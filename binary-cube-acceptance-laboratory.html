<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Binary Cube Acceptance Laboratory</title><style>body{font:16px system-ui;max-width:1100px;margin:2rem auto;padding:0 1rem}fieldset{margin:1rem 0;padding:1rem}label{display:block;margin:.5rem 0}input,select,textarea,button{font:inherit;padding:.45rem}textarea{width:100%;min-height:5rem}pre{white-space:pre-wrap;overflow:auto;background:#eee;padding:1rem}.gate{padding:.7rem;border:1px solid #aaa;margin:.5rem 0}.passed{border-width:2px}.failed,.error{border-style:dashed}</style></head><body><h1>Binary Cube Strengthening Acceptance</h1><p>One bounded runtime report for the experimental subcube stack. Passing this dashboard is a research promotion gate, not a production-security claim.</p><fieldset><legend>Acceptance configuration</legend><label>Binary payload <textarea id="bits">0100110010110101</textarea></label><label>Mode <select id="mode"><option>keyed-codeword</option><option>direct-replication</option></select></label><label>Fan-out <select id="fan"><option>3</option><option>5</option><option>7</option></select></label><label>Region count <input id="regions" type="number" min="7" value="7"></label><label>Indexing seed <input id="seed" value="acceptance-indexing"></label><label>Integrity key <input id="ikey" value="acceptance-integrity-key"></label><label>Cube seed <input id="cseed" value="acceptance-cube"></label><button id="run">Run acceptance gates</button></fieldset><section><h2 id="status">Not run</h2><div id="gates"></div><details><summary>Complete machine-readable report</summary><pre id="out"></pre></details></section><script src="shadowrun-binary-cube-engine.js"></script><script src="binary-cube-subcube-indexing.js"></script><script src="binary-cube-subcube-integrity.js"></script><script src="binary-cube-subcube-corruption-matrix.js"></script><script src="binary-cube-subcube-strength-comparison.js"></script><script src="binary-cube-acceptance-runner.js"></script><script>const $=id=>document.getElementById(id);$('run').onclick=()=>{try{const report=BinaryCubeAcceptanceRunner.runAcceptance({bits:$('bits').value,mode:$('mode').value,fanOut:+$('fan').value,regionCount:+$('regions').value,indexingSeed:$('seed').value,integrityKey:$('ikey').value,keyOptions:{gridSize:3,seed:$('cseed').value}});$('status').textContent=report.summary.promotionReady?'PROMOTION GATES PASSED':'PROMOTION BLOCKED';$('gates').innerHTML=report.gates.map(g=>`<div class="gate ${g.status}"><b>${g.id}</b> — ${g.status} (${g.durationMs} ms)${g.error?`<br>${g.error.message}`:''}</div>`).join('');$('out').textContent=JSON.stringify(report,null,2)}catch(e){$('status').textContent='RUNNER ERROR';$('gates').innerHTML='';$('out').textContent=e.stack||e.message}}</script></body></html>
