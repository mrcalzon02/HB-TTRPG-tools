<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cube Encryption Laboratory — Five-Way Strengthening Campaign</title><style>body{font:15px system-ui;max-width:1100px;margin:2rem auto;padding:0 1rem;background:#111;color:#eee}fieldset{margin:1rem 0;padding:1rem}label{display:block;margin:.6rem 0}input,select,button{font:inherit;padding:.45rem}button{cursor:pointer}table{width:100%;border-collapse:collapse}th,td{padding:.5rem;border-bottom:1px solid #444;text-align:right}th:first-child,td:first-child{text-align:left}pre{white-space:pre-wrap;background:#080808;padding:1rem;overflow:auto}.ok{color:#8f8}.bad{color:#f88}</style></head><body><h1>Five-Way Strengthening Campaign</h1><p>Corpus comparison of baseline Cube, standalone subcube, standalone chaining, and both composition orders. Experimental evidence only.</p><fieldset><legend>Configuration</legend><label>Subcube fan-out <select id="fan"><option>3</option><option>5</option><option>7</option></select></label><label>Region count <input id="regions" type="number" min="7" value="11"></label><label>Indexing seed <input id="indexSeed" value="five-way-subcube"></label><label>Chaining seed <input id="chainSeed" value="five-way-chain"></label><label>Maximum source-bit perturbations <input id="flips" type="number" min="1" value="16"></label><button id="run">Run campaign</button></fieldset><h2 id="status">Not run</h2><div id="summary"></div><table><thead><tr><th>Strategy</th><th>Exact</th><th>Worst cipher diffusion</th><th>Mean cipher diffusion</th><th>Expansion</th><th>Observed ms</th></tr></thead><tbody id="rows"></tbody></table><h2>Machine-readable evidence</h2><pre id="raw"></pre><script src="shadowrun-binary-cube-engine.js"></script><script src="binary-cube-subcube-indexing.js"></script><script src="binary-cube-data-dependent-chaining.js"></script><script src="binary-cube-strengthening-strategy-comparison.js"></script><script src="binary-cube-strengthening-composition.js"></script><script src="binary-cube-acceptance-runner.js"></script><script src="binary-cube-acceptance-campaign.js"></script><script src="binary-cube-strengthening-five-way-campaign.js"></script><script>run.onclick=()=>{try{const r=BinaryCubeStrengtheningFiveWayCampaign.runCampaign({subcubeFanOut:+fan.value,regionCount:+regions.value,indexingSeed:indexSeed.value,chainingSeed:chainSeed.value,maxPlaintextBitFlips:+flips.value});status.textContent=r.ok?'CAMPAIGN COMPLETED':'CAMPAIGN HAS FAILURES';status.className=r.ok?'ok':'bad';summary.textContent=`${r.summary.completed}/${r.summary.caseCount} families completed; ${r.summary.roundTripFailures} round-trip failures; ${r.summary.errors} errors.`;rows.innerHTML=r.aggregates.map(a=>`<tr><td>${a.strategy}</td><td>${a.allExactRoundTrip?'yes':'NO'}</td><td>${a.worstCiphertextDiffusion.toFixed(4)}</td><td>${a.meanCiphertextDiffusion.toFixed(4)}</td><td>${a.meanExpansionRatio.toFixed(2)}×</td><td>${a.meanObservedTotalMs.toFixed(2)}</td></tr>`).join('');raw.textContent=JSON.stringify(r,null,2)}catch(e){status.textContent='ERROR';status.className='bad';raw.textContent=e.stack||String(e)}};</script></body></html>
