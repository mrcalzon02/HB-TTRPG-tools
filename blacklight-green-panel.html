<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blacklight Green Panel</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="blacklight-corporate-assets.css">
  <link rel="stylesheet" href="blacklight-checkpoint-panels.css">
  <script src="blacklight-checkpoint-panels.js" defer></script>
</head>
<body class="blacklight-corp-body blacklight-checkpoint-body">
  <header class="bli-topbar">
    <a class="bli-brand" href="blacklight-corporate-systems.html" aria-label="Return to Blacklight systems gateway">
      <span class="bli-mark" aria-hidden="true"></span>
      <span class="bli-brand-text"><span>Blacklight</span><span>Green Panel</span></span>
    </a>
    <nav class="bli-nav" aria-label="Green panel navigation">
      <a href="blacklight-corporate-systems.html">Gateway</a>
    </nav>
  </header>

  <main class="bli-shell">
    <section class="bli-hero" aria-labelledby="green-panel-title">
      <div>
        <p class="bli-eyebrow">Green Card Checkpoint</p>
        <h1 id="green-panel-title">Support systems checkpoint.</h1>
        <p class="bli-lede">Restricted support access requires a brief handoff before the green systems directory opens.</p>
        <div class="bli-actions">
          <a class="bli-action primary blacklight-checkpoint-continue" href="blacklight-systems-green.html" data-security-tier="Green" data-security-target="blacklight-systems-green.html">Begin Green Verification</a>
          <a class="bli-action" href="blacklight-corporate-systems.html">Return to Gateway</a>
        </div>
      </div>
      <aside class="bli-directory-panel" aria-label="Green checkpoint verification steps">
        <div class="bli-directory-title">Green Steps</div>
        <div class="bli-directory-list" role="list">
          <div class="bli-directory-item" role="listitem"><strong>Identity</strong><span class="bli-arrow">checked</span></div>
          <div class="bli-directory-item" role="listitem"><strong>Card</strong><span class="bli-arrow">checked</span></div>
          <div class="bli-directory-item" role="listitem"><strong>Route</strong><span class="bli-arrow">ready</span></div>
          <div class="bli-directory-item" role="listitem"><strong>Handoff</strong><span class="bli-arrow">pending</span></div>
        </div>
      </aside>
    </section>
  </main>
  <script src="blacklight-background-audio.js"></script>
</body>
</html>
