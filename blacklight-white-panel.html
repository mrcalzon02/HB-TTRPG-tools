<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blacklight White Panel</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="blacklight-corporate-assets.css">
  <link rel="stylesheet" href="blacklight-checkpoint-panels.css">
</head>
<body class="blacklight-corp-body blacklight-checkpoint-body">
  <header class="bli-topbar">
    <a class="bli-brand" href="blacklight-corporate-systems.html" aria-label="Return to Blacklight systems gateway">
      <span class="bli-mark" aria-hidden="true"></span>
      <span class="bli-brand-text"><span>Blacklight</span><span>White Panel</span></span>
    </a>
    <nav class="bli-nav" aria-label="White panel navigation">
      <a href="blacklight-corporate-systems.html">Gateway</a>
    </nav>
  </header>

  <main class="bli-shell">
    <section class="bli-hero" aria-labelledby="white-panel-title">
      <div>
        <p class="bli-eyebrow">White Card Checkpoint</p>
        <h1 id="white-panel-title">Employee systems checkpoint.</h1>
        <p class="bli-lede">This static checkpoint represents the employee-tier step before baseline systems.</p>
        <div class="bli-actions">
          <a class="bli-action primary" href="blacklight-systems-white.html">Continue to White Systems</a>
          <a class="bli-action" href="blacklight-corporate-systems.html">Return to Gateway</a>
        </div>
      </div>
      <aside class="bli-directory-panel" aria-label="White checkpoint verification steps">
        <div class="bli-directory-title">White Steps</div>
        <div class="bli-directory-list" role="list">
          <div class="bli-directory-item" role="listitem"><strong>Operator</strong><span class="bli-arrow">checked</span></div>
          <div class="bli-directory-item" role="listitem"><strong>Phrase</strong><span class="bli-arrow">checked</span></div>
        </div>
      </aside>
    </section>
  </main>
</body>
</html>
