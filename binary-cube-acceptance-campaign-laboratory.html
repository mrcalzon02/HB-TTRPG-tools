<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Binary Cube Acceptance Campaign</title><style>body{font:16px system-ui;max-width:1200px;margin:2rem auto;padding:0 1rem}fieldset{margin:1rem 0;padding:1rem}label{display:block;margin:.5rem 0}input,select,button{font:inherit;padding:.45rem}pre{white-space:pre-wrap;overflow:auto;background:#eee;padding:1rem}.case{padding:.7rem;border:1px solid #aaa;margin:.5rem 0}.passed{border-width:2px}.failed,.error{border-style:dashed}</style></head><body><h1>Binary Cube Acceptance Campaign</h1><p>Runs the same promotion gates across representative low-entropy, patterned, boundary, mixed, and multi-block payloads. One convenient payload cannot promote an experimental strengthening layer.</p><fieldset><legend>Campaign configuration</legend><label>Mode <select id="mode"><option>keyed-codeword</option><option>direct-replication</option></select></label><label>Fan-out <select id="fan"><option>3</option><option>5</option><option>7</option></select></label><label>Region count <input id="regions" type="number" min="7" value="7"></label><label>Indexing seed <input id="seed" value="campaign-indexing"></label><label>Integrity key <input id="ikey" value="campaign-integrity-key"></label><label>Cube seed <input id="cseed" value="campaign-cube"></label><button id="run">Run full campaign</button></fieldset><h2 id="status">Not run</h2><div id="summary"></div><div id="cases"></div><details><summary>Complete machine-readable report</summary><pre id="out"></pre></details><script src="shadowrun-binary-cube-engine.js"></script><script src="binary-cube-subcube-indexing.js"></script><script src="binary-cube-subcube-integrity.js"></script><script src="binary-cube-subcube-corruption-matrix.js"></script><script src="binary-cube-subcube-strength-comparison.js"></script><script src="binary-cube-acceptance-runner.js"></script><script src="binary-cube-acceptance-campaign.js"></script><script>const $=id=>document.getElementById(id);$('run').onclick=()=>{try{const r=BinaryCubeAcceptanceCampaign.runCampaign({mode:$('mode').value,fanOut:+$('fan').value,regionCount:+$('regions').value,indexingSeed:$('seed').value,integrityKey:$('ikey').value,keyOptions:{gridSize:3,seed:$('cseed').value}});$('status').textContent=r.summary.promotionReady?'CAMPAIGN PASSED':'PROMOTION BLOCKED';$('summary').textContent=`${r.summary.passed}/${r.summary.caseCount} payload families passed; ${r.summary.durationMs} ms total.`;$('cases').innerHTML=r.cases.map(c=>`<div class="case ${c.status}"><b>${c.id}</b> — ${c.family} — ${c.status}${c.error?`<br>${c.error.message}`:''}</div>`).join('');$('out').textContent=JSON.stringify(r,null,2)}catch(e){$('status').textContent='CAMPAIGN ERROR';$('out').textContent=e.stack||e.message}}</script></body></html>
