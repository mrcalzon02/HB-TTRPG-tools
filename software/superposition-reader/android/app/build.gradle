plugins { id 'com.android.application' }

android {
    namespace 'io.github.mrcalzon02.superpositionreader'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.mrcalzon02.superpositionreader'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1-android-preview'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
