<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blacklight | Resource Viewer</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="blacklight-corporate-assets.css">
  <style>
    .resource-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
    }
    .resource-toolbar a {
      display: inline-flex;
      align-items: center;
      min-height: 40px;
      padding: 8px 12px;
      border: 1px solid var(--bli-line);
      border-radius: 10px;
      color: var(--bli-ink);
      background: var(--bli-panel);
      text-decoration: none;
      font-weight: 800;
    }
    .resource-path {
      flex: 1 1 280px;
      min-width: 0;
      overflow-wrap: anywhere;
      color: var(--bli-muted);
      font: 700 .82rem/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .resource-document {
      padding: clamp(16px, 2.5vw, 30px);
      border: 1px solid var(--bli-line);
      border-radius: 14px;
      background: var(--bli-panel);
      overflow: auto;
    }
    .resource-document > :first-child { margin-top: 0; }
    .resource-document > :last-child { margin-bottom: 0; }
    .resource-document pre {
      margin: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font: 500 .9rem/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .resource-document code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .resource-document table {
      width: 100%;
      border-collapse: collapse;
      display: block;
      overflow-x: auto;
    }
    .resource-document th,
    .resource-document td {
      padding: 8px 10px;
      border: 1px solid var(--bli-line);
      text-align: left;
      vertical-align: top;
    }
    .resource-document [data-align="center"] { text-align: center; }
    .resource-document [data-align="right"] { text-align: right; }
    .resource-error {
      color: #ffb4b4;
      font-weight: 800;
    }
  </style>
</head>
<body class="blacklight-corp-body">
  <header class="bli-topbar">
    <a class="bli-brand" href="blacklight-corporate.html"><span class="bli-mark"></span><span class="bli-brand-text"><span>Blacklight</span><span>Archive</span></span></a>
    <nav class="bli-nav"><a href="blacklight-systems-black.html">Black Tier</a><a href="blacklight-wiki-archive.html">Continuum Wiki</a><a href="blacklight-exo-operations.html">EXO Operations</a><a href="blacklight-no-return-signal-campaign.html">No Return Signal</a></nav>
  </header>

  <main class="bli-shell">
    <section class="bli-section">
      <div class="resource-toolbar">
        <a href="blacklight-systems-black.html">Back to Black Tier</a>
        <a id="resource-raw-link" href="#">Open Raw</a>
        <span class="resource-path" id="resource-path"></span>
      </div>
      <article class="resource-document" id="resource-document" aria-live="polite"></article>
    </section>
  </main>

  <footer class="bli-footer"><strong>Blacklight Intelligence</strong> · Archive resource.</footer>
  <script src="blacklight-background-audio.js"></script>
  <script>
    (() => {
      'use strict';

      const params = new URLSearchParams(location.search);
      const sourcePath = params.get('src') || '';
      const documentNode = document.getElementById('resource-document');
      const pathNode = document.getElementById('resource-path');
      const rawLink = document.getElementById('resource-raw-link');
      const allowedExtension = /\.(?:md|txt|json|ya?ml|csv|xml|css|js|mjs|cjs|map)$/i;
      const allowedPath = /^(?:[^/?#]+\/)*(?:[^/?#]+)$/;

      const escapeHtml = value => String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');

      const inlineMarkdown = value => escapeHtml(value)
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\*([^*]+)\*/g, '<em>$1</em>')
        .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_match, label, href) => {
          const safeHref = /^(?:https?:|\.\.?\/|#)/i.test(href) ? href : '#';
          return `<a href="${escapeHtml(safeHref)}">${label}</a>`;
        });

      const splitTableRow = value => value.trim()
        .replace(/^\|/, '')
        .replace(/\|$/, '')
        .split('|')
        .map(cell => cell.trim());

      const tableAlignment = divider => {
        const left = divider.startsWith(':');
        const right = divider.endsWith(':');
        if (left && right) return 'center';
        if (right) return 'right';
        return 'left';
      };

      const isTableDivider = value => {
        const cells = splitTableRow(value);
        return cells.length > 0 && cells.every(cell => /^:?-{3,}:?$/.test(cell));
      };

      const renderMarkdownTable = (headerLine, dividerLine, bodyLines) => {
        const headers = splitTableRow(headerLine);
        const dividers = splitTableRow(dividerLine);
        const width = headers.length;
        if (width < 1 || dividers.length !== width) return null;

        const alignments = dividers.map(tableAlignment);
        const renderCell = (tag, value, index) => {
          const alignment = alignments[index] || 'left';
          const attribute = alignment === 'left' ? '' : ` data-align="${alignment}"`;
          return `<${tag}${attribute}>${inlineMarkdown(value || '')}</${tag}>`;
        };

        const head = `<thead><tr>${headers.map((cell, index) => renderCell('th', cell, index)).join('')}</tr></thead>`;
        const rows = bodyLines.map(line => {
          const cells = splitTableRow(line);
          const normalized = Array.from({ length: width }, (_unused, index) => cells[index] || '');
          return `<tr>${normalized.map((cell, index) => renderCell('td', cell, index)).join('')}</tr>`;
        }).join('');
        return `<table>${head}<tbody>${rows}</tbody></table>`;
      };

      const renderMarkdown = source => {
        const lines = source.replace(/\r\n?/g, '\n').split('\n');
        const output = [];
        let paragraph = [];
        let listType = null;
        let inCode = false;
        let code = [];

        const flushParagraph = () => {
          if (!paragraph.length) return;
          output.push(`<p>${inlineMarkdown(paragraph.join(' '))}</p>`);
          paragraph = [];
        };

        const closeList = () => {
          if (!listType) return;
          output.push(`</${listType}>`);
          listType = null;
        };

        const flushCode = () => {
          output.push(`<pre><code>${escapeHtml(code.join('\n'))}</code></pre>`);
          code = [];
        };

        for (let index = 0; index < lines.length; index += 1) {
          const line = lines[index];
          if (/^```/.test(line)) {
            flushParagraph();
            closeList();
            if (inCode) flushCode();
            inCode = !inCode;
            continue;
          }
          if (inCode) {
            code.push(line);
            continue;
          }

          const heading = line.match(/^(#{1,6})\s+(.+)$/);
          if (heading) {
            flushParagraph();
            closeList();
            const level = heading[1].length;
            output.push(`<h${level}>${inlineMarkdown(heading[2])}</h${level}>`);
            continue;
          }

          if (line.includes('|') && index + 1 < lines.length && isTableDivider(lines[index + 1])) {
            const bodyLines = [];
            let cursor = index + 2;
            while (cursor < lines.length && lines[cursor].includes('|') && !/^\s*$/.test(lines[cursor])) {
              bodyLines.push(lines[cursor]);
              cursor += 1;
            }
            const table = renderMarkdownTable(line, lines[index + 1], bodyLines);
            if (table) {
              flushParagraph();
              closeList();
              output.push(table);
              index = cursor - 1;
              continue;
            }
          }

          const unordered = line.match(/^\s*[-*+]\s+(.+)$/);
          const ordered = line.match(/^\s*\d+[.)]\s+(.+)$/);
          if (unordered || ordered) {
            flushParagraph();
            const nextType = ordered ? 'ol' : 'ul';
            if (listType !== nextType) {
              closeList();
              listType = nextType;
              output.push(`<${listType}>`);
            }
            output.push(`<li>${inlineMarkdown((unordered || ordered)[1])}</li>`);
            continue;
          }

          const quote = line.match(/^>\s?(.*)$/);
          if (quote) {
            flushParagraph();
            closeList();
            output.push(`<blockquote>${inlineMarkdown(quote[1])}</blockquote>`);
            continue;
          }

          if (/^\s*$/.test(line)) {
            flushParagraph();
            closeList();
            continue;
          }

          paragraph.push(line.trim());
        }

        if (inCode) flushCode();
        flushParagraph();
        closeList();
        return output.join('\n');
      };

      const render = (source, path) => {
        if (/\.md$/i.test(path)) {
          documentNode.innerHTML = renderMarkdown(source);
          return;
        }
        let text = source;
        if (/\.json$/i.test(path)) {
          try { text = JSON.stringify(JSON.parse(source), null, 2); } catch (_error) { /* preserve source */ }
        }
        const pre = document.createElement('pre');
        pre.textContent = text;
        documentNode.replaceChildren(pre);
      };

      if (!sourcePath || !allowedPath.test(sourcePath) || !allowedExtension.test(sourcePath) || sourcePath.includes('..')) {
        pathNode.textContent = 'Invalid resource path';
        rawLink.hidden = true;
        documentNode.innerHTML = '<p class="resource-error">The requested Blacklight resource path is invalid.</p>';
        return;
      }

      const sourceUrl = encodeURI(sourcePath);
      pathNode.textContent = sourcePath;
      rawLink.href = sourceUrl;
      document.title = `Blacklight | ${sourcePath.split('/').pop().replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ')}`;

      fetch(sourceUrl, { cache: 'no-cache' })
        .then(response => {
          if (!response.ok) throw new Error(`Resource request returned ${response.status}`);
          return response.text();
        })
        .then(source => render(source, sourcePath))
        .catch(error => {
          documentNode.innerHTML = `<p class="resource-error">Unable to load this resource: ${escapeHtml(error.message)}</p>`;
        });
    })();
  </script>
</body>
</html>
