<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Binary Cube Subcube Integrity Laboratory</title><style>body{font:16px system-ui;max-width:1100px;margin:2rem auto;padding:0 1rem}label{display:block;margin:.7rem 0}input,select,textarea,button{font:inherit;padding:.5rem}textarea{width:100%;min-height:5rem}pre{white-space:pre-wrap;background:#111;color:#eee;padding:1rem;overflow:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}.card{border:1px solid #aaa;padding:1rem;border-radius:.5rem}</style></head><body><h1>Subcube Recovery Integrity Laboratory</h1><p>Experimental independent integrity check around strict or tolerant subcube recovery. This is research tooling, not production cryptography.</p><div class="grid"><div class="card"><label>Source bits<textarea id="bits">0100110010110101</textarea></label><label>Integrity key<input id="key" value="laboratory-integrity-key"></label></div><div class="card"><label>Mode<select id="mode"><option>keyed-codeword</option><option>direct-replication</option></select></label><label>Fan-out<select id="fan"><option>1</option><option selected>3</option><option>5</option><option>7</option></select></label><label>Region count<input id="regions" type="number" value="7" min="1"></label><label>Indexing seed<input id="seed" value="integrity-lab"></label></div></div><p><button id="run">Protect → damage one share → tolerant recover → verify</button> <button id="self">Run self-test</button></p><div class="grid"><div class="card"><h2>Integrity artifact</h2><pre id="artifact">—</pre></div><div class="card"><h2>Recovery result</h2><pre id="result">—</pre></div></div><h2>Structured evidence</h2><pre id="evidence">—</pre><script src="binary-cube-subcube-indexing.js"></script><script src="binary-cube-subcube-integrity.js"></script><script>const $=id=>document.getElementById(id),api=BinaryCubeSubcubeIntegrity;$('run').onclick=()=>{try{const fanOut=+$('fan').value,regionCount=Math.max(+$('regions').value,fanOut),req={bits:$('bits').value,integrityKey:$('key').value,indexOptions:{fanOut,regionCount,mode:$('mode').value,seed:$('seed').value}},p=api.protectedEncode(req),a=p.encodedBits.split(''),x=p.plan.placements[0].physicalIndexes[0];a[x]=a[x]==='1'?'0':'1';let recovered;try{recovered=api.protectedDecode({encodedBits:a.join(''),plan:p.plan,integrity:p.integrity,integrityKey:req.integrityKey,maxCorrections:Math.floor((fanOut-1)/2)})}catch(e){recovered={ok:false,error:String(e.message||e)}}$('artifact').textContent=JSON.stringify(p.integrity,null,2);$('result').textContent=JSON.stringify(recovered,null,2);$('evidence').textContent=JSON.stringify({protected:p,damagedPhysicalIndex:x,recovered},null,2)}catch(e){$('result').textContent=String(e.message||e)}};$('self').onclick=()=>{$('evidence').textContent=JSON.stringify(api.runSelfTest(),null,2)}</script></body></html>
