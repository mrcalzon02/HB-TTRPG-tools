<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blacklight Black Panel</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="blacklight-corporate-assets.css">
  <link rel="stylesheet" href="blacklight-checkpoint-panels.css">
  <script src="blacklight-checkpoint-panels.js" defer></script>
</head>
<body class="blacklight-corp-body blacklight-checkpoint-body">
  <header class="bli-topbar">
    <a class="bli-brand" href="blacklight-corporate-systems.html" aria-label="Return to Blacklight systems gateway">
      <span class="bli-mark" aria-hidden="true"></span>
      <span class="bli-brand-text"><span>Blacklight</span><span>Black Panel</span></span>
    </a>
    <nav class="bli-nav" aria-label="Black panel navigation">
      <a href="blacklight-corporate-systems.html">Gateway</a>
    </nav>
  </header>

  <main class="bli-shell">
    <section class="bli-hero" aria-labelledby="black-panel-title">
      <div>
        <p class="bli-eyebrow">Black Card Checkpoint</p>
        <h1 id="black-panel-title">Archive checkpoint.</h1>
        <p class="bli-lede">Deep archive access requires a brief handoff before the black systems directory opens.</p>
        <div class="bli-actions">
          <a class="bli-action primary blacklight-checkpoint-continue" href="blacklight-systems-black.html" data-security-tier="Black" data-security-target="blacklight-systems-black.html">Begin Black Verification</a>
          <a class="bli-action" href="blacklight-corporate-systems.html">Return to Gateway</a>
        </div>
      </div>
      <aside class="bli-directory-panel" aria-label="Black checkpoint verification steps">
        <div class="bli-directory-title">Black Steps</div>
        <div class="bli-directory-list" role="list">
          <div class="bli-directory-item" role="listitem"><strong>Identity</strong><span class="bli-arrow">checked</span></div>
          <div class="bli-directory-item" role="listitem"><strong>Voice</strong><span class="bli-arrow">checked</span></div>
          <div class="bli-directory-item" role="listitem"><strong>Charles</strong><span class="bli-arrow">watching</span></div>
          <div class="bli-directory-item" role="listitem"><strong>Handoff</strong><span class="bli-arrow">pending</span></div>
        </div>
      </aside>
    </section>
  </main>
  <script src="blacklight-background-audio.js"></script>
</body>
</html>
