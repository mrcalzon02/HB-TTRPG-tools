<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Binary Cube Subcube Strength Comparison</title><style>body{font:15px system-ui;max-width:1100px;margin:auto;padding:24px;background:#111;color:#eee}fieldset{margin:14px 0;padding:16px}label{display:block;margin:8px 0}input,select,textarea,button{font:inherit;padding:7px;background:#222;color:#eee;border:1px solid #666}textarea{width:100%;min-height:90px}pre{white-space:pre-wrap;background:#181818;padding:14px;overflow:auto}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.card{border:1px solid #555;padding:12px}.warn{color:#ffd27a}</style></head><body><h1>Subcube Strength Comparison</h1><p>Experimental fan-out comparison. Identical source data and cube key are tested at fan-out 1 and the selected candidate fan-out. Results are comparative diagnostics, not a security proof.</p><fieldset><legend>Experiment</legend><label>Binary source<textarea id="bits">01001100101101011110000100110110</textarea></label><label>Mode <select id="mode"><option>keyed-codeword</option><option>direct-replication</option></select></label><label>Candidate fan-out <select id="fan"><option>3</option><option>5</option><option>7</option></select></label><label>Region count <input id="regions" type="number" min="7" value="7"></label><label>Indexing seed <input id="iseed" value="subcube-strength-comparison"></label><label>Cube seed <input id="cseed" value="subcube-strength-cube"></label><label>Grid size <input id="grid" type="number" min="2" value="4"></label><label>Sampled source-bit flips <input id="samples" type="number" min="1" value="16"></label><button id="run">Run comparison</button></fieldset><div class="metrics" id="metrics"></div><h2>Findings</h2><div id="findings"></div><h2>Structured evidence</h2><pre id="out">Not run.</pre><script src="shadowrun-binary-cube-engine.js"></script><script src="binary-cube-subcube-indexing.js"></script><script src="binary-cube-subcube-strength-comparison.js"></script><script>const $=id=>document.getElementById(id);$('run').onclick=()=>{try{const r=BinaryCubeSubcubeStrengthComparison.compareSubcubeStrength({bits:$('bits').value,mode:$('mode').value,fanOut:+$('fan').value,regionCount:+$('regions').value,indexingSeed:$('iseed').value,maxPlaintextBitFlips:+$('samples').value,keyOptions:{gridSize:+$('grid').value,seed:$('cseed').value}});$('metrics').innerHTML=[['Baseline mean diffusion',r.baseline.ciphertextDiffusion.mean],['Candidate mean diffusion',r.candidate.ciphertextDiffusion.mean],['Mean delta',r.comparison.meanCiphertextDiffusionDelta],['Expansion',r.candidate.expansionRatio+'x'],['Round trip',String(r.candidate.exactRoundTrip)],['Collisions',String(r.candidate.coverage.collisionCount)]].map(x=>`<div class="card"><b>${x[0]}</b><br>${x[1]}</div>`).join('');$('findings').innerHTML=r.findings.length?r.findings.map(f=>`<p class="warn"><b>${f.severity}: ${f.code}</b> — ${f.message}</p>`).join(''):'<p>No configured finding threshold triggered.</p>';$('out').textContent=JSON.stringify(r,null,2)}catch(e){$('out').textContent=e.stack||String(e)}};</script></body></html>
