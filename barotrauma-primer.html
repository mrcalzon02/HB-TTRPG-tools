<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Europan Crewman's Primer</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body{min-height:100vh}.primer-page{max-width:1600px;margin:0 auto;padding:22px}.primer-page-header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:18px}.primer-page-header h1{margin:.2rem 0}.primer-page-actions{display:flex;flex-wrap:wrap;gap:8px}.primer-page-actions a{display:inline-flex;align-items:center;text-decoration:none}.primer-controls{display:grid;grid-template-columns:minmax(240px,1fr) auto;gap:10px;margin:16px 0}.primer-controls input{background:#10131a;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:11px 13px}.primer-layout{display:grid;grid-template-columns:minmax(280px,390px) minmax(0,1fr);gap:16px}.primer-nav{display:grid;gap:7px;align-content:start;max-height:78vh;overflow:auto}.primer-nav a{width:100%;box-sizing:border-box;text-align:left;border:1px solid var(--line);border-radius:12px;padding:10px;background:rgba(255,255,255,.03);color:var(--ink);text-decoration:none}.primer-nav a:hover,.primer-nav a.active{border-color:var(--accent);background:rgba(200,138,53,.1)}.primer-meta,.primer-status,.primer-article p,.primer-article li{color:var(--muted)}.primer-article{border:1px solid rgba(200,138,53,.36);border-radius:18px;padding:22px;background:rgba(0,0,0,.18);min-width:0}.primer-article p,.primer-article li{line-height:1.68}.primer-article h2{font-size:clamp(1.6rem,3vw,2.6rem)}.primer-error{padding:18px;border:1px solid #a33;border-radius:14px;color:#ffb3b3}.primer-loading{padding:18px;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}@media(max-width:900px){.primer-page-header,.primer-layout,.primer-controls{grid-template-columns:1fr;display:grid}.primer-nav{max-height:42vh}}
  </style>
</head>
<body>
  <main class="primer-page">
    <header class="primer-page-header">
      <div>
        <p class="eyebrow">Barotrauma campaign reference</p>
        <h1>THE EUROPAN CREWMAN’S PRIMER</h1>
        <p>All 198 individual wiki entries are attached directly from their Markdown files in manuscript order.</p>
      </div>
      <div class="primer-page-actions"><a class="secondary-action" href="index.html#barotrauma">Return to Barotrauma Dashboard</a></div>
    </header>

  </main>
  <script src="barotrauma-primer-page.js?v=entry-198-filenames"></script>
</body>
