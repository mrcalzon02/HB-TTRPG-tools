<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spell Creator · HB TTRPG Tools</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body{min-height:100vh}.spell-workspace-header{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:12px 18px;flex-wrap:wrap;border-bottom:1px solid var(--line)}.spell-workspace-header h1{margin:2px 0;font-size:clamp(1.35rem,2vw,1.8rem)}.spell-workspace-header .eyebrow{margin:0}.spell-workspace-header .header-actions{display:flex;gap:8px;flex-wrap:wrap}.spell-workspace-main{padding:14px 18px 28px}.spell-workspace-main #spell-creator-root{width:min(1720px,100%);max-width:none;margin:0 auto}.standalone-note{max-width:980px;margin:3px 0 0;color:var(--muted);line-height:1.4;font-size:.9rem}.back-link{display:inline-block;border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--ink);text-decoration:none;background:rgba(255,255,255,.04)}
    .spell-workspace-main #module-spell-creator-root{display:grid;grid-template-columns:minmax(360px,500px) minmax(0,1fr);gap:10px 16px;align-items:start;padding:14px}.spell-workspace-main #module-spell-creator-root>.section-heading{grid-column:1/-1;margin:0;padding:0 0 10px;border-bottom:1px solid var(--line)}.spell-workspace-main #module-spell-creator-root>.section-heading .eyebrow,.spell-workspace-main #module-spell-creator-root>.section-heading p{display:none}.spell-workspace-main #module-spell-creator-root>.section-heading h2{margin:0;font-size:1.15rem}.spell-workspace-main #module-spell-creator-root>.msc-section-title,.spell-workspace-main #module-spell-creator-root>.msc-controls,.spell-workspace-main #module-spell-creator-root>.msc-actions,.spell-workspace-main #module-spell-creator-root>#msc-status,.spell-workspace-main #module-spell-creator-root>#msc-audit{grid-column:1}.spell-workspace-main #module-spell-creator-root>.msc-section-title{margin:8px 0 0;font-size:1rem}.spell-workspace-main #module-spell-creator-root .msc-controls{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.spell-workspace-main #module-spell-creator-root>.msc-actions{margin:8px 0 0}.spell-workspace-main #module-spell-creator-root>#msc-status{margin:0}.spell-workspace-main #module-spell-creator-root>#msc-output{grid-column:2;grid-row:2/span 7;min-width:0;align-self:start}.spell-workspace-main #module-spell-creator-root>#msc-output>.msc-card:first-child{margin-top:0}.spell-workspace-main #module-spell-creator-root>#msc-audit{max-height:220px}
    @media(max-width:1100px){.spell-workspace-main #module-spell-creator-root{grid-template-columns:1fr}.spell-workspace-main #module-spell-creator-root>.section-heading,.spell-workspace-main #module-spell-creator-root>.msc-section-title,.spell-workspace-main #module-spell-creator-root>.msc-controls,.spell-workspace-main #module-spell-creator-root>.msc-actions,.spell-workspace-main #module-spell-creator-root>#msc-status,.spell-workspace-main #module-spell-creator-root>#msc-audit,.spell-workspace-main #module-spell-creator-root>#msc-output{grid-column:1;grid-row:auto}}
    @media(max-width:620px){.spell-workspace-header{align-items:flex-start;padding:10px 12px}.spell-workspace-main{padding:10px 8px 20px}.spell-workspace-main #module-spell-creator-root{padding:10px}.spell-workspace-main #module-spell-creator-root .msc-controls{grid-template-columns:1fr}.standalone-note{display:none}}
  </style>
</head>
<body>
  <header class="site-header spell-workspace-header no-print">
    <div>
      <p class="eyebrow">HB TTRPG Tools · Standard generator</p>
      <h1>Spell Creator</h1>
      <p class="standalone-note">Build, review, balance, copy, and export table-ready spells with visible mechanics and caster-level scaling.</p>
    </div>
    <div class="header-actions">
      <a class="back-link" href="index.html#generators">Return to Generators</a>
    </div>
  </header>
  <main class="spell-workspace-main">
    <div id="spell-creator-root"><p class="helper-note">Loading Spell Creator…</p></div>
  </main>
  <script src="spell-creator-vocabulary.js"></script>
  <script src="spell-creator-mechanics.js"></script>
  <script src="module-spell-creator.js"></script>
</body>
</html>
