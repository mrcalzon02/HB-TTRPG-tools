name: Factorio R85 combine real sprite-ranked hinge cast geometry with straight fins
on:
  push:
    branches: [main]
    paths:
      - 'tools/factorio-render-pipeline/combined_original_mount_geometry_r85.py'
      - '.github/workflows/factorio-real-combined-cast-optimization-r85.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real-combined-cast-3d-candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover source-checked prior R83 original fin model (not proprietary atlas)
        uses: actions/download-artifact@v4
        with:
          run-id: 41406588540
          name: factorio-r83-straight-swept-fins-retain-bell-clearance
          github-token: ${{ github.token }}
          path: private-ci/r83
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hb-ttrpg-tools/factorio-render-pipeline
          key: factorio-art-env-ubuntu24-blender4.5.15-python3.12-v1
      - name: Bootstrap actual pinned Blender 4.5 LTS
        run: python tools/factorio-render-pipeline/bootstrap.py install --evidence-dir private-ci/readiness
      - name: Apply source-ranked REAL casting geometry, original hinge contacts, source camera unchanged
        run: |
          BLENDER="$(python -c "import sys;sys.path.insert(0,'tools/factorio-render-pipeline');import bootstrap;print(bootstrap.find_blender())")"
          "$BLENDER" -b --disable-autoexec --factory-startup -t 2 --python-exit-code 4 \
            --python tools/factorio-render-pipeline/combined_original_mount_geometry_r85.py -- \
            --source-blend private-ci/r83/output/r83/sweep_straight_060.blend \
            --out private-ci/output/r85
      - name: Verify actual saved editable Blender models and two original-camera frames each
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('private-ci/output/r85')
          d=json.loads((p/'r85_combined_source_cast_hypotheses.json').read_text())
          assert not d['proprietary_original_rgba_uploaded']
          assert not d['official_visual_source_approved']
          assert len(d['saved_editable_true_3d_candidates'])==6
          for c in d['saved_editable_true_3d_candidates']:
              assert (p/c['native_frame1']).stat().st_size>5000
              assert (p/c['native_frame33']).stat().st_size>5000
              if c['name']!='baseline':
                  assert (p/c['saved_reopened_blend']).stat().st_size>100000
                  assert c['same_real_fins_source_camera_original_64_frame_animation']
          print('R85_REAL_R83_FIN_AND_R84_CAST_JOINED_GEOMETRY_VERIFIED')
          PY
      - name: Upload actual original-art-free 3D candidate models, native renders and numeric JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorio-r85-source-ranked-actual-hinge-cast-combinations
          path: |
            private-ci/output/r85/*.blend
            private-ci/output/r85/*.png
            private-ci/output/r85/*.json
            private-ci/readiness/readiness.json
          if-no-files-found: warn
          retention-days: 14
