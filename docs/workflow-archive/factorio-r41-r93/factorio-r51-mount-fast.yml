name: Factorio saved-scene fast mounting analysis

on:
  push:
    branches: [main]
    paths:
      - 'tools/factorio-render-pipeline/mount_occlusion_diagnostic_r51.py'
      - 'tools/factorio-render-pipeline/test_mount_occlusion_diagnostic_r51.py'
      - 'tools/factorio-render-pipeline/mount_shape_fit_r52.py'
      - 'tools/factorio-render-pipeline/test_mount_shape_fit_r52.py'
      - 'tools/factorio-render-pipeline/mount_radial_visibility_r53.py'
      - 'tools/factorio-render-pipeline/test_mount_radial_visibility_r53.py'
      - 'tools/factorio-render-pipeline/rim_clearance_r54.py'
      - 'tools/factorio-render-pipeline/test_rim_clearance_r54.py'
      - 'tools/factorio-render-pipeline/mounted_fin_candidate_r55.py'
      - 'tools/factorio-render-pipeline/test_mounted_fin_candidate_r55.py'
      - 'tools/factorio-render-pipeline/run_calibration.py'
      - '.github/workflows/factorio-r51-mount-fast.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: factorio-r51-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  existing-saved-scene:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore actual previously verified R50 native .blend
        uses: actions/download-artifact@v4
        with:
          run-id: 40958278388
          name: factorio-captures-calibration
          github-token: ${{ github.token }}
          path: .
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hb-ttrpg-tools/factorio-render-pipeline
          key: factorio-art-env-ubuntu24-blender4.5.15-python3.12-v1
      - name: Check diagnostic source without Blender
        run: |
          python -m py_compile tools/factorio-render-pipeline/mount_occlusion_diagnostic_r51.py
          python -m unittest discover -s tools/factorio-render-pipeline -p 'test_mount_occlusion_diagnostic_r51.py' -v
      - name: Verify pinned headless Blender workstation
        run: python tools/factorio-render-pipeline/bootstrap.py install --evidence-dir readiness
      - name: Project source mounting bounds and raycast R50 D grey occluder
        run: |
          BLENDER="$(python -c "import sys;sys.path.insert(0,'tools/factorio-render-pipeline');import bootstrap;print(bootstrap.find_blender())")"
          test -f capture-output/test-04-vanilla-approx/scenes/test-04-vanilla-approx.blend
          "$BLENDER" -b --factory-startup -t 2 --python-exit-code 4 --python tools/factorio-render-pipeline/mount_occlusion_diagnostic_r51.py -- --output capture-output
      - name: Source-constrained three bespoke physical mounting envelope sweep
        run: |
          BLENDER="$(python -c "import sys;sys.path.insert(0,'tools/factorio-render-pipeline');import bootstrap;print(bootstrap.find_blender())")"
          python -m unittest discover -s tools/factorio-render-pipeline -p 'test_mount_shape_fit_r52.py' -v
          "$BLENDER" -b --factory-startup -t 2 --python-exit-code 4 --python tools/factorio-render-pipeline/mount_shape_fit_r52.py -- --output capture-output
      - name: Radial physical casting visibility and contact analysis
        run: |
          BLENDER="$(python -c "import sys;sys.path.insert(0,'tools/factorio-render-pipeline');import bootstrap;print(bootstrap.find_blender())")"
          python -m unittest discover -s tools/factorio-render-pipeline -p 'test_mount_radial_visibility_r53.py' -v
          "$BLENDER" -b --factory-startup -t 2 --python-exit-code 4 --python tools/factorio-render-pipeline/mount_radial_visibility_r53.py -- --output capture-output
      - name: Recess original obstructing R08 annuli without deleting physical rims
        run: |
          BLENDER="$(python -c "import sys;sys.path.insert(0,'tools/factorio-render-pipeline');import bootstrap;print(bootstrap.find_blender())")"
          python -m unittest discover -s tools/factorio-render-pipeline -p 'test_rim_clearance_r54.py' -v
          "$BLENDER" -b --factory-startup -t 2 --python-exit-code 4 --python tools/factorio-render-pipeline/rim_clearance_r54.py -- --output capture-output
      - name: Create and reopen actual R55 editable mounted-fin candidate Blender model
        run: |
          BLENDER="$(python -c "import sys;sys.path.insert(0,'tools/factorio-render-pipeline');import bootstrap;print(bootstrap.find_blender())")"
          python -m unittest discover -s tools/factorio-render-pipeline -p 'test_mounted_fin_candidate_r55.py' -v
          "$BLENDER" -b --factory-startup -t 2 --python-exit-code 4 --python tools/factorio-render-pipeline/mounted_fin_candidate_r55.py -- --output capture-output
      - name: Upload only native geometry projections and diagnostic PNGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorio-r51-r52-native-mount-calibration
          path: |
            capture-output/test-04-vanilla-approx/mount-and-occlusion-r51/
            capture-output/test-04-vanilla-approx/mount-shape-calibration-r52/
            capture-output/test-04-vanilla-approx/mount-radial-visibility-r53/
            capture-output/test-04-vanilla-approx/rim-clearance-r54/
            capture-output/test-04-vanilla-approx/mounted-fin-candidate-r55/
          if-no-files-found: warn
          retention-days: 30
