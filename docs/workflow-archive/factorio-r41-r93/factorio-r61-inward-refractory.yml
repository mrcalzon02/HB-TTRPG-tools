name: Factorio R61 inward refractory reveal
on:
  push:
    branches: [main]
    paths:
      - 'tools/factorio-render-pipeline/inward_refractory_shingles_r61.py'
      - 'tools/factorio-render-pipeline/test_inward_refractory_shingles_r61.py'
      - '.github/workflows/factorio-r61-inward-refractory.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-source-bore-inset:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore verified R58 saved source-connected Blender geometry
        uses: actions/download-artifact@v4
        with:
          run-id: 40968758379
          name: factorio-r56-r58-fin-visibility-and-editable-model
          github-token: ${{ github.token }}
          path: capture-output/test-04-vanilla-approx/
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hb-ttrpg-tools/factorio-render-pipeline
          key: factorio-art-env-ubuntu24-blender4.5.15-python3.12-v1
      - name: Check original 3D shingle inward correction invariants
        run: |
          python -m unittest discover -s tools/factorio-render-pipeline -p 'test_inward_refractory_shingles_r61.py' -v
          python tools/factorio-render-pipeline/bootstrap.py install --evidence-dir readiness
      - name: Render original 80 physical shingle meshes in native 264 by 542
        run: |
          BLENDER="$(python -c "import sys;sys.path.insert(0,'tools/factorio-render-pipeline');import bootstrap;print(bootstrap.find_blender())")"
          "$BLENDER" -b --factory-startup -t 2 --python-exit-code 4 --python tools/factorio-render-pipeline/inward_refractory_shingles_r61.py -- --output capture-output
      - name: Upload source-original shingle physical relief variants
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorio-r61-original-inward-shingle-sweep
          path: capture-output/test-04-vanilla-approx/inward-refractory-shingles-r61/
          if-no-files-found: warn
          retention-days: 30
