name: Factorio R75 actual native existing throat mesh isolation
on:
  push:
    branches: [main]
    paths:
      - 'tools/factorio-render-pipeline/native_nozzle_geometry_isolation_r75.py'
      - '.github/workflows/factorio-native-nozzle-isolation-r75.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect-existing-native-nozzle-shapes:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve real editable R71 scene, no original Factorio source art
        uses: actions/download-artifact@v4
        with:
          run-id: 41378123612
          name: factorio-r71-3d-physically-formed-refractory-80-plates-editable-candidates
          github-token: ${{ github.token }}
          path: private-ci/r71
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hb-ttrpg-tools/factorio-render-pipeline
          key: factorio-art-env-ubuntu24-blender4.5.15-python3.12-v1
      - name: Restore real Blender 4.5 LTS
        run: python tools/factorio-render-pipeline/bootstrap.py install --evidence-dir private-ci/readiness
      - name: Render existing R11 liner, two baffles and both R19 layers in isolation, without saving changes
        run: |
          BLENDER="$(python -c "import sys;sys.path.insert(0,'tools/factorio-render-pipeline');import bootstrap;print(bootstrap.find_blender())")"
          "$BLENDER" -b --disable-autoexec --factory-startup -t 2 --python-exit-code 4 \
            --python tools/factorio-render-pipeline/native_nozzle_geometry_isolation_r75.py -- \
            --source-blend private-ci/r71/output/r71/source_refractory_form_075.blend \
            --out private-ci/output/r75
      - name: Produce objective image-difference diagnostics (never acceptance of visuals)
        run: |
          python -m pip install "Pillow>=10,<13"
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image,ImageChops
          root=Path('private-ci/output/r75')
          p=json.loads((root/'R75_MODEL_ONLY_TEMPORARY_ISOLATION.json').read_text())
          assert p['saved_scene_geometry_and_visibility_restored']
          assert not p['private_original_factorio_sprite_present']
          original=Image.open(root/'model_only_baseline.png').convert('RGBA')
          after=Image.open(root/'model_only_restored.png').convert('RGBA')
          assert original.size==(264,542)==after.size
          # Exact pixel equality is a functional render-restoration contract.
          # If nondeterminism occurs, diagnose separately rather than silently
          # permitting a geometry edit disguised as a visibility-only audit.
          assert original.tobytes()==after.tobytes(), 'Native RGBA render was not restored byte-for-byte'
          roi=(48,395,218,512)
          a=original.crop(roi).convert('RGB')
          for group in p['groups']:
              b=Image.open(root/group['render']).crop(roi).convert('RGB')
              diff=ImageChops.difference(a,b)
              values=diff.tobytes()
              group['nozzle_roi_rgb_mae_raw_255']=round(sum(values)/len(values),6)
              group['nozzle_roi_pixels_at_least_2_rgb']=sum(
                  max(values[i:i+3])>=2 for i in range(0,len(values),3))
              group['native_nozzle_roi_pixels']=170*117
          (root/'R75_MODEL_ONLY_TEMPORARY_ISOLATION.json').write_text(
              json.dumps(p,indent=2)+'\n')
          print('R75_REAL_RENDER_RESTORATION_AND_CAUSAL_ISOLATION_PASS')
          print(json.dumps({x['group']:x['nozzle_roi_pixels_at_least_2_rgb']
                            for x in p['groups']},sort_keys=True))
          PY
      - name: Upload only model-derived native PNGs, JSON and readiness; no source art
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorio-r75-real-native-nozzle-mesh-isolation
          path: |
            private-ci/output/r75/*.png
            private-ci/output/r75/*.json
            private-ci/readiness/readiness.json
          if-no-files-found: warn
          retention-days: 14
