name: Factorio R70 original sprite 3D appearance comparison contract
on:
  push:
    branches: [main]
    paths:
      - 'tools/factorio-render-pipeline/source_3d_shape_correspondence_r70.py'
      - 'tools/factorio-render-pipeline/test_source_3d_shape_correspondence_r70.py'
      - '.github/workflows/factorio-thruster-appearance-r70.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-original-sprite-only-shape-comparator:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test image processing
        run: python -m pip install "Pillow>=10,<13"
      - name: Test original shape geometry and surface-color diagnostics, no web substitutes
        run: |
          python -m unittest discover -s tools/factorio-render-pipeline \
            -p test_source_3d_shape_correspondence_r70.py -v
      - name: Reject any reference fetched from Internet or fabricated from our 3D renders
        run: |
          python - <<'PY'
          from pathlib import Path
          from subprocess import run, PIPE
          import sys
          p=Path('tools/factorio-render-pipeline/source_3d_shape_correspondence_r70.py')
          s=p.read_text()
          assert 'source_rgba_frames(source_pages)' in s
          assert 'source_rgb_is_not_the_glow_layer' in s
          assert 'original_private_source_comparisons_must_never_be_published' in s
          assert not any(x in s for x in ('urllib.request', 'requests.get(', 'wiki.factorio.com', 'image_query'))
          proc=run([sys.executable,str(p),
                 '--source-atlases','/unavailable/original-thruster-1.png',
                 '/unavailable/original-thruster-2.png',
                 '--candidate-cycle','/unavailable/blender',
                 '--private-output','/tmp/should-not-be-created'],
                 stdout=PIPE,stderr=PIPE,text=True)
          assert proc.returncode != 0
          assert 'No such file' in proc.stderr or 'FileNotFoundError' in proc.stderr
          print('R70_NO_MISSING_SOURCE_IMAGE_SUBSTITUTION')
          print('R70_REAL_ORIGINAL_3D_FORM_COMPARISON_IS_PRIVATE_DIAGNOSTIC')
          PY
