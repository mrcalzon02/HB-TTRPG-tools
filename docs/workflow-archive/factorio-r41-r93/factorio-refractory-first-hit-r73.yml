name: Factorio R73 original-camera physical refractory occlusion maps
on:
  push:
    branches: [main]
    paths:
      - 'tools/factorio-render-pipeline/refractory_first_hit_atlas_r73.py'
      - '.github/workflows/factorio-refractory-first-hit-r73.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  trace-real-3d-refractory-first-hit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve saved real R66 baseline (no original source sprites)
        uses: actions/download-artifact@v4
        with:
          run-id: 40995175908
          name: factorio-r66-source-visible-cream-castings-editable-blend-and-native-frames
          github-token: ${{ github.token }}
          path: private-ci/r66
      - name: Retrieve both previously saved and re-opened R71 model candidates
        uses: actions/download-artifact@v4
        with:
          run-id: 41378123612
          name: factorio-r71-3d-physically-formed-refractory-80-plates-editable-candidates
          github-token: ${{ github.token }}
          path: private-ci/r71
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hb-ttrpg-tools/factorio-render-pipeline
          key: factorio-art-env-ubuntu24-blender4.5.15-python3.12-v1
      - name: Bootstrap real Blender
        run: python tools/factorio-render-pipeline/bootstrap.py install --evidence-dir private-ci/readiness
      - name: Trace first-hit physical mesh per original-camera native pixel
        run: |
          BLENDER="$(python -c "import sys;sys.path.insert(0,'tools/factorio-render-pipeline');import bootstrap;print(bootstrap.find_blender())")"
          "$BLENDER" -b --disable-autoexec --factory-startup -t 2 --python-exit-code 4 \
            --python tools/factorio-render-pipeline/refractory_first_hit_atlas_r73.py -- \
            --baseline private-ci/r66/output/r66/saved_three_source_cast_face_stays_r66.blend \
            --emboss-042 private-ci/r71/output/r71/source_refractory_form_042.blend \
            --emboss-075 private-ci/r71/output/r71/source_refractory_form_075.blend \
            --out private-ci/output/r73
      - name: Verify actual no-source native geometry maps
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('private-ci/output/r73')
          r=json.loads((p/'MODEL_ONLY_R73_real_occlusion.json').read_text())
          assert not r['genuine_original_sprite_available']
          assert not r['art_fidelity_or_geometry_approved']
          assert len(r['variants'])==3
          for v in r['variants']:
              assert v['source_model_unmodified']
              assert v['rays']==170*117
              assert v['first_hit_group_counts'].get('near',0)>0
              assert v['first_hit_group_counts'].get('liner',0)>0
              assert (p/v['native_object_id_png']).stat().st_size>1000
          assert r['baseline_to_075']['changed_first_hit_mesh_pixels']>0
          print('R73_REAL_NATIVE_OCCLUSION_DIAGNOSTIC_PASS')
          PY
      - name: Upload model-only maps and diagnostics (NO proprietary source art)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorio-r73-model-only-native-mesh-occlusion-maps
          path: |
            private-ci/output/r73/*.png
            private-ci/output/r73/*.json
            private-ci/readiness/readiness.json
          if-no-files-found: warn
          retention-days: 14
