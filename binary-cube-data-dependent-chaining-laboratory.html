<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Binary Cube Data-Dependent Chaining Laboratory</title><style>body{font:16px system-ui;max-width:1100px;margin:2rem auto;padding:0 1rem}label{display:block;margin:.8rem 0}input,textarea,button{font:inherit;padding:.55rem;width:100%;box-sizing:border-box}button{width:auto;cursor:pointer}pre{white-space:pre-wrap;background:#111;color:#eee;padding:1rem;overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.status{font-weight:700}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><h1>Data-Dependent Chaining Laboratory</h1><p>Experimental reversible 1:1 pre-cube diffusion. Each emitted bit changes state used by later positions. This is research instrumentation, not production cryptography.</p><div class="grid"><label>Source bits<textarea id="bits" rows="5">0100110010110101</textarea></label><div><label>Chaining seed<input id="seed" value="chain-laboratory"></label><label>Bit-flip samples<input id="samples" type="number" min="1" max="64" value="8"></label><button id="run">Run analysis</button></div></div><p class="status" id="status">Ready.</p><pre id="summary"></pre><details><summary>Complete machine-readable evidence</summary><pre id="evidence"></pre></details><script src="shadowrun-binary-cube-engine.js"></script><script src="binary-cube-data-dependent-chaining.js"></script><script>const $=id=>document.getElementById(id);$('run').onclick=()=>{try{const r=BinaryCubeDataDependentChaining.analyze({bits:$('bits').value,seed:$('seed').value,maxPlaintextBitFlips:Number($('samples').value)});$('status').textContent=r.ok?'ROUND-TRIP PASSED':'ROUND-TRIP FAILED';$('summary').textContent=`Expansion: ${r.expansionRatio}x\nMean pre-cube diffusion: ${(r.meanPreCubeDiffusion*100).toFixed(2)}%\nExact recovery: ${r.exactRoundTrip}\nClassification: ${r.securityClassification}`;$('evidence').textContent=JSON.stringify(r,null,2)}catch(e){$('status').textContent='ERROR';$('summary').textContent=e.message;$('evidence').textContent=''}};</script></body></html>
