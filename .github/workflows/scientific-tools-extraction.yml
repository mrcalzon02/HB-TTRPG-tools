# Combined-head gate for centralized Scientific Tools, cryptanalysis, media-forensics, steganalysis, and routed diagnostic runtimes.
name: Validate Scientific Tools extraction

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/scientific-tools-extraction.yml"
      - "app-lite-view-mounts.js"
      - "scientific-tools-entry.js"
      - "scientific-tools-cooperative-runner.js"
      - "scientific-tools-local-media.js"
      - "shadowrun-binary-cube-worker.js"
      - "binary-cube-worker-client.js"
      - "shadowrun-binary-cube-encryption.js"
      - "shadowrun-binary-cube-visualizer.js"
      - "binary-cube-key-generation-research.js"
      - "binary-cube-key-generation-research-worker.js"
      - "binary-cube-key-generation-visualizer.js"
      - "binary-cube-key-generation-visualizer.css"
      - "binary-cube-decryption-dashboard.js"
      - "binary-cube-decryption-dashboard.css"
      - "binary-cube-cryptanalytic-test-lab.js"
      - "binary-cube-cryptanalytic-test-lab.css"
      - "binary-cube-information-analysis-suite.js"
      - "binary-cube-information-analysis-suite.css"
      - "binary-cube-communication-capacity-analyzer.js"
      - "binary-cube-communication-capacity-analyzer.css"
      - "binary-cube-communication-capacity-worker.js"
      - "binary-cube-media-forensics-suite.js"
      - "binary-cube-media-forensics-suite.css"
      - "binary-cube-media-forensics-worker.js"
      - "binary-cube-media-forensics-demo-corpus.js"
      - "binary-cube-steganalysis-engine.js"
      - "binary-cube-steganalysis-worker.js"
      - "binary-cube-steganalysis-lab.js"
      - "binary-cube-steganalysis-lab.css"
      - "binary-cube-diagnostic-calibration-registry.js"
      - "binary-cube-diagnostic-calibration-baseline.js"
      - "binary-cube-diagnostic-pipeline.js"
      - "binary-cube-diagnostic-pipeline-panel.js"
      - "binary-cube-diagnostic-pipeline.css"
      - "binary-cube-cubic-decryptor-engine.js"
      - "binary-cube-cubic-decryptor-worker.js"
      - "binary-cube-cubic-decryptor.js"
      - "binary-cube-cubic-decryptor.css"
      - "docs/scientific-diagnostic-pipeline-plan.md"
      - "shadowrun-entry.js"
      - "blacklight-continuum-entry.js"
      - "interstellar-media-collisions-lab.js"
      - "interstellar-media-collisions-lab.css"
      - "double-slit-lab.js"
      - "double-slit-lab.css"
      - "scripts/validate-scientific-tools-extraction.mjs"
      - "scripts/validate-scientific-diagnostic-pipeline.mjs"
      - "scripts/calibrate-scientific-diagnostic-pipeline.mjs"
      - "scripts/validate-scientific-diagnostic-calibration.mjs"
      - "scripts/validate-binary-cube-cubic-decryptor.mjs"
      - "scripts/run-scientific-diagnostic-local.mjs"
      - "scripts/validate-cooperative-slice-budget.mjs"
      - "scripts/validate-binary-cube-reseed.mjs"
      - "scripts/research-binary-cube-key-generation-profiles.mjs"
      - "scripts/validate-binary-cube-key-generation-visualizer.mjs"
      - "scripts/validate-binary-cube-decryption-dashboard.mjs"
      - "scripts/validate-binary-cube-decryption-dashboard-browser.mjs"
      - "scripts/validate-binary-cube-cryptanalytic-test-lab.mjs"
      - "scripts/validate-binary-cube-information-analysis-suite.mjs"
      - "scripts/validate-binary-cube-communication-capacity-analyzer.mjs"
      - "scripts/validate-binary-cube-media-forensics-suite.mjs"
      - "scripts/validate-binary-cube-media-forensics-demo-corpus.mjs"
      - "scripts/validate-binary-cube-steganalysis-lab.mjs"
      - "scripts/validate-binary-cube-v13-launch.mjs"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: "scientific-tools-extraction-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Record extraction pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=pending \
            -f context='scientific-tools/extraction' \
            -f description='Scientific Tools placement validation is running.' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check authoritative sources
        run: |
          node --check app-lite-view-mounts.js
          node --check scientific-tools-entry.js
          node --check scientific-tools-cooperative-runner.js
          node --check scientific-tools-local-media.js
          node --check shadowrun-binary-cube-worker.js
          node --check binary-cube-worker-client.js
          node --check shadowrun-binary-cube-encryption.js
          node --check shadowrun-binary-cube-visualizer.js
          node --check binary-cube-key-generation-research.js
          node --check binary-cube-key-generation-research-worker.js
          node --check binary-cube-key-generation-visualizer.js
          node --check binary-cube-decryption-dashboard.js
          node --check binary-cube-cryptanalytic-test-lab.js
          node --check binary-cube-information-analysis-suite.js
          node --check binary-cube-communication-capacity-analyzer.js
          node --check binary-cube-communication-capacity-worker.js
          node --check binary-cube-media-forensics-suite.js
          node --check binary-cube-media-forensics-worker.js
          node --check binary-cube-media-forensics-demo-corpus.js
          node --check binary-cube-steganalysis-engine.js
          node --check binary-cube-steganalysis-worker.js
          node --check binary-cube-steganalysis-lab.js
          node --check binary-cube-diagnostic-calibration-registry.js
          node --check binary-cube-diagnostic-pipeline.js
          node --check binary-cube-diagnostic-pipeline-panel.js
          node --check binary-cube-cubic-decryptor-engine.js
          node --check binary-cube-cubic-decryptor-worker.js
          node --check binary-cube-cubic-decryptor.js
          node --check shadowrun-entry.js
          node --check blacklight-continuum-entry.js
          node --check interstellar-media-collisions-lab.js
          node --check double-slit-lab.js
          node --check scripts/validate-scientific-tools-extraction.mjs
          node --check scripts/validate-scientific-diagnostic-pipeline.mjs
          node --check scripts/calibrate-scientific-diagnostic-pipeline.mjs
          node --check scripts/validate-scientific-diagnostic-calibration.mjs
          node --check scripts/validate-binary-cube-cubic-decryptor.mjs
          node --check scripts/run-scientific-diagnostic-local.mjs
          node --check scripts/validate-cooperative-slice-budget.mjs
          node --check scripts/validate-binary-cube-reseed.mjs
          node --check scripts/research-binary-cube-key-generation-profiles.mjs
          node --check scripts/validate-binary-cube-key-generation-visualizer.mjs
          node --check scripts/validate-binary-cube-decryption-dashboard.mjs
          node --check scripts/validate-binary-cube-decryption-dashboard-browser.mjs
          node --check scripts/validate-binary-cube-cryptanalytic-test-lab.mjs
          node --check scripts/validate-binary-cube-information-analysis-suite.mjs
          node --check scripts/validate-binary-cube-communication-capacity-analyzer.mjs
          node --check scripts/validate-binary-cube-media-forensics-suite.mjs
          node --check scripts/validate-binary-cube-media-forensics-demo-corpus.mjs
          node --check scripts/validate-binary-cube-steganalysis-lab.mjs
          node --check scripts/validate-binary-cube-v13-launch.mjs
          test -s binary-cube-key-generation-visualizer.css
          test -s binary-cube-decryption-dashboard.css
          test -s binary-cube-cryptanalytic-test-lab.css
          test -s binary-cube-information-analysis-suite.css
          test -s binary-cube-communication-capacity-analyzer.css
          test -s binary-cube-media-forensics-suite.css
          test -s binary-cube-steganalysis-lab.css
          test -s binary-cube-diagnostic-pipeline.css
          test -s binary-cube-cubic-decryptor.css
          test -s docs/scientific-diagnostic-pipeline-plan.md
          test -s interstellar-media-collisions-lab.css
          test -s double-slit-lab.css

      - name: Validate Steganography Signal and Media Demonstration Corpus
        run: node scripts/validate-binary-cube-media-forensics-demo-corpus.mjs

      - name: Validate Advanced Steganalysis Laboratory
        run: node scripts/validate-binary-cube-steganalysis-lab.mjs

      - name: Validate routed Diagnostic Evaluation Pipeline
        run: node scripts/validate-scientific-diagnostic-pipeline.mjs

      - name: Measure diagnostic detector calibration corpus
        run: |
          node scripts/calibrate-scientific-diagnostic-pipeline.mjs --json=/tmp/hb-diagnostic-calibration.json > /tmp/hb-diagnostic-calibration.stdout.json
          cat /tmp/hb-diagnostic-calibration.json

      - name: Validate diagnostic detector calibration
        run: node scripts/validate-scientific-diagnostic-calibration.mjs

      - name: Exercise local Diagnostic Evaluation Pipeline
        run: |
          printf 'Local diagnostic runner control material. This is ordinary text.\n' > /tmp/hb-diagnostic-control.txt
          node scripts/run-scientific-diagnostic-local.mjs /tmp/hb-diagnostic-control.txt --profile=triage --json=/tmp/hb-diagnostic-report.json > /tmp/hb-diagnostic-stdout.json
          test -s /tmp/hb-diagnostic-report.json
          grep -q 'hb-ttrpg-scientific-diagnostic-pipeline-report' /tmp/hb-diagnostic-report.json

      - name: Validate Cubic Decryptor Tool
        run: node scripts/validate-binary-cube-cubic-decryptor.mjs

      - name: Validate Scientific Tools main-menu contract
        run: node scripts/validate-scientific-tools-extraction.mjs

      - name: Validate cooperative time-slice budget
        run: node scripts/validate-cooperative-slice-budget.mjs

      - name: Validate Binary Cube reseed semantics
        run: node scripts/validate-binary-cube-reseed.mjs

      - name: Research Binary Cube key-generation profiles
        run: node scripts/research-binary-cube-key-generation-profiles.mjs

      - name: Validate Binary Cube key-generation structure visualizer
        run: node scripts/validate-binary-cube-key-generation-visualizer.mjs

      - name: Validate Binary Cube Decryption Dashboard
        run: node scripts/validate-binary-cube-decryption-dashboard.mjs

      - name: Exercise Binary Cube Decryption Dashboard in Chromium
        run: node scripts/validate-binary-cube-decryption-dashboard-browser.mjs

      - name: Validate Binary Cube Cryptanalytic Test Lab
        run: node scripts/validate-binary-cube-cryptanalytic-test-lab.mjs

      - name: Validate Information and Deobfuscation Analysis Suite
        run: node scripts/validate-binary-cube-information-analysis-suite.mjs

      - name: Validate Communication Capacity Analyzer
        run: node scripts/validate-binary-cube-communication-capacity-analyzer.mjs

      - name: Validate Steganography Signal and Media Forensics Suite
        run: node scripts/validate-binary-cube-media-forensics-suite.mjs

      - name: Preserve accepted Binary Cube launch contract
        run: node scripts/validate-binary-cube-v13-launch.mjs

      - name: Record extraction success
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=success \
            -f context='scientific-tools/extraction' \
            -f description='Scientific Tools main-menu placement gate passed.' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Record extraction failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=failure \
            -f context='scientific-tools/extraction' \
            -f description='Scientific Tools main-menu placement gate failed.' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
