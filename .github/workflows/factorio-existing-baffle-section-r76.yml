name: Factorio R76 real 3D pressure ring cross-section candidates
on:
  push:
    branches: [main]
    paths:
      - 'tools/factorio-render-pipeline/physical_existing_baffle_section_r76.py'
      - '.github/workflows/factorio-existing-baffle-section-r76.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reshape-real-existing-ring-without-inventing-parts:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Load exact previous R71 saved Blender model, not original source artwork
        uses: actions/download-artifact@v4
        with:
          run-id: 41378123612
          name: factorio-r71-3d-physically-formed-refractory-80-plates-editable-candidates
          github-token: ${{ github.token }}
          path: private-ci/r71
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hb-ttrpg-tools/factorio-render-pipeline
          key: factorio-art-env-ubuntu24-blender4.5.15-python3.12-v1
      - name: Restore pinned actual Blender 4.5 LTS
        run: python tools/factorio-render-pipeline/bootstrap.py install --evidence-dir private-ci/readiness
      - name: Save/reopen real baffle section candidates and render native camera
        run: |
          BLENDER="$(python -c "import sys;sys.path.insert(0,'tools/factorio-render-pipeline');import bootstrap;print(bootstrap.find_blender())")"
          "$BLENDER" -b --disable-autoexec --factory-startup -t 2 --python-exit-code 4 \
            --python tools/factorio-render-pipeline/physical_existing_baffle_section_r76.py -- \
            --source-blend private-ci/r71/output/r71/source_refractory_form_075.blend \
            --out private-ci/output/r76
      - name: Measure real pixel impact and verify unaffected original scene
        run: |
          python -m pip install "Pillow>=10,<13"
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image,ImageChops
          root=Path('private-ci/output/r76')
          p=root/'R76_ORIGINAL_RING_SECTION_CANDIDATES.json'
          result=json.loads(p.read_text())
          assert not result['original_user_sprite_present']
          assert not result['source_image_visual_approval']
          assert len(result['candidates'])==3
          base=Image.open(root/result['candidates'][0]['native_render_01']).convert('RGBA')
          assert base.size==(264,542)
          bbox=(48,395,218,512)
          for row in result['candidates']:
              assert row['original_face_morph']['original_ring_topology_unchanged']
              candidate=Image.open(root/row['native_render_01']).convert('RGBA')
              assert candidate.size==(264,542)
              pixels=ImageChops.difference(base.crop(bbox).convert('RGB'),
                                           candidate.crop(bbox).convert('RGB')).tobytes()
              row['native_nozzle_rgb_mean_absolute_255']=round(sum(pixels)/len(pixels),5)
              row['native_nozzle_pixels_2rgb']=sum(max(pixels[i:i+3])>=2
                                                   for i in range(0,len(pixels),3))
              if row['section_axial_scale']<1:
                  assert (root/row['editable_saved_reopened_scene']).stat().st_size>100000
                  assert row['native_nozzle_pixels_2rgb']>0
                  assert row['unchanged_camera_other_original_meshes_materials_motion']
          p.write_text(json.dumps(result,indent=2)+'\n')
          print('R76_ACTUAL_NATIVE_BLENDER_GEOMETRY_SCENE_VERIFIED')
          print('R76_ORIGINAL_FACTORIO_SPRITE_STILL_REQUIRED_TO_ACCEPT')
          PY
      - name: Upload only own diagnostic images and editable models
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorio-r76-real-existing-pressure-ring-section-native-candidates
          path: |
            private-ci/output/r76/*.blend
            private-ci/output/r76/*.png
            private-ci/output/r76/*.json
            private-ci/readiness/readiness.json
          if-no-files-found: warn
          retention-days: 14
