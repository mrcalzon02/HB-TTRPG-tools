name: Apply Binary Cube V7 lifecycle fix

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/binary-cube-v7-lifecycle-fix.yml"
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: binary-cube-v7-lifecycle-fix
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Record pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=pending \
            -f context='binary-cube/v7-lifecycle-fix' \
            -f description='Applying direct Binary Cube V7 lifecycle correction.' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct trace-clearing order directly
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('shadowrun-binary-cube-visualizer.js')
          source = path.read_text(encoding='utf-8')
          old = """  function clearTrace(panel, message = '') {
              pausePlayback(panel, false);
              activeTrace = null;
          """
          new = """  function clearTrace(panel, message = '') {
              activeTrace = null;
              pausePlayback(panel, false);
          """
          if old not in source:
              raise SystemExit('Expected V7 clearTrace ordering was not found; refusing an ambiguous edit.')
          updated = source.replace(old, new, 1)
          if updated.count(new) != 1:
              raise SystemExit('Lifecycle correction did not produce exactly one authoritative clearTrace implementation.')
          path.write_text(updated, encoding='utf-8')
          PY
          node --check shadowrun-binary-cube-visualizer.js
          git diff --check

      - name: Commit direct correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shadowrun-binary-cube-visualizer.js
          git commit -m 'fix: clear stale Binary Cube trace before scene replacement [skip ci]'
          git push origin HEAD:main

      - name: Record success status
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=success \
            -f context='binary-cube/v7-lifecycle-fix' \
            -f description='Direct Binary Cube V7 lifecycle correction committed.' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Record failure status
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=failure \
            -f context='binary-cube/v7-lifecycle-fix' \
            -f description='Binary Cube V7 lifecycle correction failed.' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
