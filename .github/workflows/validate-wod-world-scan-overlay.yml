name: Validate World of Darkness World Scans

on:
  push:
    branches: [main]
    paths:
      - 'character-sheet-title.js'
      - 'world-of-darkness-*.js'
      - 'scripts/ingest-wod-*.mjs'
      - 'scripts/enrich-wod-location-context.mjs'
      - 'scripts/validate-wod-*.mjs'
      - 'scripts/run-wod-detail-diversity-validation.mjs'
      - 'source-page-references/chronicle-spatial-engine.source.json'
      - 'data/world-of-darkness/**'
      - '.github/workflows/ingest-wod-world-scan-batch.yml'
      - '.github/workflows/ingest-wod-location-package.yml'
      - '.github/workflows/validate-wod-world-scan-overlay.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wod-detail-diversity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run and record WOD validation
        run: node scripts/run-wod-detail-diversity-validation.mjs

      - name: Commit validation receipt
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/world-of-darkness/validation/detail-diversity-ci-receipt.json
          if git diff --cached --quiet; then
            echo "Validation receipt is unchanged."
          else
            git commit -m "Record WOD diversity validation result [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Enforce successful validation
        run: |
          node -e "const r=require('./data/world-of-darkness/validation/detail-diversity-ci-receipt.json'); if(r.status!=='passed'){console.error(JSON.stringify(r.results.filter(x=>!x.passed),null,2)); process.exit(1)}"
