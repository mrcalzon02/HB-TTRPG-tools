name: One-Time Integrate Veteran Bubble Reorientation

on:
  push:
    paths:
      - '.github/workflows/one-time-integrate-veteran-bubble-reorientation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate structured veteran choices
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          html_path = Path('blacklight-veteran-reintroduction.html')
          html = html_path.read_text(encoding='utf-8')
          marker = '  <script src="blacklight-veteran-reintroduction.js"></script>'
          scripts = '  <script src="blacklight-veteran-reorientation-options.js"></script>\n' + marker
          if 'blacklight-veteran-reorientation-options.js' not in html:
              if marker not in html:
                  raise SystemExit('Veteran script marker missing')
              html = html.replace(marker, scripts, 1)
              html_path.write_text(html, encoding='utf-8')

          js_path = Path('blacklight-veteran-reintroduction.js')
          js = js_path.read_text(encoding='utf-8')

          js = js.replace("      schemaVersion: '1.0.0',", "      schemaVersion: '2.0.0',", 1)
          js = js.replace(
              "      responses: {},\n      visited: [],",
              "      responses: {},\n      legacyAnswers: {},\n      visited: [],",
              1
          )
          js = js.replace(
              "      responses: saved.responses && typeof saved.responses === 'object' ? saved.responses : {},\n      visited:",
              "      responses: saved.responses && typeof saved.responses === 'object' ? saved.responses : {},\n      legacyAnswers: saved.legacyAnswers && typeof saved.legacyAnswers === 'object' ? saved.legacyAnswers : {},\n      visited:",
              1
          )

          get_prompt_end = """  function getPrompt(promptId) {
            for (const entry of state.entries) {
              const prompt = (entry.prompts || []).find(item => item.id === promptId);
              if (prompt) return { entry, prompt };
            }
            return null;
          }

"""
          helpers = """  function optionValue(option) {
            return typeof option === 'string' ? option : String(option?.value ?? option?.label ?? '');
          }

          function optionLabel(option) {
            return typeof option === 'string' ? option : String(option?.label ?? option?.value ?? '');
          }

          function optionDetail(option) {
            return typeof option === 'string' ? '' : String(option?.detail ?? '');
          }

          function optionResponse(option) {
            return typeof option === 'string' ? '' : String(option?.response ?? '');
          }

          function findOption(prompt, value) {
            return (prompt.options || []).find(option => optionValue(option) === value) || null;
          }

          function applyEnhancements(source) {
            const enhancements = globalThis.BLACKLIGHT_VETERAN_REORIENTATION_ENHANCEMENTS;
            if (!enhancements || typeof enhancements !== 'object') return source;
            source.interactionSchemaVersion = enhancements.schemaVersion || source.interactionSchemaVersion || '1.0.0';
            const promptOverrides = enhancements.promptOverrides || {};
            const stageExpansions = enhancements.stageExpansions || {};
            for (const entry of source.entries || []) {
              if (stageExpansions[entry.id]) entry.orientationExpansion = stageExpansions[entry.id];
              for (const prompt of entry.prompts || []) {
                const override = promptOverrides[prompt.id];
                if (override) Object.assign(prompt, override);
              }
            }
            source.preservedTextPromptIds = Array.isArray(enhancements.preservedTextPromptIds) ? enhancements.preservedTextPromptIds : [];
            return source;
          }

          function migrateLegacyAnswers() {
            const preserved = new Set(state.source?.preservedTextPromptIds || []);
            for (const entry of state.entries) {
              for (const prompt of entry.prompts || []) {
                if (preserved.has(prompt.id) || !['radio', 'checkboxes'].includes(prompt.type)) continue;
                const current = state.draft.answers[prompt.id];
                const allowed = new Set((prompt.options || []).map(optionValue));
                if (prompt.type === 'radio' && typeof current === 'string' && current && !allowed.has(current)) {
                  state.draft.legacyAnswers[prompt.id] = current;
                  delete state.draft.answers[prompt.id];
                  delete state.draft.responses[prompt.id];
                }
                if (prompt.type === 'checkboxes') {
                  if (typeof current === 'string' && current) {
                    state.draft.legacyAnswers[prompt.id] = current;
                    delete state.draft.answers[prompt.id];
                    delete state.draft.responses[prompt.id];
                  } else if (Array.isArray(current)) {
                    const valid = current.filter(value => allowed.has(value));
                    const invalid = current.filter(value => !allowed.has(value));
                    if (invalid.length) state.draft.legacyAnswers[prompt.id] = invalid.join(', ');
                    state.draft.answers[prompt.id] = valid;
                    if (!valid.length) delete state.draft.responses[prompt.id];
                  }
                }
              }
            }
            saveDraft();
          }

          function renderOrientationExpansion(expansion) {
            const sections = expansion?.sections;
            if (!Array.isArray(sections) || !sections.length) return '';
            return `<section class="veteran-orientation-expansion"><header><p class="veteran-meta">Expanded continuity context</p><h2>What This Stage Means</h2></header><div class="veteran-orientation-grid">${sections.map(section => `<article><h3>${escapeHtml(section.title || 'Context')}</h3><p>${escapeHtml(section.text || '')}</p></article>`).join('')}</div></section>`;
          }

"""
          if 'function optionValue(option)' not in js:
              if get_prompt_end not in js:
                  raise SystemExit('getPrompt block missing')
              js = js.replace(get_prompt_end, get_prompt_end + helpers, 1)

          old_response = """  function responseFor(prompt, value) {
            const normalized = value === true ? 'true' : value === false ? 'false' : answerText(value);
            if (prompt.responsesByValue && prompt.responsesByValue[normalized]) return prompt.responsesByValue[normalized];
            const context = prompt.responseContext || 'This answer is now part of the operative continuity record.';
            const answer = clipped(value);
            return stablePick(`${prompt.id}:${answer}`, [
              `Recorded. ${context} I will resist the temptation to reinterpret “${answer}” later as something more operationally convenient.`,
              `${context} Your answer—“${answer}”—is specific enough to be attributable, which is the point of this exercise.`,
              `I have entered “${answer}.” ${context} This does not mean I agree. It means the disagreement can no longer pretend it was never stated.`,
              `Continuity record updated: “${answer}.” ${context} Vague intentions are cheaper. They are also considerably less useful when the mission changes.`
            ]);
          }
"""
          new_response = """  function responseFor(prompt, value) {
            const normalized = value === true ? 'true' : value === false ? 'false' : answerText(value);
            if (prompt.responsesByValue && prompt.responsesByValue[normalized]) return prompt.responsesByValue[normalized];

            if (Array.isArray(value)) {
              const specific = value.map(selected => optionResponse(findOption(prompt, selected))).filter(Boolean);
              if (specific.length) {
                const lead = prompt.multiResponseLead || 'Those selections can coexist. They describe different parts of the same continuity record.';
                return `${lead} ${specific.join(' ')}`;
              }
            } else if (typeof value === 'string') {
              const specific = optionResponse(findOption(prompt, value));
              if (specific) return specific;
            }

            const context = prompt.responseContext || 'This answer is now part of the operative continuity record.';
            const answer = clipped(value);
            return stablePick(`${prompt.id}:${answer}`, [
              `Recorded. ${context} I will resist the temptation to reinterpret “${answer}” later as something more operationally convenient.`,
              `${context} Your answer—“${answer}”—is specific enough to be attributable, which is the point of this exercise.`,
              `I have entered “${answer}.” ${context} This does not mean I agree. It means the disagreement can no longer pretend it was never stated.`,
              `Continuity record updated: “${answer}.” ${context} Vague intentions are cheaper. They are also considerably less useful when the mission changes.`
            ]);
          }
"""
          if old_response not in js:
              raise SystemExit('responseFor block missing')
          js = js.replace(old_response, new_response, 1)

          old_render = """  function renderPrompt(prompt) {
            const value = state.draft.answers[prompt.id];
            const required = prompt.required ? '<em>Required continuity field</em>' : '<em>Optional continuity field</em>';
            const heading = `<span>${escapeHtml(prompt.label)}</span>${required}`;

            if (prompt.type === 'textarea') {
              return `<label class="veteran-prompt">${heading}<textarea data-answer-id="${escapeHtml(prompt.id)}" rows="4" placeholder="${escapeHtml(prompt.placeholder || '')}">${escapeHtml(value || '')}</textarea></label>`;
            }
            if (prompt.type === 'text') {
              return `<label class="veteran-prompt">${heading}<input data-answer-id="${escapeHtml(prompt.id)}" type="text" value="${escapeHtml(value || '')}" placeholder="${escapeHtml(prompt.placeholder || '')}"></label>`;
            }
            if (prompt.type === 'radio') {
              return `<section class="veteran-prompt">${heading}<div class="veteran-choice-grid">${(prompt.options || []).map(option => `
                <label class="veteran-choice"><input type="radio" name="prompt-${escapeHtml(prompt.id)}" data-radio-id="${escapeHtml(prompt.id)}" value="${escapeHtml(option)}" ${value === option ? 'checked' : ''}><span>${escapeHtml(option)}</span></label>`).join('')}</div></section>`;
            }
            if (prompt.type === 'checkboxes') {
              const selected = Array.isArray(value) ? value : [];
              return `<section class="veteran-prompt">${heading}<div class="veteran-choice-grid">${(prompt.options || []).map(option => `
                <label class="veteran-choice"><input type="checkbox" data-checkbox-id="${escapeHtml(prompt.id)}" value="${escapeHtml(option)}" ${selected.includes(option) ? 'checked' : ''}><span>${escapeHtml(option)}</span></label>`).join('')}</div></section>`;
            }
            if (prompt.type === 'acknowledge') {
              return `<section class="veteran-prompt veteran-acknowledge"><label class="veteran-choice"><input type="checkbox" data-acknowledge-id="${escapeHtml(prompt.id)}" ${value === true ? 'checked' : ''}><span>${escapeHtml(prompt.label)}</span></label>${required}</section>`;
            }
            return '';
          }
"""
          new_render = """  function renderPrompt(prompt) {
            const value = state.draft.answers[prompt.id];
            const legacy = state.draft.legacyAnswers[prompt.id];
            const required = prompt.required ? '<em>Required continuity field</em>' : '<em>Optional continuity field</em>';
            const heading = `<span>${escapeHtml(prompt.label)}</span>${required}`;
            const legacyNote = legacy ? `<aside class="veteran-legacy-answer"><strong>Previous freeform answer preserved</strong><p>${escapeHtml(legacy)}</p><small>Select the bubbles that now best represent this answer. The old wording remains in the local continuity draft.</small></aside>` : '';
            const choiceMarkup = option => {
              const label = optionLabel(option);
              const detail = optionDetail(option);
              return `<span class="veteran-choice-copy"><strong>${escapeHtml(label)}</strong>${detail ? `<small>${escapeHtml(detail)}</small>` : ''}</span>`;
            };

            if (prompt.type === 'textarea') {
              return `<label class="veteran-prompt veteran-preserved-text">${heading}<textarea data-answer-id="${escapeHtml(prompt.id)}" rows="4" placeholder="${escapeHtml(prompt.placeholder || '')}">${escapeHtml(value || '')}</textarea><small class="veteran-transfer-note">This statement transfers directly to the Basic Character Sheet and therefore remains a text entry.</small></label>`;
            }
            if (prompt.type === 'text') {
              return `<label class="veteran-prompt veteran-preserved-text">${heading}<input data-answer-id="${escapeHtml(prompt.id)}" type="text" value="${escapeHtml(value || '')}" placeholder="${escapeHtml(prompt.placeholder || '')}"></label>`;
            }
            if (prompt.type === 'radio') {
              return `<section class="veteran-prompt veteran-bubble-prompt">${heading}<p class="veteran-choice-instruction">Choose the single response that most strongly defines the character’s position.</p><div class="veteran-choice-grid">${(prompt.options || []).map(option => {
                const optionValueText = optionValue(option);
                return `<label class="veteran-choice"><input type="radio" name="prompt-${escapeHtml(prompt.id)}" data-radio-id="${escapeHtml(prompt.id)}" value="${escapeHtml(optionValueText)}" ${value === optionValueText ? 'checked' : ''}>${choiceMarkup(option)}</label>`;
              }).join('')}</div>${legacyNote}</section>`;
            }
            if (prompt.type === 'checkboxes') {
              const selected = Array.isArray(value) ? value : [];
              return `<section class="veteran-prompt veteran-bubble-prompt">${heading}<p class="veteran-choice-instruction">Select every response that remains true. Contradictory emotions and obligations may be selected together.</p><div class="veteran-choice-grid">${(prompt.options || []).map(option => {
                const optionValueText = optionValue(option);
                return `<label class="veteran-choice"><input type="checkbox" data-checkbox-id="${escapeHtml(prompt.id)}" value="${escapeHtml(optionValueText)}" ${selected.includes(optionValueText) ? 'checked' : ''}>${choiceMarkup(option)}</label>`;
              }).join('')}</div>${legacyNote}</section>`;
            }
            if (prompt.type === 'acknowledge') {
              return `<section class="veteran-prompt veteran-acknowledge"><label class="veteran-choice"><input type="checkbox" data-acknowledge-id="${escapeHtml(prompt.id)}" ${value === true ? 'checked' : ''}><span class="veteran-choice-copy"><strong>${escapeHtml(prompt.label)}</strong></span></label>${required}</section>`;
            }
            return '';
          }
"""
          if old_render not in js:
              raise SystemExit('renderPrompt block missing')
          js = js.replace(old_render, new_render, 1)

          js = js.replace(
              "      ${renderTables(entry.tables)}\n      <section class=\"veteran-builder\">",
              "      ${renderOrientationExpansion(entry.orientationExpansion)}\n      ${renderTables(entry.tables)}\n      <section class=\"veteran-builder\">",
              1
          )
          js = js.replace(
              '<header class="veteran-builder-heading"><p class="veteran-meta">Returning operative record</p><h2>Record What Remains True</h2><p>Answers are saved locally. Charles records one response per field; editing a field replaces that response rather than creating duplicate transcript entries.</p></header>',
              '<header class="veteran-builder-heading"><p class="veteran-meta">Returning operative record</p><h2>Select What Remains True</h2><p>Use the bubbles to record emotions, judgments, boundaries, loyalties, roles, and preferences. Select several whenever the character holds conflicting or overlapping positions. Charles records one response per field; changing the selection replaces that response rather than creating a duplicate.</p></header>',
              1
          )

          js = js.replace("      schemaVersion: '1.0.0',\n      savedAt:", "      schemaVersion: '2.0.0',\n      savedAt:", 1)

          old_init = """      state.source = await response.json();
              state.entries = Array.isArray(state.source.entries) ? state.source.entries : [];
              if (!state.entries.length) throw new Error('The reorientation contains no stages.');
              state.draft = mergeDraft(readJson(DRAFT_KEY, null));
              state.activeId = state.entries.some(entry => entry.id === state.draft.activeId) ? state.draft.activeId : state.entries[0].id;
"""
          new_init = """      state.source = applyEnhancements(await response.json());
              state.entries = Array.isArray(state.source.entries) ? state.source.entries : [];
              if (!state.entries.length) throw new Error('The reorientation contains no stages.');
              state.draft = mergeDraft(readJson(DRAFT_KEY, null));
              migrateLegacyAnswers();
              state.activeId = state.entries.some(entry => entry.id === state.draft.activeId) ? state.draft.activeId : state.entries[0].id;
"""
          if old_init not in js:
              raise SystemExit('initialize source block missing')
          js = js.replace(old_init, new_init, 1)
          js_path.write_text(js, encoding='utf-8')

          css_path = Path('blacklight-veteran-reintroduction.css')
          css = css_path.read_text(encoding='utf-8')
          additions = """
          .veteran-orientation-expansion{margin:24px 0;padding:18px;border:1px solid rgba(116,161,220,.38);border-radius:17px;background:linear-gradient(130deg,rgba(29,49,78,.2),rgba(0,0,0,.1))}.veteran-orientation-expansion header h2{margin:2px 0 12px}.veteran-orientation-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.veteran-orientation-grid article{border:1px solid var(--line);border-radius:13px;padding:13px;background:rgba(255,255,255,.025)}.veteran-orientation-grid h3{margin:0 0 7px;color:#8eb8eb;font-size:.82rem;text-transform:uppercase;letter-spacing:.06em}.veteran-orientation-grid p{margin:0;color:var(--muted);line-height:1.56}
          .veteran-choice-grid{grid-template-columns:repeat(auto-fit,minmax(285px,1fr));align-items:stretch}.veteran-choice{min-height:84px;padding:12px}.veteran-choice-copy{display:grid;gap:5px}.veteran-choice-copy strong{color:var(--ink);line-height:1.35}.veteran-choice-copy small{color:var(--muted);line-height:1.42;font-size:.79rem}.veteran-choice-instruction{margin:0;color:var(--muted);font-size:.84rem;line-height:1.45}.veteran-bubble-prompt{padding:16px}.veteran-preserved-text{border-color:rgba(116,161,220,.55);background:rgba(116,161,220,.055)}.veteran-transfer-note{color:#8eb8eb;line-height:1.4}.veteran-legacy-answer{border-left:3px solid var(--accent);padding:10px 12px;margin-top:10px;background:rgba(200,138,53,.06)}.veteran-legacy-answer strong{color:var(--ink)}.veteran-legacy-answer p{margin:6px 0;color:var(--muted);line-height:1.45;white-space:pre-wrap}.veteran-legacy-answer small{color:var(--muted)}
          @media(max-width:1050px){.veteran-orientation-grid{grid-template-columns:1fr}}
          """
          if '.veteran-orientation-expansion{' not in css:
              css = css.replace('@media(max-width:980px)', additions + '\n@media(max-width:980px)', 1)
              css_path.write_text(css, encoding='utf-8')

          index_path = Path('data/blacklight-continuum/wiki/wiki-index.json')
          index = json.loads(index_path.read_text(encoding='utf-8'))
          index['schemaVersion'] = '0.27.0'
          index['veteranReorientationEnhancements'] = 'blacklight-veteran-reorientation-options.js'
          scope = index.setdefault('completedScope', {})
          scope['veteranBubblePromptReplacements'] = 35
          scope['veteranPreservedSheetTextPrompts'] = 2
          scope['veteranExpandedStageGuides'] = 24
          scope['veteranStructuredChoiceAcknowledgements'] = 1
          next_areas = index.setdefault('nextDevelopmentAreas', [])
          old = 'live browser playtest of the twenty-four-stage veteran reorientation, response replacement, restart, export, and character-sheet attachment'
          new = 'live browser playtest of the twenty-four-stage bubble-based veteran reorientation, multi-selection Charles acknowledgments, legacy-answer migration, restart, export, and character-sheet attachment'
          if old in next_areas:
              next_areas[next_areas.index(old)] = new
          elif new not in next_areas:
              next_areas.insert(0, new)
          index_path.write_text(json.dumps(index, indent=2) + '\n', encoding='utf-8')
          PY
          node --check blacklight-veteran-reorientation-options.js
          node --check blacklight-veteran-reintroduction.js
      - name: Commit integration and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-integrate-veteran-bubble-reorientation.yml
          git add blacklight-veteran-reintroduction.html blacklight-veteran-reintroduction.js blacklight-veteran-reintroduction.css data/blacklight-continuum/wiki/wiki-index.json
          git commit -m "Convert veteran reorientation to guided bubble selections"
          git push origin main
