name: Factorio R116 recover source-matched actual 3D fin geometry after rejecting deformed hinge/fin models
on:
  push:
    branches: [main]
    paths:
      - 'tools/factorio-render-pipeline/source_original_straight_fin_recovery_r116.py'
      - 'tools/factorio-render-pipeline/audit_original_hinge_owners_r117.py'
      - 'tools/factorio-render-pipeline/source_three_existing_cast_zone_r118.py'
      - '.github/workflows/factorio-source-fin-geometry-recovery-r116.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  physical-original-fin-correction:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover exact pre-deformation R108 editable Blender cut-only source candidate, never the private original bitmap
        uses: actions/download-artifact@v4
        with:
          run-id: 41544091187
          name: factorio-r108-true-individual-curved-cupped-3d-metal-petal-candidates
          github-token: ${{ github.token }}
          path: private-ci/r108
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hb-ttrpg-tools/factorio-render-pipeline
          key: factorio-art-env-ubuntu24-blender4.5.15-python3.12-v1
      - name: Recover vetted original Blender 4.5 workstation
        run: python tools/factorio-render-pipeline/bootstrap.py install --evidence-dir private-ci/readiness
      - name: R116 cut source-real front and rear fin skins to three distinct sharp original sprite outlines without R114/R115 hinges
        run: |
          python -m py_compile tools/factorio-render-pipeline/source_original_straight_fin_recovery_r116.py
          BLENDER="$(python -c "import sys;sys.path.insert(0,'tools/factorio-render-pipeline');import bootstrap;print(bootstrap.find_blender())")"
          "$BLENDER" -b --disable-autoexec --factory-startup -t 2 --python-exit-code 4 \
            --python tools/factorio-render-pipeline/source_original_straight_fin_recovery_r116.py -- \
            --r108-dir private-ci/r108/output/r108 --out private-ci/output/r116
      - name: Audit correct base scene used, only three actual finite 3D source-shape fins changed and original full model/animation preserved
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('private-ci/output/r116')
          r=json.loads((p/'r116_source_real_3d_straight_blunt_fin_candidates.json').read_text())
          assert not r['original_bitmap_uploaded_to_public_CI']
          assert not r['visual_source_approved']
          assert r['restored_model_input'].startswith('R108 cut_only_three')
          assert 'R115' in r['rejected_successors']
          assert [c['variant'] for c in r['cases']]==[
             'r108_cut_only_source_control',
             'original_straight_sharp_fin_main_three',
             'original_lateral_heel_and_blunt_tip']
          for c in r['cases']:
             assert c['original_camera_and_moving_lower_fins_unchanged']
             assert not c['original_fin_shape_visual_approved']
             assert (p/c['editable_blend']).stat().st_size>100000
             assert (p/c['real_oblique_3d_view']).stat().st_size>5000
             assert set(c['native_original_camera_frames'])=={'1','33'}
             assert all((p/f).stat().st_size>5000 for f in c['native_original_camera_frames'].values())
             d=c['genuine_3d_source_profile_changes']
             if c['variant']=='r108_cut_only_source_control':
                assert not d
             else:
                assert set(d)=={'1','2','3'}
                for fin in d.values():
                   assert fin['closed_manifold']
                   assert fin['real_vertices']==198
                   assert fin['physical_manifold_edges']>200
                   assert fin['max_real_vertex_displacement']>.04
                   assert fin['real_front_back_separation']>0
                   assert not fin['source_approved']
          print('R116_TRUE_FIN_PHYSICAL_GEOMETRY_PASSES__SOURCE_IMAGE_FIDELITY_REQUIRES_PRIVATE_SIDE_BY_SIDE')
          PY
      - name: Preserve original-camera screenshots, oblique true 3D views and editable source scenes for actual local source sprite comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorio-r116-original-blunt-straight-fin-physical-3d-candidates
          path: |
            private-ci/output/r116/*.blend
            private-ci/output/r116/*.png
            private-ci/output/r116/*.json
            private-ci/readiness/readiness.json
          if-no-files-found: warn
          retention-days: 14

      - name: R117 audit original source-camera owner positions of three ACTUAL cast mount meshes and four dark bridge components without changing any fin or creating new hinges
        run: |
          python -m py_compile tools/factorio-render-pipeline/audit_original_hinge_owners_r117.py
          BLENDER="$(python -c "import sys;sys.path.insert(0,'tools/factorio-render-pipeline');import bootstrap;print(bootstrap.find_blender())")"
          "$BLENDER" -b --disable-autoexec --factory-startup -t 2 --python-exit-code 4 \
            --python tools/factorio-render-pipeline/audit_original_hinge_owners_r117.py -- \
            --r116-dir private-ci/output/r116 --out private-ci/output/r117
      - name: Verify every source-camera physical hinge owner is measured, isolated and restored before source-based 3D placement revision
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('private-ci/output/r117')
          r=json.loads((root/'r117_actual_mount_owner_source_camera_bounds.json').read_text())
          assert not r['source_bitmap_exported']
          assert not r['visual_acceptance']
          assert r['original_engine_geometry_unchanged']
          assert r['recovered_previous_good_fin_mesh']
          assert len(r['real_3d_owner_isolation_cases'])==7
          assert set(r['source_regions_camera_264x542'])=={
            'port_source_mount','center_source_mount','starboard_source_mount'}
          assert all((root/r[f]).stat().st_size>5000
                     for f in ('full_model_frame01','full_model_frame33'))
          for o in r['real_3d_owner_isolation_cases']:
             v=o['projected_3d_geometry']
             assert v['visible_to_renderer']
             assert v['actual_vertices']>=10
             assert v['actual_faces']>=5
             x0,y0,x1,y1=v['source_camera_native_bbox_px']
             assert x0<x1 and y0<y1
             assert (root/o['single_owner_hidden_frame01']).stat().st_size>5000
          print('R117_ACTUAL_VISIBLE_3D_OWNER_POSITION_BOUNDS_AND_ISOLATED_BLENDER_MOUNTS_PASS')
          PY
      - name: Preserve actual original-camera model-only mount owner isolation renders and native-pixel 3D bounds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorio-r117-original-source-camera-mount-owner-isolation
          path: |
            private-ci/output/r117/*.png
            private-ci/output/r117/*.json
          if-no-files-found: warn
          retention-days: 14

      - name: R118 source-zone 3D re-form THREE existing unlike cast mounting bodies directly, not R114/R115 invented pips or boulder plates
        run: |
          python -m py_compile tools/factorio-render-pipeline/source_three_existing_cast_zone_r118.py
          BLENDER="$(python -c "import sys;sys.path.insert(0,'tools/factorio-render-pipeline');import bootstrap;print(bootstrap.find_blender())")"
          "$BLENDER" -b --disable-autoexec --factory-startup -t 2 --python-exit-code 4 \
            --python tools/factorio-render-pipeline/source_three_existing_cast_zone_r118.py -- \
            --r116-dir private-ci/output/r116 --out private-ci/output/r118
      - name: Validate R118 actual original 3D cast mesh edits, unchanged corrected fin geometry/animation/material/camera and source inspectability
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('private-ci/output/r118')
          r=json.loads((p/'r118_source_actual_existing_mounts.json').read_text())
          assert not r['source_art_published'] and not r['visually_approved']
          assert r['R114_R115_boulder_castings_rejected']
          assert len(r['cases'])==3
          assert [c['variant'] for c in r['cases']]==[
             'r116_original_mount_geometry_control',
             'three_existing_castings_source_zone_registered',
             'three_asymmetric_reformed_L_cast_supports']
          for c in r['cases']:
             assert c['source_fidelity_unapproved']
             assert c['original_fin_3d_geometry_unchanged']
             assert (p/c['editable_blend']).stat().st_size>100000
             assert (p/c['actual_angled_mesh_view']).stat().st_size>5000
             assert set(c['native_camera_frames'])=={'1','33'}
             assert all((p/x).stat().st_size>5000 for x in c['native_camera_frames'].values())
             changes=c['physically_rebuilt_existing_original_mounts']
             assert set(changes)==(set() if c['variant']=='r116_original_mount_geometry_control'
                                  else {'port','center','starboard'})
             for metal in changes.values():
                 assert metal['real_vertices']>=60
                 assert metal['max_real_vertex_displacement']>.015
                 assert metal['unchanged_physical_edge_count']>100
                 assert metal['original_manifold']==metal['result_manifold']
                 assert not metal['source_approved']
          print('R118_REAL_3D_SOURCE_CASTS_SAVED_REOPENED__STILL_REQUIRES_PRIVATE_ORIGINAL_VISUAL_REVIEW')
          PY
      - name: Preserve all three editable true 3D cast variants and original-camera/oblique renders for private original sprite inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorio-r118-three-original-casting-source-zone-3d-candidates
          path: |
            private-ci/output/r118/*.blend
            private-ci/output/r118/*.png
            private-ci/output/r118/*.json
          if-no-files-found: warn
          retention-days: 14
