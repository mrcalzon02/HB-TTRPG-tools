name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check project JavaScript
        run: |
          node --check character-sheet-title.js
          node --check barotrauma-primer-click-fix.js
          node --check barotrauma-primer-page.js
          node --check npc-generator-foundation.js
          node --check npc-generator-compose.js
          node --check npc-generator-household-core.js
          node --check npc-generator-household-records.js
          node --check npc-generator-relationship-records.js
          node --check npc-generator-household.js
          node --check npc-generator-operations.js
          node --check npc-profile-generator-core.js
          node --check npc-profile-generator-entry.js
          node --check npc-profile-generator-ui.js
          node --check npc-profile-generator-renderer.js
          node --check npc-profile-generator-depth-data.js
          node --check npc-profile-generator-household-data.js
          node --check npc-profile-generator-operation-data.js
          node --check scripts/run-barotrauma-primer-browser-verification.mjs
          node --check scripts/validate-npc-phase-1.mjs
          node --check scripts/validate-npc-phase-2.mjs
          node --check scripts/validate-npc-phase-3.mjs
          node --check data/npc-generator/validate-phase-4.mjs
          node --check scripts/validate-npc-phase-5.mjs
          node --check scripts/validate-npc-phase-6.mjs
          node --check scripts/validate-npc-phase-7.mjs
          node --check scripts/validate-npc-phase-8.mjs

      - name: Validate universal NPC milestone contracts
        run: |
          node scripts/validate-npc-phase-1.mjs
          node scripts/validate-npc-phase-2.mjs
          node scripts/validate-npc-phase-3.mjs
          node data/npc-generator/validate-phase-4.mjs
          node scripts/validate-npc-phase-5.mjs
          node scripts/validate-npc-phase-6.mjs
          node scripts/validate-npc-phase-7.mjs
          node scripts/validate-npc-phase-8.mjs

      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.60.0
          npx playwright install --with-deps chromium

      - name: Verify 198 Markdown entries in both viewers
        run: node scripts/run-barotrauma-primer-browser-verification.mjs artifacts/barotrauma-primer-browser-verification.json

      - name: Remove browser dependencies
        run: rm -rf node_modules

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy
        uses: actions/deploy-pages@v4
