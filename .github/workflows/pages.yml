name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check project JavaScript
        run: |
          node --check character-sheet-title.js
          node --check barotrauma-primer-click-fix.js
          node --check barotrauma-primer-page.js
          node --check npc-generator-foundation.js
          node --check npc-generator-compose.js
          node --check npc-generator-household-core.js
          node --check npc-generator-household-records.js
          node --check npc-generator-relationship-records.js
          node --check npc-generator-household.js
          node --check npc-generator-operations.js
          node --check npc-generator-mechanics.js
          node --check npc-profile-generator-core.js
          node --check npc-profile-generator-storage.js
          node --check npc-profile-generator-export.js
          node --check npc-profile-generator-entry.js
          node --check npc-profile-generator-ui.js
          node --check npc-profile-generator-renderer.js
          node --check npc-profile-generator-mechanics-ui.js
          node --check npc-profile-generator-persistence-ui.js
          node --check npc-profile-generator-persistence-restore.js
          node --check npc-profile-generator-pack-bootstrap.js
          node --check npc-profile-generator-pack-validator.js
          node --check npc-profile-generator-pack-manager.js
          node --check npc-profile-generator-pack-storage.js
          node --check npc-profile-generator-pack-ui.js
          node --check npc-profile-generator-kaysender-data.js
          node --check npc-profile-generator-kaysender-adapter.js
          node --check npc-profile-generator-depth-data.js
          node --check npc-profile-generator-household-data.js
          node --check npc-profile-generator-operation-data.js
          node --check npc-profile-generator-mechanics-data.js
          node --check scripts/migrate-npc-custom-pack-phase-11.mjs
          node --check scripts/npc-phase-11-validation-fixture.mjs
          node --check scripts/npc-phase-11-validation-assertions.mjs
          node --check scripts/npc-phase-11-validation-runner.mjs
          node --check scripts/npc-phase-11-storage-upgrade-checks.mjs
          node --check scripts/validate-npc-phase-11.mjs
          node --check scripts/npc-phase-12-validation-fixture.mjs
          node --check scripts/npc-phase-12-validation-assertions.mjs
          node --check scripts/npc-phase-12-validation-runner.mjs
          node --check scripts/validate-npc-phase-12.mjs
          node --check scripts/run-barotrauma-primer-browser-verification.mjs
          node --check scripts/validate-npc-phase-1.mjs
          node --check scripts/validate-npc-phase-2.mjs
          node --check scripts/validate-npc-phase-3.mjs
          node --check data/npc-generator/validate-phase-4.mjs
          node --check scripts/validate-npc-phase-5.mjs
          node --check scripts/validate-npc-phase-6.mjs
          node --check scripts/validate-npc-phase-7.mjs
          node --check scripts/validate-npc-phase-8.mjs
          node --check scripts/validate-npc-phase-9.mjs
          node --check scripts/validate-npc-phase-10.mjs

      - name: Verify Phase 13 group contracts
        run: |
          node -e "for(const path of ['data/schemas/npc-profile.schema.json','data/schemas/npc-group.schema.json','data/npc-generator/groups/group-templates.json','data/npc-generator/groups/group-tables.json','data/npc-generator/fixtures/phase-13-group-matrix.json'])JSON.parse(require('node:fs').readFileSync(path,'utf8'))"
          git diff --check

      - name: Validate current universal NPC milestone
        id: npc_gate
        shell: bash
        run: |
          set +e
          node scripts/validate-npc-phase-13.mjs > phase-13-validator-output.txt 2>&1
          status=$?
          cat phase-13-validator-output.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record Phase 13 CI result
        if: github.actor != 'github-actions[bot]'
        env:
          VALIDATED_SHA: ${{ github.sha }}
          VALIDATION_STATUS: ${{ steps.npc_gate.outputs.status }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const statusCode = Number(process.env.VALIDATION_STATUS || 1);
          const receipt = {
            receiptType: 'npcPhaseCiReceipt',
            projectId: 'universal-npc-profile-generator',
            phaseId: 'phase-13-roster-group-generation',
            status: statusCode === 0 ? 'passed' : 'failed',
            validatedCommit: process.env.VALIDATED_SHA,
            validator: 'scripts/validate-npc-phase-13.mjs',
            workflow: '.github/workflows/pages.yml',
            exitCode: statusCode,
            output: fs.readFileSync('phase-13-validator-output.txt', 'utf8').trim().split('\n').slice(-240)
          };
          fs.writeFileSync('data/npc-generator/fixtures/phase-13-ci-receipt.json', `${JSON.stringify(receipt, null, 2)}\n`);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/npc-generator/fixtures/phase-13-ci-receipt.json
          if ! git diff --cached --quiet; then
            git commit -m "Record NPC phase 13 CI result [skip ci]"
            git push
          fi

      - name: Enforce NPC milestone gate
        if: steps.npc_gate.outputs.status != '0'
        run: exit 1

      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.60.0
          npx playwright install --with-deps chromium

      - name: Verify 198 Markdown entries in both viewers
        run: node scripts/run-barotrauma-primer-browser-verification.mjs artifacts/barotrauma-primer-browser-verification.json

      - name: Remove browser dependencies
        run: rm -rf node_modules

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy
        uses: actions/deploy-pages@v4
