name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify complete Crewman's Primer source bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s data/barotrauma/wiki/source/crewmans-primer-compact-part-05.b64

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build complete Crewman's Primer source JSON
        run: node scripts/build-barotrauma-primer-source.mjs

      - name: Install native Primer viewer links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '  <script src="barotrauma-entry.js"></script>'
          guard = '  <script src="barotrauma-primer-click-fix.js"></script>'
          if guard not in text:
              if marker not in text:
                  raise SystemExit('barotrauma-entry.js script marker not found in index.html')
              text = text.replace(marker, marker + '\n' + guard, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Check Primer JavaScript syntax
        run: |
          node --check character-sheet-title.js
          node --check barotrauma-entry.js
          node --check barotrauma-primer-click-fix.js
          node --check barotrauma-primer-page.js
          node --check scripts/build-barotrauma-primer-source.mjs
          node --check scripts/validate-barotrauma-crewmans-primer.mjs
          node --check scripts/run-barotrauma-primer-browser-verification.mjs

      - name: Validate Barotrauma Crewman's Primer
        run: node scripts/validate-barotrauma-crewmans-primer.mjs

      - name: Install Chromium verification runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.60.0
          npx playwright install --with-deps chromium

      - name: Verify native Primer viewer links
        run: node scripts/run-barotrauma-primer-browser-verification.mjs artifacts/barotrauma-primer-browser-verification.json artifacts/barotrauma-primer-browser-verification-failure.png artifacts/barotrauma-primer-browser-verification-failure.json

      - name: Upload Primer browser verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: barotrauma-primer-browser-verification
          path: artifacts/barotrauma-primer-browser-verification*
          if-no-files-found: warn
          retention-days: 30

      - name: Remove browser test dependencies from Pages payload
        if: ${{ always() }}
        run: rm -rf node_modules

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
