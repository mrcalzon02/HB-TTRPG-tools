name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check project JavaScript
        run: |
          find . -path './node_modules' -prune -o \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check

      - name: Verify Phase 14 contracts
        run: |
          node -e "for(const path of ['data/npc-generator/phase-status.json','data/npc-generator/fixtures/phase-14-browser-matrix.json','data/schemas/npc-profile.schema.json','data/schemas/npc-group.schema.json'])JSON.parse(require('node:fs').readFileSync(path,'utf8'))"
          git diff --check

      - name: Run consolidated NPC regression suite
        id: static_gate
        shell: bash
        run: |
          set +e
          node scripts/validate-npc-all-phases.mjs > phase-14-static-output.txt 2>&1
          status=$?
          cat phase-14-static-output.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Install Chromium
        if: steps.static_gate.outputs.status == '0'
        run: |
          npm install --no-save --package-lock=false playwright@1.60.0
          npx playwright install --with-deps chromium

      - name: Run NPC browser verification
        id: browser_gate
        if: steps.static_gate.outputs.status == '0'
        shell: bash
        run: |
          set +e
          node scripts/run-npc-browser-verification.mjs artifacts/npc-browser-verification.json > phase-14-browser-output.txt 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            node scripts/validate-npc-browser-artifact.mjs artifacts/npc-browser-verification.json >> phase-14-browser-output.txt 2>&1
            status=$?
          fi
          cat phase-14-browser-output.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record Phase 14 CI result
        if: always() && github.actor != 'github-actions[bot]'
        env:
          VALIDATED_SHA: ${{ github.sha }}
          STATIC_STATUS: ${{ steps.static_gate.outputs.status }}
          BROWSER_STATUS: ${{ steps.browser_gate.outputs.status }}
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const staticCode=Number(process.env.STATIC_STATUS||1);
          const browserCode=Number(process.env.BROWSER_STATUS||1);
          const lines=path=>fs.existsSync(path)?fs.readFileSync(path,'utf8').trim().split('\n').slice(-240):[];
          const receipt={
            receiptType:'npcPhaseCiReceipt',
            projectId:'universal-npc-profile-generator',
            phaseId:'phase-14-automated-validation-browser-testing',
            status:staticCode===0&&browserCode===0?'passed':'failed',
            validatedCommit:process.env.VALIDATED_SHA,
            staticValidator:'scripts/validate-npc-all-phases.mjs',
            browserValidator:'scripts/run-npc-browser-verification.mjs',
            browserArtifact:'artifacts/npc-browser-verification.json',
            workflow:'.github/workflows/pages.yml',
            exitCodes:{static:staticCode,browser:browserCode},
            staticOutput:lines('phase-14-static-output.txt'),
            browserOutput:lines('phase-14-browser-output.txt')
          };
          fs.mkdirSync('data/npc-generator/fixtures',{recursive:true});
          fs.writeFileSync('data/npc-generator/fixtures/phase-14-ci-receipt.json',`${JSON.stringify(receipt,null,2)}\n`);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/npc-generator/fixtures/phase-14-ci-receipt.json
          if [ -f artifacts/npc-browser-verification.json ]; then git add artifacts/npc-browser-verification.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Record NPC phase 14 CI result [skip ci]"
            git push
          fi

      - name: Enforce NPC Phase 14 gate
        if: always() && (steps.static_gate.outputs.status != '0' || steps.browser_gate.outputs.status != '0')
        run: exit 1

      - name: Verify 198 Markdown entries in both viewers
        run: node scripts/run-barotrauma-primer-browser-verification.mjs artifacts/barotrauma-primer-browser-verification.json

      - name: Remove browser dependencies
        run: rm -rf node_modules

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy
        uses: actions/deploy-pages@v4
