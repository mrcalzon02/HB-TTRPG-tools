name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate crafting generator data
        run: node scripts/validate-crafting-data.mjs

      - name: Validate main-line editor roadmap
        run: node scripts/validate-editor-roadmap.mjs

      - name: Validate shared editor kernel
        run: node scripts/validate-editor-kernel.mjs

      - name: Validate editor profile migrations
        run: node scripts/validate-editor-migrations.mjs

      - name: Validate persistent editor repository
        run: node scripts/validate-editor-repository.mjs

      - name: Validate shared editor browser runtime
        run: node scripts/validate-editor-runtime-structure.mjs

      - name: Validate P0 browser verification contract
        run: node scripts/validate-p0-browser-verification.mjs

      - name: Validate arcane academic curricula
        run: node scripts/validate-arcane-academic-generator.mjs

      - name: Validate malefic academic curricula
        run: node scripts/validate-malefic-academic-generator.mjs

      - name: Validate magical syllabus library catalogue
        run: node scripts/validate-magical-library-generator.mjs

      - name: Validate registered source references
        run: node scripts/validate-source-references.mjs

      - name: Validate Elemental Realms creature wiki
        run: node scripts/validate-elemental-realms-wiki.mjs

      - name: Validate Solanum Umbra native wiki
        run: node scripts/validate-solanum-umbra-native-wiki.mjs

      - name: Validate Solanum Umbra live workspace
        run: node scripts/validate-solanum-umbra-ui.mjs

      - name: Validate Kaysender Warlock of the Swamp
        run: node scripts/validate-kaysender-warlock-of-the-swamp.mjs

      - name: Validate Kaysender Locations of Note
        run: node scripts/validate-kaysender-locations-of-note.mjs

      - name: Validate Mad Martiken proprietor conversations
        run: node scripts/validate-kaysender-martiken-conversations.mjs

      - name: Check generator and editor JavaScript syntax
        run: |
          node --check kaysender-wiki.js
          node --check kaysender-crafting-generator.js
          node --check kaysender-npc-generator.js
          node --check kaysender-editor-kernel.js
          node --check kaysender-editor-field-mapping.js
          node --check kaysender-editor-adapter-registry.js
          node --check kaysender-editor-builtins.js
          node --check kaysender-editor-migrations.js
          node --check kaysender-editor-kernel-adapters.js
          node --check kaysender-editor-lifecycle.js
          node --check kaysender-editor-repository.js
          node --check kaysender-editor-production.js
          node --check kaysender-editor-record-library.js
          node --check kaysender-editor-parent-library.js
          node --check kaysender-editor-error-boundary.js
          node --check kaysender-editor-live-smoke.js
          node --check scripts/validate-editor-migrations.mjs
          node --check scripts/validate-editor-adapter-integration.mjs
          node --check scripts/validate-editor-inheritance.mjs
          node --check scripts/validate-editor-repository.mjs
          node --check scripts/run-p0-browser-verification.mjs
          node --check scripts/validate-p0-browser-verification.mjs
          node --check spell-creator-vocabulary.js
          node --check spell-creator-mechanics.js
          node --check module-spell-creator.js
          node --check spell-creator-entry.js
          node --check eccentric-spell-competence.js
          node --check eccentric-spell-morality.js
          node --check eccentric-spell-vocabulary.js
          node --check eccentric-spell-engine.js
          node --check eccentric-spell-view.js
          node --check eccentric-spell-text.js
          node --check eccentric-spell-controller-core.js
          node --check eccentric-spell-actions.js
          node --check eccentric-spell-runtime.js
          node --check eccentric-spell-entry.js
          node --check arcane-academic-domains.js
          node --check arcane-academic-vocabulary.js
          node --check arcane-academic-engine.js
          node --check arcane-academic-view.js
          node --check arcane-academic-text.js
          node --check arcane-academic-controller-core.js
          node --check arcane-academic-actions.js
          node --check arcane-academic-runtime.js
          node --check arcane-academic-entry.js
          node --check malefic-academic-domains.js
          node --check malefic-academic-vocabulary.js
          node --check malefic-academic-engine.js
          node --check malefic-academic-view.js
          node --check malefic-academic-text.js
          node --check malefic-academic-controller-core.js
          node --check malefic-academic-actions.js
          node --check dark-academic-runtime.js
          node --check malefic-academic-entry.js
          node --check magical-library-vocabulary.js
          node --check magical-library-engine.js
          node --check magical-library-profile-engine.js
          node --check magical-library-content-vocabulary.js
          node --check magical-library-content-engine.js
          node --check magical-library-view.js
          node --check magical-library-text.js
          node --check magical-library-controller-core.js
          node --check magical-library-actions.js
          node --check magical-library-runtime.js
          node --check magical-library-entry.js
          node --check elemental-realms-creature-core.js
          node --check elemental-realms-creatures-primary.js
          node --check elemental-realms-creatures-secondary.js
          node --check elemental-realms-creatures-expansions.js
          node --check elemental-realms-creatures-leeches.js
          node --check elemental-realms-creatures-leech-hosts.js
          node --check elemental-realms-creatures-context.js
          node --check elemental-realms-entry.js
          node --check solanum-umbra-entry.js
          node --check kaysender-editors.js
          node --check kaysender-settlement-editor.js
          node --check kaysender-airship-editor.js

      - name: Install Chromium verification runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.60.0
          npx playwright install --with-deps chromium

      - name: Run P0 browser verification
        run: node scripts/run-p0-browser-verification.mjs artifacts/p0-browser-verification.json artifacts/p0-browser-verification-failure.png artifacts/p0-browser-verification-failure.json

      - name: Validate P0 browser verification receipt
        run: node scripts/validate-p0-browser-verification.mjs artifacts/p0-browser-verification.json

      - name: Upload P0 browser verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: p0-browser-verification
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Remove browser test dependencies from Pages payload
        if: ${{ always() }}
        run: rm -rf node_modules

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
