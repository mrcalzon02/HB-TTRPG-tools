name: Deploy Blacklight EXO and Barotrauma site

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/pages.yml"
      - "*.html"
      - "*.css"
      - "*.js"
      - "*.json"
      - "data/**"
      - "scripts/**"
      - "artifacts/**"
      - "assets/**"
      - "images/**"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - "sitemap.xml"
      - "robots.txt"
      - ".nojekyll"
      - "CNAME"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-blacklight-exo-barotrauma"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check Blacklight EXO JavaScript
        shell: bash
        run: |
          find . -maxdepth 1 -name 'blacklight-exo-*.js' -print0 | xargs -0 -r -n1 node --check
          find scripts -maxdepth 1 -name 'validate-exo-*.mjs' -print0 | xargs -0 -r -n1 node --check

      - name: Validate EXO stellar sector and incremental system loading
        run: node scripts/validate-exo-stellar-sector.mjs

      - name: Validate EXO stellar sector strategic atlas
        run: node scripts/validate-exo-stellar-sector-strategic-atlas.mjs

      - name: Validate EXO stellar sector strategic map
        run: node scripts/validate-exo-stellar-sector-strategic-map.mjs

      - name: Validate EXO durable sector archives
        run: node scripts/validate-exo-sector-archives.mjs

      - name: Smoke-test EXO browser runtimes
        run: node scripts/validate-exo-browser-runtime.mjs

      - name: Validate EXO cluster jump calculator
        run: node scripts/validate-exo-jump-calculator.mjs

      - name: Validate EXO FTL Path 5 speed balance
        run: node scripts/validate-exo-ftl-path5-balance.mjs

      - name: Validate EXO vessel engineering and design philosophy
        run: node scripts/validate-exo-vessel-generator-v2.mjs

      - name: Validate EXO vessel canonical contracts
        run: node scripts/validate-exo-vessel-contracts.mjs

      - name: Validate EXO species-specific manufacturers
        run: node scripts/validate-exo-vessel-manufacturers.mjs

      - name: Validate EXO vessel expanded engineering ledger
        run: node scripts/validate-exo-vessel-engineering.mjs

      - name: Validate EXO vessel inertial-reference control
        run: node scripts/validate-exo-vessel-inertial-control.mjs

      - name: Validate EXO vessel semantic module graph
        run: node scripts/validate-exo-vessel-modules.mjs

      - name: Validate EXO alien operative technology bases
        run: node scripts/validate-exo-vessel-technology-basis.mjs

      - name: Validate EXO vessel crude voxel assembler
        run: node scripts/validate-exo-vessel-voxels.mjs

      - name: Validate EXO vessel condition, history, salvage, and destruction
        run: node scripts/validate-exo-vessel-condition.mjs

      - name: Validate EXO vessel sensor tracks and combat geometry
        run: node scripts/validate-exo-vessel-tracks.mjs

      - name: Validate EXO vessel weapon-family engagement envelopes
        run: node scripts/validate-exo-vessel-weapons.mjs

      - name: Validate EXO vessel local combat resolution
        run: node scripts/validate-exo-vessel-damage.mjs

      - name: Validate EXO vessel RPG statistics and action economy
        run: node scripts/validate-exo-vessel-gameplay.mjs

      - name: Validate canonical VESSEL-09 weapon authority
        run: node scripts/validate-exo-vessel-gameplay-weapon-authority.mjs

      - name: Validate VESSEL-10 vessel campaign persistence
        run: node scripts/validate-exo-vessel-campaign-store.mjs

      - name: Validate VESSEL-10 diegetic controls
        run: node scripts/validate-exo-vessel-diegetic-controls.mjs

      - name: Validate VESSEL-10 reversible damage editor
        run: node scripts/validate-exo-vessel-campaign-damage-editor.mjs

      - name: Validate VESSEL-10 campaign voxel viewer
        run: node scripts/validate-exo-vessel-campaign-voxel-viewer.mjs

      - name: Validate interactive vessel campaign 3D viewer
        run: node scripts/validate-exo-vessel-campaign-3d-viewer.mjs

      - name: Validate canonical VESSEL-10 loader integration
        run: node scripts/validate-exo-vessel-v10-loader.mjs

      - name: Validate phased EXO vessel base roadmap
        run: node scripts/validate-exo-vessel-roadmap-v2.mjs

      - name: Validate effective EXO vessel roadmap through VESSEL-10
        run: node scripts/validate-exo-vessel-roadmap-v3.mjs

      - name: Validate VESSEL-11 matrix and simulation contracts
        run: node scripts/validate-exo-vessel-validation-matrix.mjs

      - name: Validate scoped canonical weapon-family override
        run: node scripts/validate-exo-vessel-weapon-priority-override.mjs

      - name: Run VESSEL-11 cross-product balance matrix
        run: node scripts/run-exo-vessel-balance-matrix.mjs artifacts/exo-vessel-balance-matrix.json

      - name: Upload VESSEL-11 balance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exo-vessel-balance-matrix
          path: artifacts/exo-vessel-balance-matrix.json
          if-no-files-found: warn
          retention-days: 30

      - name: Run VESSEL-11 engagement Monte Carlo
        run: node scripts/run-exo-vessel-engagement-monte-carlo.mjs artifacts/exo-vessel-balance-matrix.json artifacts/exo-vessel-engagement-simulation.json

      - name: Upload VESSEL-11 engagement report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exo-vessel-engagement-simulation
          path: artifacts/exo-vessel-engagement-simulation.json
          if-no-files-found: warn
          retention-days: 30

      - name: Validate completed EXO vessel roadmap
        run: node scripts/validate-exo-vessel-roadmap-v4.mjs

      - name: Check Barotrauma JavaScript
        shell: bash
        run: |
          find . -maxdepth 1 -name 'barotrauma*.js' -print0 | xargs -0 -r -n1 node --check
          find scripts -maxdepth 1 \( -name '*barotrauma*.js' -o -name '*barotrauma*.mjs' \) -print0 | xargs -0 -r -n1 node --check

      - name: Verify Barotrauma crew-primer entries
        run: node scripts/run-barotrauma-primer-browser-verification.mjs artifacts/barotrauma-primer-browser-verification.json

  deploy:
    needs: validate
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write deployment health manifest
        shell: bash
        run: |
          mkdir -p artifacts
          cat > artifacts/exo-deployment-health.json <<EOF
          {
            "recordType": "blacklightExoDeploymentHealth",
            "schemaVersion": "1.0.0",
            "status": "validated-for-deployment",
            "commit": "${GITHUB_SHA}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "workflow": "${GITHUB_WORKFLOW}",
            "runId": "${GITHUB_RUN_ID}",
            "runAttempt": "${GITHUB_RUN_ATTEMPT}",
            "repository": "${GITHUB_REPOSITORY}",
            "ref": "${GITHUB_REF}"
          }
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy
        uses: actions/deploy-pages@v4