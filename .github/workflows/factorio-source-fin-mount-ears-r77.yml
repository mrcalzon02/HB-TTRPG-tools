name: Factorio R77 source-specific center fin hinge geometry
on:
  push:
    branches: [main]
    paths:
      - 'tools/factorio-render-pipeline/source_fin_mount_ears_r77.py'
      - '.github/workflows/factorio-source-fin-mount-ears-r77.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real-blender-fin-hinge-candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover existing real editable source calibration model without proprietary sprites
        uses: actions/download-artifact@v4
        with:
          run-id: 41378123612
          name: factorio-r71-3d-physically-formed-refractory-80-plates-editable-candidates
          github-token: ${{ github.token }}
          path: private-ci/r71
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hb-ttrpg-tools/factorio-render-pipeline
          key: factorio-art-env-ubuntu24-blender4.5.15-python3.12-v1
      - name: Bootstrap Blender 4.5 LTS
        run: python tools/factorio-render-pipeline/bootstrap.py install --evidence-dir private-ci/readiness
      - name: Physically shorten ONLY two original center bracket ears; render source-camera and reopen
        run: |
          BLENDER="$(python -c "import sys;sys.path.insert(0,'tools/factorio-render-pipeline');import bootstrap;print(bootstrap.find_blender())")"
          "$BLENDER" -b --disable-autoexec --factory-startup -t 2 --python-exit-code 4 \
            --python tools/factorio-render-pipeline/source_fin_mount_ears_r77.py -- \
            --source-blend private-ci/r71/output/r71/source_refractory_form_075.blend \
            --out private-ci/output/r77
      - name: Verify native frames and actual saved original geometry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('private-ci/output/r77')
          data=json.loads((root/'r77_original_ear_candidate_analysis.json').read_text())
          assert not data['original_artwork_embedded_or_uploaded']
          assert not data['source_visual_fidelity_approved']
          assert [x['existing_ear_free_length_scale'] for x in data['candidates']]==[1.0,.65,.45]
          for item in data['candidates']:
              assert (root/item['native_blender_frame_1']).stat().st_size>5000
              assert (root/item['native_blender_frame_33']).stat().st_size>5000
              if item['existing_ear_free_length_scale']<1:
                  assert (root/item['editable_reopened_blend']).stat().st_size>100000
                  assert item['unchanged_64_frame_original_fin_motion']
          print('R77_SAVED_REOPENED_REAL_3D_CENTER_ATTACHMENTS_PASS')
          PY
      - name: Upload model-only candidates, not the actual proprietary original atlas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorio-r77-original-source-center-hinge-physical-candidates
          path: |
            private-ci/output/r77/*.blend
            private-ci/output/r77/*.png
            private-ci/output/r77/*.json
            private-ci/readiness/readiness.json
          if-no-files-found: warn
          retention-days: 14
