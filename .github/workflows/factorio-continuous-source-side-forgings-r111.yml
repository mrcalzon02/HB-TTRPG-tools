name: Factorio R111 continuous bespoke left/right hinge shoulder forging from original source shape
on:
  push:
    branches: [main]
    paths:
      - 'tools/factorio-render-pipeline/source_continuous_forged_side_shoulders_r111.py'
      - '.github/workflows/factorio-continuous-source-side-forgings-r111.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  continuous-original-cast-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Load verified R110 editable 3D models; keep original sprite exclusively private
        uses: actions/download-artifact@v4
        with:
          run-id: 41557032680
          name: factorio-r110-distinct-real-3d-source-hinge-cast-meshes
          github-token: ${{ github.token }}
          path: private-ci/r110
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hb-ttrpg-tools/factorio-render-pipeline
          key: factorio-art-env-ubuntu24-blender4.5.15-python3.12-v1
      - name: Verify or install official pinned Blender 4.5 LTS
        run: python tools/factorio-render-pipeline/bootstrap.py install --evidence-dir private-ci/readiness
      - name: Replace source-traced left/right shoulder cast pieces with continuous actual closed beveled solids, render native and angled views
        run: |
          BLENDER="$(python -c "import sys;sys.path.insert(0,'tools/factorio-render-pipeline');import bootstrap;print(bootstrap.find_blender())")"
          "$BLENDER" -b --disable-autoexec --factory-startup -t 2 --python-exit-code 4 \
            --python tools/factorio-render-pipeline/source_continuous_forged_side_shoulders_r111.py -- \
            --r110-dir private-ci/r110/output/r110 --out private-ci/output/r111
      - name: Verify real independent source-formed volume, original finite-thickness shells, camera, animation and editable models
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('private-ci/output/r111')
          r=json.loads((p/'r111_continuous_independent_source_shoulders.json').read_text())
          assert not r['source_art_exported']
          assert not r['source_visual_fidelity_approved']
          assert len(r['candidates'])==4
          assert {c['variant'] for c in r['candidates']}=={
              'r110_existing_independent_casts','continuous_original_shoulders',
              'broad_stepped_forged_shoulders','deep_independent_cupped_castings'}
          for c in r['candidates']:
              assert not c['source_visual_approved']
              assert c['original_other_parts_and_lower_animation_unchanged']
              assert (p/c['editable_blend']).stat().st_size>100000
              assert (p/c['genuine_angled_3d_render']).stat().st_size>5000
              assert len(c['original_camera_frames'])==2
              for img in c['original_camera_frames'].values():
                  assert (p/img).stat().st_size>5000
              if c['variant']=='r110_existing_independent_casts':
                  assert not c['left_right_real_3d_side_forgings']
              else:
                  forms=c['left_right_real_3d_side_forgings']
                  assert set(forms)=={'1','3'}
                  assert forms['1']['casting']!=forms['3']['casting']
                  assert forms['1']['source_outline_points']!=forms['3']['source_outline_points']
                  for x in forms.values():
                      assert x['closed_two_sided_beveled_shell']
                      assert x['physical_manifold_edges']>40
                      assert x['new_unified_forged_solid']['camera_depth_extent']>.07
                      assert x['new_unified_forged_solid']['real_polygons']>50
                      assert x['source_visually_unapproved']
          print('R111_REAL_CONTINUOUS_INDEPENDENT_SOURCE_3D_HINGE_SHOULDERS_GEOMETRY_PASS')
          PY
      - name: Preserve actual editable Blender models and native/oblique geometry evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorio-r111-continuous-original-source-asymmetric-forged-hinge-volumes
          path: |
            private-ci/output/r111/*.blend
            private-ci/output/r111/*.png
            private-ci/output/r111/*.json
            private-ci/readiness/readiness.json
          if-no-files-found: warn
          retention-days: 14
