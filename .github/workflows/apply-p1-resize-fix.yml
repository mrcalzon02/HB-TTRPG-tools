name: Apply P1 resize dependency correction

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/apply-p1-resize-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply deterministic source correction
        run: node scripts/apply-p1-resize-dependency-fix.mjs

      - name: Verify corrected resize behavior
        run: node scripts/validate-p1-surface-grid-resize.mjs

      - name: Remove one-use patch machinery
        run: rm scripts/apply-p1-resize-dependency-fix.mjs .github/workflows/apply-p1-resize-fix.yml

      - name: Commit corrected source to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kaysender-surface-grid-resize.js scripts/apply-p1-resize-dependency-fix.mjs .github/workflows/apply-p1-resize-fix.yml
          git commit -m "Fix P1 resize dependency alignment"
          git pull --rebase origin main
          git push origin HEAD:main
