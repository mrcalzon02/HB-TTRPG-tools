name: Correct and validate expanded combat example

on:
  push:
    paths:
      - .github/workflows/one-time-expanded-combat-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct movement and action timing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          combat_path = Path('data/blacklight-continuum/rules/combat-foundation.json')
          combat = json.loads(combat_path.read_text(encoding='utf-8'))
          combat['movement']['dragging'] = (
              'A character adjacent to a willing, unconscious, or Downed target may drag that target during the Move. '
              'Each meter dragged costs 2 meters of movement. The mover must have Carry at least equal to the target’s ordinary personal scale or receive sufficient assistance. '
              'Dragging does not restore the target’s actions, change Downed or Stable state, or protect against attacks unless the new position provides cover.'
          )
          combat_path.write_text(json.dumps(combat, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          module_path = Path('data/blacklight-continuum/wiki/combat-example-module.json')
          module = json.loads(module_path.read_text(encoding='utf-8'))
          example = next(item for item in module['entries'] if item['id'] == 'worked-combat-cargo-gallery')

          def replace_paragraph(prefix, replacement):
              for index, paragraph in enumerate(example['body']):
                  if paragraph.startswith(prefix):
                      example['body'][index] = replacement
                      return
              raise SystemExit(f'Missing paragraph: {prefix}')

          replace_paragraph(
              'Round 6, Kest changes Siege Form',
              'Round 6, Kest changes Siege Form from Bulwark to Breacher, paying the 2 Fury cost again and reducing Fury from 5 to 3. Bulwark Armor ends immediately, so Protection returns to 7. Breacher adds three dice against barriers and ignores 2 Armor on structures, but changing the active configuration consumes Kest’s Standard Action. He cannot also attack the bulkhead this turn. He uses his Move to brace against the sealed door, but Total Cover prevents passage. Because the artificial enclosure has prevented Kest from moving more than 2 meters for one complete round, the First Fang Wilds Bane Cage Fury raises Instinct from 5 to 6 at the end of the turn.'
          )
          replace_paragraph(
              'Stage Four — Rescue Under a Rampaging Apex. Round 9, Mara spends',
              'Stage Four — Rescue Under a Rampaging Apex. Round 9, Mara spends 1 Cohesion on Commit, reducing Cohesion from 4 to 3, and fires eight rifle dice. Six successes against difficulty 3 create Margin 3 and Raw Damage 8. Apex Protection 9 leaves the minimum 1 Trauma. The Wounded nine-die Soak pool produces one success and removes it. This is the clearest demonstration of the advantage: Mara produces an exceptional rifle hit, yet the combination of fixed Protection and rolled Soak still prevents every point of Vitality loss. After firing, Mara uses her Move to close the distance and ends adjacent to Ilyan behind the same cargo strut, placing herself where she can attempt treatment if Kest reaches him.'
          )
          replace_paragraph(
              'Mara uses the rest of her Move to drag Ilyan',
              'Because Mara began the turn adjacent to Ilyan, she can use her full Move to drag him four meters behind the cargo-loader housing. Dragging a willing, unconscious, or Downed character costs 2 meters of movement for every meter crossed, so moving Ilyan four meters consumes all 8 meters of Mara’s movement. The housing becomes Total Cover from Kest’s present angle. This positioning is what keeps the rescue from being immediately undone.'
          )

          track_table = next(table for table in example['tables'] if table['title'] == 'Round-by-Round Track State')
          for row in track_table['rows']:
              if row[0] == '6':
                  row[3] = 'Fury 3 · Instinct 6 · Breacher configured · still behind Total Cover'

          module_path.write_text(json.dumps(module, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          wiki_path = Path('data/blacklight-continuum/wiki/basic-archetypes.json')
          wiki = json.loads(wiki_path.read_text(encoding='utf-8'))
          wiki['schemaVersion'] = '0.11.0'
          shapechanger = next(item for item in wiki['entries'] if item['id'] == 'shapechanger-archetype')
          paragraph = (
              'Living Soak is an innate Shapechanger defense separate from Protection. After Protection determines remaining damage, social form rolls Resilience against Impact, while hunting and war forms roll Resilience + Archetype Rating against Impact or Trauma. Each success removes one damage and may reduce a successful hit to zero. Disruption, Pressure, Exposure, and non-damage Death Marks bypass Living Soak.'
          )
          shapechanger['body'] = [item for item in shapechanger['body'] if not item.startswith('Living Soak is an innate Shapechanger defense')]
          shapechanger['body'].insert(1, paragraph)
          wiki_path.write_text(json.dumps(wiki, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          Path('.github/workflows/one-time-expanded-combat-validation.yml').unlink()
          PY
      - name: Validate expanded encounter
        run: |
          node --check blacklight-combat-example.js
          node --check blacklight-combat-example-entry.js
          python - <<'PY'
          import json
          from pathlib import Path

          basic = json.loads(Path('data/blacklight-continuum/rules/basic-character-options.json').read_text(encoding='utf-8'))
          combat = json.loads(Path('data/blacklight-continuum/rules/combat-foundation.json').read_text(encoding='utf-8'))
          module = json.loads(Path('data/blacklight-continuum/wiki/combat-example-module.json').read_text(encoding='utf-8'))
          wiki = json.loads(Path('data/blacklight-continuum/wiki/basic-archetypes.json').read_text(encoding='utf-8'))
          index = json.loads(Path('data/blacklight-continuum/wiki/wiki-index.json').read_text(encoding='utf-8'))

          shapechanger = next(item for item in basic['archetypes'] if item['id'] == 'shapechanger')
          soak = next(item for item in shapechanger['innateAbilities'] if item['name'] == 'Living Soak')
          assert 'Resilience + Archetype Rating' in soak['effect']
          assert 'reduce a successful hit to 0 damage' in soak['effect']
          assert 'drag' in combat['movement']
          assert combat['movement']['dragging'].startswith('A character adjacent')
          assert combat['shapechangerSoak']['completeNegation']
          assert len(combat['attackProcedure']['damageResolutionOrder']) == 6

          entries = {item['id']: item for item in module['entries']}
          assert len(entries) == 4
          assert 'shapechanger-living-soak' in entries
          example = entries['worked-combat-cargo-gallery']
          text = '\n'.join(example['body'])
          assert 'Round 13' in text
          assert 'Living Soak' in text
          assert 'cannot also attack the bulkhead this turn' in text
          assert 'ends adjacent to Ilyan' in text
          assert 'consumes all 8 meters' in text
          assert 'Kest reaches at least 3 and dies immediately' in text
          assert 'attempts Stabilize without a kit' in text
          assert text.count('Round ') >= 26

          # Major displayed arithmetic.
          assert 4 + 0 - 4 <= 0                 # Social-form pistol reaches minimum 1.
          assert 4 + 1 - 4 == 1                 # Round 2 before Soak.
          assert 5 + 2 - 7 == 0                 # Rifle reduced to minimum 1 before Soak.
          assert 7 + 3 == 10                    # Massive Shift Soak pool.
          assert 7 + 2 == 9                     # Apex/Bulwark Protection.
          assert 6 + 4 - 3 == 7                 # Apex claws against Ilyan.
          assert 6 - 7 == -1                    # Ilyan takes one excess Death Mark.
          assert 1 - 3 == -2                    # Kest takes two excess Death Marks.
          assert 2 + 2 >= 3                     # Final failed Death Test is fatal.

          shape_wiki = next(item for item in wiki['entries'] if item['id'] == 'shapechanger-archetype')
          assert any(item.startswith('Living Soak is an innate Shapechanger defense') for item in shape_wiki['body'])
          assert index['completedScope']['combatTeachingEntries'] == 4
          assert index['completedScope']['shapechangerLivingSoakProcedures'] == 1
          PY
      - name: Commit corrected expansion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Validate expanded Shapechanger soak combat example"
          git push origin main
