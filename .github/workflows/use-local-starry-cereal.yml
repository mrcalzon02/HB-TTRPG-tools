name: Use repository-owned Starry Cereal track

on:
  push:
    paths:
      - .github/workflows/use-local-starry-cereal.yml

permissions:
  contents: write

jobs:
  use-local-track:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Point the shared player at the repository asset
        run: |
          test -f "assets/blacklight/Starry Cereal.mp3"
          python - <<'PY'
          from pathlib import Path

          path = Path('blacklight-background-audio.js')
          text = path.read_text(encoding='utf-8')
          external = "const trackUrl = 'https://cdn1.suno.ai/f02fe8ca-e7ea-4608-95c0-1c7d795637b1.mp3';"
          local = "const trackUrl = 'assets/blacklight/Starry%20Cereal.mp3';"
          if external in text:
              path.write_text(text.replace(external, local, 1), encoding='utf-8')
          elif local not in text:
              raise RuntimeError('The authoritative track URL declaration was not found.')
          PY

      - name: Commit the local asset route
        run: |
          if git diff --quiet -- blacklight-background-audio.js; then
            echo "The player already uses the repository-owned MP3."
            exit 0
          fi
          git config user.name "Blacklight Continuum Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -- blacklight-background-audio.js
          git commit -m "Use repository-owned Starry Cereal track"
          git push origin HEAD:main
