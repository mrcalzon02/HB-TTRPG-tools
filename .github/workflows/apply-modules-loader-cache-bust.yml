name: Apply Modules loader cache bust

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_modules_loader_cache_bust.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python scripts/apply_modules_loader_cache_bust.py
      - name: Validate cache-busted Modules loader reference
        run: |
          grep -F 'app-lite-view-mounts.js?v=22-modules-spatial-suite' index.html
          node tests/modules-spatial-interface.test.js
      - name: Commit cache-busted loader reference
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Cache-bust Modules spatial interface loader'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
