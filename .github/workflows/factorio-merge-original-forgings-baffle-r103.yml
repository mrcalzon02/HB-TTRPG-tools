name: Factorio R103 integrate original-source distinct forgings and true R11 annular baffle in Blender
on:
  push:
    branches: [main]
    paths:
      - 'tools/factorio-render-pipeline/merge_original_forgings_baffle_r103.py'
      - '.github/workflows/factorio-merge-original-forgings-baffle-r103.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real-original-sprite-3d-physical-model-merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download SHA-verified original source-fit R97 actual forged mount .blend candidates
        uses: actions/download-artifact@v4
        with:
          run-id: 41504074348
          name: factorio-r97-source-traced-asymmetric-large-forged-sidewalls
          github-token: ${{ github.token }}
          path: private-ci/r97
      - name: Download SHA-verified R101 original-source-verified actual 3D R11 annulus candidates
        uses: actions/download-artifact@v4
        with:
          run-id: 41514469964
          name: factorio-r101-real-3d-source-r11-annular-baffle-profile-reconstruction
          github-token: ${{ github.token }}
          path: private-ci/r101
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hb-ttrpg-tools/factorio-render-pipeline
          key: factorio-art-env-ubuntu24-blender4.5.15-python3.12-v1
      - name: Install pinned verified Blender 4.5 LTS environment
        run: python tools/factorio-render-pipeline/bootstrap.py install --evidence-dir private-ci/readiness
      - name: Genuinely join source-specific R97 forged casting and R101 baffle meshes without touching other machine systems
        run: |
          BLENDER="$(python -c "import sys;sys.path.insert(0,'tools/factorio-render-pipeline');import bootstrap;print(bootstrap.find_blender())")"
          "$BLENDER" -b --disable-autoexec --factory-startup -t 2 --python-exit-code 4 \
            --python tools/factorio-render-pipeline/merge_original_forgings_baffle_r103.py -- \
            --r97-dir private-ci/r97/output/r97 \
            --r101-dir private-ci/r101/output/r101 \
            --out private-ci/output/r103
      - name: Verify four genuine saved/reopened 3D composite scenes, native original-camera frames and unaffected animation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('private-ci/output/r103')
          r=json.loads((root/'r103_original_source_real_metal_composite_candidates.json').read_text())
          assert len(r['candidates'])==6
          assert r['original_r97_and_r101_3d_scenes_sha_verified']
          assert not r['proprietary_original_pixels_uploaded_to_public_ci']
          assert not r['source_geometry_visually_approved']
          for case in r['candidates']:
              assert (root/case['native_frame1']).stat().st_size>5000
              assert (root/case['native_frame33']).stat().st_size>5000
              assert case['all_other_original_3d_geometry_motion_camera_and_materials_unchanged']
              if case['saved_editable_blend']:
                  assert (root/case['saved_editable_blend']).stat().st_size>100000
          print('R103_ACTUAL_ORIGINAL_3D_SOURCE_FORGINGS_AND_R11_BAFFLE_MERGED_VERIFIED')
          PY
      - name: Upload only real original-camera Blender test models, not proprietary original source imagery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorio-r103-source-true-3d-forging-and-nozzle-baffle-editable-composites
          path: |
            private-ci/output/r103/*.blend
            private-ci/output/r103/*.png
            private-ci/output/r103/*.json
            private-ci/readiness/readiness.json
          if-no-files-found: warn
          retention-days: 14
