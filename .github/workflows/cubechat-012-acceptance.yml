name: CubeChat 0.1.2 upgrade and conversations
on:
  push:
    branches:
      - qa/cubechat-android-0.1.0
    paths:
      - '.github/workflows/cubechat-012-acceptance.yml'
      - '.github/scripts/cubechat_012_acceptance.py'
      - '.github/cubechat-candidate/CubeChat.apk'
permissions:
  contents: read
jobs:
  two-emulators:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .github/cubechat-candidate
      - name: Check the published binary and decoder
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/mrcalzon02/HB-TTRPG-tools/releases/download/cubechat-android-v0.1.1/CubeChat.apk -o "$RUNNER_TEMP/CubeChat-previous.apk"
          echo "7511cebd219cf3b6d130aac98db2080f9ef50cbba69f6c51dafad70913b44648  $RUNNER_TEMP/CubeChat-previous.apk" | sha256sum -c -
          echo "8269f921284f0bd3180e786d3ddf9358364a677e08cd948dec032262b3d5cc7c  .github/cubechat-candidate/CubeChat.apk" | sha256sum -c -
          curl --fail --silent --show-error --location --retry 2 \
            https://repo.maven.apache.org/maven2/com/google/zxing/core/3.5.3/core-3.5.3.jar \
            --output "$RUNNER_TEMP/zxing-core.jar"
          echo "8d8064c1636fdaef7189dd9055c7d59950a8940a12f2293956446ec3c109fd82  $RUNNER_TEMP/zxing-core.jar" | sha256sum -c -
          javac -cp "$RUNNER_TEMP/zxing-core.jar" -d "$RUNNER_TEMP" .github/scripts/CubeChatQrReader.java .github/scripts/CubeChatBlackFrame.java
      - name: Boot two Android guests and verify the conversation
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-cubechat-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          sudo chmod 0666 /dev/kvm
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          sdkmanager --install "emulator" "platform-tools" "system-images;android-30;default;x86_64" > "$RUNNER_TEMP/android-setup.log"
          test -f "$ANDROID_HOME/system-images/android-30/default/x86_64/system.img"
          export ANDROID_USER_HOME="$RUNNER_TEMP/cubechat-android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          emulator_pids=()
          trap 'for pid in "${emulator_pids[@]}"; do kill "$pid" 2>/dev/null || true; done' EXIT
          adb start-server
          for port in 5554 5556; do
            name="cubechat-$port"
            avd_dir="$ANDROID_AVD_HOME/$name.avd"
            mkdir -p "$avd_dir"
            printf '%s\n' 'avd.ini.encoding=UTF-8' "path=$avd_dir" 'target=android-30' > "$ANDROID_AVD_HOME/$name.ini"
            printf '%s\n' "AvdId=$name" "avd.ini.displayname=$name" > "$avd_dir/config.ini"
            cat >> "$avd_dir/config.ini" <<'AVD'
          abi.type=x86_64
          hw.cpu.arch=x86_64
          image.sysdir.1=system-images/android-30/default/x86_64/
          tag.id=default
          tag.display=Default
          hw.lcd.width=720
          hw.lcd.height=1280
          hw.lcd.density=240
          hw.ramSize=2048
          vm.heapSize=256
          disk.dataPartition.size=2G
          hw.keyboard=yes
          hw.wifi=yes
          hw.gpu.enabled=yes
          hw.audioInput=no
          hw.audioOutput=no
          fastboot.forceColdBoot=yes
          AVD
            emulator -list-avds | grep -Fx "$name"
            stat -c 'KVM device %a %U:%G' /dev/kvm
            emulator -accel-check
            emulator -avd "$name" -port "$port" -accel on -cores 2 -memory 2048 \
              -no-window -no-snapshot -no-boot-anim -no-audio -no-metrics \
              -gpu swiftshader_indirect -feature -Vulkan > "$RUNNER_TEMP/$name.log" 2>&1 &
            vm_pid=$!
            emulator_pids+=("$vm_pid")
            export ANDROID_SERIAL="emulator-$port"
            booted=''
            for attempt in {1..100}; do
              if ! kill -0 "$vm_pid" 2>/dev/null; then
                tail -100 "$RUNNER_TEMP/cubechat-$port.log"
                exit 1
              fi
              booted=$(timeout 4 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
              if [[ "$booted" == 1 ]]; then break; fi
              sleep 3
            done
            [[ "$booted" == 1 ]]
            adb shell input keyevent 82
            adb shell wm dismiss-keyguard
            adb shell wm size 720x1280
            adb shell wm density 240
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb shell settings put system screen_off_timeout 1800000
            adb install -r "$RUNNER_TEMP/CubeChat-previous.apk"
          done
          python3 .github/scripts/cubechat_012_acceptance.py
          test_apk=.github/cubechat-candidate/ContactStorageChecks.apk
          echo "7e3034b7a37bfb504e53f43829c77070fe7d11b32752a36c61464a3658eb7e9f  $test_apk" | sha256sum -c -
          adb -s emulator-5554 install -r "$test_apk"
          adb -s emulator-5554 shell am instrument -w org.cubechat.android.test/org.cubechat.android.ContactStorageChecks | tee "$RUNNER_TEMP/store-check.log"
          grep -F "PASS: SQLite upgrade" "$RUNNER_TEMP/store-check.log"
          grep -F "INSTRUMENTATION_CODE: -1" "$RUNNER_TEMP/store-check.log"
      - name: Save the key-free conversation screenshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CubeChat-Android-012-conversation
          path: ${{ runner.temp }}/CubeChat-012-*.png
          if-no-files-found: error
          retention-days: 7
