name: Blacklight | consolidated validation

# Replaces four independent Blacklight checks with ONE job without dropping
# equipment, mission, random-character or veteran-reintroduction coverage.
# Prior definitions remain recoverable in Git history.
on:
  push:
    paths:
      - '.github/workflows/validate-blacklight.yml'
      - 'blacklight-character-creation.html'
      - 'blacklight-character-sheet-handoff.js'
      - 'blacklight-equipment-catalog.js'
      - 'blacklight-equipment-entry.js'
      - 'blacklight-mission-generator-entry.js'
      - 'blacklight-mission-generator.css'
      - 'blacklight-mission-generator.html'
      - 'blacklight-mission-generator.js'
      - 'blacklight-random-character-entry.js'
      - 'blacklight-random-character.css'
      - 'blacklight-random-character.html'
      - 'blacklight-random-character.js'
      - 'blacklight-veteran-reintroduction-entry.js'
      - 'blacklight-veteran-reintroduction.css'
      - 'blacklight-veteran-reintroduction.html'
      - 'blacklight-veteran-reintroduction.js'
      - 'data/blacklight-continuum/generators/mission-generator-content.json'
      - 'data/blacklight-continuum/generators/random-character-content.json'
      - 'data/blacklight-continuum/rules/alien-technology-templates.json'
      - 'data/blacklight-continuum/rules/basic-character-options.json'
      - 'data/blacklight-continuum/rules/character-creation-foundation.json'
      - 'data/blacklight-continuum/rules/equipment-foundation.json'
      - 'data/blacklight-continuum/rules/future-scavenged-survival-equipment.json'
      - 'data/blacklight-continuum/rules/modern-historical-equipment.json'
      - 'data/blacklight-continuum/rules/supernatural-artifacts-relics.json'
      - 'data/blacklight-continuum/wiki/equipment-catalogs.json'
      - 'data/blacklight-continuum/wiki/mission-generator.json'
      - 'data/blacklight-continuum/wiki/random-character-generator.json'
      - 'data/blacklight-continuum/wiki/veteran-reintroduction.json'
      - 'data/blacklight-continuum/wiki/wiki-index.json'
      - 'index.html'
      - 'scripts/validate-blacklight-equipment.py'
      - 'scripts/validate-blacklight-mission-generator.py'
      - 'scripts/validate-blacklight-random-character.py'
      - 'scripts/validate-blacklight-veteran-reintroduction.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blacklight-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  all-four-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all four Blacklight content areas
        run: |
          python scripts/validate-blacklight-equipment.py
          python scripts/validate-blacklight-mission-generator.py
          python scripts/validate-blacklight-random-character.py
          python scripts/validate-blacklight-veteran-reintroduction.py
      - name: Check all original JavaScript entry points
        run: |
          node --check blacklight-equipment-catalog.js
          node --check blacklight-equipment-entry.js
          node --check blacklight-character-sheet-handoff.js
          node --check blacklight-mission-generator.js
          node --check blacklight-mission-generator-entry.js
          node --check blacklight-random-character.js
          node --check blacklight-random-character-entry.js
          node --check blacklight-veteran-reintroduction.js
          node --check blacklight-veteran-reintroduction-entry.js
