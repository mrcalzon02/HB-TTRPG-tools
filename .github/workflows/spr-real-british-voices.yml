name: SPR real British neural voices (Windows diagnostic)

on:
  push:
    paths:
      - "software/superposition-reader/spr_local_voices.py"
      - "software/superposition-reader/spr_local_voice_worker.py"
      - "software/superposition-reader/spr_local_voice_smoke.py"
      - "software/superposition-reader/install-local-voices-windows.ps1"
      - ".github/workflows/spr-real-british-voices.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-local-synthesis:
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: kokoro
            selection: kokoro-british
            voice: bm_george
          - engine: piper
            selection: en_GB-alan-medium
            voice: en_GB-alan-medium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requested model in isolated private runtime
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'spr-voice-validation'
          & ./software/superposition-reader/install-local-voices-windows.ps1 -DataDir $dir -Engine '${{ matrix.engine }}' -Voice '${{ matrix.selection }}'
          if ($LASTEXITCODE -ne 0) { throw 'Local voice installer returned an error' }
      - name: Synthesize and validate actual PCM speech
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'spr-voice-validation'
          python software/superposition-reader/spr_local_voice_smoke.py --data-dir $dir --engine '${{ matrix.engine }}' --voice '${{ matrix.voice }}' --output "build/voice-auditions/${{ matrix.voice }}.wav"
          if ($LASTEXITCODE -ne 0) { throw 'Real speech synthesis failed' }
      - name: Upload real audio audition
        uses: actions/upload-artifact@v4
        with:
          name: SPR-real-${{ matrix.engine }}-${{ matrix.voice }}
          path: build/voice-auditions/*.wav
          if-no-files-found: error
          retention-days: 14
