name: Homebrew local worker

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Workbench export, Blender readiness, full audit, or a short live-status check
        type: choice
        options: [blender, full, workbench, status]
        default: blender
  push:
    branches: [main]
    paths: ['.github/workflows/homebrew-local-worker.yml', 'tools/local-worker/**']

permissions:
  contents: read
  checks: write

concurrency:
  group: old-core30-local-worker
  cancel-in-progress: false

jobs:
  repair-and-test:
    if: github.repository == 'mrcalzon02/HB-TTRPG-tools' && github.ref == 'refs/heads/main' && github.actor == 'mrcalzon02'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    env:
      HB_MODE: ${{ inputs.mode || 'workbench' }}
      # Pinned source request; update this SHA when intentionally requesting a new export.
      HB_WORKBENCH_COMMIT: 'ce3ef9720298807e3036962bde094341643c237f'
      HB_WORKBENCH_SCRIPT: 'models/island-survival/blender/workbench-v7/workbench_v7.py'
      HB_WORKBENCH_SOURCE_ZIP: 'models/island-survival/blender/workbench-v7/source.zip'
      HB_WORKBENCH_SOURCE_SHA256: '26f1402a2aa1920cdaaa8e8e15399250a86e6a6aa9bb9a00c832a76068d6c2cb'
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
    steps:
      - name: Start live worker status
        id: status-start
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HB_STATUS_ONLY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[worker-status-check]') }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          if ($env:RUNNER_NAME -ne 'OLD-CORE30-homebrew') { throw 'Wrong runner; no changes made.' }
          if ($env:HB_STATUS_ONLY -eq 'true') {
            $env:HB_MODE='status'
            'HB_MODE=status' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }
          $root='D:\Runner\actions-runner'
          if (-not (Test-Path -LiteralPath "$root\.runner")) { throw 'Expected runner configuration is missing.' }
          $out=Join-Path $root ("_homebrew\reports\{0}-{1}" -f $env:GITHUB_RUN_ID,$env:GITHUB_RUN_ATTEMPT)
          $support=Join-Path $out '_status-support'
          New-Item -ItemType Directory -Force -Path $support | Out-Null
          "HB_REPORT_DIR=$out" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $statusScript=Join-Path $support 'worker_status.ps1'
          "HB_STATUS_SCRIPT=$statusScript" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          [Net.ServicePointManager]::SecurityProtocol=[Net.SecurityProtocolType]::Tls12
          foreach ($name in @('worker_status.ps1','publish_status.ps1','test_worker_status.ps1')) {
            $downloaded=$false
            foreach ($delay in @(0,2,5)) {
              if ($delay -gt 0) { Start-Sleep -Seconds $delay }
              try {
                $uri="https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/tools/local-worker/$name"
                Invoke-WebRequest -UseBasicParsing -Uri $uri -OutFile (Join-Path $support $name) -TimeoutSec 20
                $downloaded=$true; break
              } catch { Write-Warning "Status support download delayed: $name" }
            }
            if (-not $downloaded) { throw "Status support unavailable: $name. Task execution remains independent." }
          }
          . $statusScript
          Initialize-HBStatus -Directory $out -Mode $env:HB_MODE
          Start-HBStatusPublisher -Directory $out

      - name: Test selected local-worker capabilities
        id: work
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          if ($env:RUNNER_NAME -ne 'OLD-CORE30-homebrew') { throw 'Wrong runner; no changes made.' }
          $root='D:\Runner\actions-runner'
          if (-not (Test-Path -LiteralPath "$root\.runner")) { throw 'Expected runner configuration is missing.' }
          $out=Join-Path $root ("_homebrew\reports\{0}-{1}" -f $env:GITHUB_RUN_ID,$env:GITHUB_RUN_ATTEMPT)
          $support=Join-Path $out '_status-support'
          New-Item -ItemType Directory -Force -Path $support | Out-Null
          "HB_REPORT_DIR=$out" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $workerScript=Join-Path $support 'run_worker.ps1'
          [Net.ServicePointManager]::SecurityProtocol=[Net.SecurityProtocolType]::Tls12
          $downloaded=$false
          foreach ($delay in @(0,2,5)) {
            if ($delay -gt 0) { Start-Sleep -Seconds $delay }
            try {
              $uri="https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/tools/local-worker/run_worker.ps1"
              Invoke-WebRequest -UseBasicParsing -Uri $uri -OutFile $workerScript -TimeoutSec 20
              $downloaded=$true; break
            } catch { Write-Warning 'Pinned worker script download delayed.' }
          }
          if (-not $downloaded) { throw 'Pinned worker script could not be downloaded.' }
          & $workerScript
          exit $LASTEXITCODE

      - name: Mark artifact transfer in progress
        if: always() && env.HB_REPORT_DIR != ''
        continue-on-error: true
        run: |
          if ($env:HB_STATUS_SCRIPT -and (Test-Path -LiteralPath $env:HB_STATUS_SCRIPT)) {
            . $env:HB_STATUS_SCRIPT
            Set-HBStatus -Directory $env:HB_REPORT_DIR -Stage 'artifact-upload' -Delivery @{state='uploading';artifact_id=$null;url=$null;digest=$null} -Progress @{} -Progressed
          }

      - name: Publish checkpoints and test evidence even on failure
        id: evidence
        if: always() && env.HB_REPORT_DIR != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: old-core30-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.HB_REPORT_DIR }}/**/*.json
            ${{ env.HB_REPORT_DIR }}/*.md
            ${{ env.HB_REPORT_DIR }}/*.txt
            ${{ env.HB_REPORT_DIR }}/**/*.png
            ${{ env.HB_REPORT_DIR }}/*.blend
            ${{ env.HB_REPORT_DIR }}/**/*.py
            ${{ env.HB_REPORT_DIR }}/**/*.ps1
            ${{ env.HB_REPORT_DIR }}/*.java
            ${{ env.HB_REPORT_DIR }}/*.zip
            ${{ env.HB_REPORT_DIR }}/**/*.gif
            ${{ env.HB_REPORT_DIR }}/**/*.mp4
            ${{ env.HB_REPORT_DIR }}/**/*.webp
          if-no-files-found: error
          retention-days: 14

      - name: Finalize worker receipt and live status
        if: always() && env.HB_REPORT_DIR != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HB_WORK_OUTCOME: ${{ steps.work.outcome }}
          HB_UPLOAD_OUTCOME: ${{ steps.evidence.outcome }}
          HB_ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          HB_ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
          HB_ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
          HB_CANCELLED: ${{ job.status == 'cancelled' }}
        run: |
          $ErrorActionPreference='Stop'
          if (-not $env:HB_STATUS_SCRIPT -or -not (Test-Path -LiteralPath $env:HB_STATUS_SCRIPT)) {
            'Live-status finalization unavailable. Use the Actions job outcome and artifact receipt.' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 0
          }
          . $env:HB_STATUS_SCRIPT
          if ($env:HB_CANCELLED -eq 'true') { $env:HB_WORK_OUTCOME='cancelled' }
          Complete-HBStatus -Directory $env:HB_REPORT_DIR -WorkOutcome $env:HB_WORK_OUTCOME -UploadOutcome $env:HB_UPLOAD_OUTCOME -ArtifactId $env:HB_ARTIFACT_ID -ArtifactUrl $env:HB_ARTIFACT_URL -ArtifactDigest $env:HB_ARTIFACT_DIGEST
