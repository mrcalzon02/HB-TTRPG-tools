name: Apply Tenelja Drenal Dramatis Increment

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/apply-tenelja-drenal-dramatis-increment.py"
      - ".github/workflows/apply-tenelja-drenal-dramatis-increment.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "apply-tenelja-drenal-dramatis-increment"
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Rebase onto latest concurrent main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply verified direct-source increment
        id: apply
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/apply-tenelja-drenal-dramatis-increment.py 2>&1 | tee /tmp/tenelja-dramatis.log
      - name: Publish temporary failure diagnostic
        if: steps.apply.outcome == 'failure'
        run: |
          cp /tmp/tenelja-dramatis.log scripts/tenelja-dramatis-failure.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/tenelja-dramatis-failure.log
          git commit -m "chore: record Tenelja Dramatis apply failure"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          exit 1
      - name: Remove one-shot migration mechanism
        if: steps.apply.outcome == 'success'
        run: |
          rm -f scripts/apply-tenelja-drenal-dramatis-increment.py
          rm -f .github/workflows/apply-tenelja-drenal-dramatis-increment.yml
          rm -f scripts/tenelja-dramatis-failure.log
      - name: Commit and fast-forward directly to main
        if: steps.apply.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add Tenelja and Drenal personae"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
