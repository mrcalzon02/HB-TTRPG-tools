name: CubeChat Wi-Fi Direct radio acceptance
on:
  push:
    branches:
      - qa/cubechat-android-0.1.0
    paths:
      - '.github/workflows/cubechat-wifidirect-qa.yml'
      - '.github/scripts/cubechat_wifidirect_qa.py'
permissions:
  contents: read
jobs:
  direct:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            cubechat-android/downloads
      - name: Verify frozen APK and prepare QR decoder
        shell: bash
        run: |
          set -euo pipefail
          echo '51b845ddf7564dd1887dc7ab9bf51eddb7a8e0c93a6365314c7ddd4865514d69  cubechat-android/downloads/CubeChat.apk' | sha256sum -c -
          curl --fail --silent --show-error --location --retry 2 \
            https://repo.maven.apache.org/maven2/com/google/zxing/core/3.5.3/core-3.5.3.jar \
            --output "$RUNNER_TEMP/zxing-core.jar"
          echo "8d8064c1636fdaef7189dd9055c7d59950a8940a12f2293956446ec3c109fd82  $RUNNER_TEMP/zxing-core.jar" | sha256sum -c -
          javac -cp "$RUNNER_TEMP/zxing-core.jar" -d "$RUNNER_TEMP" .github/scripts/CubeChatQrReader.java
      - name: Start two Android 15 virtual phones and test Wi-Fi Direct
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          sdkmanager --install "emulator" "platform-tools" "system-images;android-35;google_apis;x86_64" > "$RUNNER_TEMP/p2p-sdk.log"
          version=$(sed -nE 's/^Pkg.Revision[[:space:]]*=[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' "$ANDROID_HOME/emulator/source.properties")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(printf '%s\n' 36.5.0 "$version" | sort -V | head -1)" == 36.5.0 ]]
          echo "Android Emulator $version, API 35, two independent AVDs."
          export ANDROID_USER_HOME="$RUNNER_TEMP/cube-p2p-android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          test -f "$ANDROID_HOME/system-images/android-35/google_apis/x86_64/system.img"
          pids=()
          cleanup() { for pid in "${pids[@]}"; do kill "$pid" 2>/dev/null || true; done; }
          trap cleanup EXIT
          adb start-server
          for index in 0 1; do
            name="cube-radio-$index"
            port=$((5554 + index * 2))
            avd_dir="$ANDROID_AVD_HOME/$name.avd"
            mkdir -p "$avd_dir"
            printf '%s\n' 'avd.ini.encoding=UTF-8' "path=$avd_dir" 'target=android-35' > "$ANDROID_AVD_HOME/$name.ini"
            cat > "$avd_dir/config.ini" <<AVD
          AvdId=$name
          avd.ini.displayname=CubeChat WiFi Direct $index
          abi.type=x86_64
          hw.cpu.arch=x86_64
          image.sysdir.1=system-images/android-35/google_apis/x86_64/
          tag.id=google_apis
          tag.display=Google APIs
          hw.lcd.width=720
          hw.lcd.height=1280
          hw.lcd.density=240
          hw.ramSize=2048
          vm.heapSize=256
          disk.dataPartition.size=2G
          hw.keyboard=yes
          hw.gpu.enabled=yes
          hw.audioInput=no
          hw.audioOutput=no
          fastboot.forceColdBoot=yes
          AVD
            emulator -list-avds | grep -Fx "$name"
            emulator -avd "$name" -port "$port" -accel on -cores 2 -memory 2048 \
              -no-window -no-snapshot -no-boot-anim -no-audio -no-metrics \
              -gpu swiftshader_indirect -feature WiFiPacketStream -feature -Vulkan > "$RUNNER_TEMP/$name.log" 2>&1 &
            pids+=("$!")
            # Let the first instance bring up the shared radio simulator before starting its peer.
            if [[ "$index" == 0 ]]; then timeout 100 adb -s "emulator-$port" wait-for-device; fi
          done
          for index in 0 1; do
            serial="emulator-$((5554 + index * 2))"
            booted=''
            for attempt in {1..80}; do
              if ! kill -0 "${pids[$index]}" 2>/dev/null; then tail -30 "$RUNNER_TEMP/cube-radio-$index.log"; exit 1; fi
              booted=$(timeout 3 adb -s "$serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
              if [[ "$booted" == 1 ]]; then break; fi
              sleep 3
            done
            [[ "$booted" == 1 ]]
            adb -s "$serial" shell pm has-feature android.hardware.wifi.direct | tr -d '\r' | grep -Fx true
            adb -s "$serial" shell input keyevent 82
            adb -s "$serial" shell wm dismiss-keyguard
            adb -s "$serial" shell settings put global window_animation_scale 0
            adb -s "$serial" shell settings put global transition_animation_scale 0
            adb -s "$serial" shell settings put global animator_duration_scale 0
            adb -s "$serial" shell settings put system screen_off_timeout 1800000
            adb -s "$serial" shell cmd location set-location-enabled true
            adb -s "$serial" shell cmd location is-location-enabled | grep -i true
            adb -s "$serial" shell svc wifi enable
            adb -s "$serial" install -r cubechat-android/downloads/CubeChat.apk
          done
          python3 .github/scripts/cubechat_wifidirect_qa.py
