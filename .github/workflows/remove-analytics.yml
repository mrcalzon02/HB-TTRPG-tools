name: Remove analytics entirely

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/remove-analytics.yml'
      - 'scripts/remove-analytics.mjs'

permissions:
  contents: write

jobs:
  remove-analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove analytics code and references
        run: node scripts/remove-analytics.mjs

      - name: Remove the one-time cleanup files
        run: rm -f scripts/remove-analytics.mjs .github/workflows/remove-analytics.yml

      - name: Commit the cleanup
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No analytics files or references remained.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove analytics entirely [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
