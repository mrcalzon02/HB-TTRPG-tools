name: Factorio R102 native original-source 40-channel physical refractory liner
on:
  push:
    branches: [main]
    paths:
      - 'tools/factorio-render-pipeline/physical_forty_flute_liner_r102.py'
      - '.github/workflows/factorio-source-forty-flute-liner-r102.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-3d-refractory-stitched-40-channel-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download unchanged original camera R94 saved Blender 3D test scene, not original proprietary sprites
        uses: actions/download-artifact@v4
        with:
          run-id: 41494055204
          name: factorio-r94-source-first-sewn-planar-bell-metal-shell-candidates
          github-token: ${{ github.token }}
          path: private-ci/r94
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hb-ttrpg-tools/factorio-render-pipeline
          key: factorio-art-env-ubuntu24-blender4.5.15-python3.12-v1
      - name: Install verified Blender 4.5 LTS
        run: python tools/factorio-render-pipeline/bootstrap.py install --evidence-dir private-ci/readiness
      - name: Form source-oriented 20/40 flutes as real stitched open 3D liner cross-sections and preserve all R19 plates
        run: |
          BLENDER="$(python -c "import sys;sys.path.insert(0,'tools/factorio-render-pipeline');import bootstrap;print(bootstrap.find_blender())")"
          "$BLENDER" -b --disable-autoexec --factory-startup -t 2 --python-exit-code 4 \
            --python tools/factorio-render-pipeline/physical_forty_flute_liner_r102.py -- \
            --source-blend private-ci/r94/output/r94/panel_trim_025_rear_018.blend \
            --out private-ci/output/r102
      - name: Verify physically formed 13x80 original source nozzle panels, native frames and editable save/reopen
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('private-ci/output/r102')
          r=json.loads((root/'r102_source_true_fluted_3d_r11_liner.json').read_text())
          assert len(r['candidates'])==13
          assert not r['proprietary_source_pixels_published']
          assert not r['actual_source_fidelity_approved']
          for case in r['candidates']:
              assert (root/case['native_frame1']).stat().st_size>5000
              assert (root/case['native_frame33']).stat().st_size>5000
              assert case['protected_baffles_refractory_camera_and_64_frames_preserved']
              if case['new_3d_source_liner']:
                  g=case['new_3d_source_liner']
                  assert g['true_3d_quad_stitched_surface']
                  assert g['physical_3d_vertices']==1040
                  assert g['physical_3d_faces']==960
                  assert g['open_original_bore_no_caps']
                  assert not g['original_sprite_fidelity_approved']
                  assert (root/case['editable_blend']).stat().st_size>100000
          print('R102_ORIGINAL_REAL_STITCHED_3D_40_FLUTE_LINER_NATIVE_SCENES_SAVED_REOPENED_PASS')
          PY
      - name: Upload only real Blender 3D models, never private original sprite source pixels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorio-r102-original-source-stitch-40-real-refractory-liner-3d-candidates
          path: |
            private-ci/output/r102/*.blend
            private-ci/output/r102/*.png
            private-ci/output/r102/*.json
            private-ci/readiness/readiness.json
          if-no-files-found: warn
          retention-days: 14
