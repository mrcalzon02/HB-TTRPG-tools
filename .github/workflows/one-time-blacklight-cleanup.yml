name: One-time Blacklight capability cleanup

on:
  push:
    paths:
      - .github/workflows/one-time-blacklight-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove dormant history metadata and draft fragments
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          power_path = root / 'data/blacklight-continuum/rules/basic-character-options.json'
          data = json.loads(power_path.read_text(encoding='utf-8'))

          def strip_history(value):
              if isinstance(value, dict):
                  value.pop('oldWorldRoot', None)
                  value.pop('continuumTranslation', None)
                  for child in value.values():
                      strip_history(child)
              elif isinstance(value, list):
                  for child in value:
                      strip_history(child)

          strip_history(data)
          power_path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          replacements = {
              root / 'data/blacklight-continuum/wiki/basic-archetypes.json': [
                  ('Capability-only reference entries for the six Blacklight Continuum Archetypes. These records explain what each Archetype can do, how its Resource and Pressure operate, and which power families it develops. Crossing history, body speculation, and origin reconstruction are intentionally excluded.',
                   'Capability-only reference entries for the six Blacklight Continuum Archetypes. These records explain what each Archetype can do, how its Resource and Pressure operate, and which power families it develops.'),
                  ("Selecting an Archetype loads its Resource, Pressure, weakness, innate abilities, six power families, and thirty ranked powers. The sheet does not require a record of what crossed, what failed to cross, or how the character's powers were reconstructed.",
                   'Selecting an Archetype loads its Resource, Pressure, weakness, innate abilities, six power families, and thirty ranked powers. The sheet records present capabilities, costs, limits, and advancement.')
              ],
              root / 'data/blacklight-continuum/wiki/foundation-rules.json': [
                  ('No character-creation step asks what crossed through Q-MAP, what failed to cross, or what the printer could recognize. The printer produced the selected human or human-adjacent character from the supplied construction definition.',
                   'The printer produced the selected human or human-adjacent character from the supplied construction definition. Character creation begins with that character’s present capabilities.')
              ]
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          campaign = root / 'docs/blacklight-continuum/campaign-introduction.md'
          text = campaign.read_text(encoding='utf-8')
          text = text.replace("The crossing itself is incidental to the characters’ current existence. The campaign does not require the table to determine what metaphysical component crossed, whether a soul moved, whether an original remained behind, or which philosophical label should be attached to the process. The characters who awaken are the player characters. Play begins with what they can do now.\n\n", "The characters who awaken are the player characters. Play begins with what they can do now.\n\n")
          start = text.find('## What Matters at the Table\n')
          if start != -1:
              end = text.find('\n---\n', start)
              if end != -1:
                  text = text[:start] + 'The people who awaken are present, conscious, capable of choice, and entitled to act as themselves.\n' + text[end:]
          text = text.replace('Archetype descriptions explain present capabilities. They do not require a crossing history, body-reconstruction theory, or account of what may have accompanied the character through Q-MAP.\n\n', 'Archetype descriptions explain present capabilities, costs, limits, and advancement.\n\n')
          text = text.replace('Do not require players to explain what crossed before their characters are allowed to exist or use their powers.\n\n', '')
          campaign.write_text(text, encoding='utf-8')

          for path in [
              root / 'data/blacklight-continuum/rules/archetypes/eldritch-binder.json',
              root / 'data/blacklight-continuum/rules/archetypes/eldritch-binder/sealcraft.json'
          ]:
              if path.exists():
                  path.unlink()

          workflow = root / '.github/workflows/one-time-blacklight-cleanup.yml'
          if workflow.exists():
              workflow.unlink()
          PY
      - name: Commit cleaned capability data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Remove remaining Blacklight crossing metadata"
          git push origin main
