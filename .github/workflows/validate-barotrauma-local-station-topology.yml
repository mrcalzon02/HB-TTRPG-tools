name: Validate Barotrauma Local Station Topology

on:
  push:
    branches: [main]
    paths:
      - 'barotrauma-rpg-tools.html'
      - 'data/barotrauma/tools/runtime/barotrauma-rpg-tools.part-06-active-submarine-transit-core.txt'
      - 'data/barotrauma/tools/runtime/barotrauma-rpg-tools.part-06-dashboard-masterworld-performance.txt'
      - 'data/barotrauma/tools/runtime/barotrauma-rpg-tools.part-06-dashboard-local-station-topology.txt'
      - 'data/barotrauma/tools/runtime/barotrauma-rpg-tools.part-06-dashboard-masterworld-incremental-viewer.txt'
      - 'data/barotrauma/tools/runtime/barotrauma-rpg-tools.part-06-dashboard-masterworld-local-corridor-viewer.txt'
      - '.github/workflows/validate-barotrauma-local-station-topology.yml'
  pull_request:
    paths:
      - 'barotrauma-rpg-tools.html'
      - 'data/barotrauma/tools/runtime/barotrauma-rpg-tools.part-06-active-submarine-transit-core.txt'
      - 'data/barotrauma/tools/runtime/barotrauma-rpg-tools.part-06-dashboard-masterworld-performance.txt'
      - 'data/barotrauma/tools/runtime/barotrauma-rpg-tools.part-06-dashboard-local-station-topology.txt'
      - 'data/barotrauma/tools/runtime/barotrauma-rpg-tools.part-06-dashboard-masterworld-incremental-viewer.txt'
      - 'data/barotrauma/tools/runtime/barotrauma-rpg-tools.part-06-dashboard-masterworld-local-corridor-viewer.txt'
      - '.github/workflows/validate-barotrauma-local-station-topology.yml'

permissions:
  contents: read

jobs:
  validate-local-topology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile and verify sparse concentric routing
        run: |
          node <<'NODE'
          const fs = require('fs');
          const assert = require('assert');

          const performancePath = 'data/barotrauma/tools/runtime/barotrauma-rpg-tools.part-06-dashboard-masterworld-performance.txt';
          const topologyPath = 'data/barotrauma/tools/runtime/barotrauma-rpg-tools.part-06-dashboard-local-station-topology.txt';
          const incrementalPath = 'data/barotrauma/tools/runtime/barotrauma-rpg-tools.part-06-dashboard-masterworld-incremental-viewer.txt';
          const corridorViewerPath = 'data/barotrauma/tools/runtime/barotrauma-rpg-tools.part-06-dashboard-masterworld-local-corridor-viewer.txt';
          const oldTransitPath = 'data/barotrauma/tools/runtime/barotrauma-rpg-tools.part-06-active-submarine-transit-core.txt';

          const performance = fs.readFileSync(performancePath, 'utf8');
          const topology = fs.readFileSync(topologyPath, 'utf8');
          const incremental = fs.readFileSync(incrementalPath, 'utf8');
          const corridorViewer = fs.readFileSync(corridorViewerPath, 'utf8');
          const oldTransit = fs.readFileSync(oldTransitPath, 'utf8');
          new Function(performance);
          new Function(topology);
          new Function(incremental);
          new Function(corridorViewer);

          const optionalMatch = performance.match(/const DASHBOARD_INCREMENTAL_WORLD_VIEWER_PARTS=\[([\s\S]*?)\n  \];/);
          assert(optionalMatch, 'Optional Masterworld package list is missing');
          const optionalPaths = [...optionalMatch[1].matchAll(/'([^']+)'/g)].map(match => match[1]);
          assert.deepStrictEqual(optionalPaths, [topologyPath, incrementalPath, corridorViewerPath], 'Sparse topology must load before the incremental viewer and corridor renderer');
          assert.deepStrictEqual(optionalPaths.filter(path => !fs.existsSync(path)), [], 'Optional Masterworld package references missing files');
          new Function(optionalPaths.map(path => fs.readFileSync(path, 'utf8')).join(''));

          assert(oldTransit.includes('for (const station of map.nodes.filter'), 'Legacy all-pairs implementation is no longer detectable for regression protection');
          assert(oldTransit.includes('dashboardAdjacentStationRoutes(station.id, map)'), 'Legacy all-pairs nested station traversal changed; review replacement coverage');

          assert(performance.includes('dashboardAdjacentStationRoutesWhileLocalTopologyLoads(){return [];}'), 'Routes are not disabled while sparse topology loads');
          assert(performance.includes('dashboardStationCorridorsWhileLocalTopologyLoads(){return [];}'), 'Corridor rendering is not disabled while sparse topology loads');
          assert(!performance.includes('dashboardAdjacentStationRoutes=dashboardAdjacentStationRoutesBeforeLocalTopologyLoad'), 'Failure path restores the legacy route search');
          assert(!performance.includes('dashboardStationCorridors=dashboardStationCorridorsBeforeLocalTopologyLoad'), 'Failure path restores the legacy all-pairs corridor graph');
          assert(performance.includes('Global station routing remains disabled'), 'Failure mode does not explicitly preserve the safe disabled state');

          assert(topology.includes('stationsByRing.get(ring-1)||[]'), 'Inward connections are not limited to exactly one ring down');
          assert(topology.includes('list[(index+1)%list.length]'), 'Same-ring connections are not limited to circularly adjacent stations');
          assert(topology.includes("relation==='same-ring'&&ringDifference!==0"), 'Same-ring corridor invariant is missing');
          assert(topology.includes("relation==='one-ring-inward'&&ringDifference!==1"), 'One-ring corridor invariant is missing');
          assert(topology.includes('Math.abs(number(route.station.ring)-number(origin.ring))<=1'), 'Route listing can expose stations more than one ring away');
          assert(topology.includes("if(ringDifference>1)throw new Error('Cross-planetary and multi-ring station routes are prohibited.'"), 'Route filing does not reject multi-ring destinations');
          assert(topology.includes("if(typeof dashboardManagementAuthorized==='function'&&!dashboardManagementAuthorized())"), 'Asynchronous local route replacement bypasses management authentication');
          assert(topology.includes('save=()=>{};'), 'Temporary two-station crossing map can be persisted during route construction');
          assert(topology.includes('save=saveBeforeLocalCrossing;'), 'Normal save function is not restored after local route construction');
          assert(topology.includes('allPairsSearchDisabled:true'), 'Topology diagnostics do not declare all-pairs search disabled');
          assert(topology.includes('maximumRingDifference'), 'Topology diagnostics do not measure the maximum ring span');
          assert(!topology.includes('while(queue.length)'), 'Sparse station topology contains a graph-wide queue search');
          assert(!topology.includes('dashboardGraphIndex('), 'Sparse station topology calls the legacy full node graph index');
          assert(!topology.includes('for(const station of map.nodes.filter'), 'Sparse topology loops over every station and launches route searches');

          assert(corridorViewer.includes('dashboardIncrementalLocalCorridorsForRing'), 'Incremental viewer does not package sparse corridors by ring');
          assert(corridorViewer.includes('const displayRing=difference===0?leftRing:Math.min(leftRing,rightRing)'), 'One-ring-down corridors are not deferred until the inner ring loads');
          assert(corridorViewer.includes('if(difference>1)return false;'), 'Viewer can render station corridors spanning multiple rings');
          assert(corridorViewer.includes('dashboardLocalStationTopology(map)'), 'Viewer does not use the sparse station topology');
          assert(!corridorViewer.includes('crossingPath('), 'Viewer performs route planning while drawing corridors');
          assert(!corridorViewer.includes('dashboardGraphIndex('), 'Viewer invokes the full world graph');

          assert(corridorViewer.includes('dashboardSavedMasterWorldCandidatesLargestFirst'), 'Saved Masterworld recovery candidates are not re-ranked by completeness');
          assert(corridorViewer.includes('right.nodeCount-left.nodeCount'), 'Candidate recovery does not prioritize node count');
          assert(corridorViewer.includes('right.ringCount-left.ringCount'), 'Candidate recovery does not prioritize ring coverage');
          assert(corridorViewer.includes('dashboardPreserveCurrentMasterWorldSafetyCheckpoint'), 'Current map is not preserved before recovery');
          assert(corridorViewer.includes('Safety copy before Masterworld recovery'), 'Safety checkpoint is not clearly labeled');
          assert(corridorViewer.includes('allowReplace=false'), 'Valid active maps can be replaced without an explicit recovery path');
          assert(corridorViewer.includes('No world generation was performed.'), 'Recovery messaging does not explicitly prohibit regeneration');
          assert(corridorViewer.includes('No larger checkpoint is present in this browser save.'), 'Missing larger-map recovery state is not explained');
          assert(corridorViewer.includes('dashboard-masterworld-integrity-warning'), 'Undersized-map warning is absent from the viewer');
          assert(corridorViewer.includes('current.ringCount<40||current.nodeCount<400'), 'Legacy-scale maps are not detected');
          assert(corridorViewer.includes('recoveryGeneratesWorld:false'), 'Integrity diagnostics do not guarantee non-generative recovery');

          const html = fs.readFileSync('barotrauma-rpg-tools.html', 'utf8');
          assert(/barotrauma-rpg-tools-loader\.js\?v=\d+/.test(html), 'Operations page loader lacks a cache revision');

          console.log('Validated sparse local topology and safe largest-checkpoint Masterworld recovery without regeneration.');
          NODE
