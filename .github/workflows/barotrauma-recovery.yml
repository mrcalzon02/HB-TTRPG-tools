name: Barotrauma Return Lifecycle Recovery

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: barotrauma-return-lifecycle-recovery
  cancel-in-progress: false

jobs:
  repair-verify-publish:
    if: github.event.issue.title == 'Run Barotrauma return lifecycle recovery 2026-07-19'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Repair return lifecycle and regression fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("desktop/barotrauma-world-sim/src/main/java/io/github/mrcalzon02/barotrauma")
          transaction_path = root / "persistence/PassiveWorldTickTransaction.java"
          verification_path = root / "persistence/FleetRecoveryAndNaturalWorldVerification.java"

          transaction = transaction_path.read_text(encoding="utf-8")
          old_status = '        if (arrived) status = "WORKING";\n'
          new_status = ('        if (arrived) status = vessel.status().equals("RETURNING")\n'
                        '                ? "DOCKED" : "WORKING";\n')
          if transaction.count(old_status) != 1:
              raise SystemExit("Expected exactly one return-arrival status assignment.")
          transaction = transaction.replace(old_status, new_status, 1)

          update_end = '''            update.setString(8, vessel.id().toString());
            update.executeUpdate();
        }
        String legStatus = arrived ? "ARRIVED" : status.equals("LOST") ? "LOST"
'''
          dock_cleanup = '''            update.setString(8, vessel.id().toString());
            update.executeUpdate();
        }
        if (arrived && vessel.status().equals("RETURNING")) {
            try (PreparedStatement dock = connection.prepareStatement(
                    "UPDATE npc_vessel SET mission_id=NULL,destination_location_id=NULL,route_progress=0,"
                            + "route_ticks_required=1,cargo=0 WHERE npc_vessel_id=? AND status='DOCKED'")) {
                dock.setString(1, vessel.id().toString());
                if (dock.executeUpdate() != 1) {
                    throw new SQLException("Returning NPC vessel did not complete docking exactly once.");
                }
            }
        }
        String legStatus = arrived ? "ARRIVED" : status.equals("LOST") ? "LOST"
'''
          if transaction.count(update_end) != 1:
              raise SystemExit("Expected exactly one NPC transit update boundary.")
          transaction = transaction.replace(update_end, dock_cleanup, 1)
          transaction_path.write_text(transaction, encoding="utf-8", newline="\n")

          verification = verification_path.read_text(encoding="utf-8")
          replacements = [
              ('"SELECT v.world_id,v.home_station_id,ws.location_id,"',
               '"SELECT v.npc_vessel_id,v.world_id,v.home_station_id,ws.location_id,"'),
              ('+ "VALUES (?,?,\'TRANSIT\',\'COMPLETE\',?,?,?,1,1,777,0,100,?,?,?)"',
               '+ "VALUES (?,?,\'MINING\',\'ACTIVE\',?,?,?,1,1,777,1,100,?,?,?)"'),
              ('"UPDATE npc_vessel SET current_location_id=?,destination_location_id=?,mission_id=?,"\n'
               '                            + "status=\'RETURNING\',hull=100,supplies=100,route_progress=2,"',
               '"UPDATE npc_vessel SET current_location_id=?,destination_location_id=?,mission_id=?,"\n'
               '                            + "status=\'RETURNING\',hull=100,supplies=100,cargo=1,route_progress=2,"'),
              ('        return missionId;\n    }\n\n    private static void raiseMaterialRequirementAndStarve',
               '        return new ReturnRegression(missionId, vesselId);\n    }\n\n    private static void raiseMaterialRequirementAndStarve')
          ]
          for old, new in replacements:
              if verification.count(old) != 1:
                  raise SystemExit(f"Expected exactly one verification fixture fragment: {old[:80]!r}")
              verification = verification.replace(old, new, 1)

          mission_execute = '''                mission.setLong(8, tick);
                mission.executeUpdate();
            }
            try (PreparedStatement vessel = connection.prepareStatement(
'''
          mission_complete = '''                mission.setLong(8, tick);
                mission.executeUpdate();
            }
            try (PreparedStatement complete = connection.prepareStatement(
                    "UPDATE world_mission SET status='COMPLETE',updated_tick=?,completed_tick=? "
                            + "WHERE mission_id=? AND status='ACTIVE'")) {
                complete.setLong(1, tick);
                complete.setLong(2, tick);
                complete.setString(3, missionId);
                if (complete.executeUpdate() != 1) {
                    throw new IllegalStateException("Return regression mission did not complete exactly once.");
                }
            }
            try (PreparedStatement vessel = connection.prepareStatement(
'''
          if verification.count(mission_execute) != 1:
              raise SystemExit("Expected exactly one mission fixture execution boundary.")
          verification = verification.replace(mission_execute, mission_complete, 1)

          helper_marker = '''    private static String vesselStatus(WorldPaths paths, UUID vesselId) throws Exception {
'''
          helpers = '''    private static int vesselCargo(WorldPaths paths, String vesselId) throws Exception {
        try (Connection connection = DriverManager.getConnection("jdbc:sqlite:" + paths.database());
             PreparedStatement statement = connection.prepareStatement(
                     "SELECT cargo FROM npc_vessel WHERE npc_vessel_id=?")) {
            statement.setString(1, vesselId);
            try (ResultSet result = statement.executeQuery()) {
                if (!result.next()) throw new IllegalStateException("Return regression vessel disappeared.");
                return result.getInt(1);
            }
        }
    }

    private static String returnFreightStatus(WorldPaths paths, String missionId) throws Exception {
        try (Connection connection = DriverManager.getConnection("jdbc:sqlite:" + paths.database());
             PreparedStatement statement = connection.prepareStatement(
                     "SELECT status FROM freight_lot WHERE mission_id=?")) {
            statement.setString(1, missionId);
            try (ResultSet result = statement.executeQuery()) {
                if (!result.next()) throw new IllegalStateException("Return regression freight lot is missing.");
                return result.getString(1);
            }
        }
    }

    private static long returnTreasuryCount(WorldPaths paths, String missionId) throws Exception {
        return keyedLong(paths, "SELECT COUNT(*) FROM treasury_transaction WHERE transaction_id=?",
                missionId + ":freight:delivery");
    }

    private static void relinkCompletedMissionAsWorking(WorldPaths paths, String vesselId, String missionId)
            throws Exception {
        try (Connection connection = DriverManager.getConnection("jdbc:sqlite:" + paths.database());
             PreparedStatement statement = connection.prepareStatement(
                     "UPDATE npc_vessel SET mission_id=?,destination_location_id=current_location_id,"
                             + "status='WORKING',route_progress=0 WHERE npc_vessel_id=? AND status='DOCKED'")) {
            statement.setString(1, missionId);
            statement.setString(2, vesselId);
            if (statement.executeUpdate() != 1) {
                throw new IllegalStateException("Return regression vessel could not be relinked for replay testing.");
            }
        }
    }

'''
          if verification.count(helper_marker) != 1:
              raise SystemExit("Expected exactly one vessel-status helper marker.")
          verification = verification.replace(helper_marker, helpers + helper_marker, 1)

          record_marker = '''    private static void require(boolean condition, String message) {
'''
          record = '''    private record ReturnRegression(String missionId, String vesselId) { }

'''
          if verification.count(record_marker) != 1:
              raise SystemExit("Expected exactly one contract assertion marker.")
          verification = verification.replace(record_marker, record + record_marker, 1)
          verification_path.write_text(verification, encoding="utf-8", newline="\n")

          Path(".github/workflows/barotrauma-recovery.yml").unlink()
          PY

      - name: Verify complete Gradle-free desktop contract chain
        shell: pwsh
        run: ./desktop/barotrauma-world-sim/toolbox.ps1 verify

      - name: Publish verified recovery to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Repair NPC return lifecycle verification"
          git push origin HEAD:main

      - name: Close recovery issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue close "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --comment "The return lifecycle repair passed the complete Gradle-free desktop verification chain and was published to main."
