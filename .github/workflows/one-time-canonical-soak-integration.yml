name: Integrate canonical soak rules

on:
  push:
    paths:
      - .github/workflows/one-time-canonical-soak-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update canonical archetypes and foundation rules
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          basic_path = Path('data/blacklight-continuum/rules/basic-character-options.json')
          basic = json.loads(basic_path.read_text(encoding='utf-8'))
          basic['schemaVersion'] = '0.14.0'

          vampire = next(a for a in basic['archetypes'] if a['id'] == 'vampire')
          vampire['fortitudeRule'] = (
              'Fortitude equals the highest rank owned in the Deathless Resilience power family, from 0 to 5. '
              'Add Fortitude to every Vampire soak roll that is permitted, including Aggravated and Disruption soak.'
          )
          vampire['weaknessText'] = vampire['weaknessText'].replace('inflicts 2 Trauma per round', 'inflicts 2 Aggravated damage successes per round')
          vampire['weaknessText'] = vampire['weaknessText'].replace('ignores ordinary Armor', 'permits soak only from Fortitude and protection explicitly rated against Aggravated damage')
          vampire['innateAbilities'] = [a for a in vampire['innateAbilities'] if a['name'] != 'Undead Soak']
          deathless_index = next(i for i, a in enumerate(vampire['innateAbilities']) if a['name'] == 'Deathless State')
          vampire['innateAbilities'].insert(deathless_index + 1, {
              'name': 'Undead Soak',
              'effect': (
                  'Against Bashing, roll Resilience + eligible Armor + Fortitude, cancel damage successes, then halve the remainder and round down. '
                  'Against Lethal, roll Resilience + eligible Armor + Fortitude and take the full remainder. '
                  'Against Aggravated, roll Fortitude plus only explicitly supernatural protection. '
                  'Ordinary firearms normally deal Bashing to you; anti-materiel, incendiary, explosive, specialized anti-undead, or explicitly more destructive ammunition may deal Lethal or Aggravated damage.'
              )
          })
          deathless = next(f for f in vampire['powerFamilies'] if f['name'] == 'Deathless Resilience')
          deathless['description'] = (
              'Vampiric Fortitude, dormancy, healing, armor, recovery, and persistence after apparently fatal harm. '
              'Your Fortitude rating equals the highest rank owned in this family.'
          )
          cold_repair = next(a for a in deathless['abilities'] if a['name'] == 'Cold Repair')
          cold_repair['effect'] = (
              'Cost: 1 Vitae and one uninterrupted minute. Convert one Lethal damage into Bashing or remove two Bashing. '
              'Aggravated wounds from fire, radiation, or the original solar curse require 2 Vitae and can be repaired only when the effect permits Aggravated recovery. '
              'Failure: the damage is removed normally, but gain 1 Hunger and lose one die from Physical tests until you feed or complete a full rest.'
          )

          shape = next(a for a in basic['archetypes'] if a['id'] == 'shapechanger')
          shape['innateAbilities'] = [a for a in shape['innateAbilities'] if a['name'] != 'Living Soak']
          regen_index = next(i for i, a in enumerate(shape['innateAbilities']) if a['name'] == 'Regeneration')
          shape['innateAbilities'].insert(regen_index, {
              'name': 'Living Soak',
              'effect': (
                  'In social form, use ordinary mortal soak: Resilience + eligible Armor against Bashing, Armor only against Lethal, and no ordinary Aggravated soak. '
                  'In hunting or war form, roll Resilience + eligible Armor + Archetype Rating against Bashing or Lethal damage. '
                  'Every result of 6+ cancels one damage success. Living Soak does not apply to Aggravated damage, Disruption, Pressure, Exposure, or Death Marks unless another capability explicitly says otherwise.'
              )
          })
          warform = next(f for f in shape['powerFamilies'] if f['name'] == 'Warform')
          rank3 = next(a for a in warform['abilities'] if a['rank'] == 3)
          rank3['name'] = 'Titanic Frame'
          rank3['effect'] = (
              'Cost: 1 Fury. Become Large for the scene. Add 2 damage dice to melee damage rolls, gain two dice to grapple or break barriers, and increase Carry by 3. '
              'You cannot benefit from human-sized cover, cannot pass through human-width openings without forcing them, and lose two dice from Stealth.'
          )
          basic_path.write_text(json.dumps(basic, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          foundation_path = Path('data/blacklight-continuum/wiki/foundation-rules.json')
          foundation = json.loads(foundation_path.read_text(encoding='utf-8'))
          foundation['schemaVersion'] = '0.5.0'
          core = next(e for e in foundation['entries'] if e['id'] == 'blacklight-d10-foundation')
          core['body'][0] = (
              'Build a test pool from Attribute + Skill + situational modifiers. Results of 6 through 9 produce one success. '
              'A 10 produces one success and is a critical success on an attack. A failed roll containing one or more 1s creates a Complication. '
              'Damage and soak dice also succeed on 6+, but a 10 on those rolls is normally only one success.'
          )
          core['body'].insert(1, (
              'After an attack hits, roll its damage dice. A Firearms attack adds one damage die for every critical success on the final attack roll. '
              'The defender then rolls every soak die allowed by damage type, Armor, Archetype, form, Fortitude, and explicit capabilities. Each soak success cancels one damage success.'
          ))
          for table in core.get('tables', []):
              if table.get('title') == 'Derived Traits':
                  for row in table.get('rows', []):
                      if row and row[0] == 'Protection':
                          row[0] = 'Base Bashing Soak'
                          row[1] = 'Resilience + eligible Armor; special soak permissions add or replace dice'
          foundation_path.write_text(json.dumps(foundation, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          archetypes_path = Path('data/blacklight-continuum/wiki/basic-archetypes.json')
          archetypes = json.loads(archetypes_path.read_text(encoding='utf-8'))
          archetypes['schemaVersion'] = '0.13.0'
          vampire_entry = next(e for e in archetypes['entries'] if e['id'] == 'vampire-archetype')
          vampire_soak = (
              'Vampire soak follows deathless biology. Roll Resilience + Armor + Fortitude against Bashing, then halve the remainder. '
              'Roll Resilience + Armor + Fortitude against Lethal. Roll Fortitude plus explicitly supernatural protection against Aggravated. '
              'Ordinary gunfire normally deals Bashing to Vampires. Fortitude equals the highest Deathless Resilience rank owned.'
          )
          vampire_entry['body'] = [p for p in vampire_entry['body'] if not p.startswith('Vampire soak follows deathless biology')]
          vampire_entry['body'].insert(1, vampire_soak)
          shape_entry = next(e for e in archetypes['entries'] if e['id'] == 'shapechanger-archetype')
          shape_soak = (
              'Living Soak is rolled after damage. In hunting or war form, roll Resilience + eligible Armor + Archetype Rating against Bashing or Lethal damage; '
              'each 6+ cancels one damage success. Social form uses ordinary mortal soak. Living Soak does not automatically protect against Aggravated or Disruption.'
          )
          shape_entry['body'] = [p for p in shape_entry['body'] if not p.startswith('Living Soak is')]
          shape_entry['body'].insert(1, shape_soak)
          archetypes_path.write_text(json.dumps(archetypes, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          index_path = Path('data/blacklight-continuum/wiki/wiki-index.json')
          index = json.loads(index_path.read_text(encoding='utf-8'))
          index['schemaVersion'] = '0.18.0'
          index['description'] = (
              'Blacklight Continuum combat uses an attack roll, a damage roll after a hit, and one legal soak roll. '
              'Firearm critical successes add damage dice. Bashing, Lethal, Aggravated, and Disruption determine soak permissions; '
              'Vampires use Fortitude and deathless damage treatment, while transformed Shapechangers use Living Soak.'
          )
          scope = index['completedScope']
          scope['combatTeachingEntries'] = 5
          scope['damageTypes'] = 4
          scope['vampireSoakProcedures'] = 1
          scope['fortitudeProcedures'] = 1
          scope['rolledSoakProcedures'] = 1
          areas = [a for a in index['nextDevelopmentAreas'] if not a.startswith('balance testing for fixed damage')]
          areas.insert(0, 'balance testing for damage dice, firearm criticals, soak pools, Vampire Bashing halving, Fortitude, and Shapechanger Living Soak')
          index['nextDevelopmentAreas'] = areas
          index_path.write_text(json.dumps(index, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          Path('.github/workflows/one-time-canonical-soak-integration.yml').unlink()
          PY
      - name: Validate and commit canonical soak rules
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          basic = json.loads(Path('data/blacklight-continuum/rules/basic-character-options.json').read_text())
          foundation = json.loads(Path('data/blacklight-continuum/wiki/foundation-rules.json').read_text())
          archetypes = json.loads(Path('data/blacklight-continuum/wiki/basic-archetypes.json').read_text())
          index = json.loads(Path('data/blacklight-continuum/wiki/wiki-index.json').read_text())

          vampire = next(a for a in basic['archetypes'] if a['id'] == 'vampire')
          assert vampire['fortitudeRule'].startswith('Fortitude equals')
          assert any(a['name'] == 'Undead Soak' for a in vampire['innateAbilities'])
          deathless = next(f for f in vampire['powerFamilies'] if f['name'] == 'Deathless Resilience')
          assert 'Fortitude rating' in deathless['description']

          shape = next(a for a in basic['archetypes'] if a['id'] == 'shapechanger')
          soak = next(a for a in shape['innateAbilities'] if a['name'] == 'Living Soak')
          assert 'Resilience + eligible Armor + Archetype Rating' in soak['effect']
          rank3 = next(a for f in shape['powerFamilies'] if f['name'] == 'Warform' for a in f['abilities'] if a['rank'] == 3)
          assert rank3['name'] == 'Titanic Frame'

          core = next(e for e in foundation['entries'] if e['id'] == 'blacklight-d10-foundation')
          derived = next(t for t in core['tables'] if t['title'] == 'Derived Traits')
          assert any(row[0] == 'Base Bashing Soak' for row in derived['rows'])
          assert index['completedScope']['combatTeachingEntries'] == 5
          assert index['completedScope']['damageTypes'] == 4
          assert any(e['id'] == 'vampire-archetype' for e in archetypes['entries'])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate canonical damage and soak rules"
          git push origin main
