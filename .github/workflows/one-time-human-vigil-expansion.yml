name: One-time Human Vigil expansion

on:
  push:
    paths:
      - .github/workflows/one-time-human-vigil-expansion.yml

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Expand Human Investigator canonical description
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          rules_path = Path('data/blacklight-continuum/rules/basic-character-options.json')
          rules = json.loads(rules_path.read_text(encoding='utf-8'))
          human = next((item for item in rules.get('archetypes', []) if item.get('id') == 'human-investigator'), None)
          if human is None:
              raise SystemExit('Human Investigator Archetype not found')

          human['theme'] = (
              "A purely mortal hunter and investigator who competes with supernatural, posthuman, institutional, and alien threats through evidence, preparation, discipline, relationships, logistics, courage, and accountable judgment. The Human Investigator possesses no automatic mystical inheritance, transformative state, patron, bloodline, compact, or awakened command of reality. Their exceptional capabilities are the far edge of what trained human beings can accomplish when they refuse to surrender initiative, identity, one another, or the truth."
          )
          human['lore'] = [
              "The Human Investigator is the road for a character who remains human without treating humanity as an absence of options. They may be a detective, survivor, medic, soldier, organizer, journalist, engineer, advocate, responder, hunter, analyst, witness, or ordinary person who learned to function under extraordinary pressure.",
              "They do not receive automatic supernatural senses, immunity, regeneration, prophecy, or authority. Every advantage comes from a recorded Skill, specialization, Operational Frame, item, relationship, preparation, innate Human ability, ranked capability, or explicit situational permission.",
              "What makes the Investigator exceptional is the ability to connect evidence before a predator can erase it, keep moving under fear, preserve another person's identity, exploit institutional procedure, prepare options before disaster, and turn isolated people into a functioning network.",
              "Conviction is not supernatural energy. It is the character's limited capacity to commit fully to a principle, decision, person, or plan when hesitation would surrender the initiative. Spending Conviction represents focus, courage, preparation brought to bear, and the choice to accept responsibility.",
              "Strain records the cost of exceeding ordinary limits. Exhaustion, fear, injury, isolation, unresolved responsibility, moral pressure, and repeated dependence on willpower accumulate because the Investigator remains mortal even when their performance becomes extraordinary.",
              "Choose one Vigil Conviction or remain Uncommitted. The Conviction defines why the character continues to confront the threat and provides favored families, recommended Skills, and one explicit Conviction Method.",
              "A Hunter Practice may be selected as an intended advanced profession or left Undeclared. Practice attainments require later advancement. They are learned procedures and capabilities rather than blessings, Gifts, Banes, magical Edges, or unexplained revelations.",
              "Casecraft, Field Discipline, Continuity Anchoring, Institutional Ghostcraft, Contingency Engineering, and Human Network remain the shared capability families beneath every Vigil Conviction and Hunter Practice."
          ]
          rules['schemaVersion'] = '0.9.0'
          rules_path.write_text(json.dumps(rules, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          wiki_path = Path('data/blacklight-continuum/wiki/basic-archetypes.json')
          wiki = json.loads(wiki_path.read_text(encoding='utf-8'))
          entry = next((item for item in wiki.get('entries', []) if item.get('id') == 'human-investigator-archetype'), None)
          if entry is None:
              raise SystemExit('Human Investigator Wiki entry not found')

          entry['summary'] = (
              "A purely mortal hunter who answers impossible threats with evidence, preparation, discipline, relationships, grit, willpower, and the determination to remain human without remaining helpless."
          )
          entry['body'] = [
              "The Human Investigator is not the character who failed to receive a supernatural Archetype. It is the complete advancement road for people who confront impossible threats without bloodline gifts, transformation, patrons, fae compacts, awakened reality control, or automatic protection from the consequences of being mortal.",
              "The character may have been a detective, soldier, medic, engineer, journalist, organizer, advocate, responder, hunter, technician, witness, survivor, or ordinary person who kept learning because the alternative was allowing a predator to define what was possible.",
              "Their abilities are not miracles disguised with mundane language. Evidence must be gathered. Equipment must exist. Contacts must be established. Preparations must be plausible and recorded. Institutions must have procedures that can be exploited. Every extraordinary result comes from a printed capability with a defined cost, test, duration, target, and limit.",
              "Human limitation is real. Injury matters. Exhaustion matters. Fear matters. Isolation matters. A mortal cannot assume immunity to domination, vacuum, disease, hostile signals, memory alteration, or supernatural violence. Protection against those threats must be built through capabilities, equipment, teamwork, and planning.",
              "Human limitation is also not the same as irrelevance. Predators leave evidence. Powerful beings develop routines. Institutions depend upon procedure. Machines have maintenance requirements. Organizations require trust. Communities remember who helped them. A person who understands those facts can create leverage against opponents that are individually stronger.",
              "Conviction is the Investigator's Resource. It represents the limited ability to commit completely to a principle, person, preparation, or decision when ordinary caution would surrender the initiative.",
              "Strain is the Investigator's Pressure. It records the physical, psychological, social, and moral cost of functioning beyond sustainable human limits.",
              "Choose one Vigil Conviction or remain Uncommitted. The seven Convictions describe why the character keeps standing: stopping the active predator, protecting a line, judging responsibility, carrying a measured burden, preserving an exit, seeing the person before the category, or building toward a future larger than one hunt.",
              "A Hunter Practice may be chosen as an intended advanced profession. Counterpredators, Sanctuary Marshals, Forensic Adversaries, Burden Carriers, Recovery Negotiators, Witness Advocates, Cell Architects, Solitary Listeners, Final Directives, and Containment Engineers develop staged attainments through advancement rather than receiving supernatural Gifts or Banes.",
              "Casecraft establishes usable evidence and reconstructs responsibility. Field Discipline preserves action under danger. Continuity Anchoring protects identity and consent. Institutional Ghostcraft manipulates procedure and authority. Contingency Engineering preserves options. Human Network creates durable support through trust and organization."
          ]
          wiki['schemaVersion'] = '0.9.0'
          wiki_path.write_text(json.dumps(wiki, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          Path('.github/workflows/one-time-human-vigil-expansion.yml').unlink()
          PY
      - name: Commit canonical expansion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand Human Investigator Vigil road"
          git push origin main
