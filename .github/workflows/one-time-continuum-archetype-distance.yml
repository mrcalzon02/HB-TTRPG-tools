name: One-time Continuum Archetype description expansion

on:
  push:
    paths:
      - .github/workflows/one-time-continuum-archetype-distance.yml

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Expand four Archetype descriptions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          rules_path = Path('data/blacklight-continuum/rules/basic-character-options.json')
          rules = json.loads(rules_path.read_text(encoding='utf-8'))

          themes = {
              'vampire': "A Vitae-fueled predator whose supernatural speed, authority, concealment, resilience, feeding, and inherited memory remain fully functional even though the ancient curse behind them feels remote. Hunger is no longer an all-consuming presence woven through every thought; it is a distant pressure, like a migraine approaching from beyond the horizon. The legacy commonly attributed to Cain, the weight of lineage, and the compulsions carried through centuries of blood still exist, but they feel more like inherited memories than an immediate hand upon the soul. This emotional and metaphysical distance does not reduce the Vampire's recorded capabilities unless a specific rule says otherwise.",
              'shapechanger': "A supernatural transformer whose forms, pursuit, pack bonds, adaptive capabilities, spirit relations, and territorial authority continue to function even though the living spiritual world that once answered them now feels impossibly far away. The call of Gaia, once present in blood, breath, instinct, rage, and every living boundary, reaches the Shapechanger like a conversation half heard through a wall. The bond remains real, but the surrounding universe no longer reinforces it with the same immediate recognition. This distance changes how the power feels, not what the character can do according to the recorded abilities.",
              'eldritch-binder': "A negotiator, jailer, host, or partner whose structured relationship with an impossible presence survives the transition intact. Whatever entity, force, patron, fragment, name, wound, or elder intelligence answered the Binder in the former universe still answers here. Existing contracts, bindings, prohibitions, permissions, and invocations remain valid between Binder and presence, but the connection feels diminished: less like a living tether stretching through a familiar cosmos and more like a binding carried inside the Binder. Local reality does not automatically recognize the old compact or enforce its assumptions, yet the answering presence and the Binder's recorded capabilities remain available.",
              'harmonic-mutant': "A resonance wielder whose ability to affect force, living patterns, structures, emotion, phase, and memory still operates, while every use reveals that the surrounding universe answers to a different harmonic order. The Mutant is the mortal remainder of layered compacts: ancient fae or comparable higher beings bargained with fundamental forces, later powers and institutions inherited portions of those agreements, and mortal bloodlines learned to use the third-, fourth-, and fifth-order consequences. Those forces and paths still exist here, but they do not recognize the Mutant as an authorized party. The Mutant therefore feels the wrongness of self, team, and universe with unusual clarity: the old compact with reality persists inside the character, while the reality outside no longer acknowledges the chain that once made it natural. Recorded capabilities remain mechanically unchanged unless a specific effect states otherwise."
          }

          found = set()
          for archetype in rules.get('archetypes', []):
              archetype_id = archetype.get('id')
              if archetype_id in themes:
                  archetype['theme'] = themes[archetype_id]
                  found.add(archetype_id)
          missing = sorted(set(themes) - found)
          if missing:
              raise SystemExit(f'Missing Archetypes in rules data: {missing}')
          rules['schemaVersion'] = '0.5.0'
          rules_path.write_text(json.dumps(rules, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          wiki_path = Path('data/blacklight-continuum/wiki/basic-archetypes.json')
          wiki = json.loads(wiki_path.read_text(encoding='utf-8'))

          descriptions = {
              'vampire-archetype': {
                  'summary': "A Vitae-fueled predator whose capabilities remain intact while Hunger, lineage, and the ancient curse feel like distant shadows of the forces that once defined existence.",
                  'body': [
                      "The Vampire is still a Vampire. Vitae still answers. Supernatural speed, command, concealment, resilience, feeding, and blood memory operate according to the recorded innate abilities and powers. The transition has not replaced the curse with an imitation and has not mechanically reduced the Archetype.",
                      "What changed is proximity. In the former universe, Hunger could feel like an all-consuming second consciousness threaded through appetite, anger, fear, desire, and every judgment involving blood. Here it is more distant: a persistent hum, a pressure behind the eyes, a migraine still beyond the horizon. It can intensify and impose its recorded consequences, but it no longer feels like the entire cosmos agrees that the Vampire must hunger.",
                      "The binding curse traditionally associated with Cain also feels remote. It remains part of the Vampire's supernatural condition, but its authority resembles a memory half completed rather than a command carved into the foundations of creation. The curse has not vanished; the new universe simply does not appear to recognize its history or reinforce it with the same metaphysical certainty.",
                      "Centuries of lineage, ancestral memory, inherited custom, predatory instinct, and the emotional gravity of blood remain accessible through the Vampire's capabilities. They are less formative to moment-by-moment thought. A lineage voice that once felt like an ancestor standing directly behind the Vampire may now feel like a recording heard through several closed rooms.",
                      "This distance can be frightening or liberating. A Vampire may discover that some compulsions were never identical to identity, that some traditions were upheld because the old universe made them feel inevitable, and that predation remains a choice even while Hunger remains real.",
                      "Vitae is the Vampire's Resource. Hunger is the Vampire's Pressure. Crimson Velocity controls speed and action economy. Grave Dominion controls predatory authority. Veil of Night controls recognition and concealment. Deathless Resilience controls survival and recovery. Vital Predation controls feeding and function theft. Blood Memory controls inherited information, stored experience, and lineage creation."
                  ]
              },
              'shapechanger-archetype': {
                  'summary': "A supernatural transformer whose forms, pack bonds, spirit relations, and territorial instincts remain intact while Gaia's once-constant call reaches them only as a distant, partially obscured voice.",
                  'body': [
                      "The Shapechanger's powers still work. The character can assume recorded forms, pursue across impossible boundaries, sense and protect the pack, adopt explicit adaptations, interact with spirits, and establish territory according to the Archetype's abilities. Nothing about the transition silently removes those permissions.",
                      "What has faded is the immediate presence of the living spiritual order that once surrounded those powers. The call of Gaia may once have existed in every heartbeat, every root, every territorial trespass, every packmate's distress, and every surge of Fury. Here that call feels like a conversation half heard through a wall: recognizable, emotionally undeniable, but stripped of detail and immediate direction.",
                      "The Shapechanger is not severed from Gaia so much as displaced beyond the cosmology in which that relationship was ordinary. The bond remains inside the character, but the stars, ecosystems, spirits, and local metaphysical structures do not automatically answer as parts of the same sacred body.",
                      "Old spirit relationships may continue through established pacts and named bonds, yet unfamiliar local spirits have no inherited reason to recognize the Shapechanger's status, rites, renown, or territorial claims. The Shapechanger must establish those relationships through actual capabilities and actions rather than relying upon universal recognition.",
                      "Fury therefore feels more personal. Instinct remains powerful, but it is no longer accompanied by the same certainty that rage serves a universally understood war. Pack loyalty may become more important precisely because the cosmic Pack feels distant and the people immediately beside the Shapechanger are the only voices that answer clearly.",
                      "Fury is the Shapechanger's Resource. Instinct is the Shapechanger's Pressure. Threefold Form supplies the explicit ability to shift among social, hunting, and war forms. Warform defines combat benefits. Hunt Across Worlds defines pursuit. Pack Continuity defines bonded coordination. Adaptive Forms defines utility transformations. Spirit Ecology defines spirit interaction. Territorial Sovereignty defines claimed domains."
                  ]
              },
              'eldritch-binder-archetype': {
                  'summary': "A negotiator, jailer, host, or partner whose impossible patron still answers, though the old compact now feels carried within the Binder rather than recognized by the surrounding universe.",
                  'body': [
                      "Whatever answered the Binder before still answers now. Patron, prisoner, elder intelligence, impossible location, living name, inherited wound, extradimensional force, or negotiated fragment: the relationship survived. The Binder's powers work. Existing bindings, contracts, prohibitions, permissions, seals, debts, and invocation rights remain available according to the recorded abilities.",
                      "The connection nevertheless feels diminished. In the former universe it may have felt like a tether extending from the Binder into a vast metaphysical structure that knew both parties, recorded the agreement, and enforced its vocabulary. Here it feels more like a binding carried inside the Binder: a knot of obligation, access, memory, and authority that continues to function even though the surrounding reality does not recognize the institution that issued it.",
                      "The answering presence may also feel farther away. Its voice arrives with less contextual weight. Its signs may be smaller. Its attention may no longer fill the same unseen architecture. Even an ancient being that helped create, transform, or define the Binder can feel like a shadow of its former immediacy—not because it ceased to exist, but because the cosmological road between Binder and presence no longer runs through familiar territory.",
                      "The contract still binds the parties who carry it. Local forces, laws, thresholds, spirits, and causal structures are not automatically signatories. A prohibition that once relied upon the universe recognizing a sacred name may now operate only through the Binder's explicit Sealcraft. A right of passage once honored by every threshold may now need to be actively asserted through Threshold Geometry.",
                      "This makes the Binder simultaneously weaker in inherited authority and more personally responsible for every act of invocation. The old universe no longer stands visibly behind the contract. What remains is the Binder, the answering presence, the terms they still remember, and the capabilities that prove the agreement continues to have force.",
                      "Pact is the Binder's Resource. Intrusion is the Binder's Pressure. Sealcraft controls boundaries and local law. Borrowed Manifestation grants temporary capabilities. Pact Economy governs prices and obligations. Forbidden Cognition grants dangerous knowledge. Threshold Geometry creates nonordinary routes. Invocation controls signs, avatars, partial arrivals, and full audiences."
                  ]
              },
              'harmonic-mutant-archetype': {
                  'summary': "A mortal resonance inheritor whose powers still function even though the layered fae and eldritch compacts that once made those harmonics natural are no longer recognized by local reality.",
                  'body': [
                      "The Harmonic Mutant still manipulates resonance. Projection, healing, structural interaction, emotional tuning, phase modulation, and memory harmonics continue to function according to the recorded powers. The problem is not that the character has lost the method. The problem is that the world now answers in a different language.",
                      "A Harmonic Mutant is not merely someone who produces unusual frequencies. The Archetype is the mortal distillate of layered agreements between beings and reality. Ancient fae, eldritch intermediaries, or comparable higher-order entities established compacts with fundamental forces such as threshold, flame, memory, weight, distance, identity, emotion, and repetition.",
                      "Those first agreements produced secondary institutions, inherited privileges, ecological arrangements, supernatural customs, bloodline effects, and metaphysical organizations. Those consequences produced further third-, fourth-, and fifth-order agreements. Mortal lives were eventually shaped by the accumulated resonant pathways created through that chain.",
                      "The Harmonic Mutant learned to attune to those distilled pathways. The character did not necessarily negotiate directly with the first beings or the fundamental forces. They inherited the remainder: a compact already translated through generations of supernatural organization until its effects could live inside mortal thought, emotion, blood, memory, or altered physiology.",
                      "Here, the fundamental forces still exist, but the old contractual chain does not recognize the Mutant as an authorized participant. The local versions of distance, memory, gravity, emotion, matter, and identity are not necessarily governed by the same agreements or obligated to answer the same inherited procedures. The old organizations and resonant paths may have analogues, but those analogues do not know the character.",
                      "The Mutant therefore feels the wrongness of the new universe more clearly than most. The self still carries the old compact. Teammates still carry identities and supernatural conditions shaped elsewhere. The surrounding world responds, but it responds at an unfamiliar angle, as though every note remains recognizable while the interval between notes has changed.",
                      "That is why the abilities can feel diminished without being mechanically weaker. Attunement requires reaching across a contractual absence. Resonance returns with unfamiliar overtones. Emotional chords meet societies whose metaphysical assumptions were not part of the original agreement. Structural frequencies answer, but the Mutant can feel that the answer is not recognition—it is forced compatibility.",
                      "A Harmonic Mutant is therefore a person whose compact with reality was fundamentally displaced by transition. The old agreement persists as a remainder carried within the character. Local reality has not accepted the contract, yet the Mutant continues to make it function through Resonance, accepting Discord as the measurable friction between inherited law and an unbound universe.",
                      "Resonance is the Mutant's Resource. Discord is the Mutant's Pressure. Harmonic Projection controls force. Echo Patterns controls healing and duplication. Structural Resonance controls architecture and machinery. Emotional Chord controls collective state. Phase Modulation controls interaction with matter and nearby outcomes. Memory Harmonics controls recovery, storage, separation, and preservation of memory patterns."
                  ]
              }
          }

          entries = {entry.get('id'): entry for entry in wiki.get('entries', [])}
          missing = sorted(set(descriptions) - set(entries))
          if missing:
              raise SystemExit(f'Missing Wiki entries: {missing}')
          for entry_id, replacement in descriptions.items():
              entries[entry_id]['summary'] = replacement['summary']
              entries[entry_id]['body'] = replacement['body']
          wiki['schemaVersion'] = '0.5.0'
          wiki_path.write_text(json.dumps(wiki, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          Path('.github/workflows/one-time-continuum-archetype-distance.yml').unlink()
          PY
      - name: Commit expanded Archetype descriptions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand displaced supernatural Archetype descriptions"
          git push origin main
