name: Factorio R96 asymmetric original-sprite casting facets, not generic ribbons
on:
  push:
    branches: [main]
    paths:
      - 'tools/factorio-render-pipeline/source_discrete_cast_facets_r96.py'
      - '.github/workflows/factorio-source-discrete-cast-facets-r96.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-traced-discrete-3d-facets:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve R94 closest-working original 3D scene; NO original sprite included
        uses: actions/download-artifact@v4
        with:
          run-id: 41494055204
          name: factorio-r94-source-first-sewn-planar-bell-metal-shell-candidates
          github-token: ${{ github.token }}
          path: private-ci/r94
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hb-ttrpg-tools/factorio-render-pipeline
          key: factorio-art-env-ubuntu24-blender4.5.15-python3.12-v1
      - name: Install verified original camera Blender 4.5 LTS environment
        run: python tools/factorio-render-pipeline/bootstrap.py install --evidence-dir private-ci/readiness
      - name: Remesh real source-traced independent cast polygons as physical stitched depth facets
        run: |
          BLENDER="$(python -c "import sys;sys.path.insert(0,'tools/factorio-render-pipeline');import bootstrap;print(bootstrap.find_blender())")"
          "$BLENDER" -b --disable-autoexec --factory-startup -t 2 --python-exit-code 4 \
            --python tools/factorio-render-pipeline/source_discrete_cast_facets_r96.py -- \
            --source-blend private-ci/r94/output/r94/panel_trim_025_rear_018.blend \
            --out private-ci/output/r96
      - name: Check native frames, connected real facets, physical anchors, and verified editable candidates
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('private-ci/output/r96')
          r=json.loads((p/'r96_source_discrete_3d_forging_facets.json').read_text())
          assert not r['original_wube_sprite_art_exported']
          assert not r['actual_original_sprite_comparison_done_in_ci']
          assert not r['source_fidelity_approved']
          assert len(r['candidates']) == 9
          for case in r['candidates']:
              assert (p/case['frame1']).stat().st_size>5000
              assert (p/case['frame33']).stat().st_size>5000
              assert case['original_camera_materials_64_motion_and_anchors_unchanged']
              if case['editable_blend']:
                  assert (p/case['editable_blend']).stat().st_size>100000
              for casting in case['altered_original_source_parts'].values():
                  for part in casting.values():
                      assert part['new_shared_planar_ring_vertices'] >= 7
                      assert part['all_new_inset_ring_edges_stitched']
                      assert part['original_back_ring_and_real_anchor_unchanged']
                      assert part['source_fidelity_unapproved']
          print('R96_TRUE_SOURCE_OUTLINE_DISCRETE_BLENDER_FACETS_VERIFIED_DIAGNOSTIC_ONLY')
          PY
      - name: Preserve R94 as baseline and publish only genuine Blender meshes / renders (no original sprite)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorio-r96-original-asymmetric-forging-facets-source-geometry-candidates
          path: |
            private-ci/output/r96/*.blend
            private-ci/output/r96/*.png
            private-ci/output/r96/*.json
            private-ci/readiness/readiness.json
          if-no-files-found: warn
          retention-days: 14
