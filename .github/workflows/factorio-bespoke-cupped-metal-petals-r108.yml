name: Factorio R108 genuine individual cupped metal fin petals and asymmetric real 3D source forms
on:
  push:
    branches: [main]
    paths:
      - 'tools/factorio-render-pipeline/source_bespoke_cupped_petals_r108.py'
      - '.github/workflows/factorio-bespoke-cupped-metal-petals-r108.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  physical-rear-fin-stop-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover physically source-ranked R104 Blender model; keep original artwork private
        uses: actions/download-artifact@v4
        with:
          run-id: 41516311501
          name: factorio-r104-source-true-3d-forging-and-nozzle-baffle-editable-composites
          github-token: ${{ github.token }}
          path: private-ci/r104
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hb-ttrpg-tools/factorio-render-pipeline
          key: factorio-art-env-ubuntu24-blender4.5.15-python3.12-v1
      - name: Install verified source-native camera Blender 4.5 LTS
        run: python tools/factorio-render-pipeline/bootstrap.py install --evidence-dir private-ci/readiness
      - name: Sculpt truly different rolled and cupped real 3D petals with physical fin root ends, render actual original source camera
        run: |
          BLENDER="$(python -c "import sys;sys.path.insert(0,'tools/factorio-render-pipeline');import bootstrap;print(bootstrap.find_blender())")"
          "$BLENDER" -b --disable-autoexec --factory-startup -t 2 --python-exit-code 4 \
            --python tools/factorio-render-pipeline/source_bespoke_cupped_petals_r108.py -- \
            --r104-dir private-ci/r104/output/r104 \
            --out private-ci/output/r108
      - name: Verify truly different formed 3D petal sections, preserved through-slots, saved reopened Blender mesh and original motion
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('private-ci/output/r108')
          r=json.loads((p/'r108_true_individual_petal_shape_report.json').read_text())
          assert not r['original_source_sprite_exported']
          assert r['source_pixel_comparison_is_not_3d_shape_acceptance']
          assert len(r['cases'])==6
          for case in r['cases']:
              assert (p/case['editable_true_3d_blend']).stat().st_size>100000
              assert case['original_lower_fin_animation_preserved']
              assert case['camera_and_unmodified_casts_preserved']
              assert len(case['native_frames'])==2
              assert (p/case['actual_3d_oblique_inspection']).stat().st_size>5000
              for name in case['native_frames'].values():
                  assert (p/name).stat().st_size>5000
              for fin in case['per_petal_real_3d_shape_sections'].values():
                  assert fin['cut']['rear_end_actual_cap_quads']==10
                  assert fin['cut']['both_real_metal_skins_closed_manifold']
                  sections=fin['formed']['actual_3d_sections']
                  assert len(sections)==5
                  if case['forming_strength']>0:
                      assert fin['formed']['true_two_skin_198_vertex_metal']
                      assert fin['formed']['original_through_slots_retained']
                      assert fin['formed']['max_actual_vertex_displacement_m']>.008
          print('R108_INDIVIDUAL_CURVED_CUPPED_SOURCE_PETALS_REAL_3D_SHAPE_SAVED_REOPENED_PASS')
          PY
      - name: Publish original Blender scenes and actual native render frames, never original user source art
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorio-r108-true-individual-curved-cupped-3d-metal-petal-candidates
          path: |
            private-ci/output/r108/*.blend
            private-ci/output/r108/*.png
            private-ci/output/r108/*.json
            private-ci/readiness/readiness.json
          if-no-files-found: warn
          retention-days: 14
