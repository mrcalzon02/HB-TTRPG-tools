name: Integrate and validate worked combat module

on:
  push:
    paths:
      - .github/workflows/one-time-combat-example-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Complete combat module integration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          index_path = Path('index.html')
          index_html = index_path.read_text(encoding='utf-8')
          anchor = '  <script src="blacklight-character-sheet-entry.js"></script>\n'
          script = '  <script src="blacklight-combat-example-entry.js"></script>\n'
          if script not in index_html:
              if anchor not in index_html:
                  raise SystemExit('Blacklight workspace script anchor not found')
              index_html = index_html.replace(anchor, anchor + script, 1)
          index_path.write_text(index_html, encoding='utf-8')

          combat_path = Path('data/blacklight-continuum/rules/combat-foundation.json')
          combat = json.loads(combat_path.read_text(encoding='utf-8'))
          break_free = next(item for item in combat['standardActions'] if item['name'] == 'Break Free')
          break_free['effect'] = (
              "Test Force + Athletics or Finesse + Mobility against the restraint's printed difficulty. "
              "When a restraint lists durability but no Break Free difficulty, use maximum 1, ceiling(durability / 2). "
              "On success, end Restrained. On failure, remain Restrained."
          )
          combat_path.write_text(json.dumps(combat, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          Path('.github/workflows/one-time-combat-example-integration.yml').unlink()
          PY
      - name: Validate combat module
        run: |
          node --check blacklight-combat-example.js
          node --check blacklight-combat-example-entry.js
          python - <<'PY'
          import json
          from pathlib import Path

          combat = json.loads(Path('data/blacklight-continuum/rules/combat-foundation.json').read_text(encoding='utf-8'))
          module = json.loads(Path('data/blacklight-continuum/wiki/combat-example-module.json').read_text(encoding='utf-8'))
          index = json.loads(Path('data/blacklight-continuum/wiki/wiki-index.json').read_text(encoding='utf-8'))
          index_html = Path('index.html').read_text(encoding='utf-8')
          reader_html = Path('blacklight-combat-example.html').read_text(encoding='utf-8')

          assert combat['coreProcedure']['initiative'].startswith('Act from highest Initiative')
          assert 'ceiling(Guard / 2)' in combat['attackProcedure']['physicalDefenseDifficulty']
          assert combat['exposure']['warningThreshold'] == 'Exposure Warning equals ceiling(Exposure Limit / 2).'
          assert len(combat['cohesion']['options']) == 4
          assert combat['downedDyingAndDeath']['death'].startswith('At 3 Death Marks')
          assert 'ceiling(durability / 2)' in next(item['effect'] for item in combat['standardActions'] if item['name'] == 'Break Free')

          entries = {entry['id']: entry for entry in module['entries']}
          assert set(entries) == {
              'combat-foundation-procedure',
              'combat-tracks-and-death',
              'worked-combat-cargo-gallery',
          }
          example = entries['worked-combat-cargo-gallery']
          combined = '\n'.join(example['body'])
          for required in (
              'Round 1, Mara',
              'Round 2, Ilyan',
              'Human Breaking Point' if False else 'Incursion occurs',
              'Stabilize',
              'Emergency Treatment',
              'Overexposure',
              'Kest moves from 1 to 3 Death Marks and dies immediately',
          ):
              assert required in combined, required

          # Verify the arithmetic explicitly used by the example.
          assert 4 + 0 - 4 <= 0  # Pistol hit still inflicts the minimum 1 damage.
          assert 4 + 2 - 3 == 3  # Round 1 claws against Ilyan.
          assert 4 + 4 - 3 == 5  # Round 3 claws against Restrained Ilyan.
          assert 3 + 2 - 3 == 2  # Round 4 shoulder slam before Brace.
          assert 5 - 2 == 3       # Mara Exposure Limit and Warning.
          assert 8 - 7 == 1       # Ilyan Intrusion overflow after Incursion.
          assert 1 + 2 == 3       # Kest final Death Marks.

          assert index['combatFoundationRules'].endswith('combat-foundation.json')
          assert index['combatExampleModule'] == 'blacklight-combat-example.html'
          assert 'data/blacklight-continuum/wiki/combat-example-module.json' in index['packs']
          assert index['completedScope']['workedCombatModules'] == 1
          assert index_html.count('blacklight-combat-example-entry.js') == 1
          assert reader_html.count('blacklight-combat-example.js') == 1
          PY
      - name: Commit integrated combat module
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate worked combat example module"
          git push origin main
