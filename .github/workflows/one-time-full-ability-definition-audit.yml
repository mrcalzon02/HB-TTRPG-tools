name: One-time full ability definition audit

on:
  push:
    paths:
      - .github/workflows/one-time-full-ability-definition-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit innate and ranked ability text
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/blacklight-continuum/rules/basic-character-options.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          markers = [
              'game moderator', 'campaign rules', "campaign's", 'according to the campaign',
              'approved', 'appropriate', 'plausible', 'or similar', 'or equivalent',
              'known threat', 'credible public objective', 'defined purpose and limits',
              'small group', 'strong targets', 'short recent memory', 'one shared emotional posture',
              'one ordinary', 'one large effect', 'one major effect', 'one narrow', 'one limited',
              'one defining', 'one extraordinary', 'one severe', 'the immediate function or intent',
              'broad category', 'broadly', 'may use', 'may gain', 'may create', 'may develop'
          ]

          rows = []
          for archetype in data.get('archetypes', []):
              for ability in archetype.get('innateAbilities', []):
                  effect = ability.get('effect', '')
                  hits = [m for m in markers if m in effect.lower()]
                  if hits:
                      rows.append({
                          'archetype': archetype.get('name'),
                          'family': 'Innate Abilities',
                          'rank': 'innate',
                          'ability': ability.get('name'),
                          'effect': effect,
                          'markers': hits
                      })
              for family in archetype.get('powerFamilies', []):
                  for ability in family.get('abilities', []):
                      effect = ability.get('effect', '')
                      hits = [m for m in markers if m in effect.lower()]
                      if hits:
                          rows.append({
                              'archetype': archetype.get('name'),
                              'family': family.get('name'),
                              'rank': ability.get('rank'),
                              'ability': ability.get('name'),
                              'effect': effect,
                              'markers': hits
                          })

          report = Path('data/blacklight-continuum/rules/full-ability-definition-audit.json')
          report.write_text(json.dumps({'count': len(rows), 'abilities': rows}, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          Path('.github/workflows/one-time-full-ability-definition-audit.yml').unlink()
          PY
      - name: Commit audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Audit all Blacklight ability definitions"
          git push origin main
