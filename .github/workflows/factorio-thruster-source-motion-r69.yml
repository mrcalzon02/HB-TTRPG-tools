name: Factorio R69 authentic source-referenced 64-frame motion discrepancy audit
on:
  push:
    branches: [main]
    paths:
      - 'tools/factorio-render-pipeline/r69_authentic_source_motion_gap.py'
      - 'tools/factorio-render-pipeline/test_r69_authentic_source_motion_gap.py'
      - '.github/workflows/factorio-thruster-source-motion-r69.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  measure-real-source-indexed-blender-alpha-motion:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run synthetic 64-frame motion accounting safeguards
        run: |
          python -m pip install "Pillow>=10,<13"
          python -m unittest discover -s tools/factorio-render-pipeline -p 'test_r69_authentic_source_motion_gap.py' -v
      - name: Retrieve saved full real R66 Blender native frame sequence
        uses: actions/download-artifact@v4
        with:
          run-id: 41372931965
          name: factorio-r67-r66-real-native-64frame-candidate-and-sheet
          github-token: ${{ github.token }}
          path: private-ci/reconstruction/
      - name: Quantify real original-source motion shortfall without source art export
        run: |
          python tools/factorio-render-pipeline/r69_authentic_source_motion_gap.py \
            --candidate-cycle private-ci/reconstruction/output/r67 \
            --report private-ci/output/r69-authentic-original-motion-gap.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("private-ci/output/r69-authentic-original-motion-gap.json").read_text())
          assert data["total_frames"]==64
          assert data["original_64_transition_changed_pixel_total"]==31334
          assert data["candidate_64_transition_changed_pixel_total"]>0
          assert data["original_sprite_pixels_loaded"] is False
          assert data["third_party_internet_reference_used"] is False
          assert data["visual_art_acceptance"] is False
          assert data["game_release_blocked_by_art_diagnostics"] is False
          print("R69_R66_REAL_MOTION_SOURCE_RECORDED_MOTION",
                data["candidate_average_changed_alpha_pixels_per_transition"],
                data["original_average_changed_alpha_pixels_per_transition"],
                data["candidate_to_source_by_band"])
          PY
      - name: Publish objective motion gap diagnosis only, not original source sprites
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorio-r69-original-source-observed-vs-real-r66-64frame-motion
          path: private-ci/output/r69-authentic-original-motion-gap.json
          if-no-files-found: warn
          retention-days: 14
