name: Ops Manual scale geometry fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-manual-scale-geometry-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Isolate transformed book from scroll geometry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('blacklight-exo-crew-operations.css')
          s=p.read_text(encoding='utf-8')
          a='.exo-manual-scale-stage{position:relative;margin:0 auto}'
          b='.exo-manual-scale-stage{position:relative;margin:0 auto;overflow:hidden}'
          c='.exo-manual-sheet.exo-manual-book{width:960px;min-height:0;padding:0;border:0;background:transparent;box-shadow:none;transform:scale(var(--manual-scale,1));transform-origin:top left;font-family:"Times New Roman",Times,Georgia,serif}'
          d='.exo-manual-sheet.exo-manual-book{position:absolute;left:0;top:0;width:960px;min-height:0;padding:0;border:0;background:transparent;box-shadow:none;transform:scale(var(--manual-scale,1));transform-origin:top left;font-family:"Times New Roman",Times,Georgia,serif}'
          if a not in s or c not in s:
              raise SystemExit('expected Ops Manual scaling selectors not found')
          s=s.replace(a,b,1).replace(c,d,1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'exo-manual-scale-stage{position:relative;margin:0 auto;overflow:hidden}' blacklight-exo-crew-operations.css
          grep -q 'exo-manual-sheet.exo-manual-book{position:absolute;left:0;top:0' blacklight-exo-crew-operations.css
      - name: Commit fix and remove worker
        shell: bash
        run: |
          rm -f .github/workflows/ops-manual-scale-geometry-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blacklight-exo-crew-operations.css .github/workflows/ops-manual-scale-geometry-fix.yml
          git commit -m 'fix: preserve scaled Ops Manual scroll geometry [ops-manual-worker]'
          git push origin HEAD:main
