name: Network Investigator Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'network-investigator-agent/**'
      - '.github/workflows/network-investigator-windows.yml'

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build self-contained Windows bundle
        shell: pwsh
        run: ./network-investigator-agent/build-windows.ps1
      - name: Smoke test built agent
        shell: pwsh
        run: ./network-investigator-agent/smoke-test-windows.ps1
      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: NetworkInvestigator-Windows-x64
          path: network-investigator-agent/dist/NetworkInvestigator-Windows-x64.zip
          if-no-files-found: error
