name: Validate Barotrauma Runtime

on:
  push:
    branches: [main]
    paths:
      - 'barotrauma-rpg-tools-loader.js'
      - 'barotrauma-rpg-tools.html'
      - 'data/barotrauma/tools/runtime/**'
      - 'data/barotrauma/tools/catalog/**'
      - 'data/barotrauma/tools/submarines/**'
      - 'data/barotrauma/tools/custom/**'
      - 'data/barotrauma/tools/items/**'
      - 'data/barotrauma-tools-registry.json'
      - 'scripts/validate-barotrauma-runtime.mjs'
      - '.github/workflows/validate-barotrauma-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate assembled runtime
        env:
          VALIDATION_RECEIPT: data/barotrauma/validation/runtime-validation.json
        run: node scripts/validate-barotrauma-runtime.mjs
      - name: Commit validation receipt
        run: |
          if git diff --quiet -- data/barotrauma/validation/runtime-validation.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/barotrauma/validation/runtime-validation.json
          git commit -m "Record Barotrauma runtime validation"
          git push origin HEAD:main
