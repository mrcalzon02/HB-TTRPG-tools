name: Apply Cubic candidate corroboration

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/apply-cubic-candidate-corroboration.yml"
      - "scripts/apply-cubic-candidate-corroboration.py"

permissions:
  contents: write
  statuses: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Record pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=pending \
            -f context='binary-cube/cubic-corroboration' \
            -f description='Applying retained-candidate Stage B corroboration.' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply exact Stage B corroboration edits
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          python scripts/apply-cubic-candidate-corroboration.py
          node --check binary-cube-cubic-decryptor.js
          node --check scripts/validate-binary-cube-cubic-decryptor.mjs
          node --check scientific-tools-entry.js
          node --check app-lite-view-mounts.js
          node --check scripts/validate-scientific-tools-extraction.mjs
          node scripts/validate-binary-cube-cubic-decryptor.mjs
          node scripts/validate-scientific-diagnostic-pipeline.mjs
          node scripts/validate-scientific-tools-extraction.mjs
      - name: Commit validated Stage B corroboration
        run: |
          if git diff --quiet -- binary-cube-cubic-decryptor.js scripts/validate-binary-cube-cubic-decryptor.mjs scientific-tools-entry.js app-lite-view-mounts.js scripts/validate-scientific-tools-extraction.mjs; then
            echo "Stage B corroboration already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add binary-cube-cubic-decryptor.js scripts/validate-binary-cube-cubic-decryptor.mjs scientific-tools-entry.js app-lite-view-mounts.js scripts/validate-scientific-tools-extraction.mjs
          git commit -m "feat: corroborate retained Cubic decryptor candidates"
          git push origin HEAD:main
      - name: Record success
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=success \
            -f context='binary-cube/cubic-corroboration' \
            -f description='Stage B Cubic candidate corroboration integrated.' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Record failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=failure \
            -f context='binary-cube/cubic-corroboration' \
            -f description='Stage B Cubic candidate corroboration failed closed.' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
