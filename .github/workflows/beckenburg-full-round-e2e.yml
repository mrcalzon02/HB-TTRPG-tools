              if (Test-Path $diag) {
                $logs=@(Get-ChildItem $diag -Filter 'session-*.log' -File |
                        Where-Object { $_.LastWriteTime -ge $began.AddSeconds(-1) } |
                        Sort-Object LastWriteTime -Descending)
