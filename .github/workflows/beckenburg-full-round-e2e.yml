                }
              }
              if ($ready) { break }
              Start-Sleep -Milliseconds 350
            }
            if (-not $ready) { throw 'Native executable never reached PHASE ready / Menu available; inspect diagnostic logs' }
            'PASS: native Windows app-image reached fully initialized menu' |
                Set-Content -LiteralPath 'build\e2e\native-executable-load.txt' -Encoding utf8
            Write-Host 'PASS Native Windows executable loaded to the menu; not just a running splash'
          } finally {
            if ($null -ne $proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Preserve test evidence and crash diagnostics even on failure
        if: always()
        shell: pwsh
        working-directory: software/beckenburg
        run: |
          New-Item -ItemType Directory -Force 'build\e2e\diagnostics' | Out-Null
          $folder=Join-Path $env:USERPROFILE '.beckenburg\diagnostics'
          if (Test-Path $folder) {
            Get-ChildItem $folder -File |
              Where-Object { $_.Name -match '^(session-|crash-)' } |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 6 |
              ForEach-Object {
                $content=Get-Content $_.FullName -Raw -ErrorAction SilentlyContinue
                if ($null -ne $content) {
                  $content=$content.Replace($env:USERPROFILE,'<USER_HOME>')
                  Set-Content -LiteralPath (Join-Path 'build\e2e\diagnostics' $_.Name) -Value $content -Encoding utf8
                }
              }
          }
          "revision=$env:GITHUB_SHA" | Set-Content 'build\e2e\revision.txt' -Encoding ascii

      - name: Attach round transcript, menu screenshots and startup logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beckenburg-e2e-${{ github.run_id }}
          path: software/beckenburg/build/e2e/**
          if-no-files-found: warn
          retention-days: 14
