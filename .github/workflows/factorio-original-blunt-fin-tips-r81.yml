name: Factorio R81 true original-source blunt-tip narrowing metal fins
on:
  push:
    branches: [main]
    paths:
      - 'tools/factorio-render-pipeline/source_blunt_taper_fin_r81.py'
      - '.github/workflows/factorio-original-blunt-fin-tips-r81.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-mounted-fin-source-blunt-tips:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover R79 exact saved physical hinge + pressure hull scene, no proprietary artwork
        uses: actions/download-artifact@v4
        with:
          run-id: 41401424515
          name: factorio-r79-independent-center-hinges-editable-four-candidates
          github-token: ${{ github.token }}
          path: private-ci/r79
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hb-ttrpg-tools/factorio-render-pipeline
          key: factorio-art-env-ubuntu24-blender4.5.15-python3.12-v1
      - name: Install pinned actual Blender 4.5
        run: python tools/factorio-render-pipeline/bootstrap.py install --evidence-dir private-ci/readiness
      - name: Build, render and reopen unchanged-anchored R81 3D fin shoulder/tip profiles
        run: |
          BLENDER="$(python -c "import sys;sys.path.insert(0,'tools/factorio-render-pipeline');import bootstrap;print(bootstrap.find_blender())")"
          "$BLENDER" -b --disable-autoexec --factory-startup -t 2 --python-exit-code 4 \
            --python tools/factorio-render-pipeline/source_blunt_taper_fin_r81.py -- \
            --source-blend private-ci/r79/output/r79/left_036_right_036.blend \
            --out private-ci/output/r81
      - name: Verify four real Blender files and source-native screenshots without original images
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('private-ci/output/r81')
          j=json.loads((p/'r81_real_blunt_taper_fin_candidates.json').read_text())
          assert not j['original_source_sprite_included']
          assert not j['visually_approved']
          assert len(j['candidates'])==4
          for c in j['candidates']:
              assert (p/c['file']).stat().st_size>100000
              assert (p/c['real_native_frame_01']).stat().st_size>5000
              assert (p/c['real_native_frame_33']).stat().st_size>5000
              assert c['true_slot_topology_and_heat_tint_materials_retained']
              assert c['all_three_3d_mounting_roots_unchanged']
          print('R81_NATIVE_ORIGINAL_SHAPE_CORRECTION_TRUE_3D_PASSED')
          PY
      - name: Upload only edited native Blender candidates, never original proprietary body frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorio-r81-real-blunt-source-fin-taper-candidates
          path: |
            private-ci/output/r81/*.blend
            private-ci/output/r81/*.png
            private-ci/output/r81/*.json
            private-ci/readiness/readiness.json
          if-no-files-found: warn
          retention-days: 14
