name: Run guarded Binary Cube V9 performance patch

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/binary-cube-v9-patch-runner.yml"
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: binary-cube-v9-performance-patch
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Record patch pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=pending \
            -f context='binary-cube/v9-patch' \
            -f description='Applying and validating direct V9 performance-tier edits.' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply direct V9 patches
        run: |
          base64 -d scripts/.temporary-v9-engine-renderer.py.gz.b64 | gzip -d > /tmp/v9-engine-renderer.py
          base64 -d scripts/.temporary-v9-controller.py.gz.b64 | gzip -d > /tmp/v9-controller.py
          base64 -d scripts/.temporary-v9-css.py.gz.b64 | gzip -d > /tmp/v9-css.py
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/v9-controller.py')
          source = path.read_text(encoding='utf-8')
          old = '        fallback.textContent = `${error.message} The canonical key and package remain available as text, but this browser cannot display the V'
          new = '      fallback.textContent = `${error.message} The canonical key and package remain available as text, but this browser cannot display the V'
          if source.count(old) != 2:
              raise SystemExit(f'Expected two fallback patch literals, found {source.count(old)}.')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
          python /tmp/v9-engine-renderer.py
          python /tmp/v9-controller.py
          python /tmp/v9-css.py
          python - <<'PY'
          from pathlib import Path
          path = Path('shadowrun-binary-cube-visualizer.js')
          source = path.read_text(encoding='utf-8')
          old = '    if (activeKey.gridSize <= MAX_MANUAL_TRACE_GRID_SIZE) activeTraces = buildTraceCollection(sourceBits, activeKey, packageObject);'
          new = '    if (activeKey.gridSize <= MAX_MANUAL_TRACE_GRID_SIZE) activeTraces = [...buildTraceCollection(sourceBits, activeKey, packageObject)];'
          if source.count(old) != 1:
              raise SystemExit(f'Expected one eager trace-cache branch, found {source.count(old)}.')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate direct V9 implementation
        run: |
          set -o pipefail
          node --check shadowrun-binary-cube-engine.js
          node --check binary-cube-visualizer-renderer.js
          node --check shadowrun-binary-cube-visualizer.js
          node --check scripts/validate-binary-cube-visualizer-performance.mjs
          node --check scripts/measure-binary-cube-visualizer-performance.mjs
          node --check scripts/validate-binary-cube-visualizer-performance-browser.mjs
          node scripts/validate-binary-cube-baseline.mjs
          node scripts/validate-binary-cube-visualizer-encoder.mjs
          node scripts/validate-binary-cube-visualizer-sequencing.mjs
          node scripts/validate-binary-cube-visualizer-performance.mjs
          node scripts/measure-binary-cube-visualizer-performance.mjs
          node scripts/validate-binary-cube-visualizer-sequencing-browser.mjs
          node scripts/validate-binary-cube-visualizer-performance-browser.mjs
          node desktop/binary-cube/tests/smoke.cjs
          git diff --check

      - name: Commit V9 implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shadowrun-binary-cube-engine.js binary-cube-visualizer-renderer.js shadowrun-binary-cube-visualizer.js binary-cube-visualizer.css
          git commit -m 'feat: add Binary Cube V9 rendering performance tiers [skip ci]'
          git push origin HEAD:main

      - name: Record patch success
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=success \
            -f context='binary-cube/v9-patch' \
            -f description='Direct V9 performance-tier edits validated and committed.' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Record patch failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=failure \
            -f context='binary-cube/v9-patch' \
            -f description='Direct V9 performance-tier patch failed validation.' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
