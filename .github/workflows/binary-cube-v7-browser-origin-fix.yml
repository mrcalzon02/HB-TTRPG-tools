name: Apply Binary Cube V7 browser-origin fix

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/binary-cube-v7-browser-origin-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: binary-cube-v7-browser-origin-fix
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move V7 browser validation to localhost
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/validate-binary-cube-visualizer-encoder-browser.mjs')
          source = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "import fs from 'node:fs';\nimport os from 'node:os';",
                  "import fs from 'node:fs';\nimport { createServer } from 'node:http';\nimport os from 'node:os';"
              ),
              (
                  "const profileDirectory = fs.mkdtempSync(path.join(os.tmpdir(), 'binary-cube-v7-browser-'));\nconst xvfbProcess = spawn(xvfb, [display, '-screen', '0', '1280x900x24', '-nolisten', 'tcp'], { stdio: ['ignore', 'ignore', 'pipe'] });",
                  "const profileDirectory = fs.mkdtempSync(path.join(os.tmpdir(), 'binary-cube-v7-browser-'));\nconst webServer = createServer((request, response) => {\n  response.writeHead(200, {\n    'Content-Type': 'text/html; charset=utf-8',\n    'Cache-Control': 'no-store'\n  });\n  response.end('<!doctype html><html><head><meta charset=\"utf-8\"><title>Binary Cube V7 Browser Validation</title></head><body><main><section id=\"shadowrun\"></section></main></body></html>');\n});\nawait new Promise((resolve, reject) => {\n  webServer.once('error', reject);\n  webServer.listen(0, '127.0.0.1', resolve);\n});\nconst webAddress = webServer.address();\nassert.ok(webAddress && typeof webAddress === 'object', 'The V7 browser validation server did not expose a localhost address.');\nconst pageUrl = `http://127.0.0.1:${webAddress.port}/`;\nconst xvfbProcess = spawn(xvfb, [display, '-screen', '0', '1280x900x24', '-nolisten', 'tcp'], { stdio: ['ignore', 'ignore', 'pipe'] });"
              ),
              (
                  "    'about:blank'",
                  "    pageUrl"
              ),
              (
                  "  await cdp.call('Runtime.enable');\n\n  await evaluate(cdp, `(() => {",
                  "  await cdp.call('Runtime.enable');\n  await cdp.call('Page.enable');\n  await cdp.call('Page.navigate', { url: pageUrl });\n  await delay(100);\n\n  await evaluate(cdp, `(() => {"
              ),
              (
                  "    document.head.appendChild(styleNode);\n  })()`, 'Prepare V7 document');",
                  "    document.head.appendChild(styleNode);\n    localStorage.clear();\n  })()`, 'Prepare V7 document');"
              ),
              (
                  "      schemaVersion: '0.2.0',",
                  "      schemaVersion: '0.3.0',"
              ),
              (
                  "      laboratoryToVisualizerHandoff: true,\n      largeGridPackageBoundary: true\n    };",
                  "      laboratoryToVisualizerHandoff: true,\n      largeGridPackageBoundary: true,\n      storageCapableLocalhostOrigin: true\n    };"
              ),
              (
                  "  assert.equal(receipt.largeGridPackageBoundary, true);\n  assert.match(receipt.webglVersion, /WebGL 2\\.0/);",
                  "  assert.equal(receipt.largeGridPackageBoundary, true);\n  assert.equal(receipt.storageCapableLocalhostOrigin, true);\n  assert.match(receipt.webglVersion, /WebGL 2\\.0/);"
              ),
              (
                  "  terminate(xvfbProcess);\n  await delay(200);",
                  "  terminate(xvfbProcess);\n  await new Promise(resolve => webServer.close(resolve));\n  await delay(200);"
              )
          ]

          updated = source
          for old, new in replacements:
              count = updated.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one browser-harness target, found {count}: {old[:80]!r}')
              updated = updated.replace(old, new, 1)

          path.write_text(updated, encoding='utf-8')
          PY
          node --check scripts/validate-binary-cube-visualizer-encoder-browser.mjs
          git diff --check

      - name: Commit browser-origin correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/validate-binary-cube-visualizer-encoder-browser.mjs
          git commit -m 'test: run Binary Cube V7 browser harness on localhost [skip ci]'
          git push origin HEAD:main
