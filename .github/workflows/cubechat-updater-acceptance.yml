name: CubeChat 0.1.1 update consent and upgrade
on:
  push:
    branches: [qa/cubechat-android-0.1.0]
    paths:
      - .github/workflows/cubechat-updater-acceptance.yml
      - .github/scripts/cubechat_updater_qa.py
      - .github/scripts/BrowserProbe.java
permissions:
  contents: read
jobs:
  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ANDROID_SERIAL: emulator-5554
      RELEASE_TAG: cubechat-android-v0.1.1
    steps:
      - name: Get scoped acceptance driver
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Get the production source matched to the published APK
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: production
          persist-credentials: false
          sparse-checkout: cubechat-android
      - name: Verify published APK and prepare an ephemeral older client
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP" --pattern CubeChat.apk --pattern release.json
          cmp "$RUNNER_TEMP/CubeChat.apk" production/cubechat-android/downloads/CubeChat.apk
          python -c 'import hashlib,json,sys;from pathlib import Path;p=Path(sys.argv[1]); a=p/"CubeChat.apk";m=json.loads((p/"release.json").read_bytes());assert m["versionCode"] == 2;assert a.stat().st_size > 256000; print("Published APK SHA-256",hashlib.sha256(a.read_bytes()).hexdigest())' "$RUNNER_TEMP"
          curl -fsSL --retry 3 'https://raw.githubusercontent.com/mrcalzon02/HB-TTRPG-tools/129c84af9f6cba3fff64b4a293aa32c23ac358ad/cubechat-android/downloads/CubeChat.apk' -o "$RUNNER_TEMP/CubeChat-0.1.0.apk"
          echo "51b845ddf7564dd1887dc7ab9bf51eddb7a8e0c93a6365314c7ddd4865514d69  $RUNNER_TEMP/CubeChat-0.1.0.apk" | sha256sum -c -
          test -s production/shadowrun-binary-cube-engine.js
          cd production/cubechat-android
          # A disposable debug install with an older version code exercises the real GitHub offer
          # before any later release is published. The updater, endpoint and installed release stay unchanged.
          sed -i -e 's/versionCode 2$/versionCode 1/' -e "s/versionName '0.1.1'/versionName '0.1.0'/" app/build.gradle
          export JAVA_HOME="$JAVA_HOME_17_X64"
          mkdir -p consentcapture/src/main/java/org/cubechat/qacapture
          cat >> settings.gradle <<'GRADLE'
          include ':consentcapture'
          GRADLE
          cat > consentcapture/build.gradle <<'GRADLE'
          plugins { id 'com.android.application' }
          android {
              namespace 'org.cubechat.qacapture'
              compileSdk 35
              defaultConfig { applicationId 'org.cubechat.qacapture'; minSdk 26; targetSdk 35 }
          }
          GRADLE
          cat > consentcapture/src/main/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="QA HTTPS receiver">
              <activity android:name=".BrowserProbe" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.VIEW"/>
                  <category android:name="android.intent.category.DEFAULT"/>
                  <category android:name="android.intent.category.BROWSABLE"/>
                  <data android:scheme="http"/>
                  <data android:scheme="https"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          XML
          cp "$GITHUB_WORKSPACE/.github/scripts/BrowserProbe.java" consentcapture/src/main/java/org/cubechat/qacapture/BrowserProbe.java
          ./gradlew --no-daemon --max-workers=2 :app:assembleDebug :consentcapture:assembleDebug
          cp consentcapture/build/outputs/apk/debug/consentcapture-debug.apk "$RUNNER_TEMP/consent-probe.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/CubeChat-updater-rehearsal.apk"
      - name: Verify real Android upgrade and require a tap before browser download
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          sdkmanager --install "emulator" "platform-tools" "system-images;android-30;google_apis;x86_64" > "$RUNNER_TEMP/sdk-install.log"
          export ANDROID_USER_HOME="$RUNNER_TEMP/cubechat-android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          avd_dir="$ANDROID_AVD_HOME/cubechat-qa.avd"
          mkdir -p "$avd_dir"
          printf '%s\n' 'avd.ini.encoding=UTF-8' "path=$avd_dir" 'target=android-30' > "$ANDROID_AVD_HOME/cubechat-qa.ini"
          cat > "$avd_dir/config.ini" <<'AVD'
          AvdId=cubechat-qa
          avd.ini.displayname=CubeChat QA
          abi.type=x86_64
          hw.cpu.arch=x86_64
          image.sysdir.1=system-images/android-30/google_apis/x86_64/
          tag.id=google_apis
          tag.display=Google APIs
          hw.lcd.width=720
          hw.lcd.height=1280
          hw.lcd.density=240
          hw.ramSize=2048
          vm.heapSize=256
          disk.dataPartition.size=2G
          hw.keyboard=yes
          hw.gpu.enabled=yes
          hw.audioInput=no
          hw.audioOutput=no
          fastboot.forceColdBoot=yes
          AVD
          test -f "$ANDROID_HOME/system-images/android-30/google_apis/x86_64/system.img"
          emulator -list-avds | grep -Fx cubechat-qa
          emulator -avd cubechat-qa -port 5554 -accel on -cores 2 -memory 2048 \
            -no-window -no-snapshot -no-boot-anim -no-audio -no-metrics \
            -gpu swiftshader_indirect -feature -Vulkan > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          adb start-server
          booted=''
          for attempt in {1..100}; do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              tail -40 "$RUNNER_TEMP/emulator.log"
              exit 1
            fi
            booted=$(timeout 4 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [[ "$booted" == 1 ]]; then break; fi
            sleep 3
          done
          if [[ "$booted" != 1 ]]; then
            echo 'Android boot timed out.'
            tail -40 "$RUNNER_TEMP/emulator.log"
            exit 1
          fi
          adb shell input keyevent 82
          adb shell wm dismiss-keyguard
          adb shell wm size 720x1280
          adb shell wm density 240
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell settings put system screen_off_timeout 1800000
          adb install "$RUNNER_TEMP/CubeChat-0.1.0.apk"
          python3 .github/scripts/cubechat_updater_qa.py
