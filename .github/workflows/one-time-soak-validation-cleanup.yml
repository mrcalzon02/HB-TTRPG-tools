name: Validate and clean up soak terminology

on:
  push:
    paths:
      - .github/workflows/one-time-soak-validation-cleanup.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply compatibility cleanup
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          combat_path = Path('data/blacklight-continuum/rules/combat-foundation-simple.json')
          combat = json.loads(combat_path.read_text(encoding='utf-8'))
          combat['legacyDamageTerms'] = {
              'Impact': 'Treat legacy references to Impact damage as Bashing damage.',
              'Trauma': 'Treat legacy references to Trauma damage as Lethal damage unless the effect has been explicitly revised to Aggravated.'
          }
          combat_path.write_text(json.dumps(combat, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          basic_path = Path('data/blacklight-continuum/rules/basic-character-options.json')
          basic = json.loads(basic_path.read_text(encoding='utf-8'))
          vampire = next(a for a in basic['archetypes'] if a['id'] == 'vampire')
          feeding = next(a for a in vampire['innateAbilities'] if a['name'] == 'Feeding')
          feeding['effect'] = feeding['effect'].replace('1 Impact per Vitae restored', '1 Bashing per Vitae restored')
          crimson = next(f for f in vampire['powerFamilies'] if f['name'] == 'Crimson Velocity')
          slaughter = next(a for a in crimson['abilities'] if a['name'] == 'Moment of Slaughter')
          slaughter['effect'] = slaughter['effect'].replace('1 Trauma from collapse', '1 Lethal damage from collapse')

          shape = next(a for a in basic['archetypes'] if a['id'] == 'shapechanger')
          regeneration = next(a for a in shape['innateAbilities'] if a['name'] == 'Regeneration')
          regeneration['effect'] = regeneration['effect'].replace('Impact', 'Bashing')
          warform = next(f for f in shape['powerFamilies'] if f['name'] == 'Warform')
          claws = next(a for a in warform['abilities'] if a['name'] == 'Claws of Decision')
          claws['effect'] = claws['effect'].replace('inflict Trauma', 'inflict Lethal damage')
          apex = next(a for a in warform['abilities'] if a['name'] == 'Apex Shape')
          apex['effect'] = apex['effect'].replace('dealing Trauma with +2 damage', 'dealing Lethal damage with +2 damage dice')
          basic_path.write_text(json.dumps(basic, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          Path('.github/workflows/one-time-soak-validation-cleanup.yml').unlink()
          PY
      - name: Validate active combat system
        run: |
          node --check blacklight-combat-example.js
          node --check blacklight-combat-example-entry.js
          node --check blacklight-shapechanger-combat-errata.js
          node --check blacklight-resource-pressure.js
          python - <<'PY'
          import json
          from pathlib import Path

          combat = json.loads(Path('data/blacklight-continuum/rules/combat-foundation-simple.json').read_text())
          module = json.loads(Path('data/blacklight-continuum/wiki/combat-example-simple.json').read_text())
          basic = json.loads(Path('data/blacklight-continuum/rules/basic-character-options.json').read_text())
          foundation = json.loads(Path('data/blacklight-continuum/wiki/foundation-rules.json').read_text())
          index = json.loads(Path('data/blacklight-continuum/wiki/wiki-index.json').read_text())

          assert combat['schemaVersion'] == '3.0.0'
          assert combat['attackProcedure']['firearmCriticals'].startswith('Each final attack die showing 10')
          assert combat['soakProcedure']['defaultThreshold'] == 'Each soak die succeeds on 6+.'
          assert combat['soakByCharacter']['vampire']['bashing'].endswith('rounding down.')
          assert 'Fortitude' in combat['soakByCharacter']['vampire']['aggravated']
          assert 'Archetype Rating' in combat['soakByCharacter']['shapechanger']['huntingOrWarFormLethal']
          assert combat['legacyDamageTerms']['Impact'].endswith('Bashing damage.')

          ids = {e['id'] for e in module['entries']}
          assert ids == {
              'combat-foundation-procedure',
              'damage-types-and-soak',
              'vampire-soak-and-fortitude',
              'shapechanger-living-soak',
              'worked-combat-cargo-gallery',
          }
          text = json.dumps(module)
          for term in ('Bashing', 'Lethal', 'Aggravated', 'Fortitude', 'Living Soak', 'critical success'):
              assert term in text

          vampire = next(a for a in basic['archetypes'] if a['id'] == 'vampire')
          assert any(a['name'] == 'Undead Soak' for a in vampire['innateAbilities'])
          shape = next(a for a in basic['archetypes'] if a['id'] == 'shapechanger')
          assert any(a['name'] == 'Living Soak' for a in shape['innateAbilities'])
          core = next(e for e in foundation['entries'] if e['id'] == 'blacklight-d10-foundation')
          assert any('Firearms attack adds one damage die' in p for p in core['body'])
          assert index['completedScope']['combatTeachingEntries'] == 5
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Validate rolled soak combat system"
          git push origin main
