# V10 milestone gate: canonical evidence, preserved V4-V9 behavior, keyboard-only control, reduced-motion phase snapping, accessible trace transcripts, non-color distinctions, exact 2D fallback, Chromium validation, and desktop smoke.
name: Validate Binary Cube V10 accessibility and fallback

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/binary-cube-baseline.yml"
      - "shadowrun-binary-cube-engine.js"
      - "binary-cube-large-grid-ui.js"
      - "shadowrun-binary-cube-encryption.js"
      - "shadowrun-binary-cube-editor.js"
      - "shadowrun-binary-cube-auth.js"
      - "shadowrun-binary-cube-auth-ui.js"
      - "shadowrun-binary-cube-secure-export.js"
      - "binary-cube-visualizer-renderer.js"
      - "shadowrun-binary-cube-visualizer.js"
      - "binary-cube-visualizer.css"
      - "shadowrun-entry.js"
      - "app-lite-view-mounts.js"
      - "blacklight-binary-cube-encryption.html"
      - "desktop/binary-cube/**"
      - "docs/binary-cube-v10-accessibility-checklist.md"
      - "scripts/validate-binary-cube-baseline.mjs"
      - "scripts/validate-binary-cube-trace.mjs"
      - "scripts/validate-binary-cube-visualizer-shell.mjs"
      - "scripts/validate-binary-cube-visualizer-browser.mjs"
      - "scripts/validate-binary-cube-visualizer-step.mjs"
      - "scripts/validate-binary-cube-visualizer-step-browser.mjs"
      - "scripts/validate-binary-cube-visualizer-animation.mjs"
      - "scripts/validate-binary-cube-visualizer-animation-browser.mjs"
      - "scripts/validate-binary-cube-visualizer-encoder.mjs"
      - "scripts/validate-binary-cube-visualizer-encoder-browser.mjs"
      - "scripts/validate-binary-cube-visualizer-sequencing.mjs"
      - "scripts/validate-binary-cube-visualizer-sequencing-browser.mjs"
      - "scripts/validate-binary-cube-visualizer-performance.mjs"
      - "scripts/measure-binary-cube-visualizer-performance.mjs"
      - "scripts/validate-binary-cube-visualizer-performance-browser.mjs"
      - "scripts/validate-binary-cube-visualizer-accessibility.mjs"
      - "scripts/validate-binary-cube-visualizer-accessibility-browser.mjs"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: "binary-cube-baseline-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Record milestone pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=pending \
            -f context='binary-cube/v10-accessibility-fallback' \
            -f description='Binary Cube V10 validation is running.' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Binary Cube JavaScript and V10 evidence
        run: |
          node --check shadowrun-binary-cube-engine.js
          node --check binary-cube-large-grid-ui.js
          node --check shadowrun-binary-cube-encryption.js
          node --check shadowrun-binary-cube-editor.js
          node --check shadowrun-binary-cube-auth.js
          node --check shadowrun-binary-cube-auth-ui.js
          node --check shadowrun-binary-cube-secure-export.js
          node --check binary-cube-visualizer-renderer.js
          node --check shadowrun-binary-cube-visualizer.js
          node --check shadowrun-entry.js
          node --check app-lite-view-mounts.js
          node --check desktop/binary-cube/tests/smoke.cjs
          node --check desktop/binary-cube/scripts/prepare-app.mjs
          node --check scripts/validate-binary-cube-baseline.mjs
          node --check scripts/validate-binary-cube-trace.mjs
          node --check scripts/validate-binary-cube-visualizer-shell.mjs
          node --check scripts/validate-binary-cube-visualizer-browser.mjs
          node --check scripts/validate-binary-cube-visualizer-step.mjs
          node --check scripts/validate-binary-cube-visualizer-step-browser.mjs
          node --check scripts/validate-binary-cube-visualizer-animation.mjs
          node --check scripts/validate-binary-cube-visualizer-animation-browser.mjs
          node --check scripts/validate-binary-cube-visualizer-encoder.mjs
          node --check scripts/validate-binary-cube-visualizer-encoder-browser.mjs
          node --check scripts/validate-binary-cube-visualizer-sequencing.mjs
          node --check scripts/validate-binary-cube-visualizer-sequencing-browser.mjs
          node --check scripts/validate-binary-cube-visualizer-performance.mjs
          node --check scripts/measure-binary-cube-visualizer-performance.mjs
          node --check scripts/validate-binary-cube-visualizer-performance-browser.mjs
          node --check scripts/validate-binary-cube-visualizer-accessibility.mjs
          node --check scripts/validate-binary-cube-visualizer-accessibility-browser.mjs
          test -s docs/binary-cube-v10-accessibility-checklist.md
          mkdir -p binary-cube-gate-logs

      - name: Validate Binary Cube V0 golden evidence against V10
        run: node scripts/validate-binary-cube-baseline.mjs

      - name: Validate Binary Cube V2 immutable transformation traces
        run: node scripts/validate-binary-cube-trace.mjs

      - name: Preserve Binary Cube V4 static shell and renderer isolation
        run: node scripts/validate-binary-cube-visualizer-shell.mjs

      - name: Preserve Binary Cube V4 WebGL face-picking runtime
        id: v4_browser
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/validate-binary-cube-visualizer-browser.mjs 2>&1 | tee binary-cube-gate-logs/v4-browser.log

      - name: Preserve Binary Cube V5 exact manual-step mappings
        id: v5_static
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/validate-binary-cube-visualizer-step.mjs 2>&1 | tee binary-cube-gate-logs/v5-static.log

      - name: Preserve Binary Cube V5 WebGL stepping and inspection
        id: v5_browser
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/validate-binary-cube-visualizer-step-browser.mjs 2>&1 | tee binary-cube-gate-logs/v5-browser.log

      - name: Preserve Binary Cube V6 deterministic trace interpolation
        id: v6_static
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/validate-binary-cube-visualizer-animation.mjs 2>&1 | tee binary-cube-gate-logs/v6-static.log

      - name: Preserve Binary Cube V6 WebGL playback and reverse scrubbing
        id: v6_browser
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/validate-binary-cube-visualizer-animation-browser.mjs 2>&1 | tee binary-cube-gate-logs/v6-browser.log

      - name: Preserve Binary Cube V7 exact package and trace parity
        id: v7_static
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/validate-binary-cube-visualizer-encoder.mjs 2>&1 | tee binary-cube-gate-logs/v7-static.log

      - name: Preserve Binary Cube V7 WebGL encoder and laboratory handoff
        id: v7_browser
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/validate-binary-cube-visualizer-encoder-browser.mjs 2>&1 | tee binary-cube-gate-logs/v7-browser.log

      - name: Preserve Binary Cube V8 exhaustive multi-block mapping
        id: v8_static
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/validate-binary-cube-visualizer-sequencing.mjs 2>&1 | tee binary-cube-gate-logs/v8-static.log

      - name: Preserve Binary Cube V8 Chromium block sequencing and inspection
        id: v8_browser
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/validate-binary-cube-visualizer-sequencing-browser.mjs 2>&1 | tee binary-cube-gate-logs/v8-browser.log

      - name: Preserve Binary Cube V9 rendering-tier policy and isolation
        id: v9_static
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/validate-binary-cube-visualizer-performance.mjs 2>&1 | tee binary-cube-gate-logs/v9-static.log

      - name: Preserve Binary Cube V9 scene and trace measurements
        id: v9_measurements
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/measure-binary-cube-visualizer-performance.mjs 2>&1 | tee binary-cube-gate-logs/v9-measurements.log

      - name: Preserve Binary Cube V9 Chromium scale, quality, and cancellation
        id: v9_browser
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/validate-binary-cube-visualizer-performance-browser.mjs 2>&1 | tee binary-cube-gate-logs/v9-browser.log

      - name: Validate Binary Cube V10 keyboard, transcript, reduced motion, and exact fallback contract
        id: v10_static
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/validate-binary-cube-visualizer-accessibility.mjs 2>&1 | tee binary-cube-gate-logs/v10-static.log

      - name: Validate Binary Cube V10 Chromium accessibility and forced renderer fallback
        id: v10_browser
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/validate-binary-cube-visualizer-accessibility-browser.mjs 2>&1 | tee binary-cube-gate-logs/v10-browser.log

      - name: Validate Binary Cube desktop runtime contract
        id: desktop
        continue-on-error: true
        run: |
          set -o pipefail
          node desktop/binary-cube/tests/smoke.cjs 2>&1 | tee binary-cube-gate-logs/desktop.log

      - name: Retain complete milestone logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: binary-cube-v10-gate-logs
          path: binary-cube-gate-logs
          if-no-files-found: error
          retention-days: 3

      - name: Enforce complete milestone result
        if: ${{ always() }}
        run: |
          failures=''
          [ '${{ steps.v4_browser.outcome }}' = 'success' ] || failures="$failures v4-browser"
          [ '${{ steps.v5_static.outcome }}' = 'success' ] || failures="$failures v5-static"
          [ '${{ steps.v5_browser.outcome }}' = 'success' ] || failures="$failures v5-browser"
          [ '${{ steps.v6_static.outcome }}' = 'success' ] || failures="$failures v6-static"
          [ '${{ steps.v6_browser.outcome }}' = 'success' ] || failures="$failures v6-browser"
          [ '${{ steps.v7_static.outcome }}' = 'success' ] || failures="$failures v7-static"
          [ '${{ steps.v7_browser.outcome }}' = 'success' ] || failures="$failures v7-browser"
          [ '${{ steps.v8_static.outcome }}' = 'success' ] || failures="$failures v8-static"
          [ '${{ steps.v8_browser.outcome }}' = 'success' ] || failures="$failures v8-browser"
          [ '${{ steps.v9_static.outcome }}' = 'success' ] || failures="$failures v9-static"
          [ '${{ steps.v9_measurements.outcome }}' = 'success' ] || failures="$failures v9-measurements"
          [ '${{ steps.v9_browser.outcome }}' = 'success' ] || failures="$failures v9-browser"
          [ '${{ steps.v10_static.outcome }}' = 'success' ] || failures="$failures v10-static"
          [ '${{ steps.v10_browser.outcome }}' = 'success' ] || failures="$failures v10-browser"
          [ '${{ steps.desktop.outcome }}' = 'success' ] || failures="$failures desktop"
          if [ -n "$failures" ]; then
            echo "Binary Cube gate failures:$failures"
            exit 1
          fi

      - name: Record milestone success
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=success \
            -f context='binary-cube/v10-accessibility-fallback' \
            -f description='Binary Cube V10 accessibility and fallback gate passed.' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Record milestone failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=failure \
            -f context='binary-cube/v10-accessibility-fallback' \
            -f description='Binary Cube V10 accessibility and fallback gate failed.' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
