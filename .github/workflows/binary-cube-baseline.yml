# V7 milestone gate: canonical evidence, immutable traces, preserved 3D/step/animation boundaries, exact package encoding, browser round trips, handoff, and desktop smoke.
name: Validate Binary Cube V7 complete encoder

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/binary-cube-baseline.yml"
      - "shadowrun-binary-cube-engine.js"
      - "binary-cube-large-grid-ui.js"
      - "shadowrun-binary-cube-encryption.js"
      - "shadowrun-binary-cube-editor.js"
      - "shadowrun-binary-cube-auth.js"
      - "shadowrun-binary-cube-auth-ui.js"
      - "shadowrun-binary-cube-secure-export.js"
      - "binary-cube-visualizer-renderer.js"
      - "shadowrun-binary-cube-visualizer.js"
      - "binary-cube-visualizer.css"
      - "shadowrun-entry.js"
      - "app-lite-view-mounts.js"
      - "blacklight-binary-cube-encryption.html"
      - "desktop/binary-cube/**"
      - "scripts/validate-binary-cube-baseline.mjs"
      - "scripts/validate-binary-cube-trace.mjs"
      - "scripts/validate-binary-cube-visualizer-shell.mjs"
      - "scripts/validate-binary-cube-visualizer-browser.mjs"
      - "scripts/validate-binary-cube-visualizer-step.mjs"
      - "scripts/validate-binary-cube-visualizer-step-browser.mjs"
      - "scripts/validate-binary-cube-visualizer-animation.mjs"
      - "scripts/validate-binary-cube-visualizer-animation-browser.mjs"
      - "scripts/validate-binary-cube-visualizer-encoder.mjs"
      - "scripts/validate-binary-cube-visualizer-encoder-browser.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "binary-cube-baseline-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Binary Cube JavaScript
        run: |
          node --check shadowrun-binary-cube-engine.js
          node --check binary-cube-large-grid-ui.js
          node --check shadowrun-binary-cube-encryption.js
          node --check shadowrun-binary-cube-editor.js
          node --check shadowrun-binary-cube-auth.js
          node --check shadowrun-binary-cube-auth-ui.js
          node --check shadowrun-binary-cube-secure-export.js
          node --check binary-cube-visualizer-renderer.js
          node --check shadowrun-binary-cube-visualizer.js
          node --check shadowrun-entry.js
          node --check app-lite-view-mounts.js
          node --check desktop/binary-cube/tests/smoke.cjs
          node --check desktop/binary-cube/scripts/prepare-app.mjs
          node --check scripts/validate-binary-cube-baseline.mjs
          node --check scripts/validate-binary-cube-trace.mjs
          node --check scripts/validate-binary-cube-visualizer-shell.mjs
          node --check scripts/validate-binary-cube-visualizer-browser.mjs
          node --check scripts/validate-binary-cube-visualizer-step.mjs
          node --check scripts/validate-binary-cube-visualizer-step-browser.mjs
          node --check scripts/validate-binary-cube-visualizer-animation.mjs
          node --check scripts/validate-binary-cube-visualizer-animation-browser.mjs
          node --check scripts/validate-binary-cube-visualizer-encoder.mjs
          node --check scripts/validate-binary-cube-visualizer-encoder-browser.mjs

      - name: Validate Binary Cube V0 golden evidence against V7
        run: node scripts/validate-binary-cube-baseline.mjs

      - name: Validate Binary Cube V2 immutable transformation traces
        run: node scripts/validate-binary-cube-trace.mjs

      - name: Preserve Binary Cube V4 static shell and renderer isolation
        run: node scripts/validate-binary-cube-visualizer-shell.mjs

      - name: Preserve Binary Cube V4 WebGL face-picking runtime
        run: node scripts/validate-binary-cube-visualizer-browser.mjs

      - name: Preserve Binary Cube V5 exact manual-step mappings
        run: node scripts/validate-binary-cube-visualizer-step.mjs

      - name: Preserve Binary Cube V5 WebGL stepping and inspection
        run: node scripts/validate-binary-cube-visualizer-step-browser.mjs

      - name: Preserve Binary Cube V6 deterministic trace interpolation
        run: node scripts/validate-binary-cube-visualizer-animation.mjs

      - name: Preserve Binary Cube V6 WebGL playback and reverse scrubbing
        run: node scripts/validate-binary-cube-visualizer-animation-browser.mjs

      - name: Validate Binary Cube V7 exact package and trace parity
        run: node scripts/validate-binary-cube-visualizer-encoder.mjs

      - name: Validate Binary Cube V7 WebGL encoder and laboratory handoff
        run: node scripts/validate-binary-cube-visualizer-encoder-browser.mjs

      - name: Validate Binary Cube desktop runtime contract
        run: node desktop/binary-cube/tests/smoke.cjs
