# Temporary guarded correction for V4-V6 CDP synthetic-storage setup return values.
name: Guard Binary Cube synthetic-storage receipt correction

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/binary-cube-baseline.yml"
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: "binary-cube-synthetic-storage-receipt-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Record correction pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=pending \
            -f context='binary-cube/v11-synthetic-storage-receipt' \
            -f description='Binary Cube synthetic-storage receipt correction is running.' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Checkout authoritative main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Return primitive sentinels from synthetic-storage setup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [
              Path('scripts/validate-binary-cube-visualizer-browser.mjs'),
              Path('scripts/validate-binary-cube-visualizer-step-browser.mjs'),
              Path('scripts/validate-binary-cube-visualizer-animation-browser.mjs'),
          ]
          for path in files:
              source = path.read_text()
              old = "clear() { values.clear(); } }; })() });`, 'Install synthetic"
              new = "clear() { values.clear(); } }; })() }); true;`, 'Install synthetic"
              if source.count(old) != 1:
                  raise SystemExit(f'{path}: synthetic-storage setup count was {source.count(old)}, expected 1')
              path.write_text(source.replace(old, new))
          PY

      - name: Check corrected validator syntax
        run: |
          node --check scripts/validate-binary-cube-visualizer-browser.mjs
          node --check scripts/validate-binary-cube-visualizer-step-browser.mjs
          node --check scripts/validate-binary-cube-visualizer-animation-browser.mjs

      - name: Validate V4 WebGL face-picking runtime
        run: node scripts/validate-binary-cube-visualizer-browser.mjs

      - name: Validate V5 WebGL stepping and inspection
        run: node scripts/validate-binary-cube-visualizer-step-browser.mjs

      - name: Validate V6 WebGL playback and reverse scrubbing
        run: node scripts/validate-binary-cube-visualizer-animation-browser.mjs

      - name: Preserve V10 forced renderer fallback
        run: node scripts/validate-binary-cube-visualizer-accessibility-browser.mjs

      - name: Commit validated receipt correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/validate-binary-cube-visualizer-browser.mjs \
            scripts/validate-binary-cube-visualizer-step-browser.mjs \
            scripts/validate-binary-cube-visualizer-animation-browser.mjs
          git diff --cached --quiet && { echo "No synthetic-storage receipt correction was staged." >&2; exit 1; }
          git commit -m "test: return primitive synthetic-storage setup receipts"
          git push origin HEAD:main

      - name: Record correction success
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=success \
            -f context='binary-cube/v11-synthetic-storage-receipt' \
            -f description='Binary Cube synthetic-storage receipt correction passed.' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Record correction failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=failure \
            -f context='binary-cube/v11-synthetic-storage-receipt' \
            -f description='Binary Cube synthetic-storage receipt correction failed.' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
