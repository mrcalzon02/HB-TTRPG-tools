# Temporary guarded repair on the established Binary Cube workflow path.
name: Guard Binary Cube V11 optional-storage repair

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/binary-cube-baseline.yml"
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: "binary-cube-v11-storage-repair-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Record repair pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=pending \
            -f context='binary-cube/v11-optional-storage-repair' \
            -f description='Binary Cube V11 optional-storage repair is running.' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Checkout authoritative main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Repair optional visualizer storage access directly
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('shadowrun-binary-cube-visualizer.js')
          source = path.read_text()
          old = '''  function saveVisualizerState(panel) {
            if (restoringStoredState || !panel || !root?.localStorage) return false;
            try {
              const state = {
                format: VISUALIZER_STATE_FORMAT,
                schemaVersion: VISUALIZER_STATE_SCHEMA_VERSION,
                key: cloneJson(activeKey),
                bits: panel.querySelector('[data-cube-trace-bits]')?.value?.replace(/\\s+/g, '') || '',
                sourceFileName,
                transportKind: activeTransportKind,
                transportDocument: packageDocumentForDisplay(),
                preferences: { reducedMotion, displayMode, renderQuality, playbackSpeed, playbackScope }
              };
              root.localStorage.setItem(visualizerStorageKey(), JSON.stringify(state));
              return true;
            } catch (_) {
              return false;
            }
          }

          function readStoredVisualizerState() {
            if (!root?.localStorage) return null;
            const currentKey = visualizerStorageKey();
            let parsed = null;
            let migratedFrom = null;
            try {
              const current = root.localStorage.getItem(currentKey);
              if (current) parsed = JSON.parse(current);
              if (!parsed) {
                for (const legacyKey of LEGACY_VISUALIZER_STORAGE_KEYS) {
                  const legacy = root.localStorage.getItem(legacyKey);
                  if (!legacy) continue;
                  parsed = JSON.parse(legacy);
                  migratedFrom = legacyKey;
                  break;
                }
              }
              const migrated = migrateVisualizerState(parsed);
              if (!migrated) return null;
              root.localStorage.setItem(currentKey, JSON.stringify(migrated));
              if (migratedFrom) root.localStorage.removeItem(migratedFrom);
              return migrated;
            } catch (_) {
              root.localStorage.removeItem(currentKey);
              return null;
            }
          }
'''
          new = '''  function optionalVisualizerStorage() {
            try { return root?.localStorage || null; }
            catch (_) { return null; }
          }

          function saveVisualizerState(panel) {
            const storage = optionalVisualizerStorage();
            if (restoringStoredState || !panel || !storage) return false;
            try {
              const state = {
                format: VISUALIZER_STATE_FORMAT,
                schemaVersion: VISUALIZER_STATE_SCHEMA_VERSION,
                key: cloneJson(activeKey),
                bits: panel.querySelector('[data-cube-trace-bits]')?.value?.replace(/\\s+/g, '') || '',
                sourceFileName,
                transportKind: activeTransportKind,
                transportDocument: packageDocumentForDisplay(),
                preferences: { reducedMotion, displayMode, renderQuality, playbackSpeed, playbackScope }
              };
              storage.setItem(visualizerStorageKey(), JSON.stringify(state));
              return true;
            } catch (_) {
              return false;
            }
          }

          function readStoredVisualizerState() {
            const storage = optionalVisualizerStorage();
            if (!storage) return null;
            const currentKey = visualizerStorageKey();
            let parsed = null;
            let migratedFrom = null;
            try {
              const current = storage.getItem(currentKey);
              if (current) parsed = JSON.parse(current);
              if (!parsed) {
                for (const legacyKey of LEGACY_VISUALIZER_STORAGE_KEYS) {
                  const legacy = storage.getItem(legacyKey);
                  if (!legacy) continue;
                  parsed = JSON.parse(legacy);
                  migratedFrom = legacyKey;
                  break;
                }
              }
              const migrated = migrateVisualizerState(parsed);
              if (!migrated) return null;
              storage.setItem(currentKey, JSON.stringify(migrated));
              if (migratedFrom) storage.removeItem(migratedFrom);
              return migrated;
            } catch (_) {
              try { storage.removeItem(currentKey); } catch (_) { /* Optional storage. */ }
              return null;
            }
          }
'''
          if source.count(old) != 1:
              raise SystemExit(f'optional storage source block count was {source.count(old)}, expected 1')
          source = source.replace(old, new)
          catch_old = "    } catch (_) {\n      try { root.localStorage.removeItem(visualizerStorageKey()); } catch (_) { /* Optional storage. */ }\n      return false;\n"
          catch_new = "    } catch (_) {\n      try { optionalVisualizerStorage()?.removeItem(visualizerStorageKey()); } catch (_) { /* Optional storage. */ }\n      return false;\n"
          if source.count(catch_old) != 1:
              raise SystemExit(f'restore storage cleanup count was {source.count(catch_old)}, expected 1')
          path.write_text(source.replace(catch_old, catch_new))
          PY

      - name: Check repaired controller syntax
        run: node --check shadowrun-binary-cube-visualizer.js

      - name: Preserve V0 golden evidence
        run: node scripts/validate-binary-cube-baseline.mjs

      - name: Validate V4 opaque-origin WebGL runtime
        run: node scripts/validate-binary-cube-visualizer-browser.mjs

      - name: Validate V5 opaque-origin stepping runtime
        run: node scripts/validate-binary-cube-visualizer-step-browser.mjs

      - name: Validate V6 opaque-origin animation runtime
        run: node scripts/validate-binary-cube-visualizer-animation-browser.mjs

      - name: Preserve V10 forced fallback runtime
        run: node scripts/validate-binary-cube-visualizer-accessibility-browser.mjs

      - name: Preserve V11 static compatibility contract
        run: node scripts/validate-binary-cube-visualizer-compatibility.mjs

      - name: Preserve V11 Chromium security and storage contract
        run: node scripts/validate-binary-cube-visualizer-compatibility-browser.mjs

      - name: Preserve desktop runtime contract
        run: node desktop/binary-cube/tests/smoke.cjs

      - name: Commit validated optional-storage repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shadowrun-binary-cube-visualizer.js
          git diff --cached --quiet && { echo "No optional-storage repair was staged." >&2; exit 1; }
          git commit -m "fix: guard Binary Cube optional storage access"
          git push origin HEAD:main

      - name: Record repair success
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=success \
            -f context='binary-cube/v11-optional-storage-repair' \
            -f description='Binary Cube V11 optional-storage repair passed.' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Record repair failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=failure \
            -f context='binary-cube/v11-optional-storage-repair' \
            -f description='Binary Cube V11 optional-storage repair failed.' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
