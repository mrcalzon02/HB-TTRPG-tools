name: Align Binary Cube V5-V7 validators with V9

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/binary-cube-v9-compatibility-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply compatibility assertions
        run: python scripts/.temporary-v9-compatibility.py
      - name: Validate preserved V5 through V7 boundaries
        run: |
          set -o pipefail
          node --check scripts/validate-binary-cube-visualizer-step.mjs
          node --check scripts/validate-binary-cube-visualizer-step-browser.mjs
          node --check scripts/validate-binary-cube-visualizer-animation.mjs
          node --check scripts/validate-binary-cube-visualizer-animation-browser.mjs
          node --check scripts/validate-binary-cube-visualizer-encoder.mjs
          node --check scripts/validate-binary-cube-visualizer-encoder-browser.mjs
          node scripts/validate-binary-cube-visualizer-step.mjs
          node scripts/validate-binary-cube-visualizer-step-browser.mjs
          node scripts/validate-binary-cube-visualizer-animation.mjs
          node scripts/validate-binary-cube-visualizer-animation-browser.mjs
          node scripts/validate-binary-cube-visualizer-encoder.mjs
          node scripts/validate-binary-cube-visualizer-encoder-browser.mjs
          git diff --check
      - name: Commit validator alignment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/validate-binary-cube-visualizer-step.mjs \
            scripts/validate-binary-cube-visualizer-step-browser.mjs \
            scripts/validate-binary-cube-visualizer-animation.mjs \
            scripts/validate-binary-cube-visualizer-animation-browser.mjs \
            scripts/validate-binary-cube-visualizer-encoder.mjs \
            scripts/validate-binary-cube-visualizer-encoder-browser.mjs
          git commit -m 'test: preserve Binary Cube V5-V7 boundaries under V9 [skip ci]'
          git push origin HEAD:main
