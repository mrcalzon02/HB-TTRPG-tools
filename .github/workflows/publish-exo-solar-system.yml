name: Publish EXO solar system generator

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-exo-solar-system.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Assemble generator and activate EXO route
        shell: bash
        run: |
          cat .github/exo-js-part-1.txt .github/exo-js-part-2.txt .github/exo-js-part-3.txt > blacklight-exo-solar-system.js
          node --check blacklight-exo-solar-system.js
          python - <<'PY'
          from pathlib import Path

          path = Path('blacklight-exo-operations.html')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  '    .exo-notice{border-left:3px solid rgba(217,168,79,.76);background:rgba(217,168,79,.075);padding:14px 16px;border-radius:12px;color:#d9d1c0;line-height:1.6}',
                  '    .exo-notice{border-left:3px solid rgba(217,168,79,.76);background:rgba(217,168,79,.075);padding:14px 16px;border-radius:12px;color:#d9d1c0;line-height:1.6}\n    .exo-active-card::after{content:"ACTIVE";color:rgba(126,214,155,.32)}'
              ),
              (
                  '      <div class="bli-actions"><a class="bli-action primary" href="#generator-framework">Open Generator Framework</a><a class="bli-action" href="blacklight-systems-black.html">Return to Black Archive</a></div>',
                  '      <div class="bli-actions"><a class="bli-action primary" href="blacklight-exo-solar-system.html">Open Solar System Generator</a><a class="bli-action" href="#generator-framework">Open Generator Framework</a><a class="bli-action" href="blacklight-systems-black.html">Return to Black Archive</a></div>'
              ),
              (
                  '<div class="bli-directory-item" role="listitem"><strong>Framework</strong><span class="bli-arrow">staged</span></div>',
                  '<div class="bli-directory-item" role="listitem"><strong>Framework</strong><span class="bli-arrow">active</span></div>'
              ),
              (
                  '<div class="bli-directory-item" role="listitem"><strong>Generators</strong><span class="bli-arrow">pending</span></div>',
                  '<div class="bli-directory-item" role="listitem"><strong>Generators</strong><span class="bli-arrow">1 active</span></div>'
              ),
              (
                  '<p><span class="exo-status">Framework initialized</span></p>',
                  '<p><span class="exo-status">Orbital generator active</span></p>'
              ),
              (
                  '<article class="bli-card exo-framework-card"><h3>Solar System Generator</h3><p>Star classification, planetary count, orbital architecture, resource index, orbital projection, selectable planetary records, moons, belts, hazards, and system-scale points of interest.</p><div class="exo-meta"><span>primary framework</span><span>orbital display</span><span>planet sidebar</span></div></article>',
                  '<article class="bli-card exo-framework-card exo-active-card"><h3>Solar System Generator</h3><p>Generate seeded random stellar systems with animated orbital rails, selectable star and planet records, planetary classes, moons, rings, atmospheres, biosphere and civilization signals, hazards, debris belts, and a system resource index.</p><div class="exo-meta"><span>active generator</span><span>orbital display</span><span>planet inspector</span></div><div class="bli-actions"><a class="bli-action primary" href="blacklight-exo-solar-system.html">Open Solar System Generator</a></div></article>'
              )
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected source fragment missing: {old[:100]}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          for temporary in [
              Path('.github/exo-js-part-1.txt'),
              Path('.github/exo-js-part-2.txt'),
              Path('.github/exo-js-part-3.txt'),
              Path('.github/workflows/publish-exo-solar-system.yml')
          ]:
              temporary.unlink(missing_ok=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Activate EXO solar system generator [skip ci]"
          git push origin main
