name: Apply EXO Crew control physicality audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-exo-control-physicality-audit.yml'
      - 'scripts/apply-exo-control-physicality-audit.py'

permissions:
  contents: write

concurrency:
  group: apply-exo-control-physicality-audit
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase onto current main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Apply full Crew control physicality audit
        run: python3 scripts/apply-exo-control-physicality-audit.py
      - name: Validate JavaScript and physical classifications
        run: |
          node --check blacklight-exo-crew-operations.js
          test "$(grep -c 'physical:"' blacklight-exo-crew-operations.js)" -ge 44
          grep -q 'physical-spring-transmit-key' blacklight-exo-crew-operations.css
          grep -q 'physical-coolant-handwheel' blacklight-exo-crew-operations.css
          grep -q 'physical-weapon-bank-selector' blacklight-exo-crew-operations.css
          grep -q 'data-control-physical' blacklight-exo-crew-operations.js
      - name: Commit directly to main and remove one-shot tooling
        run: |
          rm -f scripts/apply-exo-control-physicality-audit.py .github/workflows/apply-exo-control-physicality-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: audit and specialize all Crew control hardware"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
