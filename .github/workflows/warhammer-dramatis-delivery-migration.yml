name: One-shot Warhammer Dramatis Delivery Seal

on:
  push:
    branches: [main]
    paths:
      - 'scripts/seal-warhammer-dramatis-delivery.js'
      - '.github/workflows/warhammer-dramatis-delivery-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Re-anchor to current main
        run: git pull --rebase origin main
      - name: Apply verified delivery seal
        run: node scripts/seal-warhammer-dramatis-delivery.js
      - name: Remove one-shot migration mechanism
        run: rm scripts/seal-warhammer-dramatis-delivery.js .github/workflows/warhammer-dramatis-delivery-migration.yml
      - name: Commit authoritative delivery changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add warhammer-40k-workspace-v8.js app-lite-view-mounts.js warhammer-40k-map.html scripts/seal-warhammer-dramatis-delivery.js .github/workflows/warhammer-dramatis-delivery-migration.yml
          git diff --cached --check
          git commit -m 'chore: expose chronicle Dramatis Personae on both Warhammer routes'
          git push origin HEAD:main
