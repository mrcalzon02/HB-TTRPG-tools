name: Consolidate Veteran Stage Media

on:
  push:
    branches:
      - main
    paths:
      - scripts/consolidate-veteran-stage-media.mjs
      - .github/workflows/consolidate-veteran-stage-media.yml

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Consolidate veteran stage media
        run: node scripts/consolidate-veteran-stage-media.mjs

      - name: Validate repository changes
        run: |
          git diff --check
          test ! -f blacklight-veteran-stage-illustrations.js
          ! grep -q 'blacklight-veteran-stage-illustrations.js' blacklight-veteran-reintroduction.html
          grep -q 'renderStageMedia(entry)' blacklight-veteran-reintroduction.js
          grep -q 'attachStageMediaListeners();' blacklight-veteran-reintroduction.js
          grep -q '.veteran-scene-figure{' blacklight-veteran-reintroduction.css

      - name: Commit consolidated renderer
        run: |
          if git diff --quiet; then
            echo 'No stage-media consolidation changes were produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate veteran stage media into canonical renderer'
          git push origin HEAD:main
