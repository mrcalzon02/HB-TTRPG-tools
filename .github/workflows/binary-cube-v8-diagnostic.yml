# Refreshes the latest guarded V8 patch failure with reverse-sequence state.
name: Capture guarded Binary Cube V8 patch failure

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/binary-cube-v8-diagnostic.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture latest guarded patch failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list --repo "${{ github.repository }}" --workflow binary-cube-v8-patch-runner.yml --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$run_id"
          mkdir -p docs/diagnostics
          {
            echo "run_id=$run_id"
            gh run view "$run_id" --repo "${{ github.repository }}" --json status,conclusion,url,headSha,workflowName
            echo
            gh run view "$run_id" --repo "${{ github.repository }}" --log-failed
          } > docs/diagnostics/binary-cube-v8-patch-failure.txt
      - name: Commit diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/diagnostics/binary-cube-v8-patch-failure.txt
          git commit -m 'chore: refresh Binary Cube V8 reverse diagnostic [skip ci]'
          git push origin HEAD:main
