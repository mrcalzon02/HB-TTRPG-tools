name: Validate immediate Eldritch Depth resolution

on:
  push:
    paths:
      - .github/workflows/one-time-immediate-depth-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate immediate resolution standard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/blacklight-continuum/rules/eldritch-binding-sources.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          catalog = next(item for item in data['catalogs'] if item['id'] == 'binding-sources')
          abilities = [step for source in catalog['variants'] for step in source['progression']]

          assert data['schemaVersion'] == '1.2.0'
          assert len(abilities) == 30
          assert all(step.get('effect') for step in abilities)
          standard = data['selectionRules']['depthResolutionStandard']
          for phrase in ('resolves when it is activated', 'cannot create an unspent token', 'All choices, tests, targets, and primary outcomes are determined during activation'):
              assert phrase in standard

          prohibited = [
              'contradiction token',
              'spend the token',
              'before scene end',
              'before operation end',
              'on the next action',
              'on your next action',
              'on the next test',
              'on your next test',
              'the first action that',
              'the first test that',
              'during the scene you may use',
              'gain two dice on the first',
              'gain one die on the first',
              'at the start of each of your turns choose',
              'create one research',
              'promised clue',
          ]
          combined = '\n'.join(step['effect'].lower() for step in abilities)
          for phrase in prohibited:
              assert phrase not in combined, phrase

          # Persistent effects are legal only when their effect and duration begin immediately.
          for step in abilities:
              text = step['effect']
              assert ('Action:' in text or 'Trigger:' in text or 'Passive while conscious.' in text)
              if 'Duration:' in text or ' until ' in text.lower() or ' for three rounds' in text.lower():
                  assert not any(phrase in text.lower() for phrase in ('activate later', 'choose later', 'resolve later'))

          expected_immediate = {
              ('void-mind', 'Depth 3'): 'immediately receive one specific fact',
              ('void-mind', 'Depth 5'): 'Immediately receive one truthful sentence',
              ('abyssal-womb', 'Depth 4'): 'immediately performs one selected profile',
              ('abyssal-womb', 'Depth 5'): 'Immediately choose up to five different effects',
              ('that-which-hungers', 'Depth 5'): 'Immediately spend those points',
              ('lidless-eye', 'Depth 2'): 'Immediately learn all five facts',
          }
          for source in catalog['variants']:
              for step in source['progression']:
                  key = (source['id'], step['stage'])
                  if key in expected_immediate:
                      assert expected_immediate[key] in step['effect'], key
          PY
      - name: Remove validation workflow
        run: rm .github/workflows/one-time-immediate-depth-validation.yml
      - name: Commit validation cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Validate immediate Eldritch Depth resolution"
          git push origin main
