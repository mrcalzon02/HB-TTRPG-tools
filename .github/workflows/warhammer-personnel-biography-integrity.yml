name: Warhammer Personnel Biography Integrity

on:
  push:
    branches: [main]
    paths:
      - 'assets/warhammer-40k/imperial-logistics-v1.js'
      - 'assets/warhammer-40k/imperial-vessel-history-v1.js'
      - 'assets/warhammer-40k/imperial-orbital-infrastructure-v1.js'
      - 'assets/warhammer-40k/imperial-personnel-lineage-v1.js'
      - 'assets/warhammer-40k/imperial-medicae-catalog-v1.js'
      - 'assets/warhammer-40k/imperial-medicae-institutions-v1.js'
      - 'tests/warhammer-personnel-biography-integrity.test.js'
      - '.github/workflows/warhammer-personnel-biography-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check assets/warhammer-40k/imperial-personnel-lineage-v1.js
          node --check assets/warhammer-40k/imperial-medicae-institutions-v1.js
      - name: Validate personnel, biography and Medicae registers
        run: node tests/warhammer-personnel-biography-integrity.test.js
