name: NUTBUSTER Remote Voice Production

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/nutbuster-remote-voice.yml
      - tools/voicebox/references/Sphinx-of-Black-Quartz-Judge-my-Vow.mp3
  workflow_dispatch:
    inputs:
      scope:
        description: Six preview lines or all 74 original-announcer additions
        type: choice
        required: true
        default: all
        options: [all, preview]

permissions:
  contents: read

concurrency:
  group: nutbuster-remote-owner-voice
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout HBTTRPG voice tools
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout public NUTBUSTER narration scripts
        uses: actions/checkout@v4
        with:
          repository: mrcalzon02/NUTBUSTER-R
          ref: main
          path: input/nutbuster
          persist-credentials: false
      - name: Install FFmpeg on temporary GitHub runner
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -n 1
      - name: Prepare one spoken source recording (no game effects or grunts)
        shell: bash
        run: |
          test -s tools/voicebox/references/Sphinx-of-Black-Quartz-Judge-my-Vow.mp3
          echo "ce4c621e3587b9a7f6fd1b6237433f779fa4b8ffb1bae4154ae6739da0362cd2  tools/voicebox/references/Sphinx-of-Black-Quartz-Judge-my-Vow.mp3" | sha256sum -c -
          ffmpeg -nostdin -hide_banner -loglevel error -y \
            -i tools/voicebox/references/Sphinx-of-Black-Quartz-Judge-my-Vow.mp3 \
            -ac 1 -ar 24000 -c:a pcm_s16le "$RUNNER_TEMP/reference.wav"
          ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 "$RUNNER_TEMP/reference.wav"
          python3 tools/voicebox/remote_luxtts_nutbuster.py \
            --nutbuster input/nutbuster --reference "$RUNNER_TEMP/reference.wav" \
            --out "$RUNNER_TEMP/unused" --scope all --validate
      - name: Setup temporary GitHub-hosted Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only LuxTTS on GitHub-hosted runner
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          git clone --depth 1 https://github.com/ysharma3501/LuxTTS.git "$RUNNER_TEMP/luxtts"
          python -m pip install -r "$RUNNER_TEMP/luxtts/requirements.txt" soundfile
          PYTHONPATH="$RUNNER_TEMP/luxtts" python -c "from zipvoice.luxvoice import LuxTTS; print('LuxTTS import succeeded')"
      - name: Generate original-announcer voice lines
        shell: bash
        env:
          PYTHONPATH: ${{ runner.temp }}/luxtts
          SCOPE: ${{ inputs.scope || 'all' }}
        run: |
          python tools/voicebox/remote_luxtts_nutbuster.py \
            --nutbuster input/nutbuster --reference "$RUNNER_TEMP/reference.wav" \
            --out "$RUNNER_TEMP/rendered" --scope "$SCOPE"
          test -s "$RUNNER_TEMP/nutbuster-voice-review.zip"
      - name: Publish sound files as downloadable GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: NUTBUSTER-Voice-Sound-Files
          path: ${{ runner.temp }}/nutbuster-voice-review.zip
          if-no-files-found: error
          retention-days: 30
      - name: Clean up temporary audio
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/reference.wav" "$RUNNER_TEMP/rendered" \
            "$RUNNER_TEMP/nutbuster-voice-review.zip" "$RUNNER_TEMP/luxtts"
