name: NUTBUSTER Remote Voice Production

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/nutbuster-remote-voice.yml
      - tools/voicebox/references/Sphinx-of-Black-Quartz-Judge-my-Vow.mp3
      - tools/voicebox/remote_luxtts_nutbuster.py
      - tools/voicebox/tests/test_playback_boundaries.py
      - tools/voicebox/tests/test_missing_phonemes.py
      - tools/voicebox/tests/test_spurious_prefix.py
      - tools/voicebox/tests/test_spoken_numbers.py
      - tools/voicebox/tests/test_partial_production.py
      - tools/voicebox/retry_failed_nutbuster.py
      - tools/voicebox/tests/test_retry_failed_nutbuster.py
      - tools/voicebox/tests/test_intro_marker.py
  workflow_dispatch:
    inputs:
      scope:
        description: Six preview lines or all 74 original-announcer additions
        type: choice
        required: true
        default: all
        options: [all, preview]

permissions:
  contents: read
  actions: read

concurrency:
  group: nutbuster-remote-owner-voice
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout HBTTRPG voice tools
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout public NUTBUSTER narration scripts
        uses: actions/checkout@v4
        with:
          repository: mrcalzon02/NUTBUSTER-R
          ref: main
          path: input/nutbuster
          persist-credentials: false
      - name: Verify 73 approved and 1 rejected for retry
        shell: bash
        run: |
          python3 -m unittest discover -s tools/voicebox/tests -p 'test_retry_failed_nutbuster.py' -v
      - name: Verify rejected cues cannot discard successful recordings
        shell: bash
        run: |
          python3 -m unittest discover -s tools/voicebox/tests -p 'test_partial_production.py' -v
      - name: Install FFmpeg on temporary GitHub runner
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -n 1
      - name: Prepare one spoken source recording (no game effects or grunts)
        shell: bash
        run: |
          test -s tools/voicebox/references/Sphinx-of-Black-Quartz-Judge-my-Vow.mp3
          echo "ce4c621e3587b9a7f6fd1b6237433f779fa4b8ffb1bae4154ae6739da0362cd2  tools/voicebox/references/Sphinx-of-Black-Quartz-Judge-my-Vow.mp3" | sha256sum -c -
          ffmpeg -nostdin -hide_banner -loglevel error -y \
            -i tools/voicebox/references/Sphinx-of-Black-Quartz-Judge-my-Vow.mp3 \
            -ac 1 -ar 24000 -c:a pcm_s16le "$RUNNER_TEMP/reference.wav"
          ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 "$RUNNER_TEMP/reference.wav"
          python3 tools/voicebox/remote_luxtts_nutbuster.py \
            --nutbuster input/nutbuster --reference "$RUNNER_TEMP/reference.wav" \
            --out "$RUNNER_TEMP/unused" --scope all --validate
      - name: Setup temporary GitHub-hosted Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only LuxTTS on GitHub-hosted runner
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          git clone --depth 1 https://github.com/ysharma3501/LuxTTS.git "$RUNNER_TEMP/luxtts"
          python -m pip install -r "$RUNNER_TEMP/luxtts/requirements.txt" soundfile
          PYTHONPATH="$RUNNER_TEMP/luxtts" python -c "from zipvoice.luxvoice import LuxTTS; print('LuxTTS import succeeded')"
      - name: Verify start and end audio margins before generating voice
        shell: bash
        env:
          PYTHONPATH: ${{ runner.temp }}/luxtts
        run: |
          python -m unittest discover -s tools/voicebox/tests -p 'test_playback_boundaries.py' -v
      - name: Verify missing-word recognition and QA gates
        shell: bash
        env:
          PYTHONPATH: ${{ runner.temp }}/luxtts
        run: |
          python -m unittest discover -s tools/voicebox/tests -p 'test_missing_phonemes.py' -v
      - name: Verify unwanted opening word correction
        shell: bash
        env:
          PYTHONPATH: ${{ runner.temp }}/luxtts
        run: |
          python -m unittest discover -s tools/voicebox/tests -p 'test_spurious_prefix.py' -v
      - name: Verify spoken-digit equivalent checks
        shell: bash
        env:
          PYTHONPATH: ${{ runner.temp }}/luxtts
        run: |
          python -m unittest discover -s tools/voicebox/tests -p 'test_spoken_numbers.py' -v
      - name: Retrieve previous approved audio and rejected IDs from run 40173559594
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/base-artifact"
          gh run download 40177319678 --repo "$GITHUB_REPOSITORY" \
            --name NUTBUSTER-74-Retry3-Merged-WAVs --dir "$RUNNER_TEMP/base-artifact"
          test -s "$RUNNER_TEMP/base-artifact/nutbuster-voice-review.zip"
      - name: Verify word-timed setup phrase removal
        shell: bash
        env:
          PYTHONPATH: ${{ runner.temp }}/luxtts
        run: |
          python -m unittest discover -s tools/voicebox/tests -p 'test_intro_marker.py' -v
      - name: Generate ONLY final fish-common cue and preserve 73
        shell: bash
        env:
          PYTHONPATH: ${{ runner.temp }}/luxtts
          SCOPE: ${{ inputs.scope || 'all' }}
        run: |
          python tools/voicebox/retry_failed_nutbuster.py \
            --base-archive "$RUNNER_TEMP/base-artifact/nutbuster-voice-review.zip" \
            --nutbuster input/nutbuster --reference "$RUNNER_TEMP/reference.wav" \
            --out "$RUNNER_TEMP/rendered"
          test -s "$RUNNER_TEMP/nutbuster-voice-review.zip"
      - name: Summarize verified recordings and lines requiring retry
        shell: bash
        run: |
          export REVIEW_DIR="$RUNNER_TEMP/rendered"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads((Path(os.environ["REVIEW_DIR"])/"manifest.json").read_text())
          line=("Narration QA: %s/%s verified, %s rejected; status=%s" %
                (data["verifiedCount"],data["requestedLineCount"],
                 data["failedCount"],data["status"]))
          print(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out:
              out.write("### "+line+"\n")
              if data["failedCount"]:
                  out.write("Rejected cues: "+", ".join(x["key"] for x in data["failedTakes"])+"\n")
          if data["failedCount"]:
              print("::warning::Some cues failed voice QA; verified recordings and a retry list have been preserved")
          PY
      - name: Publish sound files as downloadable GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: NUTBUSTER-74-Final-Fish-Cue
          path: ${{ runner.temp }}/nutbuster-voice-review.zip
          if-no-files-found: error
          retention-days: 30
      - name: Clean up temporary audio
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/reference.wav" "$RUNNER_TEMP/rendered" \
            "$RUNNER_TEMP/nutbuster-voice-review.zip" "$RUNNER_TEMP/base-artifact" \
            "$RUNNER_TEMP/luxtts"
