name: Integrate character sheet library

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/integrate-character-sheet-library.yml'
      - 'scripts/publish-character-sheet-library.mjs'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate library
        run: node scripts/publish-character-sheet-library.mjs
      - name: Remove one-time integration files
        run: rm -f scripts/publish-character-sheet-library.mjs .github/workflows/integrate-character-sheet-library.yml
      - name: Commit integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Connect character sheet library to Utilities [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
