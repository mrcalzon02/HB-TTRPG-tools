name: Inspect Binary Cube V9 fallback patch guard

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/binary-cube-v9-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture fallback guard context
        run: |
          mkdir -p docs/diagnostics
          base64 -d scripts/.temporary-v9-controller.py.gz.b64 | gzip -d > /tmp/v9-controller.py
          {
            echo 'PATCH CONTEXT'
            grep -n -B 8 -A 8 'controller fallback version' /tmp/v9-controller.py || true
            echo
            echo 'CURRENT CONTROLLER CONTEXT'
            grep -n -B 3 -A 3 'cannot display the V' shadowrun-binary-cube-visualizer.js || true
          } > docs/diagnostics/binary-cube-v9-fallback-guard.txt
      - name: Commit diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/diagnostics/binary-cube-v9-fallback-guard.txt
          git commit -m 'chore: inspect Binary Cube V9 fallback patch guard [skip ci]'
          git push origin HEAD:main
