name: Apply occupied-deck spatial connectivity fix

on:
  push:
    paths:
      - 'scripts/apply_spatial_occupied_deck_fix.py'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply guarded authoritative patch
        run: python scripts/apply_spatial_occupied_deck_fix.py
      - name: Validate complete spatial stack
        run: |
          node tests/spatial-engine.test.js
          node tests/site-profile-layers.test.js
          node tests/site-history-interactions.test.js
          node tests/spatial-connector-normalization.test.js
      - name: Commit authoritative fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add semantic-spatial-engine.js tests/spatial-connector-normalization.test.js
          git commit -m 'Connect consecutive occupied spatial decks'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:main; then exit 0; fi
            test "$attempt" -lt 5 || exit 1
            sleep 2
          done
