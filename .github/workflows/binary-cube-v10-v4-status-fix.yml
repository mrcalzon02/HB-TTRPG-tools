name: Align Binary Cube V4 status validator with V10

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/binary-cube-v10-v4-status-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Align and validate V4 browser status assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/validate-binary-cube-visualizer-browser.mjs')
          source = path.read_text(encoding='utf-8')
          anchor = "    if (JSON.stringify(generated.legalOutputFaces) !== JSON.stringify(['top', 'bottom', 'left', 'right'])) throw new Error('Legal output-face enforcement changed.');"
          replacement = anchor + "\n    const generatedStatus = panel.querySelector('[data-cube-visualizer-status]').textContent;\n    if (!/Generated canonical key/.test(generatedStatus) || !/encoding remains exact/i.test(generatedStatus)) throw new Error('The generated canonical-key acceptance and exact-encoding status was not reported.');"
          if source.count(anchor) != 1:
              raise SystemExit(f'Expected one generated-key status anchor, found {source.count(anchor)}.')
          source = source.replace(anchor, replacement, 1)
          obsolete = "    const status = panel.querySelector('[data-cube-visualizer-status]').textContent;\n    if (!/Generated canonical key/.test(status)) throw new Error('The generated directional scene status was not reported.');\n"
          if source.count(obsolete) != 1:
              raise SystemExit(f'Expected one obsolete post-camera status assertion, found {source.count(obsolete)}.')
          path.write_text(source.replace(obsolete, '', 1), encoding='utf-8')
          PY
          node --check scripts/validate-binary-cube-visualizer-browser.mjs
          node scripts/validate-binary-cube-visualizer-browser.mjs
          git diff --check
      - name: Commit aligned validator
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/validate-binary-cube-visualizer-browser.mjs
          git commit -m 'test: preserve Binary Cube V4 status boundary under V10'
          git push origin HEAD:main
