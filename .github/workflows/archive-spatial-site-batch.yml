name: Archive spatial site generator batch

on:
  push:
    paths:
      - 'scripts/archive_spatial_site_batch.mjs'
      - 'semantic-spatial-engine.js'
      - 'module-map-generator.js'
      - 'tests/spatial-connector-normalization.test.js'
      - 'tests/site-interaction-quality-regressions.test.js'
      - 'scripts/.run-spatial-batch-trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spatial-site-batch-archive
  cancel-in-progress: false

env:
  BATCH_ID: 2026-08-22-purpose-aware-variety-03-history-deepened

jobs:
  archive-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run spatial regressions into durable scratch evidence
        shell: bash
        run: |
          set +e
          OUT='/tmp/spatial-validation'
          rm -rf "$OUT"
          mkdir -p "$OUT"
          status=0
          : > "$OUT/test-status.tsv"
          for test in \
            tests/spatial-engine.test.js \
            tests/site-profile-layers.test.js \
            tests/site-history-interactions.test.js \
            tests/spatial-connector-normalization.test.js \
            tests/site-interaction-quality-regressions.test.js
          do
            name="$(basename "$test" .js)"
            node "$test" > "$OUT/$name.txt" 2>&1
            rc=$?
            printf '%s\t%s\n' "$test" "$rc" >> "$OUT/test-status.tsv"
            cat "$OUT/$name.txt"
            if [ "$rc" -ne 0 ]; then status=1; fi
          done
          printf '%s\n' "$status" > "$OUT/regression-status"
          echo "REGRESSION_STATUS=$status" >> "$GITHUB_ENV"
          exit 0

      - name: Generate archived batch
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set +e
          node scripts/archive_spatial_site_batch.mjs > /tmp/spatial-batch.txt 2>&1
          rc=$?
          cat /tmp/spatial-batch.txt
          echo "BATCH_STATUS=$rc" >> "$GITHUB_ENV"
          exit 0

      - name: Merge validation evidence after batch output exists
        shell: bash
        run: |
          set -euo pipefail
          OUT="artifacts/spatial-site-batch/$BATCH_ID/validation"
          mkdir -p "$OUT"
          cp /tmp/spatial-validation/test-status.tsv "$OUT/test-status.tsv"
          cp /tmp/spatial-validation/*.txt "$OUT/"
          cp /tmp/spatial-validation/regression-status "$OUT/regression-status.txt"
          cp /tmp/spatial-batch.txt "$OUT/batch-runner.txt"

      - name: Record workflow outcome
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const dir=path.join('artifacts','spatial-site-batch',process.env.BATCH_ID,'validation');
          const tests=fs.readFileSync(path.join(dir,'test-status.tsv'),'utf8').trim().split(/\n/).filter(Boolean).map(line=>{const [test,exitCode]=line.split('\t');return{test,exitCode:Number(exitCode),ok:Number(exitCode)===0};});
          const regressionStatus=Number(fs.readFileSync(path.join(dir,'regression-status.txt'),'utf8').trim());
          const batchStatus=Number(process.env.BATCH_STATUS||1);
          const outcome={schemaVersion:'1.2.0',recordType:'spatial-site-batch-workflow-outcome',batchId:process.env.BATCH_ID,sourceCommit:process.env.GITHUB_SHA,regressionStatus,batchStatus,tests,ok:regressionStatus===0&&batchStatus===0};
          fs.writeFileSync(path.join(dir,'workflow-outcome.json'),JSON.stringify(outcome,null,2)+'\n');
          console.log(JSON.stringify(outcome,null,2));
          NODE

      - name: Upload immutable workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spatial-site-batch-2026-08-22-purpose-aware-variety-03-history-deepened
          path: artifacts/spatial-site-batch/2026-08-22-purpose-aware-variety-03-history-deepened/
          if-no-files-found: error
          retention-days: 90

      - name: Commit archived results and validation evidence to main
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="artifacts/spatial-site-batch/$BATCH_ID"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ARCHIVE"
          if git diff --cached --quiet; then
            echo 'Archive/evidence already present; nothing to commit.'
          else
            git commit -m 'Archive history-deepened spatial site batch [skip ci]'
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo 'Unexpected archive conflict during rebase.' >&2
                exit 1
              fi
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo 'Unable to publish archive after retries.' >&2
                exit 1
              fi
              sleep 2
            done
          fi

      - name: Enforce regression and batch acceptance
        shell: bash
        run: |
          set -euo pipefail
          test "${REGRESSION_STATUS:-1}" -eq 0
          test "${BATCH_STATUS:-1}" -eq 0
          node -e "const s=require('./artifacts/spatial-site-batch/2026-08-22-purpose-aware-variety-03-history-deepened/summary.json'); if(!s.acceptance.ok){console.error(JSON.stringify(s.acceptance,null,2));process.exit(1)} console.log(JSON.stringify(s.acceptance,null,2))"