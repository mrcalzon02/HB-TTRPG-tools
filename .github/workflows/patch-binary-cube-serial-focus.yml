name: Patch Binary Cube serial focus

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/patch-binary-cube-serial-focus.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Patch authoritative renderer serial context colors
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('binary-cube-visualizer-renderer.js')
          source = path.read_text()
          old = """    if (playbackMode === 'serial') {\n      const bit = trace.bitByPoint[pointId];\n      const filler = trace.cellKindByPoint[pointId] === 'filler';\n      const inputColor = filler ? (bit === '1' ? COLORS.fillerOne : COLORS.fillerZero) : (bit === '1' ? COLORS.payloadOne : COLORS.payloadZero);\n      const outputColor = bit === '1' ? COLORS.projectedOne : COLORS.projectedZero;\n      return mix(inputColor, outputColor, smoothstep(localTraceTime));\n    }\n"""
          new = """    if (playbackMode === 'serial') {\n      const bit = trace.bitByPoint[pointId];\n      const filler = trace.cellKindByPoint[pointId] === 'filler';\n      const inputColor = filler ? (bit === '1' ? COLORS.fillerOne : COLORS.fillerZero) : (bit === '1' ? COLORS.payloadOne : COLORS.payloadZero);\n      const outputColor = bit === '1' ? COLORS.projectedOne : COLORS.projectedZero;\n      const serialState = serialPlaybackState(trace, traceTimeValue);\n      const inputCellIndex = trace.inputCellIndexByPoint[pointId];\n      if (inputCellIndex < serialState.inputCellIndex) return mix(COLORS.dim, outputColor, 0.34);\n      if (inputCellIndex > serialState.inputCellIndex) return mix(COLORS.dim, inputColor, 0.24);\n      return mix(inputColor, outputColor, smoothstep(localTraceTime));\n    }\n"""
          if old not in source:
              raise SystemExit('Expected serial color block was not found; refusing to patch a different renderer shape.')
          path.write_text(source.replace(old, new, 1))
          PY
          node --check binary-cube-visualizer-renderer.js
          node scripts/validate-binary-cube-serial-demonstration.mjs
          node scripts/validate-binary-cube-serial-translation-marker.mjs
      - name: Commit authoritative change and remove maintenance workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-binary-cube-serial-focus.yml
          git add binary-cube-visualizer-renderer.js
          git commit -m "feat: focus Binary Cube serial active bit"
          git push origin HEAD:main
