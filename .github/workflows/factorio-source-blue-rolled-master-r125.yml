name: Factorio R125 one source-shaped cylindrical fin shorter spine and bright rolled cobalt toe
on:
  push:
    branches: [main]
    paths:
      - 'tools/factorio-render-pipeline/source_blue_rolled_toe_one_master_r125.py'
      - '.github/workflows/factorio-source-blue-rolled-master-r125.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  physical-round-one-master-toe-refinement:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover verified R124 source-rounded actual central master scene only, never user original bitmap
        uses: actions/download-artifact@v4
        with:
          run-id: 41576963561
          name: factorio-r124-physical-round-master-finned-spine-grooves-tip-and-patina
          github-token: ${{ github.token }}
          path: private-ci/r124
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hb-ttrpg-tools/factorio-render-pipeline
          key: factorio-art-env-ubuntu24-blender4.5.15-python3.12-v1
      - name: Recover pinned authentic Blender 4.5 LTS source camera
        run: python tools/factorio-render-pipeline/bootstrap.py install --evidence-dir private-ci/readiness
      - name: Model shortened pressed bead and form genuine blue/violet thermally affected rolled toe on same single rounded 3D metal master
        run: |
          python -m py_compile tools/factorio-render-pipeline/source_blue_rolled_toe_one_master_r125.py
          BLENDER="$(python -c "import sys;sys.path.insert(0,'tools/factorio-render-pipeline');import bootstrap;print(bootstrap.find_blender())")"
          "$BLENDER" -b --disable-autoexec --factory-startup -t 2 --python-exit-code 4 \
            --python tools/factorio-render-pipeline/source_blue_rolled_toe_one_master_r125.py -- \
            --r124-dir private-ci/r124 --out private-ci/output/r125
      - name: Verify only single physical central master changed, original bell other fins original camera and 64 frame lower fin motion unchanged
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('private-ci/output/r125')
          r=json.loads((p/'r125_one_cylindrical_fin_blue_rolled_toe_source_cases.json').read_text())
          assert not r['original_sprite_upload_to_public_CI']
          assert not r['visual_original_source_approved']
          assert r['one_master_real_round_fin_only']
          assert len(r['scenes'])==3
          assert [x['tag'] for x in r['scenes']]==[
             'r124_dark_pressed_steel_control',
             'r125_dark_original_steel_vivid_coined_cobalt_toe',
             'r125_short_stamped_center_and_original_blue_rolled_toe']
          for i,c in enumerate(r['scenes']):
             assert c['restored_original_bell_other_fins_and_animation']
             assert c['visual_source_match_unapproved']
             assert set(c['genuine_blender_source_camera_frames'])=={'1','33'}
             assert set(c['physical_macro_3d_views'])=={'0','35','65'}
             assert all((p/f).stat().st_size>4000
                for f in list(c['genuine_blender_source_camera_frames'].values())+
                         list(c['physical_macro_3d_views'].values()))
             assert (p/c['editable_blender_scene']).stat().st_size>100000
             if i==0:
                assert c['true_master_ridge_revision'] is None
                assert c['actual_source_thermal_toe_revision'] is None
             else:
                thermal=c['actual_source_thermal_toe_revision']
                assert thermal['actual_face_corners_colored']>1000
                assert thermal['original_source_sprite_is_private']
                assert thermal['last_row_bright_blue'][2]>.8
             if i==2:
                geom=c['true_master_ridge_revision']
                assert geom['physical_mesh_vertices']==306
                assert geom['manifold']
                assert geom['max_real_3d_vertex_delta_m']>.005
          print('R125_PHYSICAL_ROUNDED_FIN_SHORT_STAMPED_BEAD_AND_BLUE_TOE_PASS__VISUAL_REVIEW_PENDING')
          PY
      - name: Upload actual source-aligned Blender renders, oblique fin 3D views and editable models but never proprietary reference sprite
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorio-r125-single-source-round-fin-short-ridge-and-blue-toe-models
          path: |
            private-ci/output/r125/*.blend
            private-ci/output/r125/*.png
            private-ci/output/r125/*.json
          if-no-files-found: warn
          retention-days: 14
