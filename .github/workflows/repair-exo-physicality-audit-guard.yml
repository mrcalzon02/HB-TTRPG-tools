name: Repair EXO Crew physicality audit guard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-exo-physicality-audit-guard.yml'
      - 'scripts/repair-exo-physicality-audit-guard.py'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase onto current main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Repair audit guard token
        run: python3 scripts/repair-exo-physicality-audit-guard.py
      - name: Commit repaired audit and remove helper
        run: |
          rm -f scripts/repair-exo-physicality-audit-guard.py .github/workflows/repair-exo-physicality-audit-guard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align Crew physicality audit guard"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
