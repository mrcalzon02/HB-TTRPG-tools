name: Factorio R84 speculative source-native 3D mounting align scale shear sweep
on:
  push:
    branches: [main]
    paths:
      - 'tools/factorio-render-pipeline/speculative_real_cast_alignment_r84.py'
      - '.github/workflows/factorio-speculative-source-cast-sweep-r84.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  physical-cast-probe-original-camera:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download existing authentic real editable original-camera R81 baseline, not private source images
        uses: actions/download-artifact@v4
        with:
          run-id: 41403904522
          name: factorio-r81-real-blunt-source-fin-taper-candidates
          github-token: ${{ github.token }}
          path: private-ci/r81
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hb-ttrpg-tools/factorio-render-pipeline
          key: factorio-art-env-ubuntu24-blender4.5.15-python3.12-v1
      - name: Install real pinned Blender 4.5 LTS
        run: python tools/factorio-render-pipeline/bootstrap.py install --evidence-dir private-ci/readiness
      - name: Render 19 actual geometric cast variants x 2 source frames, preserve all hinge contacts
        run: |
          BLENDER="$(python -c "import sys;sys.path.insert(0,'tools/factorio-render-pipeline');import bootstrap;print(bootstrap.find_blender())")"
          "$BLENDER" -b --disable-autoexec --factory-startup -t 2 --python-exit-code 4 \
            --python tools/factorio-render-pipeline/speculative_real_cast_alignment_r84.py -- \
            --source-blend private-ci/r81/output/r81/shoulder_22_tip_15.blend \
            --out private-ci/output/r84
      - name: Verify 19 x 2 real native renders and complete original geometry protection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('private-ci/output/r84')
          j=json.loads((p/'r84_real_cast_parameter_sweep.json').read_text())
          assert not j['original_sprite_images_uploaded']
          assert not j['source_visual_approved']
          assert len(j['experiments'])==19
          for x in j['experiments']:
              assert all((p/f).stat().st_size>5000 for f in x['both_frames_rendered'])
              assert x['individual_original_fin_meshes_stay_put']
              assert all(v['source_root_contact_tiles']<.003 for v in
                         x['original_3d_mount_and_hull_contacts_after'].values())
          print('R84_19_REAL_MESH_SPECULATIVE_SOURCE_ALIGNMENT_EXPERIMENTS_VERIFIED')
          PY
      - name: Upload no original Wube source, only numeric JSON and actual 3D camera renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorio-r84-real-mesh-individual-mount-19-hypotheses
          path: |
            private-ci/output/r84/*.png
            private-ci/output/r84/*.json
            private-ci/readiness/readiness.json
          if-no-files-found: warn
          retention-days: 14
