name: Ingest Shadowrun Sprawl Location Submission

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub issue number containing the Shadowrun sprawl location registry patch
        required: true
        type: string

permissions:
  contents: write
  issues: read

concurrency:
  group: shadowrun-sprawl-location-registry
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download issue body
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq .body > /tmp/shadowrun-sprawl-location-issue.txt

      - name: Validate and write Shadowrun registry entry
        env:
          ISSUE_BODY_FILE: /tmp/shadowrun-sprawl-location-issue.txt
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: node scripts/ingest-shadowrun-sprawl-location.mjs

      - name: Commit Shadowrun registry change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shadowrun/sprawl_location_registry.json
          if git diff --cached --quiet; then
            echo "No Shadowrun registry changes to commit."
          else
            git commit -m "Register Shadowrun sprawl location #${{ inputs.issue_number }} [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
