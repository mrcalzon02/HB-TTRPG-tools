name: Apply Interlocutum Vallimere Dramatis Increment

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/apply-interlocutum-vallimere-dramatis-increment.py"
      - "scripts/run-interlocutum-vallimere-dramatis.trigger"
      - ".github/workflows/apply-interlocutum-vallimere-dramatis-increment.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "apply-interlocutum-vallimere-dramatis-increment"
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Re-anchor on current main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Align evidence guard and apply verified direct-source increment
        id: apply
        continue-on-error: true
        run: |
          set -o pipefail
          sed -i "s@exact total is uncertain|exact count is uncertain@uncertain whether|false exact count|precise total@" scripts/apply-interlocutum-vallimere-dramatis-increment.py
          python3 scripts/apply-interlocutum-vallimere-dramatis-increment.py 2>&1 | tee /tmp/interlocutum-vallimere-dramatis.log
      - name: Publish temporary failure diagnostic
        if: steps.apply.outcome == 'failure'
        run: |
          cp /tmp/interlocutum-vallimere-dramatis.log scripts/interlocutum-vallimere-dramatis-failure.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/interlocutum-vallimere-dramatis-failure.log
          git commit -m "chore: record Interlocutum Vallimere apply failure"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          exit 1
      - name: Remove one-shot migration mechanism
        if: steps.apply.outcome == 'success'
        run: |
          rm -f scripts/apply-interlocutum-vallimere-dramatis-increment.py
          rm -f scripts/run-interlocutum-vallimere-dramatis.trigger
          rm -f scripts/interlocutum-vallimere-dramatis-failure.log
          rm -f .github/workflows/apply-interlocutum-vallimere-dramatis-increment.yml
      - name: Commit and fast-forward directly to main
        if: steps.apply.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add Interlocutum and Vallimere personae"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
