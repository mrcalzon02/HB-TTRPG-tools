name: Apply Interlocutum Vallimere Dramatis Increment

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/apply-interlocutum-vallimere-dramatis-increment.py"
      - ".github/workflows/apply-interlocutum-vallimere-dramatis-increment.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "apply-interlocutum-vallimere-dramatis-increment"
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Re-anchor on current main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Align evidence guard and apply verified direct-source increment
        run: |
          sed -i "s@exact total is uncertain|exact count is uncertain@uncertain whether|false exact count|precise total@" scripts/apply-interlocutum-vallimere-dramatis-increment.py
          python3 scripts/apply-interlocutum-vallimere-dramatis-increment.py
      - name: Remove one-shot migration mechanism
        run: |
          rm scripts/apply-interlocutum-vallimere-dramatis-increment.py
          rm .github/workflows/apply-interlocutum-vallimere-dramatis-increment.yml
      - name: Commit and fast-forward directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add Interlocutum and Vallimere personae"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
