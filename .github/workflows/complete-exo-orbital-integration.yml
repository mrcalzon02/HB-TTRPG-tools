name: Complete EXO orbital integration

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/complete-exo-orbital-integration.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover and execute orbital integration patch
        run: |
          git show HEAD^:.github/workflows/complete-exo-orbital-integration.yml > /tmp/exo-patch-source.yml
          python - <<'PY'
          from pathlib import Path
          source = Path('/tmp/exo-patch-source.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = []
          for line in source[start:end].splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          code = '\n'.join(lines)
          exec(compile(code, '/tmp/recovered-exo-patch.py', 'exec'))
          PY
          node --check blacklight-exo-solar-system.js
          node --check blacklight-exo-species-civilization.js
          grep -q "function makeMoon" blacklight-exo-solar-system.js
          grep -q "function makeBelt" blacklight-exo-solar-system.js
          grep -q "blacklight-exo-selected-world-v1" blacklight-exo-species-civilization.js
          grep -q "exo-develop-world" blacklight-exo-solar-system.html
          grep -q "exo-source-context" blacklight-exo-species-civilization.html
          git rm .github/workflows/complete-exo-orbital-integration.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add blacklight-exo-solar-system.js blacklight-exo-solar-system.html blacklight-exo-solar-system.css blacklight-exo-species-civilization.js blacklight-exo-species-civilization.html blacklight-exo-species-civilization.css
          git commit -m 'Complete EXO moon belt and world dossier integration [skip ci]'
          git push