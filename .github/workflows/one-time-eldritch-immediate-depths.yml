name: One-time immediate Eldritch Depths

on:
  push:
    paths:
      - .github/workflows/one-time-eldritch-immediate-depths.yml

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove deferred Depth resolution
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/blacklight-continuum/rules/eldritch-binding-sources.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['schemaVersion'] = '1.2.0'
          data['selectionRules']['depthResolutionStandard'] = (
              'A Depth ability resolves when it is activated or when its printed trigger occurs. Activation may immediately create a condition, construct, field, mark, or suppression with a fixed duration, but it cannot create an unspent token, deferred choice, promised clue, future bonus, or free activation to be resolved later. All choices, tests, targets, and primary outcomes are determined during activation. The Moderator supplies only facts already true in established play; if an immediate information result has no valid fact, it returns None under the ability’s printed refund rule.'
          )

          replacements = {
              ('void-mind', 'Depth 1'): "Action: one exchange. Cost: 1 Pact. Target: one person, object, record, or location you can directly examine within 5 meters. Choose exactly one question: What was intentionally concealed here? Which visible detail was added or altered most recently? What expected trace is missing? What single fact most directly contradicts the apparent explanation? Test Resolve + Investigation at difficulty 2, or opposed by Guile + Security when a sentient actor actively concealed the answer. Success: immediately receive one specific fact answering the chosen question. Failure: receive no fact and gain 1 Intrusion. If established play contains no valid answer, receive None and refund the Pact cost.",
              ('void-mind', 'Depth 3'): "Action: one exchange. Cost: 1 Pact. Target: two recorded statements, observations, memories, or records that cannot both be true. Choose exactly one question: Which item is false? Who or what introduced the contradiction? What single event allows both items to be partially true? Test Resolve + Investigation at difficulty 3, or opposed by Guile + Security when a sentient actor deliberately created the contradiction. Success: immediately receive one specific fact answering the chosen question. Failure: the contradiction remains unresolved and you gain 1 Intrusion. If established play contains no valid answer to the selected question, receive None and refund the Pact cost.",
              ('void-mind', 'Depth 4'): "Action: ten uninterrupted minutes. Cost: 2 Pact. Target: at least three distinct pieces of evidence you can examine. Before rolling choose one output: the single event capable of producing all three pieces; the person or system with access to all three; the one missing record that directly connects them; or which piece originated in another continuity. Test Resolve + Investigation at difficulty 3. Success: immediately receive one specific answer and one supporting fact explaining the connection. Failure: immediately identify one examined piece as unreliable, contaminated, or irrelevant and receive no answer. If established play contains no valid output, receive None and refund the Pact cost.",
              ('void-mind', 'Depth 5'): "Action: one exchange. Cost: 2 Pact and 2 Intrusion. Target: one person, object, record, location, active pact, or anomaly you can perceive within 10 meters. Choose three different questions: What was intentionally concealed? What was added or altered most recently? What expected trace is missing? What fact most directly contradicts its apparent nature? What entity, force, or system most recently influenced it? What immediate consequence is already in motion? Did it originate in this continuity? What name, identifier, or location most directly connects it to its source? Immediately receive one truthful sentence for each selected question. A question with no valid established answer returns None. If all three answers are None, refund the Pact cost; the Intrusion remains.",
              ('abyssal-womb', 'Depth 3'): "Action: one standard action. Cost: 1 Pact. Range: 10 meters and line of sight. Immediately perform up to three different operations: move one unattended Carry 1 object up to 5 meters; retrieve one unattended Carry 1 object to your hand; reload one weapon held by you or a willing adjacent ally; open or close one unsecured closure; operate one visible unsecured control; transfer one handheld item between two willing targets within range; or hold one Carry 1 object stationary against ordinary gravity until the start of your next turn. No object or mechanism may be selected more than once, and these operations cannot attack, pick locks, perform surgery, or activate powers.",
              ('abyssal-womb', 'Depth 4'): "Action: one standard action. Cost: 2 Pact and 1 Intrusion. Range: 15 meters. A dream-born servitor appears, immediately performs one selected profile, and then collapses: Carrier moves up to four unattended objects of Carry 2 or less up to 10 meters each; Attendant removes 2 Impact from one willing target or repairs 4 durability to one device or construct; Warden makes one Resolve + Archetype Rating restraint attack against up to two targets, compared separately to Guard, with durability 5 on each successful restraint; Scout immediately reveals the exact positions of all creatures, active sensors, exits, and unsecured controls within 15 meters that are not behind an active boundary. The servitor cannot perform any unprinted task.",
              ('abyssal-womb', 'Depth 5'): "Action: one standard action. Cost: 2 Pact and 2 Intrusion. Range: 20 meters and line of sight. Immediately choose up to five different effects, resolving each once: move one unattended Carry 2 object up to 10 meters; grant one target Armor 2 until the start of your next turn; make one Resolve + Archetype Rating restraint attack against one target with durability 5; operate one visible unsecured mechanism; move one willing target up to 5 meters without provoking reactions; repair 3 durability to one device or construct; or remove 1 Impact from one willing living target. No target may receive more than one effect from this activation.",
              ('that-which-hungers', 'Depth 3'): "Action: one standard action. Cost: 1 Pact. Target: one unattended Serviceable handheld object within reach; destroy it and immediately choose one result: Cutter inflicts 5 structural damage to one adjacent object or barrier; Power Source restores three charges, ammunition units, or power points to one compatible held device; Sensor reveals the direction and distance of every active source of one chosen category—heat, electricity, vibration, or noospheric activity—within 20 meters; Armor Component grants Armor 2 for three rounds; Mobility Component immediately moves you up to 10 meters across climbable surfaces, gaps, or difficult terrain without a test. The destroyed object cannot be recovered.",
              ('that-which-hungers', 'Depth 5'): "Action: one standard action. Cost: 2 Pact and 2 Intrusion. Area: 5-meter radius centered on you. Exclude up to Archetype Rating visible targets. Make one Resolve + Close Combat test and compare it separately to every remaining target's Guard. Each successful living target suffers 2 Trauma; each successful object or barrier suffers 5 structural damage; unsecured Carry 1 objects are destroyed automatically. After all targets resolve, gain one recovery point for each successful target or destroyed qualifying object, to a maximum of 3. Immediately spend those points in any combination to restore Pact or remove Impact from yourself, one point per Pact or Impact.",
              ('lidless-eye', 'Depth 2'): "Action: one standard action. Cost: 1 Pact. Target: one visible creature, autonomous system, or manifested entity within 20 meters. Immediately learn all five facts: its distance; whether it is uninjured, injured, critically injured, or incapacitated; whether its visible form is natural, transformed, projected, fabricated, or disguised; whether its identity credentials or noospheric address match its current body or system; and the direction of its strongest active remote connection, if any. Until the start of your next turn, that target gains no benefit from visual disguise, holographic substitution, or false identity credentials against you."
          }

          catalog = next(item for item in data['catalogs'] if item['id'] == 'binding-sources')
          for source in catalog['variants']:
              for step in source['progression']:
                  key = (source['id'], step['stage'])
                  if key in replacements:
                      step['effect'] = replacements[key]

          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          Path('.github/workflows/one-time-eldritch-immediate-depths.yml').unlink()
          PY
      - name: Commit immediate Depth resolution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make Eldritch Depth abilities resolve immediately"
          git push origin main
