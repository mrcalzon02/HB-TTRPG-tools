name: Factorio R93 source-first original hinge occlusion by old rolled bell and R08 pressure parts
on:
  push:
    branches: [main]
    paths:
      - 'tools/factorio-render-pipeline/original_old_roll_occlusion_r93.py'
      - '.github/workflows/factorio-original-hinge-roll-isolation-r93.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real-original-source-old-occluder-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover exact genuine original-camera R91 source-traced .blend, not proprietary original sprite
        uses: actions/download-artifact@v4
        with:
          run-id: 41477873481
          name: factorio-r91-source-first-real-3d-hinge-knee-combination-candidates
          github-token: ${{ github.token }}
          path: private-ci/r91
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hb-ttrpg-tools/factorio-render-pipeline
          key: factorio-art-env-ubuntu24-blender4.5.15-python3.12-v1
      - name: Install genuine pinned Blender 4.5 LTS
        run: python tools/factorio-render-pipeline/bootstrap.py install --evidence-dir private-ci/readiness
      - name: Temporarily isolate and restore physical old R08 exhaust rolls and old generic bell
        run: |
          BLENDER="$(python -c "import sys;sys.path.insert(0,'tools/factorio-render-pipeline');import bootstrap;print(bootstrap.find_blender())")"
          "$BLENDER" -b --disable-autoexec --factory-startup -t 2 --python-exit-code 4 \
            --python tools/factorio-render-pipeline/original_old_roll_occlusion_r93.py -- \
            --source-blend private-ci/r91/output/r91/raised_hidden.blend \
            --out private-ci/output/r93
      - name: Verify all old physical object visibility restored, original camera never moved
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('private-ci/output/r93')
          j=json.loads((root/'r93_actual_old_roll_bell_source_hinge_isolation.json').read_text())
          assert not j['original_artwork_published']
          assert not j['source_shape_approved']
          assert j['original_source_camera_and_model_restored']
          assert len(j['diagnostic_renders'])==9
          for x in j['diagnostic_renders']:
              assert (root/x['true_native_frame1']).stat().st_size>5000
              assert (root/x['true_native_frame33']).stat().st_size>5000
              assert x['original_source_64_frame_motion_unmodified']
          print('R93_REAL_3D_MESH_GROUPS_ISOLATED_ORIGINAL_SCENE_RESTORED')
          PY
      - name: Upload only actual Blender renders and numeric physical mesh ownership labels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorio-r93-original-source-hinge-old-occluding-mesh-isolations
          path: |
            private-ci/output/r93/*.png
            private-ci/output/r93/*.json
            private-ci/readiness/readiness.json
          if-no-files-found: warn
          retention-days: 14
