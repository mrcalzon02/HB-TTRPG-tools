# One-shot migration runner for parity-gated Cubic WebGPU Stage A integration.
name: Apply Cubic WebGPU integration

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/apply-cubic-webgpu-integration.py"
      - ".github/workflows/apply-cubic-webgpu-integration.yml"
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: "apply-cubic-webgpu-integration"
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Record migration pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=pending \
            -f context='cubic-webgpu/migration' \
            -f description='Parity-gated Cubic WebGPU migration is running.' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Rebase onto current main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Apply authoritative WebGPU integration
        run: |
          python3 scripts/apply-cubic-webgpu-integration.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('binary-cube-cubic-decryptor-worker.js')
          text = path.read_text(encoding='utf-8')
          if text.startswith('\\\n'):
              text = text[2:]
          bad = "const resultLimit = Math.max(1, Math.min(100, Math.floor(Number(options.resultLimit) || Cubic.constants.DEFAULT_RESULT_LIMIT));"
          good = "const resultLimit = Math.max(1, Math.min(100, Math.floor(Number(options.resultLimit) || Cubic.constants.DEFAULT_RESULT_LIMIT)));"
          if bad not in text:
              raise SystemExit('Expected generated resultLimit clamp was not found.')
          path.write_text(text.replace(bad, good, 1), encoding='utf-8')
          PY
      - name: Validate modified sources
        run: |
          node --check binary-cube-cubic-decryptor-engine.js
          node --check binary-cube-cubic-decryptor-webgpu.js
          node --check binary-cube-cubic-decryptor-worker-pool.js
          node --check binary-cube-cubic-decryptor-worker.js
          node --check binary-cube-cubic-decryptor.js
          node --check scripts/validate-binary-cube-cubic-decryptor.mjs
          node --check scripts/validate-scientific-tools-extraction.mjs
          node scripts/validate-binary-cube-cubic-decryptor.mjs
          node scripts/validate-scientific-tools-extraction.mjs
      - name: Commit and fast-forward directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            binary-cube-cubic-decryptor-engine.js \
            binary-cube-cubic-decryptor-worker-pool.js \
            binary-cube-cubic-decryptor-worker.js \
            binary-cube-cubic-decryptor.js \
            scripts/validate-binary-cube-cubic-decryptor.mjs \
            scripts/validate-scientific-tools-extraction.mjs
          if git diff --cached --quiet; then
            echo "No integration changes to commit."
            exit 0
          fi
          git commit -m "feat: integrate parity-gated Cubic WebGPU acceleration"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Record migration success
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=success \
            -f context='cubic-webgpu/migration' \
            -f description='Parity-gated Cubic WebGPU migration landed and validated.' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Record migration failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=failure \
            -f context='cubic-webgpu/migration' \
            -f description='Parity-gated Cubic WebGPU migration failed.' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
