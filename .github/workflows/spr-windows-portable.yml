name: SuperPosition Reader Windows portable preview

on:
  push:
    paths:
      - "software/superposition-reader/**"
      - ".github/workflows/spr-windows-portable.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-preview:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application and packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r software/superposition-reader/requirements.txt
          python -m pip install --disable-pip-version-check "pyinstaller>=6,<7"
      - name: Verify offline archive, queue, audio and API functionality
        shell: pwsh
        run: python -m unittest discover -s software/superposition-reader/tests -p "test_*.py" -v
      - name: Build four canonical story EPUBs and validate narration archive
        shell: pwsh
        run: |
          python software/superposition-reader/spr_verify_storybooks.py --output build/spr_examples --snapshot $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "Canonical EPUB integration failed" }
      - name: Assemble Windows portable program
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --console --name "SuperPositionReader" --paths software/superposition-reader --hidden-import fitz --hidden-import docx --hidden-import webview.platforms.winforms --add-data "software/superposition-reader/reader.html;." --add-data "software/superposition-reader/sapi_synthesize.ps1;." --add-data "software/superposition-reader/spr_luxtts_worker.py;." --add-data "software/superposition-reader/spr_epub.py;." --add-data "software/superposition-reader/spr_storybooks.py;." --add-data "software/superposition-reader/assets/voice;assets/voice" --add-data "software/superposition-reader/install-neural-windows.ps1;." --add-data "build/spr_examples;spr_examples" software/superposition-reader/spr_app.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }
      - name: Verify bundled executable with built-in smoke test
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'spr-bundled-smoke.json'
          & .\dist\SuperPositionReader\SuperPositionReader.exe --self-check --require-examples --report $report
          $exit = $LASTEXITCODE
          if (Test-Path $report) { Get-Content $report }
          else { Write-Warning "Executable did not create a self-check report" }
          if ($exit -ne 0) { throw "Bundled executable self-check failed ($exit)" }
          $check = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $check.ok) { throw "SPR self-check failed: $(Get-Content $report -Raw)" }
          Get-Content $report
      - name: Create zipped portable preview
        shell: pwsh
        run: |
          Compress-Archive -Path .\dist\SuperPositionReader\* -DestinationPath .\SPR-Windows-portable-preview.zip -CompressionLevel Optimal
          if (-not (Test-Path .\SPR-Windows-portable-preview.zip)) { throw "Portable ZIP was not created" }
      - name: Upload portable preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: SPR-Windows-portable-preview
          path: SPR-Windows-portable-preview.zip
          if-no-files-found: error
          retention-days: 14
