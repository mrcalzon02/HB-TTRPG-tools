name: One-time Human Vigil skill normalization

on:
  push:
    paths:
      - .github/workflows/one-time-human-vigil-skill-fix.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize recommended Skills
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/blacklight-continuum/rules/human-vigil-practices.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          replacements = {
              'red-line': ['Firearms', 'Close Combat', 'Survival'],
              'clear-verdict': ['Investigation', 'Empathy', 'Xenoculture'],
              'willing-burden': ['Medicine', 'Athletics', 'Survival'],
              'burden-carrier': ['Medicine', 'Athletics', 'Survival'],
              'solitary-listener': ['Investigation', 'Survival', 'Security'],
              'final-directive': ['Command', 'Investigation', 'Firearms'],
          }
          for catalog in data.get('catalogs', []):
              for variant in catalog.get('variants', []):
                  if variant.get('id') in replacements:
                      variant['recommendedSkills'] = replacements[variant['id']]
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          Path('.github/workflows/one-time-human-vigil-skill-fix.yml').unlink()
          PY
      - name: Commit normalized Skills
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize Human Vigil recommended Skills"
          git push origin main
