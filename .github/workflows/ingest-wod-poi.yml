name: Ingest World of Darkness POI Registry Submission

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub issue number containing the Chronicle Spatial Engine registry patch
        required: true
        type: string

permissions:
  contents: write
  issues: read

concurrency:
  group: wod-poi-registry
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download issue body
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq .body > /tmp/wod-poi-issue-body.txt

      - name: Validate and write registry entry
        env:
          ISSUE_BODY_FILE: /tmp/wod-poi-issue-body.txt
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: node scripts/ingest-wod-poi-issue.mjs

      - name: Commit registry change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/world-of-darkness/poi_registry.json
          if git diff --cached --quiet; then
            echo "No registry changes to commit."
          else
            git commit -m "Register World of Darkness POI #${{ inputs.issue_number }} [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
