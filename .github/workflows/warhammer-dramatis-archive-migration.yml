name: One-shot Warhammer Dramatis Archive Integration

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-warhammer-dramatis-archive-integration.js'
      - '.github/workflows/warhammer-dramatis-archive-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Re-anchor to current main
        run: git pull --rebase origin main
      - name: Apply verified direct archive edit
        run: node scripts/apply-warhammer-dramatis-archive-integration.js
      - name: Remove one-shot migration mechanism
        run: rm scripts/apply-warhammer-dramatis-archive-integration.js .github/workflows/warhammer-dramatis-archive-migration.yml
      - name: Commit authoritative archive integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add warhammer-40k-archive-ui-v6.js scripts/apply-warhammer-dramatis-archive-integration.js .github/workflows/warhammer-dramatis-archive-migration.yml
          git diff --cached --check
          git commit -m 'feat: integrate chronicle Dramatis Personae into Archivum'
          git push origin HEAD:main
