name: Apply direct SCI aperture source refactor

on:
  push:
    paths:
      - '.github/workflows/_apply-sci-apm-source-refactor.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rewrite canonical Crew Operations source
        run: python .github/_apply_sci_apm.py
      - name: Validate canonical JavaScript
        run: node --check blacklight-exo-crew-operations.js
      - name: Commit canonical source only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: rebuild Science aperture topology at source'
          git push origin HEAD:main
