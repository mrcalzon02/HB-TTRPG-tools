name: One-shot Warhammer Antegra Dramatis Increment

on:
  push:
    branches: [main]
    paths:
      - 'scripts/expand-warhammer-dramatis-antegra.js'
      - '.github/workflows/warhammer-dramatis-antegra-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Re-anchor to current main
        run: git pull --rebase origin main
      - name: Apply verified Antegra personae increment
        run: node scripts/expand-warhammer-dramatis-antegra.js
      - name: Remove one-shot migration mechanism
        run: rm scripts/expand-warhammer-dramatis-antegra.js .github/workflows/warhammer-dramatis-antegra-migration.yml
      - name: Commit authoritative personae expansion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/warhammer-40k/imperial-dramatis-personae-v1.js warhammer-40k-archive-ui-v6.js app-lite-view-mounts.js warhammer-40k-map.html scripts/expand-warhammer-dramatis-antegra.js .github/workflows/warhammer-dramatis-antegra-migration.yml
          git diff --cached --check
          git commit -m 'feat: add Antegra governance personae'
          git push origin HEAD:main
