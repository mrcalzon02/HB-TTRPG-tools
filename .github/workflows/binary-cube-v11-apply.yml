name: Apply guarded Binary Cube V11 compatibility integration

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/binary-cube-v11-apply.yml"
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: "binary-cube-v11-apply-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Record guarded patch pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=pending \
            -f context='binary-cube/v11-compatibility-patch' \
            -f description='Binary Cube V11 guarded compatibility integration is running.' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Checkout authoritative main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Reconstruct and verify V11 payload
        run: |
          cat scripts/.binary-cube-v11-payload.part00 scripts/.binary-cube-v11-payload.part01 > /tmp/binary-cube-v11.b64
          test "$(wc -c < /tmp/binary-cube-v11.b64 | tr -d ' ')" = "21300"
          base64 --decode /tmp/binary-cube-v11.b64 > /tmp/binary-cube-v11.tar.gz
          echo "eef754368e8461feb7c092a65d2b5ccc59d42b27a2d69cd32b58e0387fafd26d  /tmp/binary-cube-v11.tar.gz" | sha256sum --check --strict
          mkdir -p /tmp/binary-cube-v11
          tar -xzf /tmp/binary-cube-v11.tar.gz -C /tmp/binary-cube-v11
          test -s /tmp/binary-cube-v11/apply_binary_cube_v11_patch.py
          test -s /tmp/binary-cube-v11/scripts/validate-binary-cube-visualizer-compatibility.mjs
          test -s /tmp/binary-cube-v11/scripts/validate-binary-cube-visualizer-compatibility-browser.mjs
          test -s /tmp/binary-cube-v11/docs/binary-cube-v11-compatibility-report.md

      - name: Narrow duplicated compatibility anchors
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee /tmp/binary-cube-v11-narrow.log
          from pathlib import Path
          import re
          path = Path('/tmp/binary-cube-v11/apply_binary_cube_v11_patch.py')
          source = path.read_text()
          old = r'''text = replace_once(text,
              "    panel.querySelector('[data-cube-encoder-package]').value = JSON.stringify(packageObject, null, 2);\n",
              "    setActiveTransport(options.transportKind || 'internal-package', options.transportDocument || packageObject);\n    syncPackageDocument(panel);\n",
              'visualizer apply transport')'''
          new = r'''transport_old = "    panel.querySelector('[data-cube-encoder-package]').value = JSON.stringify(packageObject, null, 2);\n"
          transport_new = "    setActiveTransport(options.transportKind || 'internal-package', options.transportDocument || packageObject);\n    syncPackageDocument(panel);\n"
          transport_count = text.count(transport_old)
          if transport_count != 2:
              raise SystemExit(f'visualizer apply transport: expected exactly two source assignments before narrowing, found {transport_count}')
          text = text.replace(transport_old, transport_new, 1)'''
          if source.count(old) != 1:
              raise SystemExit(f'guarded visualizer patch source block count was {source.count(old)}, expected 1')
          source = source.replace(old, new)
          helper_pattern = r"(def replace_once\(text, old, new, label\):\n    count = text\.count\(old\)\n)"
          helper_insertion = "\\1    if label in {'auth seal provenance', 'entry lab await'} and count == 2:\n        return text.replace(old, new, 1)\n"
          source, helper_count = re.subn(helper_pattern, helper_insertion, source, count=1)
          if helper_count != 1:
              raise SystemExit(f'replace_once helper count was {helper_count}, expected 1')
          path.write_text(source)
          PY

      - name: Apply direct authoritative V11 edits
        run: |
          set -o pipefail
          python3 /tmp/binary-cube-v11/apply_binary_cube_v11_patch.py 2>&1 | tee /tmp/binary-cube-v11-apply.log
          cp /tmp/binary-cube-v11/scripts/validate-binary-cube-visualizer-compatibility.mjs scripts/
          cp /tmp/binary-cube-v11/scripts/validate-binary-cube-visualizer-compatibility-browser.mjs scripts/
          cp /tmp/binary-cube-v11/docs/binary-cube-v11-compatibility-report.md docs/

      - name: Expose exact V7 file-import state on failure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/validate-binary-cube-visualizer-encoder-browser.mjs')
          source = path.read_text()
          old = "    if (sourceField.value !== fileBits || Visualizer.currentState().sourceFileName !== 'sample.bin') throw new Error('File bytes were not converted into exact binary input.');"
          new = "    const fileImportState = Visualizer.currentState();\n    if (sourceField.value !== fileBits || fileImportState.sourceFileName !== 'sample.bin') throw new Error(`File bytes were not converted into exact binary input: field=${JSON.stringify(sourceField.value)} filename=${JSON.stringify(fileImportState.sourceFileName)} note=${JSON.stringify(panel.querySelector('[data-cube-encoder-file-note]')?.textContent || '')}.`);"
          if source.count(old) != 1:
              raise SystemExit(f'V7 file assertion count was {source.count(old)}, expected 1')
          path.write_text(source.replace(old, new))
          PY

      - name: Check candidate syntax
        run: |
          node --check shadowrun-binary-cube-encryption.js
          node --check shadowrun-binary-cube-auth-ui.js
          node --check shadowrun-binary-cube-secure-export.js
          node --check shadowrun-binary-cube-visualizer.js
          node --check shadowrun-entry.js
          node --check desktop/binary-cube/app/desktop.js
          node --check desktop/binary-cube/scripts/prepare-app.mjs
          node --check scripts/validate-binary-cube-visualizer-compatibility.mjs
          node --check scripts/validate-binary-cube-visualizer-compatibility-browser.mjs
          node --check scripts/validate-binary-cube-visualizer-encoder-browser.mjs

      - name: Validate unchanged V0 golden evidence
        run: node scripts/validate-binary-cube-baseline.mjs

      - name: Validate unchanged V2 immutable traces
        run: node scripts/validate-binary-cube-trace.mjs

      - name: Preserve V7 complete encoder parity
        run: node scripts/validate-binary-cube-visualizer-encoder.mjs

      - name: Preserve V7 Chromium encoder and laboratory handoff
        id: v7_browser
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/validate-binary-cube-visualizer-encoder-browser.mjs 2>&1 | tee /tmp/binary-cube-v11-v7-browser.log

      - name: Preserve V10 accessibility and exact fallback contract
        id: v10_static
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/validate-binary-cube-visualizer-accessibility.mjs 2>&1 | tee /tmp/binary-cube-v11-v10-static.log

      - name: Preserve V10 Chromium accessibility and renderer fallback
        id: v10_browser
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/validate-binary-cube-visualizer-accessibility-browser.mjs 2>&1 | tee /tmp/binary-cube-v11-v10-browser.log

      - name: Validate V11 tool-family compatibility contract
        id: v11_static
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/validate-binary-cube-visualizer-compatibility.mjs 2>&1 | tee /tmp/binary-cube-v11-v11-static.log

      - name: Validate V11 Chromium handoff, storage, and security boundaries
        id: v11_browser
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/validate-binary-cube-visualizer-compatibility-browser.mjs 2>&1 | tee /tmp/binary-cube-v11-v11-browser.log

      - name: Validate desktop runtime contract
        id: desktop
        continue-on-error: true
        run: |
          set -o pipefail
          node desktop/binary-cube/tests/smoke.cjs 2>&1 | tee /tmp/binary-cube-v11-desktop.log

      - name: Enforce guarded compatibility result
        run: |
          failures=''
          [ '${{ steps.v7_browser.outcome }}' = 'success' ] || failures="$failures v7-browser"
          [ '${{ steps.v10_static.outcome }}' = 'success' ] || failures="$failures v10-static"
          [ '${{ steps.v10_browser.outcome }}' = 'success' ] || failures="$failures v10-browser"
          [ '${{ steps.v11_static.outcome }}' = 'success' ] || failures="$failures v11-static"
          [ '${{ steps.v11_browser.outcome }}' = 'success' ] || failures="$failures v11-browser"
          [ '${{ steps.desktop.outcome }}' = 'success' ] || failures="$failures desktop"
          if [ -n "$failures" ]; then
            echo "Binary Cube V11 guarded failures:$failures"
            exit 1
          fi

      - name: Commit validated V11 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            shadowrun-binary-cube-visualizer.js \
            shadowrun-binary-cube-encryption.js \
            shadowrun-binary-cube-auth-ui.js \
            shadowrun-binary-cube-secure-export.js \
            shadowrun-entry.js \
            desktop/binary-cube/scripts/prepare-app.mjs \
            desktop/binary-cube/app/index.html \
            desktop/binary-cube/app/desktop.js \
            scripts/validate-binary-cube-visualizer-compatibility.mjs \
            scripts/validate-binary-cube-visualizer-compatibility-browser.mjs \
            docs/binary-cube-v11-compatibility-report.md \
            scripts/validate-binary-cube-visualizer-encoder.mjs \
            scripts/validate-binary-cube-visualizer-encoder-browser.mjs \
            scripts/validate-binary-cube-visualizer-accessibility.mjs \
            scripts/validate-binary-cube-visualizer-accessibility-browser.mjs
          git diff --cached --quiet && { echo "No validated V11 changes were staged." >&2; exit 1; }
          git commit -m "feat: integrate Binary Cube V11 tool compatibility"
          git push origin HEAD:main

      - name: Capture guarded failure without runtime edits
        if: ${{ failure() }}
        run: |
          {
            for file in /tmp/binary-cube-v11-*.log; do
              [ -f "$file" ] || continue
              echo "=== $(basename "$file") ==="
              tail -n 120 "$file"
              echo
            done
            echo '=== candidate import and persistence context ==='
            grep -n -B 8 -A 35 -E 'async function importPlainFile|function saveVisualizerState|function restoreVisualizerState' shadowrun-binary-cube-visualizer.js || true
            echo
            echo '=== duplicate patch labels ==='
            grep -n -B 20 -A 30 -E 'visualizer apply transport|auth seal provenance|entry lab await' /tmp/binary-cube-v11/apply_binary_cube_v11_patch.py || true
          } > /tmp/binary-cube-v11-diagnostic.txt
          git reset --hard HEAD
          git clean -fd
          cp /tmp/binary-cube-v11-diagnostic.txt scripts/.binary-cube-v11-apply-failure.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/.binary-cube-v11-apply-failure.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: capture Binary Cube V11 guarded failure [skip ci]"
            git push origin HEAD:main
          fi

      - name: Record guarded patch success
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=success \
            -f context='binary-cube/v11-compatibility-patch' \
            -f description='Binary Cube V11 guarded compatibility integration passed.' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Record guarded patch failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=failure \
            -f context='binary-cube/v11-compatibility-patch' \
            -f description='Binary Cube V11 guarded compatibility integration failed.' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
