name: Apply site secret traversal scaling

on:
  push:
    paths:
      - 'scripts/apply_site_secret_traversal.py'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply guarded secret traversal patch
        run: python scripts/apply_site_secret_traversal.py
      - name: Validate complete spatial stack
        run: |
          node tests/spatial-engine.test.js
          node tests/site-profile-layers.test.js
          node tests/site-history-interactions.test.js
          node tests/spatial-connector-normalization.test.js
          node tests/site-interaction-quality-regressions.test.js
          node tests/site-secret-traversal.test.js
      - name: Commit authoritative secret traversal layer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add module-map-generator.js SEMANTIC_SITE_PROFILE_LAYERS.md tests/site-secret-traversal.test.js
          git commit -m 'Scale secret traversal from site density'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:main; then exit 0; fi
            test "$attempt" -lt 5 || exit 1
            sleep 2
          done
