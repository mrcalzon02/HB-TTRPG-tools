name: One-time Resource and Pressure validation

on:
  push:
    paths:
      - .github/workflows/one-time-resource-pressure-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate scripts and data
        run: |
          node --check blacklight-resource-pressure.js
          node --check blacklight-character-sheet.js
          node --check blacklight-archetype-transition.js
          node --check blacklight-character-sheet-entry.js
          python - <<'PY'
          import json
          from pathlib import Path

          rules_path = Path('data/blacklight-continuum/rules/archetype-resource-pressure-rules.json')
          wiki_path = Path('data/blacklight-continuum/wiki/resource-pressure-rules.json')
          index_path = Path('data/blacklight-continuum/wiki/wiki-index.json')
          basic_path = Path('data/blacklight-continuum/rules/basic-character-options.json')

          tracks = json.loads(rules_path.read_text(encoding='utf-8'))
          wiki = json.loads(wiki_path.read_text(encoding='utf-8'))
          index = json.loads(index_path.read_text(encoding='utf-8'))
          basic = json.loads(basic_path.read_text(encoding='utf-8'))

          expected = {
              'human-investigator': ('Conviction', 'Strain', 'Human Breaking Point'),
              'vampire': ('Vitae', 'Hunger', 'Feeding Frenzy'),
              'shapechanger': ('Fury', 'Instinct', 'Rampage'),
              'eldritch-binder': ('Pact', 'Intrusion', 'Incursion'),
              'harmonic-mutant': ('Resonance', 'Discord', 'Dissonant Cascade'),
              'technomancer': ('Bandwidth', 'Feedback', 'Hard Reboot'),
          }
          assert set(tracks['archetypes']) == set(expected)
          for archetype_id, (resource, pressure, crisis) in expected.items():
              record = tracks['archetypes'][archetype_id]
              assert record['resource']['name'] == resource
              assert record['pressure']['name'] == pressure
              assert record['pressure']['crisis']['name'] == crisis
              assert record['resource']['meaning']
              assert record['resource']['spending']
              assert record['resource']['depletedState']
              assert len(record['resource']['recovery']) >= 3
              assert record['pressure']['warning']['effect']
              assert record['pressure']['critical']['effect']
              assert record['pressure']['crisis']['effect']
              assert len(record['pressure']['recovery']) >= 3

          assert 'Pressure Limit equals Composure + 5' in tracks['procedure']['pressureLimit']
          assert 'Warning Threshold' in tracks['procedure']['warningThreshold']
          assert 'Critical Threshold' in tracks['procedure']['criticalThreshold']
          assert 'Reapply every Pressure point' in tracks['procedure']['overflow']
          assert wiki['entries'][0]['id'] == 'archetype-resource-pressure-procedure'
          assert index['resourcePressureRules'] == str(rules_path)
          assert str(wiki_path) in index['packs']
          assert index['completedScope']['archetypeCrisisProcedures'] == 6

          basic_pairs = {item['id']: (item['resourceName'], item['pressureName']) for item in basic['archetypes']}
          for archetype_id, (resource, pressure, _) in expected.items():
              assert basic_pairs[archetype_id] == (resource, pressure)

          sheet_html = Path('blacklight-character-sheet.html').read_text(encoding='utf-8')
          index_html = Path('index.html').read_text(encoding='utf-8')
          assert sheet_html.count('blacklight-resource-pressure.js') == 1
          assert index_html.count('blacklight-resource-pressure.js') == 1
          PY
      - name: Remove validation workflow
        run: rm .github/workflows/one-time-resource-pressure-validation.yml
      - name: Commit validation cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Validate Archetype resource and pressure procedures"
          git push origin main
