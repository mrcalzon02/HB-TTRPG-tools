name: SPR real full-size EPUB passage narration

on:
  workflow_dispatch:
  push:
    paths:
      - "software/superposition-reader/spr_long_passage_trial.py"
      - ".github/workflows/spr-full-passage-neural.yml"

permissions:
  contents: read

concurrency:
  group: spr-long-passage-neural
  cancel-in-progress: true

jobs:
  two-authentic-passages:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check authorized source voice recording
        shell: bash
        run: |
          echo "ce4c621e3587b9a7f6fd1b6237433f779fa4b8ffb1bae4154ae6739da0362cd2  software/superposition-reader/assets/voice/sphinx-original.mp3" | sha256sum --check -
      - name: Install real local neural TTS and independent English ASR
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          git clone --depth 1 https://github.com/ysharma3501/LuxTTS.git "$RUNNER_TEMP/luxtts"
          python -m pip install -r "$RUNNER_TEMP/luxtts/requirements.txt" soundfile faster-whisper scipy
          PYTHONPATH="$RUNNER_TEMP/luxtts:software/superposition-reader" python -c "from zipvoice.luxvoice import LuxTTS; from faster_whisper import WhisperModel; print('Independent voice and QA dependencies loaded')"
      - name: Generate and verify realistic 280-420 character narrative passages
        env:
          PYTHONPATH: ${{ runner.temp }}/luxtts:software/superposition-reader
          HF_HOME: ${{ runner.temp }}/spr-long-passage-models
          SPR_NEURAL_QA_DIR: build/long-passage/rejected
        run: |
          python software/superposition-reader/spr_long_passage_trial.py \
            --epub-dir software/superposition-reader/books/snapshot-2026-11-03 \
            --reference software/superposition-reader/assets/voice/sphinx-original.mp3 \
            --output build/long-passage --cpu
      - name: Check both real EPUB imports produced approved longer narration
        run: |
          python - <<'PY'
          import json, hashlib, wave
          from pathlib import Path
          root=Path('build/long-passage')
          report=json.loads((root/'long-passage-report.json').read_text(encoding='utf-8'))
          assert report['status']=='passed'
          assert len(report['cases'])==2
          for item in report['cases']:
              assert 280<=item['source_chars']<=420
              assert item['qa']['first_words_preserved'] is True
              path=root/item['audio']
              assert hashlib.sha256(path.read_bytes()).hexdigest()==item['audio_sha256']
              with wave.open(str(path),'rb') as wav:
                  assert wav.getframerate()==48000 and wav.getnchannels()==1
                  assert wav.getnframes()>48000
              print(item['book'],item['source_chars'],'characters:',item['qa']['post_trim_transcript'][:160])
          PY
      - name: Preserve source text, QA timing, approved WAV and any rejected takes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SPR-long-book-passages-neural-QA-${{ github.sha }}
          path: build/long-passage/
          if-no-files-found: warn
          retention-days: 30
