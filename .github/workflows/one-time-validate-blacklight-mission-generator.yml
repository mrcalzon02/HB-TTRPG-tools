name: One-Time Validate Blacklight Mission Generator

on:
  push:
    paths:
      - '.github/workflows/one-time-validate-blacklight-mission-generator.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run mission generator validation
        run: |
          python scripts/validate-blacklight-mission-generator.py | tee /tmp/mission-generator-validation.txt
          node --check blacklight-mission-generator.js
          node --check blacklight-mission-generator-entry.js
          node --check blacklight-character-sheet-handoff.js
      - name: Write validation receipt
        run: |
          mkdir -p data/blacklight-continuum/validation
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          output = Path('/tmp/mission-generator-validation.txt').read_text(encoding='utf-8').strip()
          receipt = {
              'system': 'Blacklight Continuum',
              'module': 'BlackLight Mission Generator',
              'validated': True,
              'validatedAt': datetime.now(timezone.utc).isoformat(),
              'validatedCommit': os.environ.get('GITHUB_SHA', ''),
              'checks': [
                  'Mission content library JSON parsed successfully',
                  'Twelve source-derived legacy mission patterns mapped once each to source missions 1 through 12',
                  '384 selectable pattern, operation, and Continuum-layer contract combinations retained compatible clients, targets, opposition, challenges, and deadlines',
                  'Eight operation types, twelve client categories, twelve target profiles, twenty locations, ten opposition models, thirty-two challenges, thirty-four twists, and twenty-four deadlines validated',
                  'Player briefing and Moderator-only dossier separation validated',
                  'Mandatory risk disclosure, declared redactions, known unknowns, and renewed-consent procedure validated',
                  'Seed recreation and independent contract, site, hidden-truth, and cast reroll controls validated',
                  'Seven-scene framework, two mission clocks, and five resolution levels validated',
                  'Workspace, character creation, veteran reorientation, random character, character sheet, and Wiki integration validated',
                  'Mission generator, workspace entry, and character-sheet handoff JavaScript passed node --check'
              ],
              'validatorOutput': output
          }
          Path('data/blacklight-continuum/validation/mission-generator.json').write_text(
              json.dumps(receipt, indent=2) + '\n', encoding='utf-8'
          )
          PY
      - name: Commit receipt and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-validate-blacklight-mission-generator.yml
          git add data/blacklight-continuum/validation/mission-generator.json
          git commit -m "Record Blacklight mission generator validation"
          git push origin main
