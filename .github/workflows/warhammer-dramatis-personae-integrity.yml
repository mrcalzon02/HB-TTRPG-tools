name: Warhammer Dramatis Personae Integrity

on:
  push:
    branches: [main]
    paths:
      - 'assets/warhammer-40k/imperial-dramatis-personae-v1.js'
      - 'tests/warhammer-dramatis-personae-integrity.test.js'
      - '.github/workflows/warhammer-dramatis-personae-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Dramatis Personae syntax
        run: node --check assets/warhammer-40k/imperial-dramatis-personae-v1.js
      - name: Validate first chronicle cohort
        run: node tests/warhammer-dramatis-personae-integrity.test.js
