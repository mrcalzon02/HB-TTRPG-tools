name: Patch Binary Cube serial translation marker

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/patch-binary-cube-serial-translation-marker.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Patch authoritative renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('binary-cube-visualizer-renderer.js')
          source = path.read_text()
          old = """      this.gl.bindBuffer(this.gl.ARRAY_BUFFER, this.selectedPointBuffer);\n      this.gl.bufferData(this.gl.ARRAY_BUFFER, new Float32Array([...highlightedPosition, ...COLORS.selected]), this.gl.DYNAMIC_DRAW);\n      this.selectedPointCount = 1;\n"""
          new = """      const translationPoint = serialState ? pointAnchorPosition(trace, highlightedPointId, 4) : null;\n      const selectedPointVertices = serialState\n        ? new Float32Array([...highlightedPosition, ...COLORS.selected, ...translationPoint, ...COLORS.path])\n        : new Float32Array([...highlightedPosition, ...COLORS.selected]);\n      this.gl.bindBuffer(this.gl.ARRAY_BUFFER, this.selectedPointBuffer);\n      this.gl.bufferData(this.gl.ARRAY_BUFFER, selectedPointVertices, this.gl.DYNAMIC_DRAW);\n      this.selectedPointCount = serialState ? 2 : 1;\n"""
          if old not in source:
              raise SystemExit('Expected selected-point upload block was not found; refusing to patch a different renderer shape.')
          path.write_text(source.replace(old, new, 1))
          PY
          node --check binary-cube-visualizer-renderer.js
          node scripts/validate-binary-cube-serial-demonstration.mjs
      - name: Commit authoritative change and remove maintenance workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-binary-cube-serial-translation-marker.yml
          git add binary-cube-visualizer-renderer.js
          git commit -m "feat: mark serial keyed translation point"
          git push origin HEAD:main
