name: Apply EXO Crew console load repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-exo-crew-controlmode-repair.yml'
      - 'scripts/apply-exo-crew-controlmode-repair.py'

permissions:
  contents: write

concurrency:
  group: apply-exo-crew-controlmode-repair
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase onto current main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Restore Crew state-model dependency
        run: python3 scripts/apply-exo-crew-controlmode-repair.py
      - name: Validate Crew JavaScript and runtime dependency
        run: |
          node --check blacklight-exo-crew-operations.js
          grep -q 'function controlMode(station,ctrl)' blacklight-exo-crew-operations.js
          grep -q 'controlMode(activeStation,ctrl)' blacklight-exo-crew-operations.js
      - name: Commit repair and remove one-shot tooling
        run: |
          rm -f scripts/apply-exo-crew-controlmode-repair.py .github/workflows/apply-exo-crew-controlmode-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore Crew console state renderer"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
