name: One-Time Validate Random Character Generator

on:
  push:
    paths:
      - '.github/workflows/one-time-validate-random-character.yml'

permissions:
  contents: write

jobs:
  validate-and-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run generator validation
        run: |
          python scripts/validate-blacklight-random-character.py | tee /tmp/random-character-validation.txt
          node --check blacklight-random-character.js
          node --check blacklight-random-character-entry.js
          node --check blacklight-character-sheet-handoff.js
      - name: Write validation receipt
        run: |
          mkdir -p data/blacklight-continuum/validation
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          message = Path('/tmp/random-character-validation.txt').read_text(encoding='utf-8').strip()
          receipt = {
              'system': 'Blacklight Continuum',
              'module': 'Random Character Generator',
              'validated': True,
              'validatedAt': datetime.now(timezone.utc).isoformat(),
              'validatedCommit': os.environ.get('GITHUB_SHA', ''),
              'checks': [
                  'All generator JSON parsed successfully',
                  '3,600 simulated legal Attribute and Skill allocations passed',
                  'All six Archetypes have a legal automatic Starting Ability and at least two additional Rank 1 choices',
                  'All twelve Operational Frame profiles use valid Attributes and Skills',
                  'All five equipment-era modes contain weapons, protection, and field-kit candidates',
                  'Character Sheet field targets exist',
                  'Generator, entry, and handoff JavaScript passed node --check'
              ],
              'validatorOutput': message
          }
          Path('data/blacklight-continuum/validation/random-character-generator.json').write_text(
              json.dumps(receipt, indent=2) + '\n', encoding='utf-8'
          )
          PY
      - name: Commit receipt and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-validate-random-character.yml
          git add data/blacklight-continuum/validation/random-character-generator.json
          git commit -m "Record random character generator validation"
          git push origin main
