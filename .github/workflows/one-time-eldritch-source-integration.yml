name: One-time Eldritch Binding Source integration

on:
  push:
    paths:
      - .github/workflows/one-time-eldritch-source-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate Eldritch Binding Sources
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Missing replacement target: {label}')
              return text.replace(old, new, 1)

          transition_path = Path('blacklight-archetype-transition.js')
          transition = transition_path.read_text(encoding='utf-8')
          transition = replace_once(
              transition,
              "  const HARMONIC_VARIANT_URL = 'data/blacklight-continuum/rules/harmonic-compact-remainders.json';\n  const TECHNOMANCER_VARIANT_URL",
              "  const HARMONIC_VARIANT_URL = 'data/blacklight-continuum/rules/harmonic-compact-remainders.json';\n  const ELDRITCH_VARIANT_URL = 'data/blacklight-continuum/rules/eldritch-binding-sources.json';\n  const TECHNOMANCER_VARIANT_URL",
              'transition constant'
          )
          transition = replace_once(
              transition,
              "  let harmonicVariantData = null;\n  let technomancerVariantData = null;",
              "  let harmonicVariantData = null;\n  let eldritchVariantData = null;\n  let technomancerVariantData = null;",
              'transition data variable'
          )
          transition = replace_once(
              transition,
              "    if (archetypeId === 'harmonic-mutant' && harmonicVariantData?.catalogs?.length) return harmonicVariantData.catalogs;\n    if (archetypeId === 'technomancer'",
              "    if (archetypeId === 'harmonic-mutant' && harmonicVariantData?.catalogs?.length) return harmonicVariantData.catalogs;\n    if (archetypeId === 'eldritch-binder' && eldritchVariantData?.catalogs?.length) return eldritchVariantData.catalogs;\n    if (archetypeId === 'technomancer'",
              'transition catalogs'
          )
          transition = replace_once(
              transition,
              "    if (archetypeId === 'harmonic-mutant') return harmonicVariantData?.framework || '';\n    if (archetypeId === 'technomancer')",
              "    if (archetypeId === 'harmonic-mutant') return harmonicVariantData?.framework || '';\n    if (archetypeId === 'eldritch-binder') return eldritchVariantData?.framework || '';\n    if (archetypeId === 'technomancer')",
              'transition framework'
          )
          transition = replace_once(
              transition,
              "    } else if (archetypeId === 'technomancer') {\n      setPrimaryLabel('Awakening Paradigm');",
              "    } else if (archetypeId === 'eldritch-binder') {\n      setPrimaryLabel('Binding Source');\n      primary.placeholder = 'Choose one Eldritch Binding Source…';\n      const source = catalogs.find(catalog => fieldForCatalog(catalog) === 'lineageVariant');\n      populateDatalist(document.getElementById('blacklight-lineage-options'), source?.variants);\n    } else if (archetypeId === 'technomancer') {\n      setPrimaryLabel('Awakening Paradigm');",
              'transition selector'
          )
          transition = replace_once(
              transition,
              "      ${renderMethod('Lineage Bane', variant.bane)}\n      ${variant.progression?.length",
              "      ${renderMethod('Lineage Bane', variant.bane)}\n      ${renderMethod('Temptation', variant.temptation)}\n      ${renderMethod('Intrusion Breach', variant.intrusionBreach)}\n      ${variant.progression?.length",
              'transition special fields'
          )
          transition = replace_once(
              transition,
              "      const [entryResponse, rulesResponse, humanResponse, vampireResponse, shapechangerResponse, harmonicResponse, technomancerResponse] = await Promise.all([",
              "      const [entryResponse, rulesResponse, humanResponse, vampireResponse, shapechangerResponse, harmonicResponse, eldritchResponse, technomancerResponse] = await Promise.all([",
              'transition response tuple'
          )
          transition = replace_once(
              transition,
              "        fetch(HARMONIC_VARIANT_URL, { cache: 'no-store' }),\n        fetch(TECHNOMANCER_VARIANT_URL",
              "        fetch(HARMONIC_VARIANT_URL, { cache: 'no-store' }),\n        fetch(ELDRITCH_VARIANT_URL, { cache: 'no-store' }),\n        fetch(TECHNOMANCER_VARIANT_URL",
              'transition fetch'
          )
          transition = replace_once(
              transition,
              "      if (!harmonicResponse.ok) throw new Error(`Harmonic variant request failed with status ${harmonicResponse.status}.`);\n      if (!technomancerResponse.ok)",
              "      if (!harmonicResponse.ok) throw new Error(`Harmonic variant request failed with status ${harmonicResponse.status}.`);\n      if (!eldritchResponse.ok) throw new Error(`Eldritch source request failed with status ${eldritchResponse.status}.`);\n      if (!technomancerResponse.ok)",
              'transition response check'
          )
          transition = replace_once(
              transition,
              "      harmonicVariantData = await harmonicResponse.json();\n      technomancerVariantData = await technomancerResponse.json();",
              "      harmonicVariantData = await harmonicResponse.json();\n      eldritchVariantData = await eldritchResponse.json();\n      technomancerVariantData = await technomancerResponse.json();",
              'transition assignment'
          )
          transition_path.write_text(transition, encoding='utf-8')

          entry_path = Path('blacklight-character-sheet-entry.js')
          entry_js = entry_path.read_text(encoding='utf-8')
          entry_js = replace_once(
              entry_js,
              "  const HARMONIC_VARIANT_URL = 'data/blacklight-continuum/rules/harmonic-compact-remainders.json';\n  const TECHNOMANCER_VARIANT_URL",
              "  const HARMONIC_VARIANT_URL = 'data/blacklight-continuum/rules/harmonic-compact-remainders.json';\n  const ELDRITCH_VARIANT_URL = 'data/blacklight-continuum/rules/eldritch-binding-sources.json';\n  const TECHNOMANCER_VARIANT_URL",
              'entry constant'
          )
          entry_js = replace_once(
              entry_js,
              "        <span class=\"badge\">13 Harmonic remainders</span>\n        <span class=\"badge\">20 Technomancer practices</span>",
              "        <span class=\"badge\">13 Harmonic remainders</span>\n        <span class=\"badge\">6 Eldritch sources</span>\n        <span class=\"badge\">20 Technomancer practices</span>",
              'entry badge'
          )
          entry_js = replace_once(
              entry_js,
              "    if (archetypeId === 'harmonic-mutant') return HARMONIC_VARIANT_URL;\n    if (archetypeId === 'technomancer')",
              "    if (archetypeId === 'harmonic-mutant') return HARMONIC_VARIANT_URL;\n    if (archetypeId === 'eldritch-binder') return ELDRITCH_VARIANT_URL;\n    if (archetypeId === 'technomancer')",
              'entry source URL'
          )
          entry_js = replace_once(
              entry_js,
              "        ${renderMethod('Lineage Bane', variant.bane)}\n        ${variant.progression?.length",
              "        ${renderMethod('Lineage Bane', variant.bane)}\n        ${renderMethod('Temptation', variant.temptation)}\n        ${renderMethod('Intrusion Breach', variant.intrusionBreach)}\n        ${variant.progression?.length",
              'entry special fields'
          )
          entry_js = replace_once(
              entry_js,
              "    if ((archetypeId === 'human-investigator' || archetypeId === 'shapechanger' || archetypeId === 'harmonic-mutant' || archetypeId === 'technomancer')",
              "    if ((archetypeId === 'human-investigator' || archetypeId === 'shapechanger' || archetypeId === 'harmonic-mutant' || archetypeId === 'eldritch-binder' || archetypeId === 'technomancer')",
              'entry catalogs'
          )
          entry_path.write_text(entry_js, encoding='utf-8')

          rules_path = Path('data/blacklight-continuum/rules/basic-character-options.json')
          rules = json.loads(rules_path.read_text(encoding='utf-8'))
          binder = next(item for item in rules['archetypes'] if item['id'] == 'eldritch-binder')
          binder['theme'] = (
              "A negotiator, jailer, vessel, accomplice, or surviving contractual partner bound to one of six infinite predatory presences: the Void Mind, the Abyssal Womb, That Which Hungers, the Lidless Eye, the Silence, or the Noise. Whatever answered in the former universe still answers here. Existing contracts, prohibitions, permissions, names, and invocations remain valid between Binder and Source, but the connection feels diminished: less like a tether running through a familiar occult cosmos and more like a sealed fragment of infinity carried inside a finite person. The entity is vastly larger than the Binder, fundamentally vile, and eager to exchange power for access to identity, memory, agency, relationship, and soul."
          )
          binder['weaknessText'] = (
              "Every use teaches the Binding Source more about you, the team, and local reality. Each Source defines a printed Temptation and an explicit Intrusion Breach. When Intrusion reaches its limit, resolve that Breach rather than inventing an undefined possession or arbitrary loss."
          )
          binder['lore'] = [
              "The Eldritch Binder was already bound before the transition. The Source did not arise from alien feedstock, printer error, or reconstruction. The old relationship survived because the pact remained a valid relationship between Binder and entity even when the surrounding universe changed.",
              "The Source now feels more distant and less cosmically immediate. Old cults, temples, geometries, bloodlines, stars, dream routes, and enforcement mechanisms may no longer exist here, but the entity still answers through the binding carried inside the character.",
              "Every Source is infinite in comparison to the Binder. The relationship may be negotiated, constrained, exploited, inherited, stolen, or maintained under duress, but it is never equal. The Binder is a small finite self under an attention that can always offer more of itself than the Binder can safely contain.",
              "Choose one Binding Source: the Void Mind, the Abyssal Womb, That Which Hungers, the Lidless Eye, the Silence, or the Noise. The Source grants no free capability beyond its recorded Temptation, favored families, purchased Depth abilities, and the shared Eldritch Binder rules.",
              "A Temptation is an explicit once-per-scene exchange: the Binder accepts a source-specific advantage, restores 1 Pact, and gains 1 Intrusion. An Intrusion Breach is the fixed source-specific consequence resolved when Intrusion reaches its limit.",
              "Depth of Binding abilities are purchased in order from Depth 1 through Depth 5. Each deeper ability gives the Binder a larger, clearer portion of the Source's power while creating a stronger channel through which the Source can answer.",
              "Sealcraft, Borrowed Manifestation, Pact Economy, Forbidden Cognition, Threshold Geometry, and Invocation remain the six shared Eldritch Binder power families beneath every Binding Source."
          ]
          for ability in binder.get('innateAbilities', []):
              if ability.get('name') == 'Bound Presence':
                  ability['effect'] = (
                      "Choose one Binding Source: the Void Mind, the Abyssal Womb, That Which Hungers, the Lidless Eye, the Silence, or the Noise. Record its Temptation, Intrusion Breach, favored families, and purchased Depth abilities. The Source's description grants no additional unrecorded mechanics."
                  )
          rules['schemaVersion'] = '0.10.0'
          rules_path.write_text(json.dumps(rules, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          wiki_path = Path('data/blacklight-continuum/wiki/basic-archetypes.json')
          wiki = json.loads(wiki_path.read_text(encoding='utf-8'))
          wiki_entry = next(item for item in wiki['entries'] if item['id'] == 'eldritch-binder-archetype')
          wiki_entry['summary'] = (
              "A finite mortal bound to one of six infinite predatory presences, trading controlled access to the self for impossible knowledge, reach, consumption, observation, absence, or informational ruin."
          )
          wiki_entry['body'] = [
              "The Eldritch Binder was already bound before the transition. The Source is not an artifact of biological printing, alien feedstock, mistaken reconstruction, or an improvised explanation for supernatural abilities. Whatever answered before still answers here.",
              "The connection feels diminished and remote. It no longer resembles a living tether running through a familiar occult universe. It feels like a sealed binding carried inside the Binder: quieter, thinner, and easier to mistake for weakness, while remaining attached to something infinitely larger than the person containing it.",
              "The six known Binding Sources are the Void Mind, the Abyssal Womb, That Which Hungers, the Lidless Eye, the Silence, and the Noise. They are not benign cosmic archetypes. Each is vile, acquisitive, and willing to remove the Binder one finite piece at a time in exchange for allowing more of itself through.",
              "The Void Mind is endless unknowable knowledge, secrets of unlived lives, impossible realities, and conclusions no mortal reasoning produced. The Abyssal Womb is a dreaming schemer whose thousand arms push, pull, cradle, assemble, steal, and position every participant inside a design too large to perceive.",
              "That Which Hungers is red appetite without reciprocity, teaching the Binder to convert bodies, objects, energy, and relationships into fuel. The Lidless Eye is observation without privacy: the certainty that it has always seen the Binder and that noticing the gaze merely makes observation mutual.",
              "The Silence is anti-presence, the movement at the edge of an empty room, and the quiet after something has been removed from existence. The Noise is the screaming white and gray abyss that flattens information, identity, warning, and voice into static, hiss, hum, and finally furious sameness.",
              "Choose one Binding Source. Each Source defines two favored power families, recommended Skills, one Temptation, one Intrusion Breach, and five purchasable Depth of Binding abilities. These options do not use Gifts or Banes.",
              "The Temptation is a bounded once-per-scene exchange that restores 1 Pact and adds 1 Intrusion. The Intrusion Breach is a fixed consequence resolved when Intrusion reaches its limit. The Moderator applies the printed consequence rather than inventing an arbitrary possession, mutilation, or loss.",
              "Depth abilities are purchased in order. Depth 1 represents the first stable concession to the Source. Depth 5 allows a substantial local expression of its nature. Greater depth does not mean mutual trust; it means the channel has widened.",
              "Pact is the Binder's Resource. Intrusion is the Binder's Pressure. Sealcraft defines temporary law. Borrowed Manifestation grants senses, reach, defense, and movement. Pact Economy governs prices and obligations. Forbidden Cognition grants dangerous understanding. Threshold Geometry changes adjacency and routes. Invocation permits increasingly direct local arrival."
          ]
          wiki['schemaVersion'] = '0.10.0'
          wiki_path.write_text(json.dumps(wiki, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          index_path = Path('data/blacklight-continuum/wiki/wiki-index.json')
          index = json.loads(index_path.read_text(encoding='utf-8'))
          index['schemaVersion'] = '0.12.0'
          index['description'] = (
              "Reference wiki for Blacklight Continuum: No Return Signal. The six Archetype records focus on current capabilities, Resources, Pressures, weaknesses, six five-rank power families, and integrated advancement options including seven Human Vigil Convictions, ten Hunter Practices, thirteen Vampire Remainder Bloodlines, twenty-three Shapechanger traditions, six Eldritch Binding Sources with thirty Depth abilities, thirteen Harmonic Compact Remainders, and twenty Technomancer awakening practices."
          )
          index['eldritchBindingSources'] = 'data/blacklight-continuum/rules/eldritch-binding-sources.json'
          scope = index['completedScope']
          scope['eldritchBindingSources'] = 6
          scope['eldritchDepthAbilities'] = 30
          areas = index['nextDevelopmentAreas']
          item = 'Eldritch Binding Source and Depth advancement costs'
          if item not in areas:
              areas.insert(5, item)
          index_path.write_text(json.dumps(index, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          Path('.github/workflows/one-time-eldritch-source-integration.yml').unlink()
          PY
      - name: Commit Eldritch integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate six Eldritch Binding Sources"
          git push origin main
