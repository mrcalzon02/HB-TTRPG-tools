name: Delete World of Darkness Location Package

on:
  workflow_dispatch:
    inputs:
      world_seed_key:
        description: Embedded world seed key in wodworld-xxxxxxxx format
        required: true
        type: string
      package_key:
        description: Immutable package key in wodpkg-xxxxxxxx format
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: wod-location-package-registry
  cancel-in-progress: false

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Delete immutable package
        env:
          WORLD_SEED_KEY: ${{ inputs.world_seed_key }}
          PACKAGE_KEY: ${{ inputs.package_key }}
        run: node scripts/delete-wod-location-package.mjs

      - name: Commit package deletion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/world-of-darkness/generated_location_registry.json
          git commit -m "Delete World of Darkness location package ${{ inputs.package_key }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
