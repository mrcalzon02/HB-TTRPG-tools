# Existing workflow retriggered after initial registration.
name: Fix Blacklight induction loading and restart

on:
  push:
    paths:
      - .github/workflows/one-time-fix-blacklight-induction-restart.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair JSON and restart behavior
        run: |
          python - <<'PY'
          from pathlib import Path

          technomancer_path = Path('data/blacklight-continuum/rules/technomancer-awakening-practices.json')
          technomancer = technomancer_path.read_text(encoding='utf-8')
          broken = '"The record cannot answer questions and contains only information the target actually perceived."\n          ]'
          fixed = '"The record cannot answer questions and contains only information the target actually perceived."}\n          ]'
          if broken not in technomancer:
              raise SystemExit('Expected Last Process JSON defect was not found.')
          technomancer_path.write_text(technomancer.replace(broken, fixed, 1), encoding='utf-8')

          creation_path = Path('blacklight-character-creation.js')
          creation = creation_path.read_text(encoding='utf-8')
          old_reset = """  function resetInduction() {
    if (!confirm('Clear the entire character creation induction and begin again?')) return;
    state.draft = defaultDraft();
    allSkills().forEach(skill => { state.draft.fields[skillFieldName(skill)] = '0'; });
    localStorage.removeItem(DRAFT_STORAGE_KEY);
    renderEntry(state.entries[0].id);
  }
"""
          new_reset = """  function resetInduction() {
    if (!confirm('Clear the entire character creation induction and begin again?')) return;
    state.draft = defaultDraft();
    allSkills().forEach(skill => { state.draft.fields[skillFieldName(skill)] = '0'; });
    localStorage.removeItem(DRAFT_STORAGE_KEY);
    localStorage.removeItem('hb-ttrpg-tools-blacklight-charles-induction-log-v1');
    localStorage.removeItem('hb-ttrpg-tools-blacklight-charles-induction-transcript-v1');
    const firstEntry = state.entries[0];
    if (!firstEntry) {
      window.location.reload();
      return;
    }
    renderEntry(firstEntry.id);
  }
"""
          if old_reset not in creation:
              raise SystemExit('Expected resetInduction implementation was not found.')
          creation = creation.replace(old_reset, new_reset, 1)

          old_fetch = """  async function fetchJson(url, label) {
    const response = await fetch(url, { cache: 'no-store' });
    if (!response.ok) throw new Error(`${label} request failed with status ${response.status}.`);
    return response.json();
  }
"""
          new_fetch = """  async function fetchJson(url, label) {
    const response = await fetch(url, { cache: 'no-store' });
    if (!response.ok) throw new Error(`${label} request failed with status ${response.status}.`);
    const source = await response.text();
    try {
      return JSON.parse(source);
    } catch (error) {
      throw new Error(`${label} contains invalid JSON: ${error.message}`);
    }
  }
"""
          if old_fetch not in creation:
              raise SystemExit('Expected fetchJson implementation was not found.')
          creation_path.write_text(creation.replace(old_fetch, new_fetch, 1), encoding='utf-8')

          Path('.github/workflows/one-time-fix-blacklight-induction-restart.yml').unlink()
          PY
      - name: Validate Blacklight data and scripts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = [
              'data/blacklight-continuum/wiki/character-creation-guide.json',
              'data/blacklight-continuum/rules/basic-character-options.json',
              'data/blacklight-continuum/rules/character-creation-foundation.json',
              'data/blacklight-continuum/rules/human-vigil-practices.json',
              'data/blacklight-continuum/rules/vampire-remainder-bloodlines.json',
              'data/blacklight-continuum/rules/shapechanger-remainder-forms.json',
              'data/blacklight-continuum/rules/eldritch-binding-sources.json',
              'data/blacklight-continuum/rules/harmonic-compact-remainders.json',
              'data/blacklight-continuum/rules/technomancer-awakening-practices.json',
          ]
          for filename in files:
              with Path(filename).open(encoding='utf-8') as handle:
                  json.load(handle)
          PY
          node --check blacklight-character-creation.js
          node --check blacklight-charles-induction.js
          node --check blacklight-character-sheet-handoff.js
          grep -q "const firstEntry = state.entries\[0\]" blacklight-character-creation.js
          grep -q "Technomancer practices" data/blacklight-continuum/rules/technomancer-awakening-practices.json
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Blacklight induction loading and restart recovery"
          git push origin main
