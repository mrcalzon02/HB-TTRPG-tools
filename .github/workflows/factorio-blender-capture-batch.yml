      - 'tools/factorio-render-pipeline/camera_sweep_report_r09.py'
      - 'tools/factorio-render-pipeline/capture_analysis.py'
      - 'tools/factorio-render-pipeline/scene_verify.py'
      - 'tools/factorio-render-pipeline/run_calibration.py'
      - '.github/workflows/factorio-blender-capture-batch.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factorio-blender-capture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  blender-capture:
    name: Headless Blender captures (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: [calibration, models]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # One reproducible Blender art environment for calibration and model
      # regressions. Cache only the installed per-user infrastructure;
      # scene models/renders remain fresh and are uploaded as evidence.
      - name: Restore pinned Blender 4.5.15 art environment
        uses: actions/cache@v4
        with:
          path: ~/.cache/hb-ttrpg-tools/factorio-render-pipeline
          key: factorio-art-env-ubuntu24-blender4.5.15-python3.12-v1
      - name: Compile orchestration and QA sources
        run: python -m py_compile tools/factorio-render-pipeline/vanilla_depth_patina_r43.py tools/factorio-render-pipeline/test_vanilla_depth_patina_r43.py tools/factorio-render-pipeline/vanilla_legacy_bell_trim_r42.py tools/factorio-render-pipeline/test_vanilla_legacy_bell_trim_r42.py tools/factorio-render-pipeline/nozzle_layer_isolation_r40.py tools/factorio-render-pipeline/nozzle_layer_report_r40.py tools/factorio-render-pipeline/test_nozzle_layer_isolation_r40.py tools/factorio-render-pipeline/vanilla_open_liner_flutes_r39.py tools/factorio-render-pipeline/test_vanilla_open_liner_flutes_r39.py tools/factorio-render-pipeline/vanilla_refractory_depth_r38.py tools/factorio-render-pipeline/test_vanilla_refractory_depth_r38.py tools/factorio-render-pipeline/vanilla_refractory_visibility_r37.py tools/factorio-render-pipeline/test_vanilla_refractory_visibility_r37.py tools/factorio-render-pipeline/vanilla_source_guard_motion_r36.py tools/factorio-render-pipeline/test_vanilla_source_guard_motion_r36.py tools/factorio-render-pipeline/vanilla_inner_fin_proportions_r35.py tools/factorio-render-pipeline/test_vanilla_inner_fin_proportions_r35.py tools/factorio-render-pipeline/vanilla_source_tail_profile_r33.py tools/factorio-render-pipeline/test_vanilla_source_tail_profile_r33.py tools/factorio-render-pipeline/vanilla_animation_cycle_r32.py tools/factorio-render-pipeline/vanilla_animation_cycle_report_r32.py tools/factorio-render-pipeline/test_vanilla_animation_cycle_r32.py tools/factorio-render-pipeline/vanilla_cupped_radial_skids_r31.py tools/factorio-render-pipeline/test_vanilla_cupped_radial_skids_r31.py tools/factorio-render-pipeline/vanilla_beige_radial_skids_r29.py tools/factorio-render-pipeline/test_vanilla_beige_radial_skids_r29.py tools/factorio-render-pipeline/vanilla_underslung_clamshell_r28.py tools/factorio-render-pipeline/test_vanilla_underslung_clamshell_r28.py tools/factorio-render-pipeline/vanilla_evidence_prune_r27.py tools/factorio-render-pipeline/vanilla_outer_skid_covers_r25.py tools/factorio-render-pipeline/vane_layout_r22.py tools/factorio-render-pipeline/vanilla_master_fin_r21.py tools/factorio-render-pipeline/vanilla_open_drum_r20.py tools/factorio-render-pipeline/vanilla_cone_interior_r19.py tools/factorio-render-pipeline/vanilla_distal_motion_r18.py tools/factorio-render-pipeline/vanilla_vane_supports_r16.py tools/factorio-render-pipeline/vanilla_static_mechanisms_r15.py tools/factorio-render-pipeline/vanilla_mechanical_r13.py tools/factorio-render-pipeline/vanilla_afterburner_r11.py tools/factorio-render-pipeline/nozzle_detail_capture_r11.py tools/factorio-render-pipeline/camera_sweep_r09.py tools/factorio-render-pipeline/camera_sweep_report_r09.py tools/factorio-render-pipeline/vanilla_visual_refinement_r08.py tools/factorio-render-pipeline/vanilla_pipe_overlays_r07.py tools/factorio-render-pipeline/reference_compare_r07.py tools/factorio-render-pipeline/vanilla_benchmark_r07.py tools/factorio-render-pipeline/thruster_profile_r06.py tools/factorio-render-pipeline/industrial_detail_r05.py tools/factorio-render-pipeline/sculpted_thruster_r04.py tools/factorio-render-pipeline/scene_capture_batch.py tools/factorio-render-pipeline/capture_analysis.py tools/factorio-render-pipeline/scene_verify.py tools/factorio-render-pipeline/run_calibration.py
      - name: Install or verify pinned Blender 4.5 LTS workstation
        run: python tools/factorio-render-pipeline/bootstrap.py install --evidence-dir readiness
      - name: Execute real Blender scene renders and source model revisions
        run: python tools/factorio-render-pipeline/run_calibration.py --group ${{ matrix.group }} --output capture-output
      - name: Publish batch report to GitHub job summary
        if: success()
        run: cat capture-output/CAPTURE_QA.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload candidate blend files and captured PNG evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorio-captures-${{ matrix.group }}
          path: |
            readiness/
            capture-output/
          if-no-files-found: warn
          retention-days: 30
