name: Apply Binary Cube V9 asset cache bump

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/binary-cube-v9-asset-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch authoritative Shadowrun loader
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('shadowrun-entry.js')
          source = path.read_text(encoding='utf-8')
          replacements = [
              ("  const ASSET_VERSION = '20260725-4';", "  const ASSET_VERSION = '20260726-1';", 'asset version'),
              ("['tools','Binary Cube Encoder Visualizer','Encrypt manual bits or file bytes into a complete canonical package, validate every block trace, decrypt and verify the round trip, and animate any selected block in the real 3D point field.','shadowrun-binary-cube-visualizer','prototype','Open Visualizer']", "['tools','Binary Cube Encoder Visualizer','Encrypt exact canonical packages while inspecting detailed, batched, sampled, or aggregate 3D representations, verified block traces, performance metrics, and reversible multi-block playback.','shadowrun-binary-cube-visualizer','prototype','Open Visualizer']", 'visualizer card')
          ]
          for old, new, label in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f'{label}: expected exactly one target, found {source.count(old)}')
              source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          PY
          node --check shadowrun-entry.js
          git diff --check
      - name: Commit asset cache bump
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shadowrun-entry.js
          git commit -m 'feat: surface Binary Cube V9 performance tiers [skip ci]'
          git push origin HEAD:main
