# One-shot repair runner; remove after permanent compatibility validation passes.
name: Apply Binary Cube checksum compatibility

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/apply-binary-cube-checksum-compatibility.py"
      - ".github/workflows/apply-binary-cube-checksum-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: "apply-binary-cube-checksum-compatibility"
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Record migration pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=pending \
            -f context='binary-cube/checksum-compat-migration' \
            -f description='Binary Cube checksum compatibility repair is running.' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Rebase onto current main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Apply compatibility repair
        run: python3 scripts/apply-binary-cube-checksum-compatibility.py
      - name: Validate affected contracts
        run: |
          node --check shadowrun-binary-cube-engine.js
          node --check shadowrun-binary-cube-secure-export.js
          node --check scripts/validate-binary-cube-baseline.mjs
          node scripts/validate-binary-cube-baseline.mjs
          node scripts/validate-binary-cube-visualizer-compatibility.mjs
          node scripts/validate-binary-cube-visualizer-failure-paths.mjs
          node desktop/binary-cube/tests/smoke.cjs
          node scripts/validate-binary-cube-cubic-decryptor.mjs
          node scripts/validate-scientific-tools-extraction.mjs
      - name: Commit and fast-forward directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            shadowrun-binary-cube-engine.js \
            shadowrun-binary-cube-secure-export.js \
            scripts/validate-binary-cube-baseline.mjs
          if git diff --cached --quiet; then
            echo "No compatibility changes to commit."
            exit 0
          fi
          git commit -m "fix: restore Binary Cube package checksum compatibility"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Record migration success
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=success \
            -f context='binary-cube/checksum-compat-migration' \
            -f description='Binary Cube checksum compatibility repair landed and validated.' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Record migration failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=failure \
            -f context='binary-cube/checksum-compat-migration' \
            -f description='Binary Cube checksum compatibility repair failed.' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
