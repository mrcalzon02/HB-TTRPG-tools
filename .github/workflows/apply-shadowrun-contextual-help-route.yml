name: Apply direct Binary Cube contextual help route

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/apply-shadowrun-contextual-help-route.yml"
      - "scripts/apply-shadowrun-contextual-help-route.py"

permissions:
  contents: write
  statuses: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Record pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=pending \
            -f context='scientific-tools/direct-contextual-help' \
            -f description='Applying direct Binary Cube contextual-help route.' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply and validate direct help route
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          python scripts/apply-shadowrun-contextual-help-route.py
          node --check shadowrun-entry.js
          node --check app-lite-view-mounts.js
          node --check scripts/validate-scientific-tools-extraction.mjs
          node scripts/validate-scientific-tools-help.mjs
          node scripts/validate-scientific-tools-extraction.mjs
      - name: Commit validated route
        run: |
          if git diff --quiet -- shadowrun-entry.js app-lite-view-mounts.js scripts/validate-scientific-tools-extraction.mjs; then
            echo "Direct contextual-help route already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shadowrun-entry.js app-lite-view-mounts.js scripts/validate-scientific-tools-extraction.mjs
          git commit -m "feat: load shared help on direct Binary Cube routes"
          git push origin HEAD:main
      - name: Record success
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=success \
            -f context='scientific-tools/direct-contextual-help' \
            -f description='Direct Binary Cube contextual-help route integrated.' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Record failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=failure \
            -f context='scientific-tools/direct-contextual-help' \
            -f description='Direct contextual-help route failed closed.' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
