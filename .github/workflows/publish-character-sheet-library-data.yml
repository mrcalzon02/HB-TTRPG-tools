name: Publish character sheet library data

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-character-sheet-library-data.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode library script
        shell: bash
        run: |
          cat > /tmp/library.b64 <<'PAYLOAD'

PAYLOAD
          base64 --decode /tmp/library.b64 | gzip --decompress > character-sheet-library.js
          rm -f /tmp/library.b64 .github/workflows/publish-character-sheet-library-data.yml
      - name: Commit library script
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish 186-record character sheet index [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
