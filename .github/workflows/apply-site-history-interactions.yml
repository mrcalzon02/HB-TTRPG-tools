name: Apply site history interactions

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_site_history_interactions.py
      - scripts/.site-history-payload-*
      - .github/workflows/apply-site-history-interactions.yml

permissions:
  contents: write

concurrency:
  group: apply-site-history-interactions
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronize main
        run: git pull --ff-only origin main

      - name: Apply guarded authoritative payload
        run: python scripts/apply_site_history_interactions.py

      - name: Validate JavaScript syntax
        run: |
          node --check module-map-generator.js
          node --check semantic-content-populator.js
          node --check module-map-generator-entry.js

      - name: Validate layered spatial behavior
        run: |
          node tests/site-profile-layers.test.js
          node tests/site-history-interactions.test.js
          node tests/spatial-engine.test.js

      - name: Commit authoritative source replacements
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add module-map-generator.js semantic-content-populator.js SEMANTIC_SITE_PROFILE_LAYERS.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Authoritative sources already match the validated payload."
            exit 0
          fi
          git commit -m "Add cross-layer historical site interactions"
          git pull --rebase origin main
          git push origin HEAD:main
