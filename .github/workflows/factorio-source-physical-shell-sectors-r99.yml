name: Factorio R99 source-first physically segmented nozzle shell sector occlusion tests
on:
  push:
    branches: [main]
    paths:
      - 'tools/factorio-render-pipeline/physical_sectioned_shell_r99.py'
      - '.github/workflows/factorio-source-physical-shell-sectors-r99.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-bell-sector-3d-panel-cutout-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore exact R94 source-calibrated original camera Blender scene, excluding Wube original sprite pixels
        uses: actions/download-artifact@v4
        with:
          run-id: 41494055204
          name: factorio-r94-source-first-sewn-planar-bell-metal-shell-candidates
          github-token: ${{ github.token }}
          path: private-ci/r94
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hb-ttrpg-tools/factorio-render-pipeline
          key: factorio-art-env-ubuntu24-blender4.5.15-python3.12-v1
      - name: Install pinned Blender 4.5 LTS
        run: python tools/factorio-render-pipeline/bootstrap.py install --evidence-dir private-ci/readiness
      - name: Test real finite-thickness segmented source-nozzle surface cutouts against R94
        run: |
          BLENDER="$(python -c "import sys;sys.path.insert(0,'tools/factorio-render-pipeline');import bootstrap;print(bootstrap.find_blender())")"
          "$BLENDER" -b --disable-autoexec --factory-startup -t 2 --python-exit-code 4 \
            --python tools/factorio-render-pipeline/physical_sectioned_shell_r99.py -- \
            --source-blend private-ci/r94/output/r94/panel_trim_025_rear_018.blend \
            --out private-ci/output/r99
      - name: Check sectional metal edge stitching, source camera, preserved animation and actual Blender save/reopen
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('private-ci/output/r99')
          r=json.loads((root/'r99_true_sectioned_real_source_shell.json').read_text())
          assert len(r['cases'])==14
          assert not r['private_original_sprite_uploaded_to_public_ci']
          assert not r['source_comparison_done_inside_public_ci']
          assert not r['source_fidelity_approved']
          for case in r['cases']:
              assert (root/case['native_frame1']).stat().st_size>5000
              assert (root/case['native_frame33']).stat().st_size>5000
              assert case['all_protected_original_3d_parts_animation_and_camera_intact']
              if case['physical_3d_source_shell_cutout']:
                  m=case['physical_3d_source_shell_cutout']
                  assert m['all_mesh_edges_manifold']
                  assert m['new_physically_connected_thickness_walls']>0
                  assert m['removed_actual_3d_shell_quads']>0
                  assert m['actual_3d_faces']>100
                  assert (root/case['saved_reopened_editable_blend']).stat().st_size>100000
          print('R99_ORIGINAL_SOURCE_REAL_SEGMENTED_NOZZLE_CUTOUT_VERIFIED')
          PY
      - name: Upload authentic Blender model and native renders, never private original Factorio art
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorio-r99-original-source-physical-sectional-bell-occlusion-diagnostic
          path: |
            private-ci/output/r99/*.blend
            private-ci/output/r99/*.png
            private-ci/output/r99/*.json
            private-ci/readiness/readiness.json
          if-no-files-found: warn
          retention-days: 14
