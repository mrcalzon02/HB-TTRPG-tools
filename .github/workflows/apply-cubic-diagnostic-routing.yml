name: Apply Cubic diagnostic routing migration

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/apply-cubic-diagnostic-routing.yml"
      - "scripts/apply-cubic-diagnostic-routing.py"

permissions:
  contents: write
  statuses: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Record pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=pending \
            -f context='scientific-tools/cubic-diagnostic-routing' \
            -f description='Applying validated Cubic diagnostic routing.' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply exact authoritative routing edits
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          python scripts/apply-cubic-diagnostic-routing.py
          node --check binary-cube-diagnostic-pipeline.js
          node --check binary-cube-diagnostic-pipeline-panel.js
          node --check scientific-tools-entry.js
          node --check scripts/validate-scientific-diagnostic-pipeline.mjs
          node -e "const P=require('./binary-cube-diagnostic-pipeline.js'); const E=require('./shadowrun-binary-cube-engine.js'); const R=require('./binary-cube-key-generation-research.js'); const bits=Array.from(Buffer.from('Diagnostic Cubic routing fixture','utf8'),b=>b.toString(2).padStart(8,'0')).join(''); const key=R.generateResearchKey('iterative-chain','437',4,{inputFace:'top',outputFace:'front',inputQuarterTurns:0,outputQuarterTurns:0,maskDensity:.75}); const pkg=E.encryptBinary(bits,key); const bytes=new TextEncoder().encode(JSON.stringify(pkg)); const cls=P.classifyAsset(bytes); const plan=P.buildPlan(bytes,{profile:'exhaustive',classification:cls,cubicSeedEnd:500,cubicAttemptBudget:128}); console.log('CUBIC_ROUTE_CLASS',JSON.stringify(cls)); console.log('CUBIC_ROUTE_APPLICABLE',JSON.stringify(plan.detectors.filter(x=>x.applicable).map(x=>({id:x.id,reason:x.reason})))); P.runPipeline(bytes,{profile:'exhaustive',sourceName:'debug-cubic.json',cubicSeedEnd:500,cubicAttemptBudget:128}).then(r=>{console.log('CUBIC_ROUTE_FINDINGS',JSON.stringify(r.findings.map(x=>({id:x.detectorId,status:x.status,note:x.notes?.[0]})))); console.log('CUBIC_ROUTE_ERRORS',JSON.stringify(r.errors));}).catch(e=>{console.error(e);process.exit(2);});"
          node scripts/validate-scientific-diagnostic-pipeline.mjs
          node scripts/validate-binary-cube-cubic-decryptor.mjs
          node scripts/validate-scientific-tools-extraction.mjs
      - name: Commit validated routing changes
        run: |
          if git diff --quiet -- binary-cube-diagnostic-pipeline.js binary-cube-diagnostic-pipeline-panel.js scientific-tools-entry.js scripts/validate-scientific-diagnostic-pipeline.mjs; then
            echo "Routing changes are already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add binary-cube-diagnostic-pipeline.js binary-cube-diagnostic-pipeline-panel.js scientific-tools-entry.js scripts/validate-scientific-diagnostic-pipeline.mjs
          git commit -m "feat: route canonical cube diagnostics to Cubic Decryptor"
          git push origin HEAD:main
      - name: Record success
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=success \
            -f context='scientific-tools/cubic-diagnostic-routing' \
            -f description='Cubic diagnostic routing integrated and validated.' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Record failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=failure \
            -f context='scientific-tools/cubic-diagnostic-routing' \
            -f description='Cubic diagnostic routing migration failed closed.' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
