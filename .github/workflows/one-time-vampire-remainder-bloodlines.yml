name: One-time Vampire Remainder Bloodlines integration

on:
  push:
    paths:
      - .github/workflows/one-time-vampire-remainder-bloodlines.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add original Continuum bloodline analogs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          lineages = [
              {
                  "id": "crowned-blood",
                  "name": "The Crowned Blood",
                  "legacy": "Domain rulers, court architects, inherited governors, and elders trained to make hierarchy feel like natural law.",
                  "continuum": "Old titles command nobody here. The Crowned retain command instincts and political memory, but authority must be established through present capability, agreement, leverage, or force.",
                  "favoredFamilies": ["Grave Dominion", "Blood Memory"],
                  "gift": {
                      "name": "Inherited Command",
                      "effect": "Once per scene after succeeding on Presence + Command or Presence + Negotiation, choose up to Archetype Rating willing allies or acknowledged subordinates within 10 meters. Until the end of your next turn, each gains one die on actions directly carrying out the plan or order you just stated."
                  },
                  "bane": {
                      "name": "Wounded Rank",
                      "effect": "The first time each scene a person publicly refuses an order you directly issued or strips you of an asserted title, gain 1 Hunger. Prevent this increase by explicitly releasing that person from obligation before the end of your next turn."
                  }
              },
              {
                  "id": "ash-rebellion",
                  "name": "The Ash Rebellion",
                  "legacy": "Warrior-philosophers, insurgents, agitators, defenders of the dispossessed, and predators who treated every throne as a temporary target.",
                  "continuum": "The old revolutions and tyrants are gone, but the blood still reacts violently to coercive hierarchy. These Vampires must decide which authorities deserve resistance rather than inheriting the answer.",
                  "favoredFamilies": ["Crimson Velocity", "Deathless Resilience"],
                  "gift": {
                      "name": "Against the Throne",
                      "effect": "Gain one die on Force and Resolve tests made directly against a target that commands at least three other active beings or holds a higher formal rank in the current scene. Once per scene, spend 1 Vitae to grant the same bonus to up to Archetype Rating allies until the end of the round."
                  },
                  "bane": {
                      "name": "Refusal of Chains",
                      "effect": "When you voluntarily obey an order backed by an explicit threat of injury, confinement, dispossession, or deprivation without first attempting resistance or stating a negotiated condition, gain 1 Hunger after completing the ordered action."
                  }
              },
              {
                  "id": "velvet-fixation",
                  "name": "The Velvet Fixation",
                  "legacy": "Artists, courtiers, patrons, performers, collectors, and predators who converted beauty and obsession into social power.",
                  "continuum": "Alien aesthetics do not share the old world's standards, forcing the Velvet to discover whether their devotion was to beauty itself or merely to a culture that rewarded their taste.",
                  "favoredFamilies": ["Grave Dominion", "Veil of Night"],
                  "gift": {
                      "name": "Perfecting Gaze",
                      "effect": "Choose voice, movement, visual design, scent and flavor, architecture, or ritual performance at character creation. Gain two dice on Performance or Empathy tests that create, analyze, or exploit the chosen medium. Once per scene after scoring at least three successes with that medium, one observing target loses one die against your next Grave Dominion power before scene end."
                  },
                  "bane": {
                      "name": "Captive Attention",
                      "effect": "When you directly perceive a Performance 4 or higher display or an Advanced or Exceptional work in your chosen medium, your first nondefensive action that neither studies nor interacts with it loses two dice. Spending one minor action studying the work ends the penalty."
                  }
              },
              {
                  "id": "fractured-moon",
                  "name": "The Fractured Moon",
                  "legacy": "Oracles, ecstatic prophets, pattern-seers, cursed visionaries, and court advisers whose insight arrived entangled with impossible perception.",
                  "continuum": "Their visions still function, but they reference a causal order slightly misaligned with local reality. Prophecy arrives as useful truth surrounded by foreign static.",
                  "favoredFamilies": ["Blood Memory", "Veil of Night"],
                  "gift": {
                      "name": "Split Premonition",
                      "effect": "Once per scene before making a test, choose one question: Which visible target will act first next round? Which visible exit will become unsafe before your next turn? Will one named action increase your Hunger, Exposure, or Pressure? Receive the exact answer and gain one die on the first action that directly uses it."
                  },
                  "bane": {
                      "name": "Signal Bleed",
                      "effect": "Whenever an Awareness, Reason, or Composure test produces a Complication, suffer 1 Disruption and lose one die from sensory tests until scene end."
                  }
              },
              {
                  "id": "beast-remnant",
                  "name": "The Beast Remnant",
                  "legacy": "Feral survivors, wilderness predators, animal-bonded outcasts, and undead who understood civilization as another hunting environment.",
                  "continuum": "The familiar beasts and ecosystems are absent, but predatory perception and survival instinct remain. The lineage now studies habitats, machines, and alien ecologies as new forms of wilderness.",
                  "favoredFamilies": ["Crimson Velocity", "Vital Predation"],
                  "gift": {
                      "name": "Predator's Sensorium",
                      "effect": "Choose one sense at character creation: scent tracking within 30 meters; thermal sight within 20 meters; vibration sense through connected surfaces within 20 meters; or echolocation within 20 meters. Gain two dice on Survival tests to track a target detected by that sense."
                  },
                  "bane": {
                      "name": "Visible Beast",
                      "effect": "At Hunger 3 or higher, unmistakable predatory traits become visible. Presence and Guile tests made to pass as an ordinary baseline human lose two dice unless Borrowed Face, Unremarked, or another explicit disguise effect is active."
                  }
              },
              {
                  "id": "underveil-kin",
                  "name": "The Underveil Kin",
                  "legacy": "Hidden information brokers, tunnel dwellers, spies, scavengers, archivists, and visibly cursed Vampires who built power beneath polite society.",
                  "continuum": "Sewers and catacombs have become maintenance arteries, waste loops, sensor shadows, forgotten service decks, and unindexed infrastructure. Their instinct for civilization's underside remains immediately useful.",
                  "favoredFamilies": ["Veil of Night", "Blood Memory"],
                  "gift": {
                      "name": "Blindspot Architecture",
                      "effect": "Automatically notice concealed access panels, maintenance routes, unmonitored service spaces, and fixed sensor gaps within 10 meters when they are physically present. Gain two dice on Stealth and Security tests inside subterranean, maintenance, waste-processing, or service infrastructure."
                  },
                  "bane": {
                      "name": "Unmasked Form",
                      "effect": "Your natural appearance is unmistakably supernatural. Social tests that depend upon appearing ordinary or harmless lose two dice unless an explicit disguise, altered appearance, or Veil of Night effect is active."
                  }
              },
              {
                  "id": "crimson-calculists",
                  "name": "The Crimson Calculists",
                  "legacy": "Blood scholars, ritual engineers, occult accountants, curse researchers, and hidden colleges that converted Vitae into repeatable supernatural procedure.",
                  "continuum": "Their old grimoires describe laws that no longer possess universal jurisdiction. The Calculists retain method, notation, and disciplined blood-work while rebuilding formulas against local reality.",
                  "favoredFamilies": ["Blood Memory", "Vital Predation"],
                  "gift": {
                      "name": "Formula of Vitae",
                      "effect": "Once per scene choose one effect: reduce the Vitae cost of one Vampire power by 1, to a minimum of 0; or spend 1 Vitae to gain two dice on one Science, Medicine, or Noospherics test involving a supernatural effect, curse, feeding medium, or continuity process."
                  },
                  "bane": {
                      "name": "Ritual Debt",
                      "effect": "The first time each scene you use a rank 3 or higher Vampire power without a prepared focus token, gain 1 Hunger. Preparing a focus token requires ten uninterrupted minutes and one common material component; the token is consumed when it prevents this Hunger increase."
                  }
              },
              {
                  "id": "starless-court",
                  "name": "The Starless Court",
                  "legacy": "Shadow sovereigns, ruthless aristocrats, abyssal mystics, and hidden rulers who treated darkness as both weapon and proof of superiority.",
                  "continuum": "Local darkness is not the same ancient abyss, but it still bends around the bloodline's authority. The lineage must distinguish inherited entitlement from actual mastery.",
                  "favoredFamilies": ["Grave Dominion", "Veil of Night"],
                  "gift": {
                      "name": "Sovereign Shadow",
                      "effect": "While in dim light or darkness, gain 1 Guard and one die on Grave Dominion and Veil of Night activation tests. These benefits end immediately in bright direct illumination."
                  },
                  "bane": {
                      "name": "Lit Exposure",
                      "effect": "While standing in bright direct artificial light or foreign daylight, Sovereign Shadow is inactive and you lose one die from Finesse and Guile tests. This illumination does not cause solar Trauma unless it also carries the Old Sun's cursed signature."
                  }
              },
              {
                  "id": "sepulcher-choir",
                  "name": "The Sepulcher Choir",
                  "legacy": "Death scholars, corpse-oracles, ghost negotiators, inheritance brokers, and families that treated the dead as a second political constituency.",
                  "continuum": "The dead of this universe do not know their names, but death still leaves evidence. The Choir must build new relationships with local echoes instead of relying upon inherited funerary authority.",
                  "favoredFamilies": ["Blood Memory", "Deathless Resilience"],
                  "gift": {
                      "name": "Last Witness",
                      "effect": "Once per scene, touch a corpse or the exact site of a death that occurred within the previous seven days and choose one question: What directly caused the death? What was the victim's strongest fear during the final minute? What was the last distinct person, creature, or machine the victim perceived? Receive a truthful sensory answer limited to that final minute."
                  },
                  "bane": {
                      "name": "Pall of the Grave",
                      "effect": "Living beings within 2 meters perceive unnatural cold and unease. Presence + Empathy and Presence + Negotiation tests against living targets lose one die. Spend 1 Vitae at scene start to suppress the Pall for that scene."
                  }
              },
              {
                  "id": "quiet-tribunal",
                  "name": "The Quiet Tribunal",
                  "legacy": "Oath-bound judges, sanctioned hunters, assassins, investigators, and executioners who treated predation as sentence rather than appetite.",
                  "continuum": "The old courts and sacred mandates possess no jurisdiction here. The Tribunal retains discipline and the need to judge, but every sentence must now be justified without inherited authority.",
                  "favoredFamilies": ["Crimson Velocity", "Vital Predation"],
                  "gift": {
                      "name": "Mark of Sentence",
                      "effect": "After personally witnessing a target inflict Trauma, break a sworn agreement, or attempt supernatural domination, mark that target until scene end. Gain two dice to track, attack, or resist the marked target. You may maintain only one Mark of Sentence at a time."
                  },
                  "bane": {
                      "name": "Blood Code",
                      "effect": "Choose one code at character creation: never feed upon a helpless target; never kill an unarmed target; never knowingly break your sworn word; or never abandon a marked quarry while physically capable of pursuit. Violating the code adds 2 Hunger, and Hunger cannot be reduced below 1 until you make direct restitution to the harmed party or complete the abandoned obligation."
                  }
              },
              {
                  "id": "coil-testament",
                  "name": "The Coil Testament",
                  "legacy": "Tempters, mystery-cult founders, poisoners, sacred transgressors, and predators who offered liberation in forms designed to create dependency.",
                  "continuum": "Their old revelations no longer correspond to local cosmology, but the blood retains toxin, patience, seduction, and the instinct to offer dangerous choices.",
                  "favoredFamilies": ["Grave Dominion", "Vital Predation"],
                  "gift": {
                      "name": "Serpent's Covenant",
                      "effect": "You are immune to ordinary biological poison. After a successful bite or direct skin contact, spend 1 Vitae to envenom one target. The target tests Resilience against difficulty equal to Archetype Rating. On failure it suffers 2 Impact and loses two dice from all actions for two rounds; on success it suffers only 1 Impact. A target can suffer this venom only once per scene."
                  },
                  "bane": {
                      "name": "Cold Torpor",
                      "effect": "After suffering cold damage or spending one complete round below freezing without environmental protection, reduce Initiative by 2 and lose access to Crimson Velocity powers. Both restrictions end after remaining above freezing for one complete round."
                  }
              },
              {
                  "id": "flesh-loom",
                  "name": "The Flesh Loom",
                  "legacy": "Body artisans, metamorphic nobles, surgeons of identity, war-shapers, and predators who treated flesh as language, property, and political argument.",
                  "continuum": "Being printed has not made their craft redundant. It has shown them a civilization where bodies are already manufactured, forcing them to decide whether their art liberates persons or merely recreates old ownership in a new medium.",
                  "favoredFamilies": ["Deathless Resilience", "Vital Predation"],
                  "gift": {
                      "name": "Mutable Design",
                      "effect": "Spend 1 Vitae and ten uninterrupted minutes, then choose one effect for the scene: alter face, voice, build, and superficial appearance; create a natural weapon dealing 2 Trauma; create a precision biological tool granting one die to Medicine, Engineering, or Close Combat; or move one point among Force, Finesse, and Resilience without raising any Attribute above 5 or below 1. Only one Mutable Design effect may be active."
                  },
                  "bane": {
                      "name": "Mutable Identity",
                      "effect": "After activating Mutable Design for the second time in one scene, suffer 1 Disruption and lose two points of Identity Defense until completing a full rest."
                  }
              },
              {
                  "id": "night-roads",
                  "name": "The Night Roads",
                  "legacy": "Wanderers, messengers, nomadic courts, smugglers, illusionists, and survivors who treated movement itself as freedom from territorial power.",
                  "continuum": "The old roads are gone, but every station, habitat, ship, transit gate, service corridor, and sensor boundary creates another route that settled powers fail to understand.",
                  "favoredFamilies": ["Crimson Velocity", "Veil of Night"],
                  "gift": {
                      "name": "Wayfarer's Trick",
                      "effect": "Spend 1 Vitae and choose one effect. Road Between: move instantly from one doorway, vehicle hatch, or deep shadow to another visible threshold within 15 meters, carrying worn equipment up to your Carry. Road Mirage: create one visual image or sound source inside a 3-meter cube within 15 meters for three rounds; physical contact reveals it as unreal."
                  },
                  "bane": {
                      "name": "Rootless Blood",
                      "effect": "After completing three consecutive full rests within the same 1-kilometer area, reduce Resource Maximum by 1. Restore the lost maximum after traveling at least 10 kilometers or completing a full rest in a different habitat, vessel, settlement, or planetary region."
                  }
              }
          ]

          rules_path = Path('data/blacklight-continuum/rules/basic-character-options.json')
          rules = json.loads(rules_path.read_text(encoding='utf-8'))
          vampire = next((item for item in rules.get('archetypes', []) if item.get('id') == 'vampire'), None)
          if vampire is None:
              raise SystemExit('Vampire Archetype not found')
          vampire['lineageFramework'] = (
              "Remainder Bloodlines are inherited supernatural and social patterns carried by Vampires from the Society of Shadows. They are not new Archetypes and do not replace the six Vampire power families. Choose one lineage or remain Unaligned. A lineage grants its printed Gift, imposes its printed Bane, and identifies two favored power families for character concept and later advancement rules."
          )
          vampire['lineages'] = lineages
          rules['schemaVersion'] = '0.7.0'
          rules_path.write_text(json.dumps(rules, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          wiki_path = Path('data/blacklight-continuum/wiki/basic-archetypes.json')
          wiki = json.loads(wiki_path.read_text(encoding='utf-8'))
          vampire_entry = next((item for item in wiki.get('entries', []) if item.get('id') == 'vampire-archetype'), None)
          if vampire_entry is None:
              raise SystemExit('Vampire Wiki entry not found')

          resource_paragraph = next((p for p in vampire_entry.get('body', []) if p.startswith("Vitae is the Vampire's Resource.")), None)
          additions = [
              "The old bloodlines survived as Remainders rather than intact political nations. Each carries a supernatural habit, a social inheritance, a specific Gift, and a specific Bane. These bloodlines do not replace the Vampire Archetype or create separate classes; they modify how one Vampire lineage expresses the same six shared power families.",
              "The thirteen Remainder Bloodlines below are original Continuum lineages built from broad gothic roles once found throughout undead civilization: rulers, rebels, aesthetes, prophets, feral survivors, hidden brokers, blood scholars, shadow sovereigns, death-speakers, judges, tempters, flesh-shapers, and wanderers. None possesses automatic authority in the Continuum."
          ]
          body = [p for p in vampire_entry.get('body', []) if p not in additions]
          if resource_paragraph in body:
              index = body.index(resource_paragraph)
              body[index:index] = additions
          else:
              body.extend(additions)
          vampire_entry['body'] = body

          lineage_table = {
              'title': 'Thirteen Remainder Bloodlines',
              'columns': ['Remainder Bloodline', 'Legacy Within the Society of Shadows', 'Continuum Translation', 'Favored Families'],
              'rows': [
                  [item['name'], item['legacy'], item['continuum'], ' · '.join(item['favoredFamilies'])]
                  for item in lineages
              ]
          }
          mechanics_table = {
              'title': 'Remainder Gifts and Banes',
              'columns': ['Remainder Bloodline', 'Lineage Gift', 'Lineage Bane'],
              'rows': [
                  [item['name'], f"{item['gift']['name']}: {item['gift']['effect']}", f"{item['bane']['name']}: {item['bane']['effect']}"]
                  for item in lineages
              ]
          }
          tables = [table for table in vampire_entry.get('tables', []) if table.get('title') not in {lineage_table['title'], mechanics_table['title']}]
          insert_at = 1 if tables and tables[0].get('title') == 'Former Stations Within the Society of Shadows' else 0
          tables[insert_at:insert_at] = [lineage_table, mechanics_table]
          vampire_entry['tables'] = tables
          wiki['schemaVersion'] = '0.7.0'
          wiki_path.write_text(json.dumps(wiki, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          html_path = Path('blacklight-character-sheet.html')
          html = html_path.read_text(encoding='utf-8')
          old_html = '<label>Lineage / Variant<input name="lineageVariant" type="text" placeholder="Bloodline, shifting tradition, patron, resonance school…"></label>'
          new_html = '<label>Lineage / Variant<input id="blacklight-lineage" name="lineageVariant" type="text" list="blacklight-lineage-options" placeholder="Choose or enter a lineage, tradition, patron, or school…"><datalist id="blacklight-lineage-options"></datalist></label>'
          if old_html not in html:
              raise SystemExit('Lineage field not found in character sheet HTML')
          html_path.write_text(html.replace(old_html, new_html, 1), encoding='utf-8')

          js_path = Path('blacklight-character-sheet.js')
          js = js_path.read_text(encoding='utf-8')
          js = js.replace(
              "  const archetypeRating = document.getElementById('blacklight-archetype-rating');\n",
              "  const archetypeRating = document.getElementById('blacklight-archetype-rating');\n  const lineageInput = document.getElementById('blacklight-lineage');\n  const lineageOptions = document.getElementById('blacklight-lineage-options');\n",
              1
          )
          anchor = """  function renderArchetypeSummary() {\n"""
          lineage_functions = """  function populateLineages() {
    if (!lineageOptions || !lineageInput) return;
    lineageOptions.innerHTML = '';
    const lineages = state.archetype?.lineages || [];
    lineages.forEach(lineage => {
      const option = document.createElement('option');
      option.value = lineage.name;
      option.label = `${lineage.gift?.name || 'Gift'} / ${lineage.bane?.name || 'Bane'}`;
      lineageOptions.appendChild(option);
    });
    lineageInput.placeholder = lineages.length
      ? 'Choose a Remainder Bloodline or enter Unaligned…'
      : 'Enter a lineage, tradition, patron, or school…';
  }

  function getSelectedLineage() {
    const value = lineageInput?.value?.trim().toLowerCase();
    if (!value || !state.archetype?.lineages?.length) return null;
    return state.archetype.lineages.find(lineage =>
      lineage.id.toLowerCase() === value || lineage.name.toLowerCase() === value
    ) || null;
  }

  function renderLineageSelection() {
    const archetype = state.archetype;
    if (!archetype?.lineages?.length) return '';
    const lineage = getSelectedLineage();
    if (!lineage) {
      return `<div class="blacklight-weakness-box"><strong>Remainder Bloodline:</strong> Choose one of ${archetype.lineages.length} listed bloodlines in the Lineage / Variant field, enter Unaligned, or record a custom campaign lineage.</div>`;
    }
    return `
      <h4>${escapeHtml(lineage.name)}</h4>
      <p><strong>Legacy:</strong> ${escapeHtml(lineage.legacy)}</p>
      <p><strong>Continuum Translation:</strong> ${escapeHtml(lineage.continuum)}</p>
      <p><strong>Favored Families:</strong> ${(lineage.favoredFamilies || []).map(escapeHtml).join(' · ')}</p>
      <div class="blacklight-weakness-box"><strong>${escapeHtml(lineage.gift?.name || 'Lineage Gift')}:</strong> ${escapeHtml(lineage.gift?.effect || '')}</div>
      <div class="blacklight-weakness-box"><strong>${escapeHtml(lineage.bane?.name || 'Lineage Bane')}:</strong> ${escapeHtml(lineage.bane?.effect || '')}</div>`;
  }

"""
          if anchor not in js:
              raise SystemExit('Archetype summary function anchor not found')
          js = js.replace(anchor, lineage_functions + anchor, 1)
          old_summary_end = """      <div class="blacklight-weakness-box"><strong>${escapeHtml(archetype.weakness)}:</strong> ${escapeHtml(archetype.weaknessText)}</div>
      <h4>Innate Abilities</h4>"""
          new_summary_end = """      <div class="blacklight-weakness-box"><strong>${escapeHtml(archetype.weakness)}:</strong> ${escapeHtml(archetype.weaknessText)}</div>
      ${renderLineageSelection()}
      <h4>Innate Abilities</h4>"""
          if old_summary_end not in js:
              raise SystemExit('Archetype summary markup not found')
          js = js.replace(old_summary_end, new_summary_end, 1)
          js = js.replace(
              """    renderArchetypeSummary();
    calculateAll();""",
              """    populateLineages();
    renderArchetypeSummary();
    calculateAll();""",
              1
          )
          js = js.replace(
              """        if (event.target === archetypeRating || event.target.classList.contains('blacklight-attribute') || event.target.name === 'armorRating' || event.target.name === 'characterName') {
          calculateAll();
          if (event.target === archetypeRating) renderPowers();
        }
        saveLocal();""",
              """        if (event.target === archetypeRating || event.target.classList.contains('blacklight-attribute') || event.target.name === 'armorRating' || event.target.name === 'characterName') {
          calculateAll();
          if (event.target === archetypeRating) renderPowers();
        }
        if (event.target === lineageInput) renderArchetypeSummary();
        saveLocal();""",
              1
          )
          js = js.replace(
              """        if (event.target === archetypeSelect) applyArchetype(archetypeSelect.value);
        saveLocal();""",
              """        if (event.target === archetypeSelect) {
          if (lineageInput) lineageInput.value = '';
          applyArchetype(archetypeSelect.value);
        }
        if (event.target === lineageInput) renderArchetypeSummary();
        saveLocal();""",
              1
          )
          js_path.write_text(js, encoding='utf-8')

          index_path = Path('data/blacklight-continuum/wiki/wiki-index.json')
          index = json.loads(index_path.read_text(encoding='utf-8'))
          index.setdefault('completedScope', {})['vampireRemainderBloodlines'] = len(lineages)
          index['schemaVersion'] = '0.7.0'
          index_path.write_text(json.dumps(index, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          Path('.github/workflows/one-time-vampire-remainder-bloodlines.yml').unlink()
          PY
      - name: Commit Remainder Bloodlines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add original Vampire Remainder Bloodlines"
          git push origin main
