name: CubeChat two-emulator conversation
on:
  push:
    branches:
      - qa/cubechat-android-0.1.0
    paths:
      - .github/workflows/cubechat-android-two-emulators.yml
      - .github/scripts/cubechat_android_qa.py
      - .github/scripts/CubeChatQrReader.java
      - cubechat-android/downloads/CubeChat.apk
      - .github/scripts/cubechat_android_two_qa.py
permissions:
  contents: read
jobs:
  two-emulators:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            cubechat-android/downloads
      - name: Check the published binary and decoder
        shell: bash
        run: |
          set -euo pipefail
          echo "51b845ddf7564dd1887dc7ab9bf51eddb7a8e0c93a6365314c7ddd4865514d69  cubechat-android/downloads/CubeChat.apk" | sha256sum -c -
          curl --fail --silent --show-error --location --retry 2 \
            https://repo.maven.apache.org/maven2/com/google/zxing/core/3.5.3/core-3.5.3.jar \
            --output "$RUNNER_TEMP/zxing-core.jar"
          echo "8d8064c1636fdaef7189dd9055c7d59950a8940a12f2293956446ec3c109fd82  $RUNNER_TEMP/zxing-core.jar" | sha256sum -c -
          javac -cp "$RUNNER_TEMP/zxing-core.jar" -d "$RUNNER_TEMP" .github/scripts/CubeChatQrReader.java
      - name: Boot two Android guests and verify the conversation
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          sdkmanager --install "emulator" "platform-tools" "system-images;android-30;default;x86_64" > "$RUNNER_TEMP/android-setup.log"
          test -f "$ANDROID_HOME/system-images/android-30/default/x86_64/system.img"
          export ANDROID_USER_HOME="$RUNNER_TEMP/cubechat-android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          emulator_pids=()
          trap 'for pid in "${emulator_pids[@]}"; do kill "$pid" 2>/dev/null || true; done' EXIT
          adb start-server
          for port in 5554 5556; do
            name="cubechat-$port"
            avd_dir="$ANDROID_AVD_HOME/$name.avd"
            mkdir -p "$avd_dir"
            printf '%s\n' 'avd.ini.encoding=UTF-8' "path=$avd_dir" 'target=android-30' > "$ANDROID_AVD_HOME/$name.ini"
            printf '%s\n' "AvdId=$name" "avd.ini.displayname=$name" > "$avd_dir/config.ini"
            cat >> "$avd_dir/config.ini" <<'AVD'
          abi.type=x86_64
          hw.cpu.arch=x86_64
          image.sysdir.1=system-images/android-30/default/x86_64/
          tag.id=default
          tag.display=Default
          hw.lcd.width=720
          hw.lcd.height=1280
          hw.lcd.density=240
          hw.ramSize=2048
          vm.heapSize=256
          disk.dataPartition.size=2G
          hw.keyboard=yes
          hw.wifi=yes
          hw.gpu.enabled=yes
          hw.audioInput=no
          hw.audioOutput=no
          fastboot.forceColdBoot=yes
          AVD
            emulator -list-avds | grep -Fx "$name"
            emulator -avd "$name" -port "$port" -accel on -cores 2 -memory 2048 \
              -no-window -no-snapshot -no-boot-anim -no-audio -no-metrics \
              -gpu swiftshader_indirect -feature -Vulkan > "$RUNNER_TEMP/$name.log" 2>&1 &
            emulator_pids+=("$!")
          done
          for i in 0 1; do
            ports=(5554 5556)
            port=${ports[$i]}
            export ANDROID_SERIAL="emulator-$port"
            booted=''
            for attempt in {1..100}; do
              if ! kill -0 "${emulator_pids[$i]}" 2>/dev/null; then
                tail -35 "$RUNNER_TEMP/cubechat-$port.log"
                exit 1
              fi
              booted=$(timeout 4 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
              if [[ "$booted" == 1 ]]; then break; fi
              sleep 3
            done
            [[ "$booted" == 1 ]]
            adb shell input keyevent 82
            adb shell wm dismiss-keyguard
            adb shell wm size 720x1280
            adb shell wm density 240
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb shell settings put system screen_off_timeout 1800000
            adb install -r cubechat-android/downloads/CubeChat.apk
          done
          python3 .github/scripts/cubechat_android_two_qa.py
      - name: Save the key-free conversation screenshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CubeChat-Android-conversation
          path: ${{ runner.temp }}/CubeChat-conversation.png
          if-no-files-found: error
          retention-days: 7
