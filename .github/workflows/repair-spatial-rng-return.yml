name: Repair spatial RNG return

on:
  push:
    paths:
      - 'scripts/.repair-spatial-rng-trigger'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Guarded authoritative repair
        shell: python
        run: |
          from pathlib import Path
          p=Path('semantic-spatial-engine.js')
          text=p.read_text()
          broken="    };\n    return out;\n  }\n\n  function roleId"
          fixed="    };\n    return next;\n  }\n\n  function roleId"
          if text.count(broken)!=1:
              raise SystemExit(f'expected exactly one broken RNG boundary, found {text.count(broken)}')
          p.write_text(text.replace(broken,fixed,1))
      - name: Validate spatial stack
        run: |
          node tests/spatial-engine.test.js
          node tests/site-profile-layers.test.js
          node tests/site-history-interactions.test.js
          node tests/spatial-connector-normalization.test.js
      - name: Commit repaired authority
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add semantic-spatial-engine.js
          git commit -m 'Repair spatial RNG after connector normalization'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
