name: Factorio R68 original two-page 8x4 candidate atlas layout
on:
  push:
    branches: [main]
    paths:
      - 'tools/factorio-render-pipeline/r68_original_atlas_page_layout.py'
      - 'tools/factorio-render-pipeline/test_r68_original_atlas_page_layout.py'
      - '.github/workflows/factorio-thruster-native-two-page-r68.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  repack-verified-64-real-native-blender-frames:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test genuine original atlas cell dimensions and source-frame order with synthetic frames
        run: |
          python -m pip install "Pillow>=10,<13"
          python -m unittest discover -s tools/factorio-render-pipeline -p 'test_r68_original_atlas_page_layout.py' -v
      - name: Download REAL verified 64-frame Blender R66 candidate renders only
        uses: actions/download-artifact@v4
        with:
          run-id: 41372931965
          name: factorio-r67-r66-real-native-64frame-candidate-and-sheet
          github-token: ${{ github.token }}
          path: private-ci/r67-candidate/
      - name: Pack exact two ORIGINAL-layout 2112x2168 RGBA candidate sprite pages
        run: |
          python tools/factorio-render-pipeline/r68_original_atlas_page_layout.py \
            --source-r67 private-ci/r67-candidate/private-ci/output/r67 \
            --out private-ci/output/r68
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('private-ci/output/r68/r68-page-layout-manifest.json').read_text())
          assert data['status']=='PASS_COMPLETE_R66_RECONSTRUCTION_TWO_NATIVE_8X4_ATLAS_PAGES'
          assert data['original_per_page_dimensions']==[2112,2168]
          assert data['page_count']==2 and data['model_frames']==64
          assert data['each_of_64_original_rendered_candidate_pixels_verified']
          assert data['real_private_original_sprite_compared'] is False
          print('R68_ACTUAL_64_BLENDER_FRAMES_PACKED_EXACTLY_AS_ORIGINAL_TWO_PAGE_LAYOUT')
          PY
      - name: Upload only reconstructed candidate pages and proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorio-r68-two-native-original-layout-candidate-atlas-pages
          path: |
            private-ci/output/r68/*.png
            private-ci/output/r68/r68-page-layout-manifest.json
          if-no-files-found: warn
          retention-days: 14
