name: Validate Cubic Decryptor Tool

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/cubic-decryptor.yml"
      - "shadowrun-binary-cube-engine.js"
      - "binary-cube-key-generation-research.js"
      - "binary-cube-cubic-decryptor-engine.js"
      - "binary-cube-cubic-decryptor-worker.js"
      - "binary-cube-cubic-decryptor.js"
      - "binary-cube-cubic-decryptor.css"
      - "scripts/validate-binary-cube-cubic-decryptor.mjs"
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: "cubic-decryptor-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Record pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=pending \
            -f context='binary-cube/cubic-decryptor' \
            -f description='Cubic Decryptor validation is running.' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Cubic Decryptor sources
        run: |
          node --check binary-cube-cubic-decryptor-engine.js
          node --check binary-cube-cubic-decryptor-worker.js
          node --check binary-cube-cubic-decryptor.js
          node --check scripts/validate-binary-cube-cubic-decryptor.mjs
          test -s binary-cube-cubic-decryptor.css
      - name: Recover all current cubic key-generator families
        run: node scripts/validate-binary-cube-cubic-decryptor.mjs
      - name: Repair stale Scientific Tools local-media ownership assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/validate-scientific-tools-extraction.mjs')
          text = path.read_text()
          old = """checks.push(includes('Diagnostic local runner shares the routed model', diagnosticLocal, [
  \"import zlib from 'node:zlib'\",
  'fileURLToPath(import.meta.url)',
  'function decodePngRgba(',
  'Pipeline.runPipeline(',
  '--profile=triage|thorough|exhaustive'
]));"""
          new = """checks.push(includes('Diagnostic local runner shares the routed model and centralized local-media decoder', diagnosticLocal, [
  \"scientific-tools-local-media.js\",
  'fileURLToPath(import.meta.url)',
  'LocalMedia.decodePngRgba',
  'Pipeline.runPipeline(',
  '--profile=triage|thorough|exhaustive'
]));"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one stale diagnostic-local assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          node --check scripts/validate-scientific-tools-extraction.mjs
          node scripts/validate-scientific-tools-extraction.mjs
      - name: Commit ownership assertion repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate-scientific-tools-extraction.mjs
          git commit -m "fix: align Scientific Tools ownership with shared local media"
          git push origin HEAD:main
      - name: Record success
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=success \
            -f context='binary-cube/cubic-decryptor' \
            -f description='Cubic Decryptor regression passed.' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Record failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=failure \
            -f context='binary-cube/cubic-decryptor' \
            -f description='Cubic Decryptor regression or ownership repair failed.' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
