name: One-time Vampire legacy expansion

on:
  push:
    paths:
      - .github/workflows/one-time-vampire-legacy-expansion.yml

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Expand Vampire legacy and stellar curse
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          rules_path = Path('data/blacklight-continuum/rules/basic-character-options.json')
          rules = json.loads(rules_path.read_text(encoding='utf-8'))
          vampire = next((a for a in rules.get('archetypes', []) if a.get('id') == 'vampire'), None)
          if vampire is None:
              raise SystemExit('Vampire Archetype not found')

          vampire['theme'] = (
              "A bearer of the cursed bloodline whose Vitae, predatory gifts, deathless resilience, inherited memory, and blood-bound authority remain fully functional even though the ancient curse feels remote. The Vampire may have arrived as a newly made Childe of Cain, a practiced predator of the hidden courts, a keeper of the Veil, a bloodline heir, or an elder who once ruled the Society of Shadows from beyond mortal perception. Those identities and centuries of experience remain part of the character, but the new universe does not automatically recognize the hierarchy, theology, or cosmic authority that once made them feel inevitable."
          )
          vampire['lore'] = [
              "You may have been freshly turned, still measuring immortality in nights rather than centuries. You may have served a hidden court, enforced the feeding laws of an undead domain, preserved the Veil, hunted those who endangered secrecy, inherited the privileges and liabilities of an ancient bloodline, or ruled mortal and undead society through agents who never knew your name. You may have been one of the ancient elders for whom kingdoms, religions, companies, and generations of lesser vampires were temporary instruments. Whatever station you held, you remember the old discipline of hiding in plain sight.",
              "The Society of Shadows survived because mortals were never permitted to understand how thoroughly the undead lived among them. Feeding had to be concealed. Corpses had to be explained. supernatural displays had to be contained. Rivalries could not be allowed to become public wars. Every Vampire learned the old lesson in some form: if humanity saw the truth clearly enough, fear would become organization, organization would become fire, and the undead would again be dragged into daylight beneath torches, weapons, cameras, laboratories, and armies.",
              "That obligation feels less pressing here. The people and systems of this universe do not know your bloodline, your court, your lineage taboos, or the old Veil. They do not automatically recognize you as one of the hidden dead because their histories never contained the society that taught mortals to fear you. Secrecy may still be tactically wise, but it is no longer an inherited command backed by centuries of collective terror. The old reflex remains: conceal the feeding, control the witness, leave no impossible corpse, never let mortal scrutiny become a crusade. What has changed is that the reflex now feels like training rather than gravity.",
              "The first lesson of foreign night is stranger still. Starlight is the light of suns, yet the distant light crossing the night does not burn you. More unsettling is the discovery that the direct light of foreign stars does not automatically awaken the hatred carried by the Sun of the old world. The curse was pronounced within another history, another covenant, and perhaps another divine jurisdiction. Who is a Vampire to declare that every star in every universe owes allegiance to the power that condemned Cain's bloodline? The foreign heavens may illuminate you without recognizing you as cursed.",
              "The cursed essence nevertheless remains. Vitae still sustains the deathless state. Blood memory still carries skills, instincts, names, grief, and the accumulated weight of lineage. The character still possesses the capabilities recorded on the sheet. What has weakened is not the power but the feeling that every part of existence was built to reinforce it.",
              "Hunger remains, but it no longer occupies every waking thought. The Red Thirst feels like a distant migraine, a persistent electronic noise behind the mind, or a signal heard from several rooms away. It can intensify. It can become dangerous. It can still drive predation when neglected. Yet the Vampire is no longer required to spend every moment suppressing the image of the nearest mortal throat opening beneath their teeth. The rich scent of blood remains desirable without automatically becoming the center of the universe.",
              "This quiet does not make the Vampire humane, ethical, or safe. It makes choice harder to excuse. Predation can no longer be blamed entirely upon a curse that once felt indistinguishable from thought. The Vampire retains the habits, hierarchies, memories, and appetites of the old undead society while gaining an unfamiliar distance from them. A former tyrant may discover that command feels optional. A keeper of the Veil may realize that secrecy can be chosen for the team's survival rather than obeyed as sacred law. A newly turned Childe may encounter the first genuine silence they have known since death. An ancient elder may find the absence of constant bloodline pressure more frightening than Hunger itself."
          ]
          vampire['weakness'] = 'The Old Sun and Distant Hunger'
          vampire['weaknessText'] = (
              "Ordinary night starlight and direct light from foreign stars do not automatically harm you. The curse reacts only to direct light from the original Sun, artificial radiation specifically calibrated to reproduce that Sun's cursed signature, or a supernatural effect explicitly invoking the original solar curse upon Cain's bloodline. Such exposure inflicts 2 Trauma per round, ignores ordinary Armor, and prevents Cold Repair and other vampiric healing until the end of your next round after exposure ends. Hunger remains a Pressure track: it is quieter than in the former universe, but its printed penalties and consequences still apply when it rises."
          )
          rules['schemaVersion'] = '0.6.0'
          rules_path.write_text(json.dumps(rules, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          wiki_path = Path('data/blacklight-continuum/wiki/basic-archetypes.json')
          wiki = json.loads(wiki_path.read_text(encoding='utf-8'))
          entry = next((e for e in wiki.get('entries', []) if e.get('id') == 'vampire-archetype'), None)
          if entry is None:
              raise SystemExit('Vampire Wiki entry not found')

          entry['summary'] = (
              "A bearer of the cursed bloodline whose Vitae and predatory gifts remain intact while the old Sun, the Society of Shadows, the Veil, Hunger, and the inherited authority of Cain's legacy feel distant rather than cosmically immediate."
          )
          entry['body'] = [
              "The Vampire is still one of the cursed dead. Vitae still answers. Supernatural speed, command, concealment, resilience, feeding, and blood memory function according to the recorded innate abilities and powers. The transition has not replaced the bloodline with an imitation, stripped away undeath, or reduced the Vampire to a biological reconstruction pretending to be supernatural.",
              "The character may have been a newly made Childe of Cain, still learning the etiquette and terror of undeath. They may have been a court predator, a keeper of the Veil, an enforcer charged with silencing dangerous witnesses, a bloodline heir carrying inherited privileges and feuds, or an elder who ruled the Society of Shadows through mortal institutions and lesser undead servants. They may have been ancient enough to regard governments, corporations, religions, and mortal generations as temporary weather.",
              "Every station within the old undead society taught the same foundational rule: humanity must never be allowed to see clearly. Feedings were concealed, supernatural displays suppressed, impossible deaths explained, and internal wars kept beneath mortal notice. The Veil was survival policy hardened into sacred custom. If mortals understood the scale of undead influence, fear would become organization, organization would become fire, and the cursed bloodlines would again be hunted into daylight as they had been in the oldest nights.",
              "That rule feels less pressing here. The civilizations of the Continuum do not inherit the old world's fear, folklore, inquisitions, or buried evidence. They do not know the Vampire's bloodline or the offices of the Society of Shadows. Hiding remains useful whenever secrecy protects the team, but the Veil no longer feels like a law built into existence. It feels like deeply conditioned operational discipline: conceal the feeding, control the witness, prevent scrutiny from becoming coordinated hostility, and never let an avoidable revelation create an enemy civilization.",
              "The heavens provide the first proof that the old curse no longer occupies familiar territory. Night starlight is still the light of suns, yet it does not burn. More astonishingly, direct light from foreign stars does not automatically provoke the lethal hatred associated with the Sun of the Vampire's original world. The curse was pronounced inside another creation, another covenant, and another divine jurisdiction. No Vampire can know whether a foreign star acknowledges the authority that condemned Cain or the mortals who inherited his blood.",
              "The curse therefore recognizes the original Sun and effects that deliberately reproduce or invoke its signature; it does not treat every star in every reality as an obedient executioner. This is an explicit setting rule rather than an invitation for arbitrary stellar rulings. Ordinary night starlight and foreign sunlight do not inflict solar damage unless a specific hazard or supernatural effect states that it carries the old solar curse.",
              "The cursed bloodline's essence still flows through the Vampire. Vitae remains necessary. Blood memory still contains ancestral instincts, techniques, identities, grief, and centuries of inherited expectation. The old hierarchy may no longer have jurisdiction, but its lessons remain carved into behavior. A former neonate may still look for permission. A former courtier may still measure every room as a hierarchy. A keeper of the Veil may instinctively erase evidence before anyone asks. An elder may still expect obedience from people who have never heard the elder's name.",
              "Hunger remains, but it has receded from the center of thought. The Red Thirst resembles a distant migraine, electronic interference behind consciousness, or a signal sounding from beyond several closed doors. It can intensify and still produces the printed consequences of the Hunger track, yet it is no longer an all-consuming command that must be wrestled down every waking moment.",
              "The nearest mortal throat no longer automatically becomes the center of the Vampire's attention. Blood can still smell rich, warm, and sustaining without instantly reducing every person to a vessel. The Vampire may still choose cruelty, indulgence, domination, or predation, but the new distance makes those choices more clearly their own.",
              "This freedom can be more disturbing than the curse. A predator who once blamed every atrocity upon Hunger must now confront the possibility that some acts were chosen. A Veil keeper must decide what secrecy protects rather than obeying secrecy as inherited religion. A newly turned Childe may experience the first genuine mental quiet since death. An ancient elder may find the absence of constant bloodline pressure more frightening than the pressure itself.",
              "Vitae is the Vampire's Resource. Hunger is the Vampire's Pressure. Crimson Velocity controls speed and action economy. Grave Dominion controls predatory authority. Veil of Night controls recognition and concealment. Deathless Resilience controls survival and recovery. Vital Predation controls feeding and function theft. Blood Memory controls inherited information, stored experience, and lineage creation."
          ]

          legacy_table = {
              'title': 'Former Stations Within the Society of Shadows',
              'columns': ['Former Station', 'Old Expectation', 'Continuum Remainder'],
              'rows': [
                  ['Newly Turned Childe', 'Obey a sire, master Hunger, learn secrecy, and survive the first years of undeath.', 'The sire may be unreachable and Hunger is quieter, leaving the Childe with more freedom and less certainty.'],
                  ['Court-Bound Neonate', 'Earn recognition through service, alliances, feeding discipline, and obedience to hidden law.', 'Court instincts remain useful, but no local authority recognizes old rank or prestation.'],
                  ['Keeper of the Veil', 'Suppress witnesses, explain impossible events, and prevent mortal scrutiny from becoming organized resistance.', 'Secrecy remains a tactical capability rather than a universally binding undead commandment.'],
                  ['Bloodline Scion', 'Carry inherited gifts, feuds, customs, and the political weight of a cursed lineage.', 'The bloodline remains within the Vampire, but its old institutions and enemies possess no automatic local jurisdiction.'],
                  ['Hidden Enforcer', 'Punish breaches, hunt uncontrolled predators, and protect the Society of Shadows through sanctioned violence.', 'The skills remain; the sanction does not. Every act of enforcement now requires a chosen authority and purpose.'],
                  ['Elder of the Society of Shadows', 'Rule through patience, mortal institutions, blood-bound servants, and centuries of accumulated obligation.', 'Experience remains immense, but old titles command no one who does not choose to acknowledge them.'],
                  ['Ancient Sovereign', 'Treat dynasties and civilizations as temporary instruments while preserving the bloodline across ages.', 'The Continuum is old enough to resist inherited certainty, forcing the ancient to negotiate with powers outside every familiar hierarchy.']
              ]
          }
          tables = entry.setdefault('tables', [])
          tables = [table for table in tables if table.get('title') != legacy_table['title']]
          tables.insert(0, legacy_table)
          entry['tables'] = tables
          wiki['schemaVersion'] = '0.6.0'
          wiki_path.write_text(json.dumps(wiki, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          sheet_path = Path('blacklight-character-sheet.js')
          text = sheet_path.read_text(encoding='utf-8')
          old = """      <p>${escapeHtml(archetype.theme)}</p>\n      <div class=\"blacklight-weakness-box\"><strong>${escapeHtml(archetype.weakness)}:</strong> ${escapeHtml(archetype.weaknessText)}</div>"""
          new = """      <p>${escapeHtml(archetype.theme)}</p>\n      ${(archetype.lore || []).map(paragraph => `<p>${escapeHtml(paragraph)}</p>`).join('')}\n      <div class=\"blacklight-weakness-box\"><strong>${escapeHtml(archetype.weakness)}:</strong> ${escapeHtml(archetype.weaknessText)}</div>"""
          if old not in text:
              raise SystemExit('Character sheet Archetype summary template not found')
          text = text.replace(old, new, 1)
          sheet_path.write_text(text, encoding='utf-8')

          Path('.github/workflows/one-time-vampire-legacy-expansion.yml').unlink()
          PY
      - name: Commit Vampire legacy expansion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand Vampire bloodline and Society of Shadows legacy"
          git push origin main
