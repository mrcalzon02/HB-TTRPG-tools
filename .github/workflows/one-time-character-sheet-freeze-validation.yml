name: Validate character sheet freeze fix

on:
  push:
    paths:
      - .github/workflows/one-time-character-sheet-freeze-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate sheet scripts and observer safety
        run: |
          node --check blacklight-character-sheet.js
          node --check blacklight-archetype-transition.js
          node --check blacklight-resource-pressure.js
          node --check blacklight-shapechanger-combat-errata.js
          node --check blacklight-experience.js
          python - <<'PY'
          from pathlib import Path

          errata = Path('blacklight-shapechanger-combat-errata.js').read_text(encoding='utf-8')
          pressure = Path('blacklight-resource-pressure.js').read_text(encoding='utf-8')
          sheet = Path('blacklight-character-sheet.js').read_text(encoding='utf-8')
          html = Path('blacklight-character-sheet.html').read_text(encoding='utf-8')

          assert "observe(document.documentElement" not in errata
          assert "document.addEventListener('input', apply)" not in errata
          assert "document.addEventListener('change', apply)" not in errata
          assert "if (quickRules && !quickRules.querySelector('[data-simple-combat-rule]'))" in errata
          assert "new MutationObserver(scheduleRefresh).observe(powerList" in errata
          assert "new MutationObserver(scheduleRefresh).observe(summary" in errata
          assert "requestAnimationFrame(refreshDynamicContent)" in errata
          assert "installCombatErrata()" in pressure
          assert "buildSkills();" in sheet
          assert '<script src="blacklight-resource-pressure.js"></script>' in html
          PY
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/one-time-character-sheet-freeze-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Validate character sheet freeze fix"
          git push origin main
