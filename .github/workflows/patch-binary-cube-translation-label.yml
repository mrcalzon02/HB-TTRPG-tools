name: Patch Binary Cube keyed translation label

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/patch-binary-cube-translation-label.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Patch authoritative renderer and stylesheet
        run: |
          python - <<'PY'
          from pathlib import Path

          renderer_path = Path('binary-cube-visualizer-renderer.js')
          source = renderer_path.read_text()

          replacements = [
            (
              """      this.labelLayer.appendChild(phaseLabel);\n      this.labels.set('trace-phase', phaseLabel);\n    }\n""",
              """      this.labelLayer.appendChild(phaseLabel);\n      this.labels.set('trace-phase', phaseLabel);\n      const translationLabel = document.createElement('span');\n      translationLabel.className = 'cube-visualizer-translation-label';\n      translationLabel.textContent = 'KEYED TRANSLATION';\n      translationLabel.hidden = true;\n      this.labelLayer.appendChild(translationLabel);\n      this.labels.set('translation-point', translationLabel);\n    }\n"""
            ),
            (
              """      const label = this.labels.get('trace-phase');\n      if (label) label.hidden = true;\n      this.render();\n""",
              """      const label = this.labels.get('trace-phase');\n      if (label) label.hidden = true;\n      const translationLabel = this.labels.get('translation-point');\n      if (translationLabel) translationLabel.hidden = true;\n      this.render();\n"""
            ),
            (
              """        selectedPosition: Object.freeze([...selectedPosition]),\n        activePointPosition: Object.freeze([...highlightedPosition])\n      });\n      const label = this.labels.get('trace-phase');\n""",
              """        selectedPosition: Object.freeze([...selectedPosition]),\n        activePointPosition: Object.freeze([...highlightedPosition]),\n        translationPointPosition: translationPoint ? Object.freeze([...translationPoint]) : null\n      });\n      const label = this.labels.get('trace-phase');\n      const translationLabel = this.labels.get('translation-point');\n"""
            ),
            (
              """        const point = trace.pointField[serialState.activePointId];\n        label.textContent = `SERIAL BIT ${serialState.inputCellIndex + 1}/${serialState.pointCount} · ${kind.toUpperCase()} ${bit} · ${(serialState.localTraceTime * 100).toFixed(1)}% ROUTE · INPUT ${serialState.inputCellIndex} → KEY POINT (${point.x}, ${point.y}, ${point.z}) → OUTPUT ${outputCellIndex}`;\n      } else {\n        label.textContent = `TRACE ${(timeline.traceTime * 100).toFixed(1)}% · ${transition.replaceAll('-', ' ').toUpperCase()} · POINT ${selectedPointId} · ${renderedPointIds.length.toLocaleString()}/${trace.pointField.length.toLocaleString()} VISIBLE`;\n      }\n      label.hidden = false;\n""",
              """        const point = trace.pointField[serialState.activePointId];\n        label.textContent = `SERIAL BIT ${serialState.inputCellIndex + 1}/${serialState.pointCount} · ${kind.toUpperCase()} ${bit} · ${(serialState.localTraceTime * 100).toFixed(1)}% ROUTE · INPUT ${serialState.inputCellIndex} → KEY POINT (${point.x}, ${point.y}, ${point.z}) → OUTPUT ${outputCellIndex}`;\n        if (translationLabel) {\n          translationLabel.textContent = `KEYED TRANSLATION · (${point.x}, ${point.y}, ${point.z})`;\n          translationLabel.hidden = false;\n        }\n      } else {\n        label.textContent = `TRACE ${(timeline.traceTime * 100).toFixed(1)}% · ${transition.replaceAll('-', ' ').toUpperCase()} · POINT ${selectedPointId} · ${renderedPointIds.length.toLocaleString()}/${trace.pointField.length.toLocaleString()} VISIBLE`;\n        if (translationLabel) translationLabel.hidden = true;\n      }\n      label.hidden = false;\n"""
            ),
            (
              """      const positions = {'axis-x':[1.5,0,0],'axis-y':[0,1.5,0],'axis-z':[0,0,1.5],...this.directionLabelPositions,'trace-phase':[0,1.52,0]};\n""",
              """      const positions = {'axis-x':[1.5,0,0],'axis-y':[0,1.5,0],'axis-z':[0,0,1.5],...this.directionLabelPositions,'trace-phase':[0,1.52,0]};\n      if (this.traceState?.translationPointPosition) positions['translation-point'] = this.traceState.translationPointPosition;\n"""
            ),
            (
              """        if (name !== 'trace-phase' || this.traceState) label.hidden = hidden;\n""",
              """        if ((name !== 'trace-phase' && name !== 'translation-point') || this.traceState) label.hidden = hidden;\n"""
            )
          ]

          for old, new in replacements:
            if old not in source:
              raise SystemExit('Expected renderer block was not found; refusing to patch a different renderer shape.')
            source = source.replace(old, new, 1)

          renderer_path.write_text(source)

          css_path = Path('binary-cube-visualizer.css')
          css = css_path.read_text()
          anchor = ".cube-visualizer-phase-label{position:absolute;left:0;top:0;padding:7px 11px;border:2px solid rgba(255,255,255,.78);border-radius:9px;background:rgba(7,16,27,.94);color:#fff;font-size:.72rem;font-weight:950;letter-spacing:.05em;white-space:nowrap;box-shadow:0 0 24px rgba(155,210,245,.22)}\n"
          addition = anchor + ".cube-visualizer-translation-label{position:absolute;left:0;top:0;padding:5px 8px;border:1px solid rgba(225,239,255,.82);border-radius:999px;background:rgba(7,16,27,.9);color:#edf7ff;font-size:.62rem;font-weight:950;letter-spacing:.08em;white-space:nowrap;box-shadow:0 0 20px rgba(225,239,255,.28);transform-origin:center bottom}\n"
          if anchor not in css:
            raise SystemExit('Expected phase-label CSS anchor was not found; refusing to patch a different stylesheet shape.')
          css_path.write_text(css.replace(anchor, addition, 1))
          PY
          node --check binary-cube-visualizer-renderer.js
          node scripts/validate-binary-cube-serial-demonstration.mjs
          node scripts/validate-binary-cube-serial-translation-marker.mjs
      - name: Commit authoritative change and remove maintenance workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-binary-cube-translation-label.yml
          git add binary-cube-visualizer-renderer.js binary-cube-visualizer.css
          git commit -m "feat: label keyed serial translation point"
          git push origin HEAD:main
