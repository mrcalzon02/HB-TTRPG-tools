name: One-Time Complete Blacklight Mission Generator Engine

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild derived player constraints after sectional rerolls
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('blacklight-mission-generator.js')
          text = path.read_text(encoding='utf-8')

          marker = "  function buildMission() {\n"
          helper = """  function buildPlayerConstraints(contract, site) {
            return [
              visibilityConstraint(contract.visibility),
              'The declared objective does not authorize unrelated theft, killing, coercion, memory alteration, supernatural binding, or destruction.',
              `Civilian baseline: ${contract.target.civilians}`,
              `Support limitation: ${site.support.limit}`,
              'If the target, location, client motive, identity risk, supernatural obligation, or return path changes materially, pause and renew consent.'
            ];
          }

"""
          if 'function buildPlayerConstraints' not in text:
              if marker not in text:
                  raise SystemExit('buildMission marker missing')
              text = text.replace(marker, helper + marker, 1)

          old_block = """      playerConstraints: [
                visibilityConstraint(contract.visibility),
                'The declared objective does not authorize unrelated theft, killing, coercion, memory alteration, supernatural binding, or destruction.',
                `Civilian baseline: ${contract.target.civilians}`,
                `Support limitation: ${site.support.limit}`,
                'If the target, location, client motive, identity risk, supernatural obligation, or return path changes materially, pause and renew consent.'
              ],"""
          if old_block in text:
              text = text.replace(old_block, '      playerConstraints: buildPlayerConstraints(contract, site),', 1)
          elif 'playerConstraints: buildPlayerConstraints(contract, site)' not in text:
              raise SystemExit('initial playerConstraints block missing')

          old = "        resolution: buildResolution(contract, site, truth),\n        followUps:"
          new = "        resolution: buildResolution(contract, site, truth),\n        playerConstraints: buildPlayerConstraints(contract, site),\n        followUps:"
          text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY
          node --check blacklight-mission-generator.js
      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-integrate-blacklight-mission-generator.yml
          git add blacklight-mission-generator.js
          git commit -m "Complete mission generator derived rerolls"
          git push origin main
