name: Factorio R112 correct boulder-thick 3D shoulder mounts into real thin folded original-source metal
on:
  push:
    branches: [main]
    paths:
      - 'tools/factorio-render-pipeline/source_thin_independent_pressed_plates_r112.py'
      - '.github/workflows/factorio-thin-source-formed-metal-shoulders-r112.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real-thin-forged-source-mounts:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover verified R111 fully editable 3D shoulder casts, never the original Wube sprite
        uses: actions/download-artifact@v4
        with:
          run-id: 41557746960
          name: factorio-r111-continuous-original-source-asymmetric-forged-hinge-volumes
          github-token: ${{ github.token }}
          path: private-ci/r111
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hb-ttrpg-tools/factorio-render-pipeline
          key: factorio-art-env-ubuntu24-blender4.5.15-python3.12-v1
      - name: Install verified pinned Blender 4.5 LTS
        run: python tools/factorio-render-pipeline/bootstrap.py install --evidence-dir private-ci/readiness
      - name: Reconstruct true thin folded volumetric left and right mounting plates, preserve center and render actual source camera/angled geometry
        run: |
          BLENDER="$(python -c "import sys;sys.path.insert(0,'tools/factorio-render-pipeline');import bootstrap;print(bootstrap.find_blender())")"
          "$BLENDER" -b --disable-autoexec --factory-startup -t 2 --python-exit-code 4 \
            --python tools/factorio-render-pipeline/source_thin_independent_pressed_plates_r112.py -- \
            --r111-dir private-ci/r111/output/r111 --out private-ci/output/r112
      - name: Verify physically shallow forged metal not stone-like thick shells, source camera and all unrelated source meshes unchanged
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('private-ci/output/r112')
          r=json.loads((p/'r112_continuous_independent_source_shoulders.json').read_text())
          assert not r['source_art_exported']
          assert not r['source_visual_fidelity_approved']
          assert r['corrects_r111_overthick_metal_not_color']
          assert len(r['candidates'])==4
          assert {c['variant'] for c in r['candidates']}=={
              'r111_thick_original_cast_control','thin_forged_steel_shoulders',
              'stepped_continuous_lap_plates','shallow_pressed_flanged_shoulders'}
          for c in r['candidates']:
              assert not c['source_visual_approved']
              assert c['original_other_parts_and_lower_animation_unchanged']
              assert (p/c['editable_blend']).stat().st_size>100000
              assert (p/c['genuine_angled_3d_render']).stat().st_size>5000
              assert len(c['original_camera_frames'])==2
              for path in c['original_camera_frames'].values():
                  assert (p/path).stat().st_size>5000
              if c['variant']=='r111_thick_original_cast_control':
                  assert c['left_right_real_3d_side_forgings']=={}
              else:
                  metal=c['left_right_real_3d_side_forgings']
                  assert set(metal)=={'1','3'}
                  assert metal['1']['casting']!=metal['3']['casting']
                  assert metal['1']['source_outline_points']!=metal['3']['source_outline_points']
                  for fin in metal.values():
                      assert fin['closed_two_sided_beveled_shell']
                      assert fin['physical_manifold_edges']>40
                      assert .10<fin['new_unified_forged_solid']['camera_depth_extent']<.24
                      assert .11<fin['designed_plate_thickness']<.20
                      assert fin['source_visually_unapproved']
          print('R112_PHYSICALLY_THIN_DISTINCT_SOURCE_SHOULDER_METAL_VERIFIED')
          PY
      - name: Preserve authentic editable Blender scenes plus source and angled renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorio-r112-thin-pressed-metal-original-source-hinge-shoulders
          path: |
            private-ci/output/r112/*.blend
            private-ci/output/r112/*.png
            private-ci/output/r112/*.json
            private-ci/readiness/readiness.json
          if-no-files-found: warn
          retention-days: 14
