name: Correct mortal supernatural aggravated soak hierarchy

on:
  push:
    paths:
      - .github/workflows/one-time-soak-hierarchy-correction.yml

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply hierarchy correction
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          basic_path = Path('data/blacklight-continuum/rules/basic-character-options.json')
          basic = json.loads(basic_path.read_text(encoding='utf-8'))
          basic['schemaVersion'] = '0.15.0'

          vampire = next(a for a in basic['archetypes'] if a['id'] == 'vampire')
          vampire['fortitudeRule'] = (
              'Fortitude equals the highest rank owned in the Deathless Resilience power family, from 0 to 5. '
              'Add Fortitude to permitted Vampire soak rolls against Non-Lethal/Bashing, Lethal, and Disruption damage. '
              'Fortitude does not soak Aggravated damage unless a separate ability explicitly grants resistance or immunity to that exact damage.'
          )
          vampire['weaknessText'] = (
              'Ordinary night starlight and direct light from foreign stars do not automatically harm you. The curse reacts only to direct light from the original Sun, artificial radiation specifically calibrated to reproduce that Sun\'s cursed signature, or a supernatural effect explicitly invoking the original solar curse upon Cain\'s bloodline. Such exposure inflicts 2 Aggravated damage successes per round. It cannot be soaked by Resilience, Armor, Fortitude, or Undead Soak; only an ability explicitly granting resistance or immunity to that exact solar Aggravated damage can alter it. It also prevents Cold Repair and other vampiric healing until the end of your next round after exposure ends. Hunger remains a Pressure track: it is quieter than in the former universe, but its printed penalties and consequences still apply when it rises.'
          )
          undead = next(a for a in vampire['innateAbilities'] if a['name'] == 'Undead Soak')
          undead['effect'] = (
              'Against Non-Lethal/Bashing, roll Resilience + eligible Armor + Fortitude, cancel damage successes, then halve the remainder and round down. '
              'Against Lethal, roll Resilience + eligible Armor + Fortitude and take the full remainder. '
              'Aggravated damage bypasses Resilience, Armor, Fortitude, and Undead Soak; only a separate ability explicitly granting resistance or immunity to that exact Aggravated damage can alter it. '
              'Ordinary firearms normally deal Non-Lethal/Bashing to you; anti-materiel, incendiary, explosive, specialized anti-undead, or explicitly more destructive ammunition may deal Lethal or Aggravated damage.'
          )
          deathless = next(f for f in vampire['powerFamilies'] if f['name'] == 'Deathless Resilience')
          deathless['description'] = (
              'Vampiric Fortitude, dormancy, healing, armor, recovery, and persistence after apparently fatal harm. '
              'Your Fortitude rating equals the highest rank owned in this family and applies to permitted Non-Lethal/Bashing, Lethal, and Disruption soak rolls, but not to Aggravated damage unless an ability explicitly says otherwise.'
          )

          shape = next(a for a in basic['archetypes'] if a['id'] == 'shapechanger')
          living = next(a for a in shape['innateAbilities'] if a['name'] == 'Living Soak')
          living['effect'] = (
              'In social form, use ordinary mortal soak: Resilience + eligible Armor against Non-Lethal/Bashing, Armor only against Lethal, and no soak against Aggravated damage. '
              'In hunting or war form, roll Resilience + eligible Armor + Archetype Rating against Non-Lethal/Bashing or Lethal damage. '
              'Every result of 6+ cancels one damage success. Aggravated damage bypasses Resilience, Armor, Archetype Rating, and Living Soak unless a separate ability explicitly grants resistance or immunity to that exact damage. '
              'Living Soak does not apply to Disruption, Pressure, Exposure, or Death Marks.'
          )
          basic_path.write_text(json.dumps(basic, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          errata_path = Path('data/blacklight-continuum/rules/shapechanger-combat-errata.json')
          errata = json.loads(errata_path.read_text(encoding='utf-8'))
          errata['schemaVersion'] = '2.1.0'
          errata['replacements']['Living Soak'] = living['effect']
          errata_path.write_text(json.dumps(errata, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          foundation_path = Path('data/blacklight-continuum/wiki/foundation-rules.json')
          foundation = json.loads(foundation_path.read_text(encoding='utf-8'))
          foundation['schemaVersion'] = '0.6.0'
          core = next(e for e in foundation['entries'] if e['id'] == 'blacklight-d10-foundation')
          core['body'][1] = (
              'After an attack hits, roll its damage dice. A Firearms attack adds one damage die for every critical success on the final attack roll. '
              'Mortals roll Resilience + eligible Armor against Non-Lethal/Bashing damage and eligible Armor only against Lethal damage. '
              'Supernatural characters use only soak explicitly granted by their recorded Archetype or abilities. Aggravated damage bypasses Resilience, Armor, Fortitude, Living Soak, and every generic soak procedure unless an ability explicitly names an exact immunity or resistance.'
          )
          derived = next(t for t in core['tables'] if t['title'] == 'Derived Traits')
          for row in derived['rows']:
              if row[0] in ('Base Bashing Soak', 'Protection'):
                  row[0] = 'Base Non-Lethal Soak'
                  row[1] = 'Resilience + eligible Armor; Lethal and supernatural soak use separate permissions'
          foundation_path.write_text(json.dumps(foundation, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          archetypes_path = Path('data/blacklight-continuum/wiki/basic-archetypes.json')
          archetypes = json.loads(archetypes_path.read_text(encoding='utf-8'))
          archetypes['schemaVersion'] = '0.14.0'
          sheet = next(e for e in archetypes['entries'] if e['id'] == 'blacklight-basic-character-sheet')
          derived = next(t for t in sheet['tables'] if t['title'] == 'Derived Traits')
          for row in derived['rows']:
              if row[0] in ('Protection', 'Base Bashing Soak'):
                  row[0] = 'Base Non-Lethal Soak'
                  row[1] = 'Resilience + eligible Armor; Lethal and supernatural soak use separate permissions'

          vampire_entry = next(e for e in archetypes['entries'] if e['id'] == 'vampire-archetype')
          vampire_entry['body'] = [p for p in vampire_entry['body'] if not p.startswith('Vampire soak follows deathless biology')]
          vampire_entry['body'].insert(1, (
              'Vampire soak follows deathless biology. Against Non-Lethal/Bashing, roll Resilience + Armor + Fortitude, cancel successes, then halve the remainder. '
              'Against Lethal, roll Resilience + Armor + Fortitude and take the full remainder. Ordinary gunfire normally deals Non-Lethal/Bashing to Vampires. '
              'Aggravated damage bypasses Resilience, Armor, Fortitude, and Undead Soak unless a separate ability explicitly grants resistance or immunity to that exact damage.'
          ))
          shape_entry = next(e for e in archetypes['entries'] if e['id'] == 'shapechanger-archetype')
          shape_entry['body'] = [p for p in shape_entry['body'] if not p.startswith('Living Soak is rolled after damage')]
          shape_entry['body'].insert(1, (
              'Living Soak is rolled after damage. Social form uses mortal permissions: Resilience + Armor against Non-Lethal/Bashing and Armor only against Lethal. '
              'Hunting or war form rolls Resilience + eligible Armor + Archetype Rating against Non-Lethal/Bashing or Lethal damage. '
              'Aggravated damage bypasses Living Soak and every component of that pool unless a separate ability explicitly grants resistance or immunity to that exact damage.'
          ))
          archetypes_path.write_text(json.dumps(archetypes, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          module_path = Path('data/blacklight-continuum/wiki/combat-example-simple.json')
          module = json.loads(module_path.read_text(encoding='utf-8'))
          module['schemaVersion'] = '3.1.0'
          module['description'] = 'A combat teaching module using attack rolls, firearm critical damage dice, mortal Resilience against Non-Lethal damage, Armor against mortal Lethal damage, explicit supernatural soak, Aggravated bypass, Exposure, Cohesion, Pressure, rescue, and death.'

          procedure = next(e for e in module['entries'] if e['id'] == 'combat-foundation-procedure')
          procedure['body'] = [
              'Build the attack pool from Attribute + Skill. Add the target\'s current Exposure as attack dice. Subtract range, cover, condition, and equipment penalties.',
              'Roll against Defense Difficulty, equal to ceiling(Guard divided by two). Results of 6 through 10 are successes. A 10 on the final attack roll is also a critical success.',
              'If the attack misses, stop. If it hits, roll the attack\'s damage dice. A successful Firearms attack adds one damage die for every critical success on the final attack roll. Ordinary extra successes do not add damage dice.',
              'Every result of 6 through 10 on the damage roll is one damage success. Against Non-Lethal/Bashing, mortals roll Resilience + eligible Armor. Against Lethal, mortals roll eligible Armor only. Supernatural characters use only soak explicitly printed by their Archetype or abilities.',
              'Aggravated damage receives no ordinary soak roll. It bypasses Resilience, Armor, Fortitude, Living Soak, and generic supernatural soak. Only a specific ability explicitly naming an exact immunity or resistance can alter it.',
              'Each legal soak success cancels one damage success. Mark every uncancelled success. A 10 on a damage or soak roll is normally only one success.'
          ]
          procedure['tables'][0]['rows'][4] = ['5. Soak Permission', 'Non-Lethal: mortal Resilience + Armor; Lethal: mortal Armor only; supernatural: printed soak only']
          procedure['tables'][0]['rows'][5] = ['6. Aggravated', 'No ordinary soak; only exact immunity or resistance applies']
          procedure['tables'][0]['rows'][6] = ['7. Record', 'Each legal soak success cancels one damage success; mark the rest']

          damage_entry = next(e for e in module['entries'] if e['id'] == 'damage-types-and-soak')
          damage_entry['title'] = 'Non-Lethal, Lethal, Aggravated, and Disruption'
          damage_entry['summary'] = 'Damage type determines whether mortal Resilience, Armor, a printed supernatural soak ability, or no ordinary soak can apply.'
          damage_entry['body'] = [
              'Non-Lethal/Bashing is blunt, concussive, exhausting, or bruising damage. A mortal or human-adjacent character rolls Resilience + eligible Armor to soak it.',
              'Lethal damage cuts, penetrates, burns, crushes, or destroys essential living tissue. A mortal cannot add Resilience to a Lethal soak pool and rolls eligible Armor only.',
              'A supernatural character uses only the soak pool explicitly printed by its Archetype, form, power, item, or ability. Supernatural status alone grants no defense. When no supernatural soak applies, use ordinary mortal permissions.',
              'Aggravated damage is supernatural, cursed, consecrated, reality-destroying, or otherwise fundamentally hostile. It bypasses Resilience, Armor, Fortitude, Living Soak, and generic supernatural soak. Only an ability explicitly naming resistance or immunity to that exact damage can alter it.',
              'Disruption damages memory, identity, noospheric continuity, or control. It uses Resolve and explicit continuity protection when its attack record allows soak.'
          ]
          damage_entry['tables'][0]['title'] = 'Mortal and General Soak Permissions'
          damage_entry['tables'][0]['rows'] = [
              ['Non-Lethal / Bashing', 'Mortals: Resilience + eligible Armor'],
              ['Lethal', 'Mortals: eligible Armor only'],
              ['Supernatural Soak', 'Use only the exact pool printed by an Archetype or ability'],
              ['Aggravated', 'No ordinary soak; exact immunity or resistance only'],
              ['Disruption', 'Resolve + explicit continuity protection when permitted']
          ]

          vampire_module = next(e for e in module['entries'] if e['id'] == 'vampire-soak-and-fortitude')
          vampire_module['summary'] = 'The dead body uses Undead Soak against Non-Lethal and Lethal damage, but Aggravated bypasses Fortitude unless an exact ability says otherwise.'
          vampire_module['body'] = [
              'A Vampire is not sustained by functioning mortal organs. Bruising, rupturing, or puncturing tissue is less decisive when cursed blood and deathless continuity move the body.',
              'Fortitude equals the highest Deathless Resilience rank the Vampire owns, from 0 to 5. Add it to permitted Vampire soak rolls against Non-Lethal/Bashing, Lethal, and Disruption damage.',
              'Against Non-Lethal/Bashing, roll Resilience + eligible Armor + Fortitude. Cancel damage successes normally, then halve the remainder and round down.',
              'Against Lethal, roll Resilience + eligible Armor + Fortitude. Do not halve what remains.',
              'Aggravated damage bypasses Resilience, Armor, Fortitude, and Undead Soak. The Vampire receives no normal soak roll. Only a separate ability explicitly granting immunity or resistance to that exact Aggravated damage can alter it.',
              'Ordinary firearms deal Non-Lethal/Bashing to Vampires. Anti-materiel fire, vehicle-mounted weapons, explosive or incendiary ammunition, specialized anti-undead ammunition, and attacks explicitly labeled otherwise may deal Lethal or Aggravated damage.'
          ]
          vampire_module['tables'][0]['rows'] = [
              ['Non-Lethal / Bashing', 'Resilience + Armor + Fortitude', 'Halve remaining damage, round down'],
              ['Lethal', 'Resilience + Armor + Fortitude', 'Take all remaining damage'],
              ['Aggravated', 'No ordinary soak', 'Only exact immunity or resistance can alter damage'],
              ['Disruption', 'Resolve + Fortitude + explicit continuity protection', 'Take all remaining damage']
          ]
          vampire_module['tables'][1]['rows'][0][1] = 'A punch produces 3 Non-Lethal/Bashing successes'
          vampire_module['tables'][1]['rows'][2][1] = '3 - 1 = 2 Non-Lethal/Bashing'
          vampire_module['tables'][1]['rows'][3][1] = '2 is halved to 1 Non-Lethal/Bashing'
          vampire_module['tables'][2] = {
              'title': 'Vampire Aggravated Example',
              'columns': ['Stage', 'Result'],
              'rows': [
                  ['Damage Roll', 'Supernatural fire produces 3 Aggravated successes'],
                  ['Ordinary Soak', 'None: Resilience, Armor, Fortitude, and Undead Soak are bypassed'],
                  ['Exact Resistance', 'The character has no ability explicitly resisting this supernatural fire'],
                  ['Damage Marked', '3 Aggravated']
              ]
          }

          shape_module = next(e for e in module['entries'] if e['id'] == 'shapechanger-living-soak')
          shape_module['summary'] = 'Living Soak provides an explicit supernatural soak pool against Non-Lethal and Lethal damage while transformed, but never against Aggravated by default.'
          shape_module['body'] = [
              'In social form, the Shapechanger uses mortal permissions: Resilience + Armor against Non-Lethal/Bashing, Armor only against Lethal, and no ordinary soak against Aggravated.',
              'In hunting or war form, Living Soak permits Resilience against both Non-Lethal/Bashing and Lethal damage. Roll Resilience + eligible Armor + Archetype Rating. Every success cancels one damage success.',
              'Living Soak costs no Fury and requires no Reaction. Low Vitality does not automatically reduce the pool.',
              'Aggravated damage bypasses Resilience, Armor, Archetype Rating, and Living Soak unless a separate ability explicitly grants resistance or immunity to that exact damage. Living Soak also does not apply to Disruption.'
          ]
          shape_module['tables'][0]['columns'] = ['State', 'Non-Lethal / Bashing', 'Lethal', 'Aggravated']
          shape_module['tables'][0]['rows'] = [
              ['Social form', 'Resilience + Armor', 'Armor only', 'No ordinary soak'],
              ['Hunting or war form', 'Resilience + Armor + Archetype Rating', 'Resilience + Armor + Archetype Rating', 'No ordinary soak; exact immunity or resistance only']
          ]
          module_path.write_text(json.dumps(module, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          index_path = Path('data/blacklight-continuum/wiki/wiki-index.json')
          index = json.loads(index_path.read_text(encoding='utf-8'))
          index['schemaVersion'] = '0.19.0'
          index['description'] = (
              'Blacklight Continuum combat uses an attack roll, a damage roll after a hit, and one legal soak roll. '
              'Mortals use Resilience against Non-Lethal/Bashing and Armor only against Lethal. Supernatural characters use only explicitly recorded soak. '
              'Aggravated damage bypasses Resilience, Armor, Fortitude, Living Soak, and generic supernatural soak unless an exact immunity or resistance says otherwise.'
          )
          index['nextDevelopmentAreas'] = [
              'balance testing for mortal Non-Lethal soak, mortal Armor-only Lethal soak, Vampire Undead Soak, Shapechanger Living Soak, and absolute Aggravated bypass'
          ] + [a for a in index['nextDevelopmentAreas'] if not a.startswith('balance testing for damage dice')]
          index_path.write_text(json.dumps(index, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          html_path = Path('blacklight-combat-example.html')
          html = html_path.read_text(encoding='utf-8')
          html = html.replace(
              'A worked encounter using attack rolls, firearm critical damage dice, rolled damage, Bashing, Lethal, Aggravated and Disruption soak permissions, Vampire Fortitude, Shapechanger Living Soak, Pressure, rescue, and death.',
              'A worked encounter using mortal Resilience against Non-Lethal damage, Armor-only mortal Lethal soak, explicit supernatural soak, absolute Aggravated bypass, firearm critical damage dice, Pressure, rescue, and death.'
          )
          html_path.write_text(html, encoding='utf-8')

          Path('.github/workflows/one-time-soak-hierarchy-correction.yml').unlink()
          PY
      - name: Validate and commit
        run: |
          node --check blacklight-shapechanger-combat-errata.js
          node --check blacklight-combat-example.js
          node --check blacklight-combat-example-entry.js
          python - <<'PY'
          import json
          from pathlib import Path

          combat = json.loads(Path('data/blacklight-continuum/rules/combat-foundation-simple.json').read_text())
          basic = json.loads(Path('data/blacklight-continuum/rules/basic-character-options.json').read_text())
          module = json.loads(Path('data/blacklight-continuum/wiki/combat-example-simple.json').read_text())
          foundation = json.loads(Path('data/blacklight-continuum/wiki/foundation-rules.json').read_text())
          archetypes = json.loads(Path('data/blacklight-continuum/wiki/basic-archetypes.json').read_text())
          index = json.loads(Path('data/blacklight-continuum/wiki/wiki-index.json').read_text())

          assert combat['schemaVersion'] == '3.1.0'
          assert 'Resilience + eligible Armor' in combat['soakProcedure']['mortalNonLethal']
          assert 'eligible Armor only' in combat['soakProcedure']['mortalLethal']
          assert 'bypasses Resilience' in combat['soakProcedure']['aggravatedBypass']
          assert 'does not soak Aggravated damage by itself' in combat['soakByCharacter']['vampire']['fortitudeRating']
          assert 'No soak roll' in combat['soakByCharacter']['vampire']['aggravated']
          assert 'No soak roll' in combat['soakByCharacter']['shapechanger']['aggravated']

          vampire = next(a for a in basic['archetypes'] if a['id'] == 'vampire')
          assert 'does not soak Aggravated' in vampire['fortitudeRule']
          assert 'bypasses Resilience' in next(a for a in vampire['innateAbilities'] if a['name'] == 'Undead Soak')['effect']
          shape = next(a for a in basic['archetypes'] if a['id'] == 'shapechanger')
          assert 'Aggravated damage bypasses' in next(a for a in shape['innateAbilities'] if a['name'] == 'Living Soak')['effect']

          text = json.dumps(module)
          assert 'No ordinary soak' in text
          assert 'exact immunity or resistance' in text
          core = next(e for e in foundation['entries'] if e['id'] == 'blacklight-d10-foundation')
          assert any('Mortals roll Resilience' in p for p in core['body'])
          sheet = next(e for e in archetypes['entries'] if e['id'] == 'blacklight-basic-character-sheet')
          derived = next(t for t in sheet['tables'] if t['title'] == 'Derived Traits')
          assert any(row[0] == 'Base Non-Lethal Soak' for row in derived['rows'])
          assert index['schemaVersion'] == '0.19.0'
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Correct soak hierarchy by damage type"
          git push origin main
