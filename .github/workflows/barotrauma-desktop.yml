name: Verify Barotrauma desktop application

on:
  push:
    branches: ["main"]
    paths:
      - "desktop/barotrauma-world-sim/**"
      - ".github/workflows/barotrauma-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "barotrauma-desktop-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  java-17-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build and verify without Gradle
        shell: pwsh
        run: ./desktop/barotrauma-world-sim/toolbox.ps1 verify
