name: Verify Barotrauma desktop application

on:
  push:
    branches: ["main"]
    paths:
      - "desktop/barotrauma-world-sim/**"
      - ".github/workflows/barotrauma-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "barotrauma-desktop-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  java-17-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.1"
          cache-provider: basic

      - name: Compile desktop application
        run: gradle -p desktop/barotrauma-world-sim clean compileJava --no-daemon

      - name: Verify identity and session contracts
        run: |
          gradle -p desktop/barotrauma-world-sim classes --no-daemon
          java -cp "desktop/barotrauma-world-sim/build/classes/java/main" \
            io.github.mrcalzon02.barotrauma.domain.identity.IdentityContracts
          java -cp "desktop/barotrauma-world-sim/build/classes/java/main" \
            io.github.mrcalzon02.barotrauma.desktop.session.DesktopWorldSession

      - name: Verify compatibility and storage contracts
        run: |
          gradle -p desktop/barotrauma-world-sim verifyWorldStore --no-daemon
          java -cp "desktop/barotrauma-world-sim/build/classes/java/main" \
            io.github.mrcalzon02.barotrauma.compatibility.web.WebSuiteV22Inspector --verify
          java -cp "desktop/barotrauma-world-sim/build/classes/java/main" \
            io.github.mrcalzon02.barotrauma.compatibility.official.BarotraumaSaveInspector --verify
          java -cp "desktop/barotrauma-world-sim/build/classes/java/main" \
            io.github.mrcalzon02.barotrauma.persistence.WorldStorageContracts
