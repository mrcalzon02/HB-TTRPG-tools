name: Factorio R110 genuine original-sprite asymmetric cast hinge geometry
on:
  push:
    branches: [main]
    paths:
      - 'tools/factorio-render-pipeline/source_individual_hinge_casts_r110.py'
      - '.github/workflows/factorio-original-cast-hinges-r110.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  true-blender-asymmetric-upper-cast-reconstruction:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover exact physically verified R109 editable source-shaped geometry
        uses: actions/download-artifact@v4
        with:
          run-id: 41546823776
          name: factorio-r109-genuine-flared-individual-fin-shells-and-rolled-metal-tip-models
          github-token: ${{ github.token }}
          path: private-ci/r109
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hb-ttrpg-tools/factorio-render-pipeline
          key: factorio-art-env-ubuntu24-blender4.5.15-python3.12-v1
      - name: Verify pinned original Blender 4.5 LTS camera and native geometry renderer
        run: python tools/factorio-render-pipeline/bootstrap.py install --evidence-dir private-ci/readiness
      - name: Sculpt individual real R89 source hinge castings and R49 central saddle, preserve original 3D fins and animated lower motor
        run: |
          BLENDER="$(python -c "import sys;sys.path.insert(0,'tools/factorio-render-pipeline');import bootstrap;print(bootstrap.find_blender())")"
          "$BLENDER" -b --disable-autoexec --factory-startup -t 2 --python-exit-code 4 \
            --python tools/factorio-render-pipeline/source_individual_hinge_casts_r110.py -- \
            --r109-dir private-ci/r109/output/r109 --out private-ci/output/r110
      - name: Verify all candidate forms are actual nonidentical 3D cast meshes with saved reopen and original animation invariant
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          out=Path('private-ci/output/r110')
          r=json.loads((out/'r110_real_asymmetric_hinge_cast_meshes.json').read_text())
          assert not r['private_source_art_exported']
          assert not r['source_visual_fidelity_approved']
          assert len(r['candidates'])==4
          names=[x['variant'] for x in r['candidates']]
          assert len(set(names))==4
          for i,item in enumerate(r['candidates']):
              assert item['surrounding_engine_fins_and_animation_unchanged']
              assert item['source_visual_match_not_approved']
              assert (out/item['editable_blend']).stat().st_size>100000
              assert (out/item['angled_3d_occupancy_view']).stat().st_size>5000
              assert len(item['native_original_camera_frames'])==2
              for name in item['native_original_camera_frames'].values():
                  assert (out/name).stat().st_size>5000
              if i==0:
                  assert not item['actual_3d_rebuilt_existing_mounts']
                  continue
              casts=item['actual_3d_rebuilt_existing_mounts']
              assert set(casts)=={'1','2','3'}
              for side in ('1','3'):
                  data=casts[side]
                  assert data['3d_vertices']>=70
                  assert data['physical_faces']>40
                  assert data['max_local_vertex_displacement']>.012
                  assert data['source_region_layers']==['heel','upper']
                  assert data['original_R89_body_anchor_geometry_intact']
              center=casts['2']
              assert center['real_3d_vertices']==60
              assert center['max_local_vertex_displacement']>.01
              assert center['physical_contact_station_rows_unchanged']==[0,5]
          print('R110_GENUINE_INDEPENDENT_SOURCE_CAST_MESHES_SAVED_REOPENED_PASS')
          PY
      - name: Upload only original Blender scene geometry and actual rendered tests, never proprietary Wube source sprites
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorio-r110-real-original-source-bespoke-hinge-cast-3d-models
          path: |
            private-ci/output/r110/*.blend
            private-ci/output/r110/*.png
            private-ci/output/r110/*.json
            private-ci/readiness/readiness.json
          if-no-files-found: warn
          retention-days: 14
