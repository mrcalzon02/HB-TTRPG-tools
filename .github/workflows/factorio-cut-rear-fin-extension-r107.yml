name: Factorio R107 real source-driven rear fin cutoff and separate capped metal
on:
  push:
    branches: [main]
    paths:
      - 'tools/factorio-render-pipeline/physical_cut_separate_source_fins_r107.py'
      - '.github/workflows/factorio-cut-rear-fin-extension-r107.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  physical-rear-fin-stop-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover exact verified R103 editable Blender models, never private Wube original sprite
        uses: actions/download-artifact@v4
        with:
          run-id: 41516311501
          name: factorio-r104-source-true-3d-forging-and-nozzle-baffle-editable-composites
          github-token: ${{ github.token }}
          path: private-ci/r104
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hb-ttrpg-tools/factorio-render-pipeline
          key: factorio-art-env-ubuntu24-blender4.5.15-python3.12-v1
      - name: Install verified source-native camera Blender 4.5 LTS
        run: python tools/factorio-render-pipeline/bootstrap.py install --evidence-dir private-ci/readiness
      - name: Physically sever obsolete rear root strips from real slotted R21 upper metal fins, cap new ends, render original source camera
        run: |
          BLENDER="$(python -c "import sys;sys.path.insert(0,'tools/factorio-render-pipeline');import bootstrap;print(bootstrap.find_blender())")"
          "$BLENDER" -b --disable-autoexec --factory-startup -t 2 --python-exit-code 4 \
            --python tools/factorio-render-pipeline/physical_cut_separate_source_fins_r107.py -- \
            --r104-dir private-ci/r104/output/r103 \
            --out private-ci/output/r107
      - name: Confirm actual 3D end-capped fin cuts, preserved source holes/heat tint/lower animation and real re-opened candidate meshes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('private-ci/output/r107')
          r=json.loads((p/'r107_physical_aft_fin_cutoff_cases.json').read_text())
          assert not r['source_sprite_pixels_exported']
          assert not r['source_fidelity_approved']
          assert r['old_mandatory_mount_contact_heuristic_deliberately_superseded']
          assert len(r['candidates'])==12
          assert len(r['original_blends_verification'])==2
          for case in r['candidates']:
              assert (p/case['frame1']).stat().st_size>5000
              assert (p/case['frame33']).stat().st_size>5000
              assert case['camera_original_lower_motion_other_forgings_and_nozzle_unchanged']
              if case['editable_blend']:
                  assert (p/case['editable_blend']).stat().st_size>100000
              for fin in case['real_fins_with_proximal_sheet_cutoff'].values():
                  assert fin['old_real_sheet_vertices']==220
                  assert fin['new_real_sheet_vertices']==198
                  assert fin['root_sheet_metal_physically_removed']
                  assert fin['rear_end_actual_cap_quads']==10
                  assert fin['both_real_metal_skins_closed_manifold']
                  assert fin['source_heat_tint_corners_retained']
                  assert fin['all_row2_to_row9_fin_geometry_unchanged']
                  assert fin['new_true_cut_end_station_y']<fin['former_root_station_y']
                  assert fin['new_true_cut_end_station_y']>=fin['first_slit_station_y']
          print('R107_REAL_PHYSICAL_REAR_FIN_CUTOFF_AND_SOURCE_NATIVE_BLENDER_MESH_VERIFIED')
          PY
      - name: Publish original Blender scenes and actual native render frames, never original user source art
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorio-r107-actual-aft-fin-termination-source-model-candidates
          path: |
            private-ci/output/r107/*.blend
            private-ci/output/r107/*.png
            private-ci/output/r107/*.json
            private-ci/readiness/readiness.json
          if-no-files-found: warn
          retention-days: 14
