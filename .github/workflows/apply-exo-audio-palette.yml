name: Apply EXO audio palette integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-exo-audio-palette.yml'
      - 'scripts/apply-exo-audio-palette.py'

permissions:
  contents: write

concurrency:
  group: apply-exo-audio-palette
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase onto current main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Apply authoritative EXO audio integration
        run: python3 scripts/apply-exo-audio-palette.py
      - name: Validate JavaScript
        run: |
          node --check blacklight-exo-control-audio.js
          node --check blacklight-exo-crew-operations.js
          node --check blacklight-exo-repair-operations.js
      - name: Verify shared module loads before consumers
        run: |
          grep -B1 'blacklight-exo-crew-operations.js' blacklight-exo-crew-operations.html | grep 'blacklight-exo-control-audio.js'
          grep -B1 'blacklight-exo-repair-operations.js' blacklight-exo-repair-operations.html | grep 'blacklight-exo-control-audio.js'
      - name: Commit directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Integrate archive mechanical SFX across EXO controls"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
