name: One-Time Integrate Veteran Reorientation

on:
  push:
    paths:
      - '.github/workflows/one-time-integrate-veteran-reorientation.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Link module and update Blacklight index
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          index_html = Path('index.html')
          text = index_html.read_text(encoding='utf-8')
          marker = '  <script src="blacklight-random-character-entry.js"></script>\n'
          addition = marker + '  <script src="blacklight-veteran-reintroduction-entry.js"></script>\n'
          if 'blacklight-veteran-reintroduction-entry.js' not in text:
              if marker not in text:
                  raise SystemExit('index.html random-character entry marker missing')
              text = text.replace(marker, addition, 1)
              index_html.write_text(text, encoding='utf-8')

          creation = Path('blacklight-character-creation.html')
          text = creation.read_text(encoding='utf-8')
          marker = '        <a class="secondary-action" href="blacklight-character-sheet.html">Open Existing Character Sheet</a>\n'
          addition = marker + '        <a class="secondary-action" href="blacklight-veteran-reintroduction.html">Returning Operative Reorientation</a>\n'
          if 'blacklight-veteran-reintroduction.html' not in text:
              if marker not in text:
                  raise SystemExit('character creation sheet-link marker missing')
              text = text.replace(marker, addition, 1)
              creation.write_text(text, encoding='utf-8')

          random_page = Path('blacklight-random-character.html')
          text = random_page.read_text(encoding='utf-8')
          marker = '        <a class="secondary-action" href="blacklight-character-creation.html">Guided Character Creation</a>\n'
          addition = marker + '        <a class="secondary-action" href="blacklight-veteran-reintroduction.html">Veteran Reorientation</a>\n'
          if 'blacklight-veteran-reintroduction.html' not in text:
              if marker not in text:
                  raise SystemExit('random-character guided-creation marker missing')
              text = text.replace(marker, addition, 1)
              random_page.write_text(text, encoding='utf-8')

          wiki_path = Path('data/blacklight-continuum/wiki/wiki-index.json')
          wiki = json.loads(wiki_path.read_text(encoding='utf-8'))
          wiki['schemaVersion'] = '0.25.0'
          wiki['description'] = 'Blacklight Continuum now includes guided new-operative induction, seeded random creation, a twenty-four-stage returning-operative reorientation, explicit physical and social conflict procedures, and a searchable capability-first equipment foundation.'
          wiki['veteranReintroductionModule'] = 'blacklight-veteran-reintroduction.html'
          wiki['veteranReintroductionData'] = 'data/blacklight-continuum/wiki/veteran-reintroduction.json'
          pack = 'data/blacklight-continuum/wiki/veteran-reintroduction.json'
          packs = wiki.setdefault('packs', [])
          if pack not in packs:
              insertion = packs.index('data/blacklight-continuum/wiki/random-character-generator.json') + 1 if 'data/blacklight-continuum/wiki/random-character-generator.json' in packs else len(packs)
              packs.insert(insertion, pack)
          scope = wiki.setdefault('completedScope', {})
          scope['wikiEntries'] = 81
          scope['nativePacks'] = 11
          scope['veteranReintroductionModules'] = 1
          scope['veteranReintroductionStages'] = 24
          scope['blackLightCompanyStatusOptions'] = 6
          scope['lunarConvocationContinuityProcedures'] = 1
          scope['veteranContinuitySheetTransfers'] = 1
          next_areas = wiki.setdefault('nextDevelopmentAreas', [])
          item = 'live browser playtest of the twenty-four-stage veteran reorientation, response replacement, restart, export, and character-sheet attachment'
          if item not in next_areas:
              next_areas.insert(0, item)
          wiki_path.write_text(json.dumps(wiki, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit integration and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-integrate-veteran-reorientation.yml
          git add index.html blacklight-character-creation.html blacklight-random-character.html data/blacklight-continuum/wiki/wiki-index.json
          git commit -m "Integrate BlackLight veteran reorientation"
          git push origin main
