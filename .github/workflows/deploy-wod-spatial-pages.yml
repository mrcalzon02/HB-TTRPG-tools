name: Deploy World of Darkness Spatial Engine to Pages

on:
  push:
    branches: [main]
    paths:
      - 'character-sheet-title.js'
      - 'world-of-darkness-*.js'
      - 'data/world-of-darkness/**'
      - 'docs/world-of-darkness-milestones.md'
      - 'source-page-references/chronicle-spatial-engine.source.json'
      - 'scripts/ingest-wod-*.mjs'
      - 'scripts/wod-world-scan-package-factory.mjs'
      - 'scripts/enrich-wod-location-context.mjs'
      - 'scripts/validate-wod-*.mjs'
      - 'scripts/run-wod-detail-diversity-validation.mjs'
      - '.github/workflows/ingest-wod-world-scan-batch.yml'
      - '.github/workflows/deploy-wod-spatial-pages.yml'
      - '.github/workflows/validate-wod-world-scan-overlay.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: wod-spatial-pages
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check World of Darkness JavaScript syntax
        run: |
          node --check character-sheet-title.js
          node --check world-of-darkness-spatial-loader.js
          node --check world-of-darkness-spatial-config-compat.js
          node --check world-of-darkness-lightweight-map-core.js
          node --check world-of-darkness-detail-diversity-core.js
          node --check world-of-darkness-radial-location-loader.js
          node --check world-of-darkness-radial-scan-compat.js
          node --check world-of-darkness-location-package-bridge.js
          node --check world-of-darkness-context-aware-variants.js
          node --check scripts/ingest-wod-location-package.mjs
          node --check scripts/enrich-wod-location-context.mjs
          node --check scripts/wod-world-scan-package-factory.mjs
          node --check scripts/ingest-wod-world-scan-rescan-v3.mjs
          node --check scripts/validate-wod-unified-global-rescan.mjs

      - name: Validate World of Darkness spatial contracts
        run: |
          node scripts/validate-wod-location-inventory.mjs
          node scripts/validate-wod-world-seed-packages.mjs
          node scripts/validate-wod-context-aware-variants.mjs
          node scripts/validate-wod-detail-diversity.mjs
          node scripts/validate-wod-unified-global-rescan.mjs
          node scripts/validate-wod-map-only-core.mjs
          node scripts/validate-wod-world-scan-overlay.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record successful WOD Pages deployment
        env:
          DEPLOYED_SHA: ${{ github.sha }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const receipt = {
            receiptType: 'wodSpatialPagesDeployment',
            schemaVersion: '1.1.0',
            status: 'passed',
            deployedCommit: process.env.DEPLOYED_SHA,
            pageUrl: process.env.PAGE_URL,
            workflow: '.github/workflows/deploy-wod-spatial-pages.yml',
            deployedAt: new Date().toISOString(),
            compatibilityVersion: '2.7.0',
            regressionChecks: 17,
            unifiedSupernaturalOrAdjacentPercent: 76.19,
            singleCatalogSupernaturalOrAdjacentPercent: 42.86,
            unifiedCatalogs: ['vampire', 'werewolf', 'breeds', 'hunter', 'changeling', 'mage'],
            globalGeneratorVersion: 'world-seeded-cross-catalog-server-rescan-3.1.0',
            persistedCatalogIdentity: true
          };
          fs.mkdirSync('data/world-of-darkness/validation', { recursive: true });
          fs.writeFileSync('data/world-of-darkness/validation/pages-deployment-receipt.json', `${JSON.stringify(receipt, null, 2)}\n`);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/world-of-darkness/validation/pages-deployment-receipt.json
          if git diff --cached --quiet; then
            echo "Deployment receipt is unchanged."
          else
            git commit -m "Record WOD Pages deployment [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
