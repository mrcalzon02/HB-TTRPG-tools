name: Factorio R124 source-defined round master pressed metal and rolled toe
on:
  push:
    branches: [main]
    paths:
      - 'tools/factorio-render-pipeline/refine_one_round_center_source_fin_r124.py'
      - '.github/workflows/factorio-round-master-source-refinement-r124.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  physical-single-master-source-refinement:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover exact successful R123 rounded central fin and source camera without private original sprite
        uses: actions/download-artifact@v4
        with:
          run-id: 41574602503
          name: factorio-r123-one-rounded-central-fin-real-blender-3d-macro-and-normal-candidates
          github-token: ${{ github.token }}
          path: private-ci/r123
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hb-ttrpg-tools/factorio-render-pipeline
          key: factorio-art-env-ubuntu24-blender4.5.15-python3.12-v1
      - name: Recover actual Blender 4.5 LTS and source scene inspection
        run: python tools/factorio-render-pipeline/bootstrap.py install --evidence-dir private-ci/readiness
      - name: Sculpt only ONE real cylindrical center-fin mesh with twin pressed creases, formed edge, rolled toe and test own source-metal patina
        run: |
          python -m py_compile tools/factorio-render-pipeline/refine_one_round_center_source_fin_r124.py
          BLENDER="$(python -c "import sys;sys.path.insert(0,'tools/factorio-render-pipeline');import bootstrap;print(bootstrap.find_blender())")"
          "$BLENDER" -b --disable-autoexec --factory-startup -t 2 --python-exit-code 4 \
            --python tools/factorio-render-pipeline/refine_one_round_center_source_fin_r124.py -- \
            --r123-dir private-ci/r123 --out private-ci/output/r124
      - name: Verify genuine 3D central master geometry/volume, source camera unchanged, other fins, bell and original 64 frame motion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('private-ci/output/r124')
          r=json.loads((p/'r124_source_master_real_pressed_metal_and_toe.json').read_text())
          assert not r['proprietary_source_in_public_CI']
          assert not r['original_source_visually_approved']
          assert len(r['cases'])==4
          expected=[
            'r123_rounded_spine_control',
            'r124_real_pressed_steel_fold_and_rolled_toe',
            'r124_stronger_forged_spine_and_rolled_tip',
            'r124_pressed_3d_steel_with_source_dark_patina']
          assert [x['tag'] for x in r['cases']]==expected
          for i,c in enumerate(r['cases']):
             g=c['physical_master']
             assert g['real_vertices']==306 and g['continuous_two_skins_no_holes']
             assert g['real_faces']>200 and g['physical_edge_count']>400
             assert g['real_max_vertex_displacement_m']>(.005 if i else -.001)
             assert set(g['cross_sections'])=={'0','2','4','6','8'}
             assert c['other_fins_bell_and_64_frame_motion_preserved']
             assert c['private_original_appearance_approval_pending']
             assert set(c['native_source_camera_frames'])=={'1','33'}
             assert set(c['isolated_real_3d_macros'])=={'0','35','65'}
             assert all((p/name).stat().st_size>4000
               for name in list(c['native_source_camera_frames'].values())+
                      list(c['isolated_real_3d_macros'].values()))
             assert (p/c['saved_editable_blend']).stat().st_size>100000
             if i==3:
                assert c['independent_source_patina']['source_material_slot_copies']==4
                assert c['independent_source_patina']['other_material_datablocks_changed'] is False
             else:
                assert c['independent_source_patina'] is None
          print('R124_REAL_3D_SOURCE_FIN_PHYSICAL_FORM_TEST_PASS__VISUAL_SOURCE_APPROVAL_REQUIRED')
          PY
      - name: Upload actual source-camera 3D render controls, one-fin geometry macros and editable source Blender files only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorio-r124-physical-round-master-finned-spine-grooves-tip-and-patina
          path: |
            private-ci/output/r124/*.blend
            private-ci/output/r124/*.png
            private-ci/output/r124/*.json
          if-no-files-found: warn
          retention-days: 14
