name: Factorio R87 true bespoke left right 3D mounting contour candidates
on:
  push:
    branches: [main]
    paths:
      - 'tools/factorio-render-pipeline/bespoke_real_hinge_cast_contours_r87.py'
      - '.github/workflows/factorio-original-bespoke-cast-contours-r87.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  physical-distinct-left-right-hinge-shapes:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover exact R85 3D editable calibrated baseline without Wube original atlas
        uses: actions/download-artifact@v4
        with:
          run-id: 41407934115
          name: factorio-r85-source-ranked-actual-hinge-cast-combinations
          github-token: ${{ github.token }}
          path: private-ci/r85
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hb-ttrpg-tools/factorio-render-pipeline
          key: factorio-art-env-ubuntu24-blender4.5.15-python3.12-v1
      - name: Install verified Blender 4.5 LTS
        run: python tools/factorio-render-pipeline/bootstrap.py install --evidence-dir private-ci/readiness
      - name: Physically remodel original side hinge cast contours and native render both frames
        run: |
          BLENDER="$(python -c "import sys;sys.path.insert(0,'tools/factorio-render-pipeline');import bootstrap;print(bootstrap.find_blender())")"
          "$BLENDER" -b --disable-autoexec --factory-startup -t 2 --python-exit-code 4 \
            --python tools/factorio-render-pipeline/bespoke_real_hinge_cast_contours_r87.py -- \
            --source-blend private-ci/r85/output/r85/center_short.blend \
            --out private-ci/output/r87
      - name: Verify real Blender scenes and source camera rendered candidate captures
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('private-ci/output/r87')
          j=json.loads((root/'r87_bespoke_left_right_cast_contours.json').read_text())
          assert j['private_original_art_included'] is False
          assert j['source_visual_approval'] is False
          assert len(j['probes'])==11
          for c in j['probes']:
              assert (root/c['native_frame01']).stat().st_size>5000
              assert (root/c['native_frame33']).stat().st_size>5000
              for contact in c['three_original_fin_joint_and_hull_stay_anchors'].values():
                  assert contact['source_root_contact_tiles']<.003
              if c['name']!='baseline':
                  assert (root/c['editable_saved_reopened_blend']).stat().st_size>100000
          print('R87_DISTINCT_ACTUAL_LEFT_RIGHT_CASTING_3D_CONTOURS_VERIFIED')
          PY
      - name: Artifact only model-only geometric candidate images and Blender meshes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorio-r87-real-bespoke-left-right-hinge-cast-contours
          path: |
            private-ci/output/r87/*.blend
            private-ci/output/r87/*.png
            private-ci/output/r87/*.json
            private-ci/readiness/readiness.json
          if-no-files-found: warn
          retention-days: 14
