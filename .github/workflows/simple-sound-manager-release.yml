name: Publish Simple Sound Manager
on:
  push:
    branches: [main]
    paths:
      - 'tools/sound-manager/RELEASE_NOTES.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: simple-sound-manager-publish
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: tools/sound-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Skip versions already published
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "import runpy; print(runpy.run_path('sound_manager/__init__.py')['__version__'])"
          if ($LASTEXITCODE -ne 0 -or -not ($version -match '^\d+\.\d+\.\d+$')) { throw 'Invalid source version' }
          $tag = "simple-sound-manager-v$version"
          & gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "$tag already published; no build or republishing"
            "publish=false" >> $env:GITHUB_OUTPUT
          } else {
            $ref = & gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" 2>$null
            if ($LASTEXITCODE -eq 0) { throw "Tag $tag exists without a published release; refusing to retag" }
            "publish=true" >> $env:GITHUB_OUTPUT
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Ensure Inno Setup 6 is installed
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --version=6.4.3 --no-progress --yes
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }

      - name: Test and build Windows application
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          & .\build.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Sound Manager build failed' }
          & .\.venv\Scripts\python.exe prepare-release.py
          if ($LASTEXITCODE -ne 0) { throw 'Sound Manager packaging failed' }

      - name: Verify artifacts before publication
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $folder = "build/release-$version"
          $manifest = Get-Content "$folder/release.json" -Raw | ConvertFrom-Json
          if ($manifest.tag -ne "${{ steps.version.outputs.tag }}" -or $manifest.assets.Count -ne 3) { throw 'Invalid release manifest' }
          foreach ($asset in $manifest.assets) {
            $file = Join-Path $folder $asset.name
            if (-not (Test-Path $file) -or (Get-Item $file).Length -ne $asset.bytes) { throw "Missing or invalid $file" }
            if ((Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant() -ne $asset.sha256) { throw "SHA256 mismatch: $file" }
          }
          if (-not (Test-Path "$folder/SHA256SUMS.txt")) { throw 'No checksum manifest' }

      - name: Upload, verify and publish the versioned release
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "${{ steps.version.outputs.tag }}"
          $folder = "build/release-$version"
          $assets = @(
            "$folder/SimpleSoundManager-$version-Setup.exe",
            "$folder/SimpleSoundManager-$version-Windows-x64.zip",
            "$folder/SimpleSoundManager-$version-Source.zip",
            "$folder/SHA256SUMS.txt"
          )
          & gh release create $tag $assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Simple Sound Manager $version" --notes-file RELEASE_NOTES.md --draft --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Release draft creation failed' }
          $uploaded = @(& gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify uploaded release assets' }
          foreach ($asset in $assets) {
            if ($uploaded -notcontains (Split-Path $asset -Leaf)) { throw "Release is missing asset $asset" }
          }
          & gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Release remains a draft; publication failed' }
