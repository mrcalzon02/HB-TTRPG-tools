name: Validate Blacklight Mission Generator

on:
  push:
    paths:
      - 'blacklight-mission-generator.html'
      - 'blacklight-mission-generator.css'
      - 'blacklight-mission-generator.js'
      - 'blacklight-mission-generator-entry.js'
      - 'blacklight-character-sheet-handoff.js'
      - 'blacklight-character-creation.html'
      - 'blacklight-random-character.html'
      - 'blacklight-veteran-reintroduction.html'
      - 'index.html'
      - 'data/blacklight-continuum/generators/mission-generator-content.json'
      - 'data/blacklight-continuum/wiki/mission-generator.json'
      - 'data/blacklight-continuum/wiki/wiki-index.json'
      - 'scripts/validate-blacklight-mission-generator.py'
      - '.github/workflows/validate-blacklight-mission-generator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate mission content and integration
        run: python scripts/validate-blacklight-mission-generator.py
      - name: Validate JavaScript syntax
        run: |
          node --check blacklight-mission-generator.js
          node --check blacklight-mission-generator-entry.js
          node --check blacklight-character-sheet-handoff.js
