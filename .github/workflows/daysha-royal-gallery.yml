name: Validate Daysha Royal Purchases Rights Quarantine
on:
  push:
    branches: [main]
    paths:
      - 'data/daysha-royal-purchases.json'
      - 'assets/daysha/royal-purchases/**'
      - 'royal-purchases.html'
      - 'scripts/validate-daysha-royal-gallery.mjs'
      - '.github/workflows/daysha-royal-gallery.yml'
  pull_request:
    paths:
      - 'data/daysha-royal-purchases.json'
      - 'assets/daysha/royal-purchases/**'
      - 'royal-purchases.html'
      - 'scripts/validate-daysha-royal-gallery.mjs'
      - '.github/workflows/daysha-royal-gallery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-unreviewed-art:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check scripts/validate-daysha-royal-gallery.mjs
      - run: node scripts/validate-daysha-royal-gallery.mjs
