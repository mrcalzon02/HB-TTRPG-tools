name: Binary Cube renderer disposal ordering fix

on:
  push:
    paths:
      - '.github/workflows/maintenance-binary-cube-dispose-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore idempotent disposal ordering
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('binary-cube-visualizer-renderer.js')
          text = path.read_text()
          old = """      if (this.disposed) return;\n      this.setViewportSerialMode(false, this.canonicalPanel());\n      this.disposed = true;\n"""
          new = """      if (this.disposed) return;\n      this.disposed = true;\n      this.setViewportSerialMode(false, this.canonicalPanel());\n"""
          if old not in text:
              raise SystemExit('Expected renderer disposal block was not found; refusing broad rewrite.')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          node --check binary-cube-visualizer-renderer.js
      - name: Commit authoritative renderer correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add binary-cube-visualizer-renderer.js
          git commit -m 'fix: preserve renderer disposal idempotence'
          git push origin HEAD:main
