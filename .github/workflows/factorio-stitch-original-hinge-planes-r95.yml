name: Factorio R95 source-traced left right hinge forgings stitched from real planar surfaces
on:
  push:
    branches: [main]
    paths:
      - 'tools/factorio-render-pipeline/stitched_original_side_hinges_r95.py'
      - '.github/workflows/factorio-stitch-original-hinge-planes-r95.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-plane-hinge-assembly:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore R94 source-first 3D stitched bell model from existing verified artifact, no Wube original art
        uses: actions/download-artifact@v4
        with:
          run-id: 41494055204
          name: factorio-r94-source-first-sewn-planar-bell-metal-shell-candidates
          github-token: ${{ github.token }}
          path: private-ci/r94
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hb-ttrpg-tools/factorio-render-pipeline
          key: factorio-art-env-ubuntu24-blender4.5.15-python3.12-v1
      - name: Install actual pinned Blender 4.5 LTS
        run: python tools/factorio-render-pipeline/bootstrap.py install --evidence-dir private-ci/readiness
      - name: Join real planar source-image sections into individually different volumetric left/right hinges
        run: |
          BLENDER="$(python -c "import sys;sys.path.insert(0,'tools/factorio-render-pipeline');import bootstrap;print(bootstrap.find_blender())")"
          "$BLENDER" -b --disable-autoexec --factory-startup -t 2 --python-exit-code 4 \
            --python tools/factorio-render-pipeline/stitched_original_side_hinges_r95.py -- \
            --source-blend private-ci/r94/output/r94/panel_trim_025_rear_018.blend \
            --out private-ci/output/r95
      - name: Verify connected physical R95 sidecast surfaces and saved/reopened editable source-camera candidates
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('private-ci/output/r95')
          j=json.loads((p/'r95_true_stitched_source_side_hinges.json').read_text())
          assert not j['original_source_art_exported']
          assert not j['source_visual_fidelity_approved']
          assert len(j['experiments'])==7
          for x in j['experiments']:
              assert (p/x['true_original_camera_frame1']).stat().st_size>5000
              assert (p/x['true_original_camera_frame33']).stat().st_size>5000
              for y in x['actual_3d_stitched_metal_geometry'].values():
                  assert y['connected_manifold_metal_skin']
                  assert len(y['two_physically_attached_3d_anchor_branches'])==2
                  assert y['actual_stitched_faces']>35
              if x['original_source_sides_rebuilt']:
                  assert (p/x['saved_reopened_blend']).stat().st_size>100000
          print('R95_ORIGINAL_SOURCE_PLANAR_STITCHED_HINGE_MODELS_NATIVE_VERIFIED')
          PY
      - name: Upload only native original-camera Blender renders and physical meshes; no original source art
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorio-r95-original-source-stitched-left-and-right-real-hinge-planes
          path: |
            private-ci/output/r95/*.blend
            private-ci/output/r95/*.png
            private-ci/output/r95/*.json
            private-ci/readiness/readiness.json
          if-no-files-found: warn
          retention-days: 14
