name: Validate Barotrauma Static Tools

on:
  push:
    branches: [main]
    paths:
      - 'barotrauma-entry.js'
      - 'barotrauma-rpg-tools.html'
      - 'barotrauma-rpg-tools-loader.js'
      - 'data/barotrauma-tools-registry.json'
      - 'data/barotrauma/**'
      - '.github/workflows/validate-barotrauma-static.yml'
  pull_request:
    paths:
      - 'barotrauma-entry.js'
      - 'barotrauma-rpg-tools.html'
      - 'barotrauma-rpg-tools-loader.js'
      - 'data/barotrauma-tools-registry.json'
      - 'data/barotrauma/**'
      - '.github/workflows/validate-barotrauma-static.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check standalone JavaScript syntax
        run: |
          node --check barotrauma-entry.js
          node --check barotrauma-rpg-tools-loader.js

      - name: Validate runtime assembly and registries
        run: |
          node <<'NODE'
          const fs = require('fs');
          const assert = require('assert');

          const loader = fs.readFileSync('barotrauma-rpg-tools-loader.js', 'utf8');
          const runtimeMatch = loader.match(/const runtimeParts = \[([\s\S]*?)\n  \];/);
          assert(runtimeMatch, 'runtimeParts array was not found in the loader');
          const paths = [...runtimeMatch[1].matchAll(/'([^']+)'/g)].map(match => match[1]);
          assert(paths.length > 40, `Expected the complete runtime list; found ${paths.length} fragments`);
          const missing = paths.filter(path => !fs.existsSync(path));
          assert.deepStrictEqual(missing, [], `Missing runtime fragments: ${missing.join(', ')}`);

          const source = paths.map(path => fs.readFileSync(path, 'utf8')).join('');
          new Function(source);

          JSON.parse(fs.readFileSync('data/barotrauma-tools-registry.json', 'utf8'));
          JSON.parse(fs.readFileSync('data/barotrauma/tools/encounters/encounter-index.json', 'utf8'));

          assert(loader.includes('barotrauma-rpg-tools.part-06-standalone-module-captures.txt'), 'Standalone module captures are not loaded');
          assert(loader.includes('barotrauma-rpg-tools.part-06-dashboard-boundaries-core.txt'), 'Dashboard boundary core is not loaded');
          assert(loader.includes('barotrauma-rpg-tools.part-06-dashboard-boundaries-ui.txt'), 'Dashboard boundary UI is not loaded');
          assert(loader.includes('barotrauma-rpg-tools.part-06-dashboard-boundaries-stability.txt'), 'Dashboard boundary stability is not loaded');
          assert(loader.includes('barotrauma-rpg-tools.part-06-dashboard-commissioning.txt'), 'Master-world commissioning is not loaded');
          assert(loader.includes('barotrauma-rpg-tools.part-06-dashboard-commissioning-stability.txt'), 'Station-only crew transition stability is not loaded');

          const boundaryCore = fs.readFileSync('data/barotrauma/tools/runtime/barotrauma-rpg-tools.part-06-dashboard-boundaries-core.txt', 'utf8');
          assert(boundaryCore.includes("return ['character','submarine','encounters','route','world','catalog','workshop'].includes(raw)"), 'Standalone hash dispatch contract is missing');
          assert(boundaryCore.includes('Purchasing is unavailable while In Route.'), 'In-route purchase guard is missing');
          assert(boundaryCore.includes('Selling is unavailable while In Route.'), 'In-route selling guard is missing');
          assert(boundaryCore.includes("map.nodes.filter(node => node.type === 'station')"), 'Starting locations are not sourced from world stations');

          const commissioning = fs.readFileSync('data/barotrauma/tools/runtime/barotrauma-rpg-tools.part-06-dashboard-commissioning.txt', 'utf8');
          assert(commissioning.includes('state.world.masterWorldId = masterWorldId'), 'Canonical master world ID assignment is missing');
          assert(commissioning.includes('state.world.map.worldId = masterWorldId'), 'Master map world ID synchronization is missing');
          assert(commissioning.includes('submission.worldId = masterWorldId'), 'World submissions do not use the master world ID');
          assert(commissioning.includes('Select Starting Submarine'), 'Dashboard starting-submarine control is missing');
          assert(commissioning.includes('Add Crew at Station'), 'Dashboard station crew-add control is missing');
          assert(commissioning.includes('Additional crew cannot be added while the submarine is In Route.'), 'In-route crew-add guard is missing');
          assert(commissioning.includes('physically docked at a station'), 'Physical-station crew-add requirement is missing');

          const commissioningStability = fs.readFileSync('data/barotrauma/tools/runtime/barotrauma-rpg-tools.part-06-dashboard-commissioning-stability.txt', 'utf8');
          assert(commissioningStability.includes("!['Reserve','Away'].includes(record.status)"), 'Reserve and away personnel are still counted as active submarine crew');
          assert(commissioningStability.includes('if (statusControl && !alreadyAboard)'), 'Non-onboard status activation is not locked during transit');

          const finalRuntime = fs.readFileSync('data/barotrauma/tools/runtime/barotrauma-rpg-tools.part-06.txt', 'utf8');
          assert(finalRuntime.includes('version: 18'), 'Suite export version was not advanced for master-world commissioning');
          assert(finalRuntime.includes('masterWorldId: synchronizeMasterWorldId(false)'), 'Suite export omits the master world ID');
          assert(finalRuntime.includes('normalizeDashboardCommissioningState()'), 'Suite import omits commissioning migration');

          const entry = fs.readFileSync('barotrauma-entry.js', 'utf8');
          assert(entry.includes('barotrauma-rpg-tools.html#dashboard'), 'Main Barotrauma menu does not link the Active Submarine Dashboard');
          assert(entry.includes('barotrauma-rpg-tools.html#submarine'), 'Standalone Submarine Manager link is missing');
          assert(entry.includes('barotrauma-rpg-tools.html#route'), 'Standalone Route Planner link is missing');
          assert(entry.includes('barotrauma-rpg-tools.html#world'), 'Standalone World State link is missing');

          const html = fs.readFileSync('barotrauma-rpg-tools.html', 'utf8');
          assert(html.includes('data-tool="dashboard"'), 'Dashboard tool tab is missing');
          assert(html.includes('data-tool="submarine"'), 'Standalone submarine tab is missing');
          assert(html.includes('data-tool="route"'), 'Standalone route tab is missing');
          assert(html.includes('data-tool="world"'), 'Standalone world tab is missing');

          console.log(`Validated ${paths.length} runtime fragments, unified master-world identity, station-gated crew recruitment, and dashboard/standalone navigation.`);
          NODE
