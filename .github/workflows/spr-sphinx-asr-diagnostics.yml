name: SPR independent Sphinx speech-content diagnosis

on:
  workflow_dispatch:
  push:
    paths:
      - "software/superposition-reader/spr_asr_diagnostics.py"
      - ".github/workflows/spr-sphinx-asr-diagnostics.yml"

permissions:
  contents: read
  actions: read

jobs:
  independent-english-asr:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install independent CPU recognition model dependencies
        run: |
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.57.6 soundfile
      - name: Download rejected raw audition candidates without editing them
        uses: actions/download-artifact@v4
        with:
          run-id: 41743639943
          github-token: ${{ github.token }}
          name: SPR-Sphinx-neural-narration-preview-7429c915fae1bdc10a120d21b089f78acacea5df
          path: build/rejected-candidates
      - name: Compare old direct speech and natural-intro candidates using independent English ASR
        env:
          PYTHONPATH: software/superposition-reader
          HF_HOME: ${{ runner.temp }}/whisper-base-en
        run: |
          python software/superposition-reader/spr_asr_diagnostics.py \
            --input software/superposition-reader/assets/voice \
            --input build/rejected-candidates \
            --output build/asr/independent-recognition.json
      - name: Upload recognition transcript and timestamp evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SPR-Sphinx-Whisper-base-independent-diagnostics
          path: build/asr/
          if-no-files-found: warn
          retention-days: 30
