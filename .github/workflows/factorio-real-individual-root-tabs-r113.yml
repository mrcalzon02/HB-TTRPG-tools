name: Factorio R113 actual individual solid source-shaped upper fin root retaining tabs
on:
  push:
    branches: [main]
    paths:
      - 'tools/factorio-render-pipeline/source_individual_forged_root_tabs_r113.py'
      - '.github/workflows/factorio-real-individual-root-tabs-r113.yml'
      - 'tools/factorio-render-pipeline/source_folded_stepped_root_brackets_r114.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  true-original-cast-retaining-lugs:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover actual verified R112 original-source thin forged shoulder Blender scene, never original Wube image
        uses: actions/download-artifact@v4
        with:
          run-id: 41558681286
          name: factorio-r112-thin-pressed-metal-original-source-hinge-shoulders
          github-token: ${{ github.token }}
          path: private-ci/r112
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hb-ttrpg-tools/factorio-render-pipeline
          key: factorio-art-env-ubuntu24-blender4.5.15-python3.12-v1
      - name: Verify pinned actual Blender 4.5 LTS workstation
        run: python tools/factorio-render-pipeline/bootstrap.py install --evidence-dir private-ci/readiness
      - name: Forge unique real 3D root retaining tabs on original left and right source castings; render and reopen editable scenes
        run: |
          BLENDER="$(python -c "import sys;sys.path.insert(0,'tools/factorio-render-pipeline');import bootstrap;print(bootstrap.find_blender())")"
          "$BLENDER" -b --disable-autoexec --factory-startup -t 2 --python-exit-code 4 \
            --python tools/factorio-render-pipeline/source_individual_forged_root_tabs_r113.py -- \
            --r112-dir private-ci/r112/output/r112 --out private-ci/output/r113
      - name: Validate actual separately built solid metal tabs, surviving parent mount and unchanged original 3D machine parts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('private-ci/output/r113')
          r=json.loads((root/'r113_actual_3d_bespoke_shoulder_tabs.json').read_text())
          assert not r['original_sprite_uploaded']
          assert not r['original_source_correctness_approved']
          assert len(r['cases'])==3
          assert {c['variant'] for c in r['cases']}=={
              'r112_without_separate_lugs','individual_original_root_tabs',
              'only_outer_root_retaining_tabs'}
          for c in r['cases']:
              assert c['all_prior_source_geometry_unchanged']
              assert c['source_fidelity_not_approved']
              assert (root/c['editable_blend']).stat().st_size>100000
              assert (root/c['angled_3d_view']).stat().st_size>5000
              assert len(c['source_native_frames'])==2
              for img in c['source_native_frames'].values():
                  assert (root/img).stat().st_size>5000
              tabs=c['real_independent_solid_lugs']
              count={'r112_without_separate_lugs':0,
                  'individual_original_root_tabs':6,
                  'only_outer_root_retaining_tabs':4}[c['variant']]
              assert len(tabs)==count
              for tab in tabs:
                  assert tab['real_vertices']==2*tab['source_silhouette_points']
                  assert tab['real_faces']==tab['source_silhouette_points']+2
                  assert tab['genuine_3d_closed_edges']>8
                  assert tab['local_forged_tab_depth']>.05
                  assert not tab['source_approved']
          print('R113_REAL_3D_ROOT_RETAINING_LUGS_AND_SOURCE_SCENE_INTEGRITY_PASS')
          PY
      - name: Preserve real Blender geometry, native original-camera frames and oblique forms (no proprietary source sprite)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorio-r113-true-3d-individually-forged-upper-fin-mounting-tabs
          path: |
            private-ci/output/r113/*.blend
            private-ci/output/r113/*.png
            private-ci/output/r113/*.json
            private-ci/readiness/readiness.json
          if-no-files-found: warn
          retention-days: 14

      - name: R114 geometry revision - physically replace incorrect R113 rectangular tabs with unique notched, raised, folded metal in the actual Blender model
        run: |
          python -m py_compile tools/factorio-render-pipeline/source_folded_stepped_root_brackets_r114.py
          BLENDER="$(python -c "import sys;sys.path.insert(0,'tools/factorio-render-pipeline');import bootstrap;print(bootstrap.find_blender())")"
          "$BLENDER" -b --disable-autoexec --factory-startup -t 2 --python-exit-code 4 \
            --python tools/factorio-render-pipeline/source_folded_stepped_root_brackets_r114.py -- \
            --r113-dir private-ci/output/r113 --out private-ci/output/r114
      - name: Audit R114 actual physical source-shape variants, fin motion and exact editable Blender saved/reopened scenes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("private-ci/output/r114")
          r=json.loads((p/"r114_physically_notched_bracket_candidates.json").read_text())
          assert not r["source_bitmap_exported"] and not r["visual_match_approved"]
          assert len(r["cases"])==3
          assert [c["variant"] for c in r["cases"]]==[
             "r113_rectangular_pip_control","independent_forged_lips",
             "stepped_offset_return_brackets"]
          for c in r["cases"]:
              assert c["existing_original_machine_geometry_unchanged"]
              assert c["source_shape_fidelity_unapproved"]
              assert (p/c["editable_blend"]).stat().st_size>100000
              assert (p/c["actual_3d_oblique_render"]).stat().st_size>5000
              assert set(c["native_source_camera_frames"])=={"1","33"}
              assert all((p/x).stat().st_size>5000 for x in c["native_source_camera_frames"].values())
              parts=c["genuine_notched_solid_brackets"]
              assert len(parts)==(0 if c["variant"]=="r113_rectangular_pip_control" else 6)
              assert c["replaced_prior_incorrect_pips"]==(len(parts)==6)
              for part in parts:
                  assert part["notched_source_footprint_points"]>=9
                  assert part["real_vertices"]==3*part["notched_source_footprint_points"]
                  assert part["real_faces"]==2*part["notched_source_footprint_points"]+2
                  assert part["physical_manifold_edges"]>=20
                  assert part["finite_crown_depth"]>.1
                  assert not part["source_visually_approved"]
          print("R114_NOTCHED_PHYSICAL_3D_BLENDER_FORGED_SOURCE_BRACKETS_PASS__VISUAL_APPROVAL_NOT_ASSERTED")
          PY
      - name: Preserve editable R114 genuine model variants and actual native/oblique renders without the proprietary original sprite
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorio-r114-notched-folded-source-bracket-3d-candidates
          path: |
            private-ci/output/r114/*.blend
            private-ci/output/r114/*.png
            private-ci/output/r114/*.json
          if-no-files-found: warn
          retention-days: 14
