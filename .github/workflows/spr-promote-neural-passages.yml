name: SPR preserve verified Sphinx long-passage WAV assets

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/spr-promote-neural-passages.yml"

permissions:
  contents: write
  actions: read

jobs:
  verify-and-archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download exact tested artifact by immutable GitHub artifact ID
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/spr-promote
          curl --fail --silent --show-error --location --retry 3 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/mrcalzon02/HB-TTRPG-tools/actions/artifacts/13284351826/zip" \
            --output "$RUNNER_TEMP/spr-verified-passages.zip"
          unzip -t "$RUNNER_TEMP/spr-verified-passages.zip"
          unzip -q "$RUNNER_TEMP/spr-verified-passages.zip" -d build/spr-promote
          test -f build/spr-promote/long-passage-report.json
      - name: Verify complete source, first words and WAV hashes
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, shutil, wave
          from pathlib import Path
          origin=Path("build/spr-promote")
          result=json.loads((origin/"long-passage-report.json").read_text(encoding="utf-8"))
          assert result.get("status")=="passed"
          cases={row["id"]:row for row in result.get("cases",[])}
          expected={
              "bdo-long-passage": ("bdo-long-passage.wav","sphinx-bdo-full-passage.wav",
                                  "ff1cdca99f913dc7183605d27b94cda3334028062c81bcf62d616dac13ccf039"),
              "nowhere-long-passage": ("nowhere-long-passage.wav","sphinx-nowhere-full-passage.wav",
                                      "e72d1fbfb968d0f13ab701514416a6ac79560f94420b99667d5c68307fdb833f")
          }
          assert set(cases)==set(expected)
          destination=Path("software/superposition-reader/assets/voice")
          destination.mkdir(parents=True,exist_ok=True)
          for key,(source_name,target_name,expected_hash) in expected.items():
              case=cases[key]
              source=origin/source_name
              assert case["audio"]==source_name
              assert case["status"]=="passed"
              assert 280<=case["source_chars"]<=420
              assert case["qa"]["first_words_preserved"] is True
              assert case["qa"]["boundary"]["first_word_pre_roll_ms"]>=600
              assert case["qa"]["match"]>=0.76
              data=source.read_bytes()
              assert hashlib.sha256(data).hexdigest()==expected_hash==case["audio_sha256"]
              with wave.open(str(source),"rb") as audio:
                  assert audio.getframerate()==48000 and audio.getnchannels()==1
                  assert audio.getsampwidth()==2 and audio.getnframes()>=48000
              shutil.copyfile(source,destination/target_name)
              print(key,"verified",len(data),"bytes",expected_hash)
          PY
      - name: Commit verified binary WAVs via normal fast-forward push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- software/superposition-reader/assets/voice/sphinx-bdo-full-passage.wav software/superposition-reader/assets/voice/sphinx-nowhere-full-passage.wav
          if git diff --cached --quiet; then
            echo "Long passage files already match the validated recordings."
          else
            git commit -m "assets(spr): preserve first-word-verified Sphinx full book passage auditions"
            git push origin HEAD:main
          fi
          local_sha=$(git rev-parse HEAD)
          remote_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$local_sha" != "$remote_sha" ]; then
            echo "Remote readback mismatch; write not verified" >&2
            exit 1
          fi
          echo "Remote main verified: $remote_sha"
