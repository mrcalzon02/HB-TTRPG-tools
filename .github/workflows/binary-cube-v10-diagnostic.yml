name: Capture Binary Cube V10 patch failure

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/binary-cube-v10-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture direct patch failure
        run: |
          mkdir -p /tmp/binary-cube-v10 docs/diagnostics
          base64 -d scripts/.temporary-v10-accessibility-payload.tar.gz.b64 | tar -xz -C /tmp/binary-cube-v10
          cp /tmp/binary-cube-v10/scripts/validate-binary-cube-visualizer-accessibility.mjs scripts/
          cp /tmp/binary-cube-v10/scripts/validate-binary-cube-visualizer-accessibility-browser.mjs scripts/
          cp /tmp/binary-cube-v10/docs/binary-cube-v10-accessibility-checklist.md docs/
          set +e
          python /tmp/binary-cube-v10/v10_patch.py > docs/diagnostics/binary-cube-v10-patch-failure.txt 2>&1
          status=$?
          set -e
          printf '\npatch_exit_status=%s\n' "$status" >> docs/diagnostics/binary-cube-v10-patch-failure.txt
      - name: Commit diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/diagnostics/binary-cube-v10-patch-failure.txt
          git commit -m 'chore: capture Binary Cube V10 patch failure [skip ci]'
          git push origin HEAD:main
