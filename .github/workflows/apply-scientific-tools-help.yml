name: Apply Scientific Tools contextual help

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/apply-scientific-tools-help.yml"
      - "scripts/apply-scientific-tools-help.py"
      - "scientific-tools-help.js"
      - "scientific-tools-help.css"
      - "scripts/validate-scientific-tools-help.mjs"

permissions:
  contents: write
  statuses: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Record pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=pending \
            -f context='scientific-tools/contextual-help' \
            -f description='Applying shared cryptography/steganography help integration.' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply help integration and validate
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          python scripts/apply-scientific-tools-help.py
          node --check scientific-tools-help.js
          node --check scientific-tools-entry.js
          node --check app-lite-view-mounts.js
          node --check scripts/validate-scientific-tools-help.mjs
          node --check scripts/validate-scientific-tools-extraction.mjs
          node scripts/validate-scientific-tools-help.mjs
          node scripts/validate-scientific-tools-extraction.mjs
      - name: Commit validated help integration
        run: |
          if git diff --quiet -- scientific-tools-entry.js app-lite-view-mounts.js scripts/validate-scientific-tools-extraction.mjs .github/workflows/scientific-tools-extraction.yml; then
            echo "Shared help integration already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scientific-tools-entry.js app-lite-view-mounts.js scripts/validate-scientific-tools-extraction.mjs .github/workflows/scientific-tools-extraction.yml
          git commit -m "feat: integrate contextual help across cryptography and steganography tools"
          git push origin HEAD:main
      - name: Record success
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=success \
            -f context='scientific-tools/contextual-help' \
            -f description='Shared cryptography/steganography help integrated.' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Record failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=failure \
            -f context='scientific-tools/contextual-help' \
            -f description='Shared help integration failed closed.' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
