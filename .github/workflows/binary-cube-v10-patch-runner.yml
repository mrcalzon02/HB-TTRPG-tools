name: Apply guarded Binary Cube V10 accessibility patch

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/binary-cube-v10-patch-runner.yml"
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: binary-cube-v10-accessibility-patch
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Record patch pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=pending \
            -f context='binary-cube/v10-patch' \
            -f description='Applying and validating direct V10 accessibility edits.' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Reconstruct verified V10 payload
        run: |
          set -o pipefail
          mkdir -p /tmp/binary-cube-v10
          cat \
            scripts/.temporary-v10-accessibility-payload.part-00 \
            scripts/.temporary-v10-accessibility-payload.part-01 \
            scripts/.temporary-v10-accessibility-payload.part-02a \
            scripts/.temporary-v10-accessibility-payload.part-02b \
            scripts/.temporary-v10-accessibility-payload.part-03a \
            scripts/.temporary-v10-accessibility-payload.part-03b \
            > /tmp/binary-cube-v10-payload.b64
          test "$(wc -c < /tmp/binary-cube-v10-payload.b64)" -eq 26201
          base64 -d /tmp/binary-cube-v10-payload.b64 > /tmp/binary-cube-v10-payload.tar.gz
          echo '4ae8b9b59f8d202d45d9d9b387d897945cef1a61d3221145684096e6fbfa0bc5  /tmp/binary-cube-v10-payload.tar.gz' | sha256sum -c -
          tar -xzf /tmp/binary-cube-v10-payload.tar.gz -C /tmp/binary-cube-v10
          test -f /tmp/binary-cube-v10/v10_patch.py
          test -f /tmp/binary-cube-v10/scripts/validate-binary-cube-visualizer-accessibility.mjs
          test -f /tmp/binary-cube-v10/scripts/validate-binary-cube-visualizer-accessibility-browser.mjs
          test -f /tmp/binary-cube-v10/docs/binary-cube-v10-accessibility-checklist.md

      - name: Apply direct V10 patch
        run: |
          set -o pipefail
          cp /tmp/binary-cube-v10/scripts/validate-binary-cube-visualizer-accessibility.mjs scripts/
          cp /tmp/binary-cube-v10/scripts/validate-binary-cube-visualizer-accessibility-browser.mjs scripts/
          cp /tmp/binary-cube-v10/docs/binary-cube-v10-accessibility-checklist.md docs/
          python /tmp/binary-cube-v10/v10_patch.py 2>&1 | tee /tmp/binary-cube-v10-patch.log
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/validate-binary-cube-visualizer-shell.mjs')
          source = path.read_text(encoding='utf-8')
          old = "assert.match(controllerSource, /renderer\\.setScene/);"
          new = "assert.match(controllerSource, /renderer\\?\\.setScene/);"
          if source.count(old) != 1:
              raise SystemExit(f'Expected one V4 renderer scene assertion, found {source.count(old)}.')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate direct V10 implementation
        run: |
          set -o pipefail
          {
            node --check shadowrun-binary-cube-engine.js
            node --check binary-cube-visualizer-renderer.js
            node --check shadowrun-binary-cube-visualizer.js
            node --check shadowrun-entry.js
            node --check scripts/validate-binary-cube-visualizer-accessibility.mjs
            node --check scripts/validate-binary-cube-visualizer-accessibility-browser.mjs
            node scripts/validate-binary-cube-baseline.mjs
            node scripts/validate-binary-cube-trace.mjs
            node scripts/validate-binary-cube-visualizer-shell.mjs
            node scripts/validate-binary-cube-visualizer-step.mjs
            node scripts/validate-binary-cube-visualizer-animation.mjs
            node scripts/validate-binary-cube-visualizer-encoder.mjs
            node scripts/validate-binary-cube-visualizer-sequencing.mjs
            node scripts/validate-binary-cube-visualizer-performance.mjs
            node scripts/measure-binary-cube-visualizer-performance.mjs
            node scripts/validate-binary-cube-visualizer-accessibility.mjs
            node scripts/validate-binary-cube-visualizer-sequencing-browser.mjs
            node scripts/validate-binary-cube-visualizer-performance-browser.mjs
            node scripts/validate-binary-cube-visualizer-accessibility-browser.mjs
            node desktop/binary-cube/tests/smoke.cjs
            git diff --check
          } 2>&1 | tee /tmp/binary-cube-v10-validation.log

      - name: Commit V10 implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shadowrun-binary-cube-visualizer.js binary-cube-visualizer.css shadowrun-entry.js scripts/validate-binary-cube-visualizer-shell.mjs scripts/validate-binary-cube-visualizer-encoder.mjs scripts/validate-binary-cube-visualizer-accessibility.mjs scripts/validate-binary-cube-visualizer-accessibility-browser.mjs docs/binary-cube-v10-accessibility-checklist.md
          git commit -m 'feat: add Binary Cube V10 accessible control and fallback [skip ci]'
          git push origin HEAD:main

      - name: Record patch success
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=success \
            -f context='binary-cube/v10-patch' \
            -f description='Direct V10 accessibility edits validated and committed.' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Commit failure diagnostic
        if: ${{ failure() }}
        run: |
          mkdir -p docs/diagnostics
          if [ -f /tmp/binary-cube-v10-validation.log ]; then
            tail -n 180 /tmp/binary-cube-v10-validation.log > docs/diagnostics/binary-cube-v10-patch-failure.txt
          elif [ -f /tmp/binary-cube-v10-patch.log ]; then
            tail -n 180 /tmp/binary-cube-v10-patch.log > docs/diagnostics/binary-cube-v10-patch-failure.txt
          else
            printf 'V10 payload reconstruction failed before patch execution.\n' > docs/diagnostics/binary-cube-v10-patch-failure.txt
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/diagnostics/binary-cube-v10-patch-failure.txt
          if ! git diff --cached --quiet; then git commit -m 'chore: capture Binary Cube V10 patch failure [skip ci]' && git push origin HEAD:main; fi

      - name: Record patch failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=failure \
            -f context='binary-cube/v10-patch' \
            -f description='Direct V10 accessibility patch failed validation.' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
