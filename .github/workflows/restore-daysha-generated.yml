name: Restore approved Daysha originals (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-daysha-generated.yml'
permissions:
  contents: write
concurrency:
  group: one-time-daysha-original-restore
  cancel-in-progress: true
jobs:
  restore-approved-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: true
      - name: Recover exactly twelve pre-audited generated WebP objects
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --filter=blob:none --depth=1 origin cc35afc4c04f179335e97b3aa866640c4b0c4ad3
          git restore --source=cc35afc4c04f179335e97b3aa866640c4b0c4ad3 -- \
            assets/daysha/royal-purchases/src-0000000057e8.webp \
            assets/daysha/royal-purchases/celestial-elven-princess-in-bloom.webp \
            assets/daysha/royal-purchases/elven-princess-s-royal-chase.webp \
            assets/daysha/royal-purchases/royal-garden-treasure-chase.webp \
            assets/daysha/royal-purchases/elven-royal-jewel-chase.webp \
            assets/daysha/royal-purchases/royal-elf-family-tea-in-the-palace-garden.webp \
            assets/daysha/royal-purchases/icy-blue-haired-royal-garden-tea-party.webp \
            assets/daysha/royal-purchases/royal-elf-garden-playtime.webp \
            assets/daysha/royal-purchases/rafters-prank-over-the-royal-council.webp \
            assets/daysha/royal-purchases/glittery-royal-family-catroom-celebration.webp \
            assets/daysha/royal-purchases/magical-family-cat-atelier.webp \
            assets/daysha/royal-purchases/royal-family-s-sunlit-castle-stroll.webp
          node --check scripts/validate-daysha-royal-gallery.mjs
          node scripts/validate-daysha-royal-gallery.mjs
      - name: Commit approved files, retire this one-shot workflow, and push safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/restore-daysha-generated.yml
          git add -A -- assets/daysha/royal-purchases
          git commit -m "Restore 12 provenance-verified original Daysha images only"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Original-only recovery committed and pushed."
              exit 0
            fi
            echo "Push conflict or transient failure; retrying."
            sleep 4
          done
          echo "Failed to publish validated gallery." >&2
          exit 1
