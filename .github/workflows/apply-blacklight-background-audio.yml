name: Apply Blacklight background audio

on:
  push:
    paths:
      - .github/workflows/apply-blacklight-background-audio.yml

permissions:
  contents: write

jobs:
  apply-background-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install the shared player on every Blacklight page
        shell: python
        run: |
          from pathlib import Path

          script_tag = '  <script src="blacklight-background-audio.js"></script>'
          changed = []

          for page in sorted(Path('.').glob('blacklight-*.html')):
              text = page.read_text(encoding='utf-8')
              if 'blacklight-background-audio.js' in text:
                  continue
              if '</body>' not in text:
                  raise RuntimeError(f'{page} has no closing body tag')
              newline = '\r\n' if '\r\n' in text else '\n'
              replacement = f'{script_tag}{newline}</body>'
              page.write_text(text.replace('</body>', replacement, 1), encoding='utf-8', newline='')
              changed.append(str(page))

          print(f'Updated {len(changed)} Blacklight pages')
          for page in changed:
              print(page)

      - name: Commit all page integrations
        run: |
          if git diff --quiet -- 'blacklight-*.html'; then
            echo "Every Blacklight page already contains the shared player."
            exit 0
          fi
          git config user.name "Blacklight Continuum Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -- 'blacklight-*.html'
          git commit -m "Install background music on every Blacklight page"
          git push origin HEAD:main
