name: Apply Live Signals mirror migration

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/apply-live-signals-mirror.yml"
      - "scripts/apply_live_signals_mirror.py"
      - "scripts/apply_live_signals_validation_fixes.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-live-signals-mirror
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply mirror migration
        run: python scripts/apply_live_signals_mirror.py

      - name: Apply full-validation fixes
        run: python scripts/apply_live_signals_validation_fixes.py

      - name: Validate JavaScript syntax
        run: |
          node --check live-signals-laboratory.js
          node --check scientific-tools-entry.js

      - name: Validate Signals laboratories
        run: |
          node scripts/validate-live-signals-laboratory.mjs
          node scripts/validate-signals-laboratory.mjs
          node scripts/validate-scientific-tools-extraction.mjs

      - name: Check patch hygiene
        run: git diff --check

      - name: Commit and integrate validated migration result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply_live_signals_mirror.py scripts/apply_live_signals_validation_fixes.py .github/workflows/apply-live-signals-mirror.yml
          git add live-signals-laboratory.js live-signals-laboratory.css scientific-tools-entry.js scripts/validate-live-signals-laboratory.mjs .github/workflows/scientific-tools-extraction.yml docs/live-signals-laboratory-mirror-and-safety.md
          git diff --cached --check
          git commit -m "Validate and consolidate Live Signals Laboratory"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race on attempt ${attempt}; refreshing main before retry."
            sleep 2
          done
          echo "Could not integrate validated migration after five rebase/push attempts." >&2
          exit 1