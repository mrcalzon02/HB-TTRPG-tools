name: Factorio R109 real forged source-petal flare, folded sidewalls and closed rolled metal toe lips
on:
  push:
    branches: [main]
    paths:
      - 'tools/factorio-render-pipeline/source_flared_real_forged_petals_r109.py'
      - '.github/workflows/factorio-real-forged-petal-edges-r109.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independent-forged-source-forms:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover verified actual R108 geometry and keep original sprite PRIVATE
        uses: actions/download-artifact@v4
        with:
          run-id: 41544091187
          name: factorio-r108-true-individual-curved-cupped-3d-metal-petal-candidates
          github-token: ${{ github.token }}
          path: private-ci/r108
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hb-ttrpg-tools/factorio-render-pipeline
          key: factorio-art-env-ubuntu24-blender4.5.15-python3.12-v1
      - name: Install pinned authentic Blender 4.5 LTS rendering and scene QA environment
        run: python tools/factorio-render-pipeline/bootstrap.py install --evidence-dir private-ci/readiness
      - name: Build and save real nonuniform flared 3D metal petals, folded sides and separate closed forged toe geometry
        run: |
          BLENDER="$(python -c "import sys;sys.path.insert(0,'tools/factorio-render-pipeline');import bootstrap;print(bootstrap.find_blender())")"
          "$BLENDER" -b --disable-autoexec --factory-startup -t 2 --python-exit-code 4 \
            --python tools/factorio-render-pipeline/source_flared_real_forged_petals_r109.py -- \
            --r108-dir private-ci/r108/output/r108 --out private-ci/output/r109
      - name: Check editable native source forms, actual cross sections, closed 3D lips and original source animation invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('private-ci/output/r109')
          r=json.loads((p/'r109_real_forged_petal_source_form_cases.json').read_text())
          assert not r['source_sprite_exported']
          assert r['metric']=='real_3d_mesh_geometry_not_pixel_mae'
          assert len(r['candidates'])==6
          for item in r['candidates']:
              assert item['source_correctness_unapproved']
              assert item['original_lower_animation_and_body_preserved']
              assert (p/item['editable_blend']).stat().st_size>100000
              assert (p/item['angled_real_3d_render']).stat().st_size>5000
              assert len(item['native_rendered_frames'])==2
              for name in item['native_rendered_frames'].values():
                  assert (p/name).stat().st_size>5000
              for k,measurement in item['actual_3d_form_measurements'].items():
                  assert measurement['real_198_vertices']==198
                  assert measurement['closed_shell_edges']>200
                  assert len(measurement['actual_cross_sections'])==6
                  assert measurement['max_real_vertex_move']>.015
              if 'rolled' in item['tag'] or 'lipped' in item['tag']:
                  assert len(item['real_separate_lips'])==len(item['actual_3d_form_measurements'])
                  for lip in item['real_separate_lips'].values():
                      assert lip['real_vertices']==110
                      assert lip['real_faces']==102
                      assert lip['closed_3d_mesh_edges']==218
          print('R109_SOURCE_3D_DISTINCT_FORMED_SHEET_AND_CLOSED_ROLLED_LIP_PASS')
          PY
      - name: Upload actual editable Blender models and true native+angled renders, never user original sprite
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorio-r109-genuine-flared-individual-fin-shells-and-rolled-metal-tip-models
          path: |
            private-ci/output/r109/*.blend
            private-ci/output/r109/*.png
            private-ci/output/r109/*.json
            private-ci/readiness/readiness.json
          if-no-files-found: warn
          retention-days: 14
