name: Apply EXO key and thumbwheel physicality correction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-exo-key-thumbwheel-physicality.yml'
      - 'scripts/apply-exo-key-thumbwheel-physicality.py'

permissions:
  contents: write

concurrency:
  group: apply-exo-key-thumbwheel-physicality
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase onto current main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Apply physicality corrections
        run: python3 scripts/apply-exo-key-thumbwheel-physicality.py
      - name: Validate Crew JavaScript and canonical mechanisms
        run: |
          node --check blacklight-exo-crew-operations.js
          grep -q 'class="exo-inserted-key"' blacklight-exo-crew-operations.js
          grep -q 'exo-thumbwheel-readout' blacklight-exo-crew-operations.js
          grep -q 'exo-thumbwheel-belt' blacklight-exo-crew-operations.css
          ! grep -q 'exo-thumbwheel-window' blacklight-exo-crew-operations.js
      - name: Commit directly to main and remove one-shot tooling
        run: |
          rm -f scripts/apply-exo-key-thumbwheel-physicality.py .github/workflows/apply-exo-key-thumbwheel-physicality.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: correct keyed lockout and navigation index drums"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
