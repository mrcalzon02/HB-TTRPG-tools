name: Import Starry Cereal background track

on:
  push:
    paths:
      - .github/workflows/import-starry-cereal.yml

permissions:
  contents: write

jobs:
  import-track:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download the exact uploaded track source
        run: |
          mkdir -p assets/blacklight
          curl --fail --location --retry 3 --output "assets/blacklight/Starry Cereal.mp3" \
            "https://cdn1.suno.ai/f02fe8ca-e7ea-4608-95c0-1c7d795637b1.mp3"
          test "$(stat -c%s 'assets/blacklight/Starry Cereal.mp3')" -gt 1000000
          test "$(head -c 3 'assets/blacklight/Starry Cereal.mp3')" = "ID3"

      - name: Commit the repository-owned music file
        run: |
          git config user.name "Blacklight Continuum Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -- "assets/blacklight/Starry Cereal.mp3"
          if git diff --cached --quiet; then
            echo "Starry Cereal is already current."
            exit 0
          fi
          git commit -m "Add Starry Cereal background track"
          git push origin HEAD:main
