name: Factorio R83 real fin straight side sweep retaining radial bell clearance
on:
  push:
    branches: [main]
    paths:
      - 'tools/factorio-render-pipeline/straight_azimuth_fin_sweep_r83.py'
      - '.github/workflows/factorio-straight-fin-side-sweep-r83.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real-independent-physical-fin-sweep-candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover physical source-validated R81 rig, without private Wube sprite
        uses: actions/download-artifact@v4
        with:
          run-id: 41403904522
          name: factorio-r81-real-blunt-source-fin-taper-candidates
          github-token: ${{ github.token }}
          path: private-ci/r81
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hb-ttrpg-tools/factorio-render-pipeline
          key: factorio-art-env-ubuntu24-blender4.5.15-python3.12-v1
      - name: Install pinned actual Blender 4.5 LTS
        run: python tools/factorio-render-pipeline/bootstrap.py install --evidence-dir private-ci/readiness
      - name: Real 3D side sweep straightening, preserving original bell clearance and root mounts
        run: |
          BLENDER="$(python -c "import sys;sys.path.insert(0,'tools/factorio-render-pipeline');import bootstrap;print(bootstrap.find_blender())")"
          "$BLENDER" -b --disable-autoexec --factory-startup -t 2 --python-exit-code 4 \
            --python tools/factorio-render-pipeline/straight_azimuth_fin_sweep_r83.py -- \
            --source-blend private-ci/r81/output/r81/shoulder_22_tip_15.blend \
            --out private-ci/output/r83
      - name: Validate saved and reopened actual original 3D panel topology
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('private-ci/output/r83')
          data=json.loads((p/'r83_angular_sweep_corrected_fins.json').read_text())
          assert data['wube_original_sprite_embedded'] is False
          assert data['r82_straight_world_chord_rejected_for_bad_occlusion'] is True
          assert len(data['candidates'])==3
          for v in data['candidates']:
              assert (p/v['frame1_real_native_rgba']).stat().st_size>5000
              assert (p/v['frame33_real_native_rgba']).stat().st_size>5000
              if v['angular_straightening_fraction']:
                  assert (p/v['saved_reopened_editable_blend']).stat().st_size>100000
                  assert v['original_3d_radial_clearance_mount_joint_and_64_frame_keys_preserved']
          print('R83_ORIGINAL_BELL_CLEARANCE_PRESERVED_ACTUAL_EDITABLE_3D_SCENES_PASSED')
          PY
      - name: Upload edited Blender candidates and native renders only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorio-r83-straight-swept-fins-retain-bell-clearance
          path: |
            private-ci/output/r83/*.blend
            private-ci/output/r83/*.png
            private-ci/output/r83/*.json
            private-ci/readiness/readiness.json
          retention-days: 14
          if-no-files-found: warn
