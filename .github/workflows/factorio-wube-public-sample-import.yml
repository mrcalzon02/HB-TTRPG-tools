name: Factorio private official Wube fifteen-set reference import
on:
  push:
    branches: [main]
    paths:
      - 'tools/factorio-render-pipeline/private_wube_acquire.py'
      - 'tools/factorio-render-pipeline/verify_official_geometry_integrity.py'
      - 'tools/factorio-render-pipeline/native_render_invariance.py'
      - '.github/workflows/factorio-wube-public-sample-import.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify-real-official-fifteen-set-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore R58 source calibration, excluding private original sprites
        uses: actions/download-artifact@v4
        with:
          run-id: 40968758379
          name: factorio-r56-r58-fin-visibility-and-editable-model
          github-token: ${{ github.token }}
          path: private-ci/model
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hb-ttrpg-tools/factorio-render-pipeline
          key: factorio-art-env-ubuntu24-blender4.5.15-python3.12-v1
      - name: Verify Blender engine
        run: python tools/factorio-render-pipeline/bootstrap.py install --evidence-dir private-ci/readiness
      - name: Retrieve representative genuine Wube STLs from all 15 sets privately
        run: |
          python tools/factorio-render-pipeline/private_wube_acquire.py \
            --root private-ci/official-geometry-private \
            --report private-ci/official-acquisition.json
      - name: Import private official STL references into real recovered Blender model
        run: |
          BLENDER="$(python -c "import sys;sys.path.insert(0,'tools/factorio-render-pipeline');import bootstrap;print(bootstrap.find_blender())")"
          "$BLENDER" -b --disable-autoexec --factory-startup -t 2 --python-exit-code 4 \
            --python tools/factorio-render-pipeline/official_reference_library.py -- \
            --source-blend private-ci/model/physically-connected-fin-r58/source_connected_hanging_fins_r58.blend \
            --stl-root private-ci/official-geometry-private \
            --out-blend private-ci/output/real-wube-15-set-reference.blend \
            --report private-ci/output/real-15-set-import-report.json
          "$BLENDER" -b --disable-autoexec private-ci/output/real-wube-15-set-reference.blend \
            -t 2 --python-exit-code 4 --python-expr "import bpy; s=bpy.data.scenes['WUBE_OFFICIAL_UNASSEMBLED_STL']; m=[o for o in s.objects if o.type=='MESH']; assert len(m)==15 and all(len(o.data.vertices)>=3 for o in m); assert bpy.context.scene.camera is not s.camera; print('OFFICIAL_STL_ACTUAL_EDITABLE_3D_MESH_ISOLATED')"
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("private-ci/official-acquisition.json").read_text())
          b=json.loads(Path("private-ci/output/real-15-set-import-report.json").read_text())
          assert a["catalogue_sample_count"]==15 and a["all_fifteen_sets_sampled"]
          assert len(b["present_sets"])==15
          assert b["reconstruction_scene_preserved"]
          assert {e["sha256"] for e in b["entries"]}=={f["sha256"] for f in a["files"]}
          print("REAL_WUBE_ALL_15_STL_SHA_CHAINS_VERIFIED")
          PY
      - name: Independently reopen both scenes and verify every native STL dimension plus 64 source frames
        run: |
          BLENDER="$(python -c "import sys;sys.path.insert(0,'tools/factorio-render-pipeline');import bootstrap;print(bootstrap.find_blender())")"
          "$BLENDER" -b --disable-autoexec --factory-startup -t 2 --python-exit-code 4 \
            --python tools/factorio-render-pipeline/verify_official_geometry_integrity.py -- \
            --baseline private-ci/model/physically-connected-fin-r58/source_connected_hanging_fins_r58.blend \
            --merged private-ci/output/real-wube-15-set-reference.blend \
            --inventory private-ci/output/real-15-set-import-report.json \
            --provenance private-ci/official-acquisition.json \
            --report private-ci/output/native-bounds-and-source-integrity.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("private-ci/output/native-bounds-and-source-integrity.json").read_text())
          assert report["result"]=="PASS_NATIVE_STL_GEOMETRY_AND_64_FRAME_SOURCE_INTEGRITY"
          assert report["imported_set_count"]==15
          assert report["original_64_frame_motion_preserved"]
          assert report["all_imported_native_bounds_preserved"]
          assert all(s["original_stl_bounds_match_import"] for s in report["samples"])
          print("ACTUAL_FIFTEEN_OFFICIAL_MESHES_64_FRAME_INTEGRITY_CONFIRMED")
          PY
      - name: Render native reconstructed R58 frames before and after import with identical fixed camera
        run: |
          BLENDER="$(python -c "import sys;sys.path.insert(0,'tools/factorio-render-pipeline');import bootstrap;print(bootstrap.find_blender())")"
          "$BLENDER" -b --disable-autoexec --factory-startup -t 2 --python-exit-code 4 \
            --python tools/factorio-render-pipeline/native_render_invariance.py -- \
            --capture-blend private-ci/model/physically-connected-fin-r58/source_connected_hanging_fins_r58.blend \
            --out private-ci/native-original
          "$BLENDER" -b --disable-autoexec --factory-startup -t 2 --python-exit-code 4 \
            --python tools/factorio-render-pipeline/native_render_invariance.py -- \
            --capture-blend private-ci/output/real-wube-15-set-reference.blend \
            --out private-ci/native-merged
          PYTHON="$(python -c "import sys;sys.path.insert(0,'tools/factorio-render-pipeline');import bootstrap;print(bootstrap.check_python_env())" | tail -n 1)"
          "$PYTHON" tools/factorio-render-pipeline/native_render_invariance.py \
            --baseline private-ci/native-original --candidate private-ci/native-merged \
            --out private-ci/output/native-render-invariance.json
      - name: Validate render evidence is from our reconstruction only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('private-ci/output/native-render-invariance.json').read_text())
          assert data["result"]=="PASS_EXACT_NATIVE_FRAME_PIXEL_INVARIANCE"
          assert len(data["frames"])==4
          assert all(f["changed_rgba_channels"]==0 for f in data["frames"])
          assert data["official_stl_mesh_rendered"] is False
          assert data["original_game_sprite_fidelity_tested"] is False
          print("FOUR_NATIVE_264x542_FRAMES_EXACTLY_IDENTICAL")
          PY
      - name: Upload only private research metadata (never models or Blender scenes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorio-real-Wube-reference-metadata-no-meshes
          path: |
            private-ci/official-acquisition.json
            private-ci/output/real-15-set-import-report.json
            private-ci/output/native-bounds-and-source-integrity.json
            private-ci/output/native-render-invariance.json
            private-ci/native-original/render-manifest.json
            private-ci/native-merged/render-manifest.json
            private-ci/native-original/*.png
          retention-days: 14
          if-no-files-found: warn
