name: Ops Manual index migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-manual-index-worker.yml

permissions:
  contents: write

concurrency:
  group: ops-manual-index-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[ops-manual-worker]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add first-page chapter index and proportional manual scaling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          js_path = Path('blacklight-exo-crew-operations.js')
          css_path = Path('blacklight-exo-crew-operations.css')
          js = js_path.read_text(encoding='utf-8')
          css = css_path.read_text(encoding='utf-8')

          start = js.index('  function manualOverlay(def){')
          end = js.index('  function recorderEntries(p){', start)
          manual_block = r'''  const MANUAL_PAGE_WIDTH=960,MANUAL_PAGE_HEIGHT=1242;
          const manualIndexId=()=>`manual-index-${activeStation}`;
          const manualChapterId=proc=>`manual-chapter-${activeStation}-${String(proc?.id||"chapter").replace(/[^a-z0-9_-]/gi,"-")}`;
          function fitManualToViewport(){
            const overlay=$("station-panel")?.querySelector(".exo-manual-overlay"),stage=overlay?.querySelector(".exo-manual-scale-stage"),book=overlay?.querySelector(".exo-manual-book");
            if(!overlay||!stage||!book)return;
            const availableWidth=Math.max(1,Math.min(window.innerWidth-24,overlay.clientWidth-16)),availableHeight=Math.max(1,window.innerHeight-24),scale=Math.max(.1,Math.min(availableWidth/MANUAL_PAGE_WIDTH,availableHeight/MANUAL_PAGE_HEIGHT));
            book.style.setProperty("--manual-scale",scale.toFixed(5));book.dataset.manualScale=scale.toFixed(5);stage.style.width=`${(MANUAL_PAGE_WIDTH*scale).toFixed(2)}px`;stage.style.height=`${(book.scrollHeight*scale).toFixed(2)}px`;
          }
          function jumpManualTo(id){
            const overlay=$("station-panel")?.querySelector(".exo-manual-overlay"),target=id?document.getElementById(id):null;if(!overlay||!target)return;
            const perform=()=>{fitManualToViewport();requestAnimationFrame(()=>{const o=overlay.getBoundingClientRect(),t=target.getBoundingClientRect(),reduce=window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches;overlay.scrollTo({top:Math.max(0,overlay.scrollTop+t.top-o.top-8),behavior:reduce?"auto":"smooth"});});};
            if(manualQuery){manualQuery="";const input=$("exo-manual-search");if(input)input.value="";filterManualResults();requestAnimationFrame(perform);}else perform();
          }
          function manualOverlay(def){
            const q=manualQuery.trim().toLowerCase(),code=STATION_CODES[activeStation],indexId=manualIndexId(),chapters=def.procedures.map((p,i)=>{const tier=procedureTaskTier(p),meta=procedureTierMeta(p),chapterId=manualChapterId(p),entryCode=`${code}-${String(i+1).padStart(2,"0")}`;return `<li><a href="#${chapterId}" data-manual-jump><span>${entryCode}</span><strong>${p.name}</strong><em>${procedureUsageLabel(p)} · T${tier} ${meta.label} · ${p.sequence.length} STEPS</em></a></li>`;}).join(""),entries=def.procedures.map((p,i)=>{const type=procedureType(p),tier=procedureTaskTier(p),meta=procedureTierMeta(p),steps=p.sequence.map(t=>tokenLabel(t,def)),hay=[type,meta.label,`tier ${tier}`,p.name,p.cue,...steps].join(" ").toLowerCase(),hidden=q&&!hay.includes(q)?" hidden":"",badge=type==="primary"?"":` <em class="manual-support">${type.toUpperCase()}</em>`,chapterId=manualChapterId(p);return `<article id="${chapterId}" class="exo-manual-entry exo-manual-page"${hidden} data-manual-search="${hay.replace(/"/g,"&quot;")}"><a class="exo-manual-index-return" href="#${indexId}" data-manual-jump>↟ INDEX</a><header><span class="exo-manual-procedure-code">${code}-${String(i+1).padStart(2,"0")}</span><strong>${procedureOptionPrefix(p)}${p.name}${badge}</strong><b>${p.sequence.length} steps · ${procedureDifficultyLabel(p)}</b></header><p><b>CLASSIFICATION.</b> ${procedureConventionLabel(p)}. ${meta.specificity}</p><p><b>APPLICATION.</b> ${p.cue}</p><h4>OPERATING SEQUENCE — REQUIRED CONTROL POSITIONS</h4><ol>${p.sequence.map((token,n)=>manualStepWithFigure(token,def,n)).join("")}</ol></article>`;}).join(""),count=def.procedures.filter(p=>!q||[procedureType(p),procedureTierMeta(p).label,`tier ${procedureTaskTier(p)}`,p.name,p.cue,...p.sequence.map(t=>tokenLabel(t,def))].join(" ").toLowerCase().includes(q)).length;
            return `<section class="exo-manual-overlay"><div class="exo-manual-scale-stage"><div class="exo-manual-sheet exo-manual-book"><section id="${indexId}" class="exo-manual-page exo-manual-index-page"><header class="exo-manual-header"><div class="exo-manual-mark"><span>BLV</span><b>071</b></div><div><small>CREW STATION OPERATING INSTRUCTIONS · HUMAN STANDARD</small><h3>${code} — ${def.label}</h3><p>Publication BLV-071 / ${code} · Revision 8C · Authorized operating instructions</p></div><button type="button" class="exo-manual-close" data-manual-close aria-label="Close station manual">×</button></header><div class="exo-manual-searchbar"><label for="exo-manual-search">INDEX / PROCEDURE SEARCH</label><div><input id="exo-manual-search" data-manual-search-input type="search" value="${manualQuery.replace(/"/g,"&quot;")}" placeholder="Enter procedure, usage, tier, control name, or control code"><span data-manual-count>${count} / ${def.procedures.length} entries</span></div></div><aside class="exo-manual-note"><strong>PROCEDURE CLASSIFICATION.</strong> Every operation uses the same naming grammar: USAGE · TASK TIER · AUXILIARY DEPTH · ROLL RELIEF. PRIMARY entries are direct ship actions, SUPPORT entries enable another watchstation, and SECONDARY entries are station-management, calibration, recovery or configuration evolutions. T1 BROAD procedures are general and can reduce the eventual roll by at most 1; T2 STANDARD by 2; T3 FOCUSED by 3; T4 SPECIALIST by 4; and T5 PRECISION by 5. Panel II depth unlocks that relief ceiling one level at a time: selecting +3 can never unlock more than three points even on a T5 procedure, while a T1 procedure can never exceed one. Execution quality determines how much unlocked relief is actually earned. This deliberately makes narrow high-tier procedures more work before the roll but potentially much easier at the dice stage when executed well. Graduated controls remain evaluated by operating band and persist until deliberately moved.</aside><nav class="exo-manual-chapters" aria-label="${def.label} operations manual chapters"><div class="exo-manual-chapters-head"><span>PAGE 1</span><h4>CHAPTERS / PROCEDURE INDEX</h4><b>${def.procedures.length} CHAPTERS</b></div><ol>${chapters}</ol></nav></section><div class="exo-manual-results">${entries}</div><div class="exo-manual-empty" ${count?" hidden":""} data-manual-empty>NO PROCEDURE FOUND FOR ENTERED INDEX TERM.</div></div></div></section>`;
          }
          function filterManualResults(){const q=manualQuery.trim().toLowerCase(),entries=[...$("station-panel").querySelectorAll(".exo-manual-entry")];let n=0;entries.forEach(e=>{const m=!q||(e.dataset.manualSearch||"").includes(q);e.hidden=!m;if(m)n++;});const c=$("station-panel").querySelector("[data-manual-count]"),empty=$("station-panel").querySelector("[data-manual-empty]");if(c)c.textContent=`${n} / ${entries.length} entries`;if(empty)empty.hidden=n!==0;requestAnimationFrame(fitManualToViewport);}

          '''
          js = js[:start] + manual_block + js[end:]

          old_open = 'if(open){manualOpen=true;manualQuery="";renderStation();requestAnimationFrame(()=>$(' + '"exo-manual-search"' + ')?.focus());return;}'
          new_open = 'if(open){manualOpen=true;manualQuery="";renderStation();requestAnimationFrame(()=>{fitManualToViewport();$(' + '"exo-manual-search"' + ')?.focus();});return;}'
          if old_open not in js:
              raise SystemExit('manual open handler signature not found')
          js = js.replace(old_open, new_open, 1)

          old_gate = 'const close=e.target.closest("[data-manual-close]");if(close){manualOpen=false;manualQuery="";renderStation();return;}if(manualOpen)return;'
          new_gate = 'const close=e.target.closest("[data-manual-close]");if(close){manualOpen=false;manualQuery="";renderStation();return;}const jump=e.target.closest("[data-manual-jump]");if(jump){e.preventDefault();jumpManualTo((jump.getAttribute("href")||"").replace(/^#/,""));return;}if(manualOpen)return;'
          if old_gate not in js:
              raise SystemExit('manual click gate signature not found')
          js = js.replace(old_gate, new_gate, 1)

          old_escape = 'document.addEventListener("keydown",e=>{if(e.key==="Escape"&&manualOpen){manualOpen=false;manualQuery="";renderStation();}});}'
          new_escape = 'document.addEventListener("keydown",e=>{if(e.key==="Escape"&&manualOpen){manualOpen=false;manualQuery="";renderStation();}});window.addEventListener("resize",()=>{if(manualOpen)requestAnimationFrame(fitManualToViewport);},{passive:true});}'
          if old_escape not in js:
              raise SystemExit('bind escape signature not found')
          js = js.replace(old_escape, new_escape, 1)

          css_marker = '/* Ops Manual paged chapter index + uniform fixed-ratio viewport scaling */'
          if css_marker in css:
              css = css.split(css_marker, 1)[0].rstrip() + '\n\n'
          css += r'''
          /* Ops Manual paged chapter index + uniform fixed-ratio viewport scaling */
          .exo-manual-overlay{padding:8px;scroll-behavior:smooth}
          .exo-manual-scale-stage{position:relative;margin:0 auto}
          .exo-manual-sheet.exo-manual-book{width:960px;min-height:0;padding:0;border:0;background:transparent;box-shadow:none;transform:scale(var(--manual-scale,1));transform-origin:top left;font-family:"Times New Roman",Times,Georgia,serif}
          .exo-manual-sheet.exo-manual-book:before,.exo-manual-sheet.exo-manual-book:after{content:none;display:none}
          .exo-manual-page{position:relative;box-sizing:border-box;width:960px;min-height:1242px;margin:0 0 28px;padding:40px 48px 58px 76px;color:#1c1a15;border:1px solid #4d483b;border-radius:0;font-family:"Times New Roman",Times,Georgia,serif;background:radial-gradient(circle at 8% 12%,rgba(104,82,47,.08) 0 1px,transparent 1.5px),radial-gradient(circle at 83% 34%,rgba(94,72,42,.055) 0 1px,transparent 1.5px),repeating-linear-gradient(0deg,rgba(65,54,37,.018) 0 1px,transparent 1px 4px),linear-gradient(92deg,#c8bea3 0,#ded4b9 6%,#e3d9be 52%,#d7ccb0 94%,#c3b89d 100%);background-size:43px 37px,61px 47px,auto,auto;box-shadow:inset 0 0 35px rgba(70,55,31,.16),0 14px 34px rgba(0,0,0,.54);scroll-margin-top:8px}
          .exo-manual-page:before{content:"";position:absolute;top:0;bottom:0;left:48px;width:1px;background:rgba(111,78,54,.38);box-shadow:7px 0 rgba(111,78,54,.12)}
          .exo-manual-page:after{content:"BLV-071 · CONTROLLED COPY";position:absolute;right:44px;bottom:18px;color:#6b6252;font:700 .48rem "Courier New",ui-monospace,monospace;letter-spacing:.08em}
          .exo-manual-results{display:grid;gap:28px}
          .exo-manual-entry{padding:40px 48px 58px 76px;border:1px solid #4d483b;background:radial-gradient(circle at 8% 12%,rgba(104,82,47,.08) 0 1px,transparent 1.5px),radial-gradient(circle at 83% 34%,rgba(94,72,42,.055) 0 1px,transparent 1.5px),repeating-linear-gradient(0deg,rgba(65,54,37,.018) 0 1px,transparent 1px 4px),linear-gradient(92deg,#c8bea3 0,#ded4b9 6%,#e3d9be 52%,#d7ccb0 94%,#c3b89d 100%);background-size:43px 37px,61px 47px,auto,auto;box-shadow:inset 0 0 35px rgba(70,55,31,.16),0 14px 34px rgba(0,0,0,.54)}
          .exo-manual-entry[hidden]{display:none}
          .exo-manual-index-return{position:absolute;right:48px;top:17px;z-index:2;padding:3px 6px;border:1px solid #756c5a;background:rgba(235,225,197,.72);color:#2a261d;text-decoration:none;font:900 .52rem "Courier New",ui-monospace,monospace;letter-spacing:.05em}
          .exo-manual-index-return:hover,.exo-manual-index-return:focus-visible{background:#f0e6ca;outline:1px solid #302d25;outline-offset:2px}
          .exo-manual-chapters{margin-top:18px;border-top:2px solid #373329}
          .exo-manual-chapters-head{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:8px 0 7px;border-bottom:1px solid #8f8672;text-transform:uppercase}
          .exo-manual-chapters-head span,.exo-manual-chapters-head b{font:900 .6rem "Courier New",ui-monospace,monospace;letter-spacing:.04em}.exo-manual-chapters-head h4{margin:0;font:700 .78rem "Arial Narrow",Arial,sans-serif;letter-spacing:.06em}.exo-manual-chapters ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;column-gap:28px;align-content:start}.exo-manual-chapters li{min-width:0;border-bottom:1px dotted #948a73}.exo-manual-chapters a{display:grid;grid-template-columns:68px minmax(0,1fr);grid-template-rows:auto auto;gap:2px 9px;padding:8px 4px;color:#211e17;text-decoration:none}.exo-manual-chapters a>span{grid-row:1/3;font:900 .65rem "Courier New",ui-monospace,monospace;letter-spacing:.03em}.exo-manual-chapters a>strong{min-width:0;font-size:.82rem;line-height:1.12}.exo-manual-chapters a>em{color:#5e5546;font:700 .5rem "Courier New",ui-monospace,monospace;font-style:normal;letter-spacing:.025em;text-transform:uppercase}.exo-manual-chapters a:hover,.exo-manual-chapters a:focus-visible{background:rgba(104,86,55,.08);outline:1px solid #756c59;outline-offset:-1px}.exo-manual-index-page .exo-manual-note{margin-bottom:12px}
          @media(max-width:640px){.exo-manual-overlay{padding:4px}.exo-manual-sheet.exo-manual-book{width:960px}.exo-manual-page,.exo-manual-entry{width:960px;min-height:1242px;padding:40px 48px 58px 76px}.exo-manual-page:before{left:48px}.exo-manual-header{grid-template-columns:58px minmax(0,1fr) 34px;gap:14px}.exo-manual-mark{width:54px;height:54px}.exo-manual-entry header{grid-template-columns:62px minmax(0,1fr) auto}.exo-manual-entry header>b{grid-column:auto}.exo-manual-searchbar>div{grid-template-columns:minmax(0,1fr) auto}.exo-manual-searchbar [data-manual-count]{text-align:right}}
          '''

          js_path.write_text(js, encoding='utf-8')
          css_path.write_text(css, encoding='utf-8')
          PY
      - name: Validate migration
        shell: bash
        run: |
          grep -q 'CHAPTERS / PROCEDURE INDEX' blacklight-exo-crew-operations.js
          grep -q 'data-manual-jump' blacklight-exo-crew-operations.js
          grep -q 'MANUAL_PAGE_WIDTH=960' blacklight-exo-crew-operations.js
          grep -q 'uniform fixed-ratio viewport scaling' blacklight-exo-crew-operations.css
          node --check blacklight-exo-crew-operations.js
      - name: Commit authoritative source changes and remove worker
        shell: bash
        run: |
          rm -f .github/workflows/ops-manual-index-worker.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blacklight-exo-crew-operations.js blacklight-exo-crew-operations.css .github/workflows/ops-manual-index-worker.yml
          git commit -m 'feat: add scalable Ops Manual chapter index [ops-manual-worker]'
          git push origin HEAD:main
