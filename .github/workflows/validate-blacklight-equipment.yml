name: Validate Blacklight Equipment

on:
  push:
    paths:
      - 'data/blacklight-continuum/rules/equipment-foundation.json'
      - 'data/blacklight-continuum/rules/modern-historical-equipment.json'
      - 'data/blacklight-continuum/rules/supernatural-artifacts-relics.json'
      - 'data/blacklight-continuum/rules/future-scavenged-survival-equipment.json'
      - 'data/blacklight-continuum/rules/alien-technology-templates.json'
      - 'data/blacklight-continuum/wiki/equipment-catalogs.json'
      - 'data/blacklight-continuum/wiki/wiki-index.json'
      - 'blacklight-equipment-catalog.js'
      - 'blacklight-equipment-entry.js'
      - 'blacklight-character-sheet-handoff.js'
      - 'scripts/validate-blacklight-equipment.py'
      - '.github/workflows/validate-blacklight-equipment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate equipment JSON and counts
        run: python scripts/validate-blacklight-equipment.py
      - name: Validate equipment JavaScript syntax
        run: |
          node --check blacklight-equipment-catalog.js
          node --check blacklight-equipment-entry.js
          node --check blacklight-character-sheet-handoff.js
