name: Apply Cubic worker scaling benchmark

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/apply-cubic-worker-benchmark.yml"
      - "scripts/apply-cubic-worker-benchmark.py"
      - "scripts/fix-cubic-worker-benchmark-contract.py"

permissions:
  contents: write
  statuses: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Record pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=pending \
            -f context='binary-cube/cubic-worker-benchmark' \
            -f description='Applying Cubic worker scaling benchmark.' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply exact worker benchmark edits
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          python scripts/fix-cubic-worker-benchmark-contract.py
          python scripts/apply-cubic-worker-benchmark.py
          node --check binary-cube-cubic-decryptor-worker-pool.js
          node --check binary-cube-cubic-decryptor.js
          node --check scripts/validate-binary-cube-cubic-decryptor.mjs
          node --check scientific-tools-entry.js
          node --check app-lite-view-mounts.js
          node --check scripts/validate-scientific-tools-extraction.mjs
          node scripts/validate-binary-cube-cubic-decryptor.mjs
          node scripts/validate-scientific-diagnostic-pipeline.mjs
          node scripts/validate-scientific-tools-extraction.mjs
      - name: Commit validated worker benchmark
        run: |
          if git diff --quiet -- binary-cube-cubic-decryptor-worker-pool.js binary-cube-cubic-decryptor.js scripts/validate-binary-cube-cubic-decryptor.mjs scientific-tools-entry.js app-lite-view-mounts.js scripts/validate-scientific-tools-extraction.mjs; then
            echo "Worker benchmark already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add binary-cube-cubic-decryptor-worker-pool.js binary-cube-cubic-decryptor.js scripts/validate-binary-cube-cubic-decryptor.mjs scientific-tools-entry.js app-lite-view-mounts.js scripts/validate-scientific-tools-extraction.mjs
          git commit -m "feat: benchmark Cubic worker scaling in browser"
          git push origin HEAD:main
      - name: Record success
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=success \
            -f context='binary-cube/cubic-worker-benchmark' \
            -f description='Cubic worker scaling benchmark integrated.' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Record failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=failure \
            -f context='binary-cube/cubic-worker-benchmark' \
            -f description='Cubic worker scaling benchmark failed closed.' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
