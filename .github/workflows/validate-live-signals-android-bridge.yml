name: Validate Live Signals Android bridge

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/validate-live-signals-android-bridge.yml"
      - "android/live-signals-bridge/**"
      - "scripts/validate-live-signals-android-bridge.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "live-signals-android-bridge-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Validate Live Signals Android bridge contract
        run: node scripts/validate-live-signals-android-bridge.mjs

      - name: Assemble Live Signals Android companion
        working-directory: android/live-signals-bridge
        run: gradle :app:assembleDebug --stacktrace
