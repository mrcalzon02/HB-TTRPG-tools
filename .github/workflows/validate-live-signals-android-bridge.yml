name: Validate Live Signals Android bridge

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/validate-live-signals-android-bridge.yml"
      - "android/live-signals-bridge/**"
      - "scripts/validate-live-signals-android-bridge.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "live-signals-android-bridge-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Validate Live Signals Android bridge contract
        run: node scripts/validate-live-signals-android-bridge.mjs

      - name: Assemble Live Signals Android companion
        working-directory: android/live-signals-bridge
        run: gradle :app:assembleDebug --stacktrace

      - name: Publish Live Signals Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: live-signals-android-debug-${{ github.sha }}
          path: android/live-signals-bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
