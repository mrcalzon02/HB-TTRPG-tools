name: SuperPosition Reader core regression

on:
  push:
    paths:
      - "software/superposition-reader/**"
      - "superposition-reader.html"
      - "software.html"
      - ".github/workflows/spr-tests.yml"
  pull_request:
    paths:
      - "software/superposition-reader/**"
      - "superposition-reader.html"
      - "software.html"
      - ".github/workflows/spr-tests.yml"
  workflow_dispatch:

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run offline archive and API regression tests
        run: python -m unittest discover -s software/superposition-reader/tests -p "test_*.py" -v
      - name: Parse Windows SAPI and installer scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($path in @("software/superposition-reader/install-windows.ps1", "software/superposition-reader/sapi_synthesize.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw "$path syntax errors: $($errors | Out-String)" }
          }
