name: Validate Main Page Performance

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app-lite.js'
      - 'app-lite-view-mounts.js'
      - 'character-sheet-title.js'
      - 'character-sheet-view.js'
      - 'world-of-darkness-spatial-loader.js'
      - 'world-of-darkness-lightweight-map-core.js'
      - 'world-of-darkness-radial-location-loader.js'
      - 'world-of-darkness-radial-scan-compat.js'
      - 'scripts/validate-main-page-lazy-boot.mjs'
      - 'scripts/validate-wod-map-only-core.mjs'
      - '.github/workflows/validate-main-page-performance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check startup script syntax
        run: |
          node --check app-lite.js
          node --check app-lite-view-mounts.js
          node --check character-sheet-title.js
          node --check character-sheet-view.js
          node --check world-of-darkness-spatial-loader.js
          node --check world-of-darkness-lightweight-map-core.js
          node --check world-of-darkness-radial-location-loader.js
          node --check world-of-darkness-radial-scan-compat.js
          node --check scripts/validate-main-page-lazy-boot.mjs
          node --check scripts/validate-wod-map-only-core.mjs

      - name: Validate lazy startup contracts
        run: |
          node scripts/validate-main-page-lazy-boot.mjs
          node scripts/validate-wod-map-only-core.mjs
