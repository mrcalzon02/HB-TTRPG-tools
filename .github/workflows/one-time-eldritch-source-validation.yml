name: One-time Eldritch Binding Source validation

on:
  push:
    paths:
      - .github/workflows/one-time-eldritch-source-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        run: |
          node --check blacklight-archetype-transition.js
          node --check blacklight-character-sheet-entry.js
          node --check blacklight-character-sheet.js
      - name: Validate Eldritch source data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          rules = json.loads(Path('data/blacklight-continuum/rules/basic-character-options.json').read_text(encoding='utf-8'))
          sources = json.loads(Path('data/blacklight-continuum/rules/eldritch-binding-sources.json').read_text(encoding='utf-8'))
          wiki = json.loads(Path('data/blacklight-continuum/wiki/basic-archetypes.json').read_text(encoding='utf-8'))
          index = json.loads(Path('data/blacklight-continuum/wiki/wiki-index.json').read_text(encoding='utf-8'))

          binder = next(item for item in rules['archetypes'] if item['id'] == 'eldritch-binder')
          families = {family['name'] for family in binder['powerFamilies']}
          skills = {skill for group in rules['skills'].values() for skill in group}
          catalog = next(item for item in sources['catalogs'] if item['id'] == 'binding-sources')
          variants = catalog['variants']

          expected_ids = {
              'void-mind',
              'abyssal-womb',
              'that-which-hungers',
              'lidless-eye',
              'the-silence',
              'the-noise',
          }
          assert {item['id'] for item in variants} == expected_ids
          assert len(variants) == 6
          assert sum(len(item.get('progression', [])) for item in variants) == 30
          assert all(len(item.get('progression', [])) == 5 for item in variants)
          assert all(item.get('temptation', {}).get('effect') for item in variants)
          assert all(item.get('intrusionBreach', {}).get('effect') for item in variants)
          assert all(set(item.get('favoredFamilies', [])) <= families for item in variants)
          assert all(set(item.get('recommendedSkills', [])) <= skills for item in variants)
          assert all(not {'gift', 'bane'} & set(item) for item in variants)
          assert all(
              [step.get('stage') for step in item['progression']] == [f'Depth {number}' for number in range(1, 6)]
              for item in variants
          )
          assert index['completedScope']['eldritchBindingSources'] == 6
          assert index['completedScope']['eldritchDepthAbilities'] == 30
          assert index['eldritchBindingSources'].endswith('eldritch-binding-sources.json')
          assert any(item['id'] == 'eldritch-binder-archetype' for item in wiki['entries'])
          assert 'Void Mind' in binder['theme'] and 'Noise' in binder['theme']

          transition = Path('blacklight-archetype-transition.js').read_text(encoding='utf-8')
          entry = Path('blacklight-character-sheet-entry.js').read_text(encoding='utf-8')
          for source in (transition, entry):
              assert 'eldritch-binding-sources.json' in source
              assert 'eldritch-binder' in source
              assert 'Intrusion Breach' in source
          assert "setPrimaryLabel('Binding Source')" in transition
          PY
      - name: Remove validation workflow
        run: rm .github/workflows/one-time-eldritch-source-validation.yml
      - name: Commit validation cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Validate Eldritch Binding Sources"
          git push origin main
