name: SPR Sphinx raw-audio neural narration trial

on:
  push:
    paths:
      - "software/superposition-reader/assets/voice/sphinx-original.mp3"
      - "software/superposition-reader/spr_luxtts_worker.py"
      - ".github/workflows/spr-sphinx-voice-trial.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spr-sphinx-neural-trial
  cancel-in-progress: false

jobs:
  clone-and-narrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify exact owner-authorized public voice recording
        shell: bash
        run: |
          echo "ce4c621e3587b9a7f6fd1b6237433f779fa4b8ffb1bae4154ae6739da0362cd2  software/superposition-reader/assets/voice/sphinx-original.mp3" | sha256sum --check -
      - name: Install CPU synthesis runtime on temporary runner
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          git clone --depth 1 https://github.com/ysharma3501/LuxTTS.git "$RUNNER_TEMP/luxtts"
          python -m pip install -r "$RUNNER_TEMP/luxtts/requirements.txt" soundfile
          PYTHONPATH="$RUNNER_TEMP/luxtts:software/superposition-reader" python -c "from zipvoice.luxvoice import LuxTTS; print('LuxTTS import passed')"
      - name: Clone Sphinx voice and narrate real approved story sentences
        shell: bash
        env:
          PYTHONPATH: ${{ runner.temp }}/luxtts:software/superposition-reader
          HF_HOME: ${{ runner.temp }}/spr-hf-models
        run: |
          python software/superposition-reader/spr_luxtts_worker.py --trial --cpu --reference software/superposition-reader/assets/voice/sphinx-original.mp3 --output build/spr_sphinx_voice_preview --repo-root .
      - name: Validate generated speech files have audible PCM data
        shell: bash
        run: |
          python - <<'PY'
          import json, wave, array, hashlib
          from pathlib import Path
          directory=Path('build/spr_sphinx_voice_preview')
          data=json.loads((directory/'manifest.json').read_text())
          assert len(data['clips'])==2,data
          for item in data['clips']:
              path=directory/item['file']
              with wave.open(str(path),'rb') as w:
                  assert w.getframerate()==48000
                  assert w.getnchannels()==1 and w.getsampwidth()==2
                  assert w.getnframes()>48000
                  audio=array.array('h',w.readframes(w.getnframes()))
                  assert max(abs(x) for x in audio)>200,'Silent voice generation'
              assert hashlib.sha256(path.read_bytes()).hexdigest()==item['audio_sha256']
              print(item['id'],item['seconds'],'seconds',len(item['text']),'source characters')
          PY
      - name: Upload original-voice narration preview for auditory review
        uses: actions/upload-artifact@v4
        with:
          name: SPR-Sphinx-neural-narration-preview-${{ github.sha }}
          path: build/spr_sphinx_voice_preview/
          if-no-files-found: error
          retention-days: 30
