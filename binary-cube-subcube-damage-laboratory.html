<!doctype html><html><head><meta charset="utf-8"><title>Binary Cube Subcube Damage Laboratory</title><style>body{font:15px system-ui;max-width:1100px;margin:auto;padding:24px}label{display:block;margin:10px 0}textarea,input,select,button{font:inherit;padding:8px}textarea{width:100%}pre{white-space:pre-wrap;background:#eee;padding:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{border:1px solid #aaa;padding:12px}</style></head><body><h1>Subcube Localized Damage Laboratory</h1><p>Experimental resilience diagnostic. It damages one indexed region at a time after subcube encoding and records exact recovery versus explicit rejection.</p><label>Source bits<textarea id="bits">01001100101101011110000100110110</textarea></label><div class="grid"><label>Mode<select id="mode"><option>keyed-codeword</option><option>direct-replication</option></select></label><label>Fan-out<input id="fan" type="number" value="3" min="1" max="7"></label><label>Regions<input id="regions" type="number" value="7" min="1"></label><label>Seed<input id="seed" value="damage-analysis"></label></div><button id="run">Analyze</button><button id="compare">Compare 1/3/5/7</button><div id="summary" class="grid"></div><pre id="out">Ready.</pre><script src="binary-cube-subcube-indexing.js"></script><script src="binary-cube-subcube-damage-analysis.js"></script><script>const $=id=>document.getElementById(id),req=()=>({bits:$('bits').value,mode:$('mode').value,fanOut:+$('fan').value,regionCount:+$('regions').value,seed:$('seed').value});function show(r){const s=r.summary||{};$('summary').innerHTML=Object.entries(s).map(([k,v])=>`<div class="card"><b>${k}</b><div>${v}</div></div>`).join('');$('out').textContent=JSON.stringify(r,null,2)}$('run').onclick=()=>{try{show(BinaryCubeSubcubeDamageAnalysis.run(req()))}catch(e){$('out').textContent=e.message}};$('compare').onclick=()=>{try{show(BinaryCubeSubcubeDamageAnalysis.compare(req()))}catch(e){$('out').textContent=e.message}};</script></body></html>
